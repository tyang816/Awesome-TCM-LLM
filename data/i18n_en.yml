ds-medchatzh:
  title_en: MedChatZH
  summary_en: MedChatZH TCM consultation dataset.
ds-shennong:
  title_en: ShenNong_TCM_Dataset
  summary_en: ShenNong TCM instruction dataset.
ds-shizhen-sft:
