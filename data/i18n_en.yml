ds-tcm-vision:
  title_en: TCM-Vision-Benchmark
  summary_en: TCM vision benchmark (herb recognition / inspection, ~7k items).
ds-tcmbench:
  title_en: TCMBench
  summary_en: Comprehensive TCM LLM evaluation benchmark.
ds-tcmeval-sdt:
  title_en: TCMEval-SDT
  summary_en: Expert-annotated case evaluation of syndrome-differentiation thinking.
ds-zhongjing-omni:
  title_en: ZhongJing-OMNI
  summary_en: ZhongJing-OMNI multimodal TCM eval (including tongue).
ds-med-exam:
