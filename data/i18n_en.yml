news-202611-ciie-qiyuan:
  summary_en: China News Service reported on 9 November 2026 that Shanghai Seventh People's Hospital made its first CIIE appearance and presented the Qiyuan TCM model, along with an AI face-diagnosis agent and the teaching robot Xiaoqi. Qiyuan was already released in July 2026; this item covers the exhibition, not a first launch.
news-202611-tcm-best4sdt-scidata:
  summary_en: Wenge announced on 5 November 2026 that TCM-BEST4SDT, a Bianzheng Lunzhi evaluation benchmark built with the China Academy of Chinese Medical Sciences, was published online in Scientific Data. The report describes 600 samples and 27 dimensions, with data and code released. This catalog already lists the benchmark; this entry is the publication notice.
news-202611-tcmqa-release:
  summary_en: Beijing News, carrying a 5 November 2026 report, said the fifth Wenzhi TCM clinical conference in Shenzhen on 1 November formally released TCMQA, a 38,279-item exam-style benchmark with a licensed-physician baseline. Materials are on Hugging Face. This catalog already lists the benchmark; this entry is the release notice. The report does not equate exam scores with clinical bianzheng skill.
news-202610-yiqi-ondevice:
  summary_en: Ifeng Finance reported on 31 October 2026 that Tianji Yiqi said its on-device model Yiqi TCM AI finished debugging and went live on 27 October, and can run fully offline for constitution assessment and similar uses. This is a company release reprinted by media; this page has not independently verified clinical effects or deployment scale. The model is not the ETCM herbal database.
news-202610-sichuan-15th-plan:
  summary_en: Sichuan Observation reported on 20 October 2026 that the province issued its 15th Five-Year TCM development plan, calling for TCM digital platforms, large models for renowned-physician intelligent diagnosis, grassroots decision-support pilots, and high-quality datasets. This is a planning document, not a model launch.
news-202610-xiaohuangqi:
  summary_en: Zhitong Finance reported on 21 October 2026 that Yidu Technology launched the evidence-based TCM agent Xiaohuangqi at the 2026 World Traditional Medicine Conference, covering guideline retrieval, assisted bianzheng, formula lookup and term translation, with answers said to cite sources. Item counts and hospital use come from the company and have not been independently verified here.
news-202610-fan-jiping-twin:
  summary_en: A 19 October 2026 Phoenix Tech reprint said Transn Suwen and Mingyi Online jointly released a Fan Jiping digital twin on 18 October at the World Traditional Medicine Conference, built on Transn's Suwen TCM model from cases and teaching materials. This is a single-physician twin launch; the report does not present independently verified clinical trial results.
news-202610-wtmc-exhibits:
  summary_en: Guang'anmen Hospital reported on 24 October 2026 on TCM AI exhibits at the 17-18 October World Traditional Medicine Conference, including Guangyi Qizhi, Hangzhou Hospital of TCM's embodied robot Xiao'an, and Zhongke Yunzhen's Miaowu Qihuang. Visit counts and agreement rates in the report come from exhibitors and should not be read as formal benchmark results.
news-202609-xuan-guowei-model:
  summary_en: Dayoo reported on 22 September 2026 that Guangdong Provincial Hospital of Chinese Medicine presented its veteran-physician model matrix at the second Guangdong AI application conference, saying the Xuan Guowei dermatology model had been in use since June 2025. Figures such as "over 95% accuracy" and 2,917 assisted decisions come from the hospital and are not external trial results. The matrix launch was reported earlier.
news-202609-chongqing-digital-tcm:
  summary_en: China Traditional Chinese Medicine News reported on 30 September 2026 that a digital TCM and data-element pilot meeting was held in Chongqing on 20-21 September. The piece is a meeting round-up covering AI, data elements and application scenarios, not a new model debut.
news-202609-baiyi-twins:
  summary_en: Jiemian reported that on 15 September, at the seventh pavilion-exchange and TCM development conference in Hangzhou, Transn Suwen launched a Hundred Physicians Twin plan to build digital twins for 100 veteran TCM doctors on its Suwen model. This is a plan announcement; the report does not list a complete roster or independently verified agreement rates.
news-202505-huanshu:
  summary_en: Sichuan Online reported on 17 May 2025 that Chengdu Sport University and Zhongke Shiyu released the Huanshu sports-medicine TCM model and agent, aimed at competitive sport, public health and teaching, including exercise prescriptions and seasonal health plans. This page has not verified weights or a public API.
person-zhang-wei-cqctcm:
  summary_en: Associate professor in the Medical Informatics teaching group at Chongqing College of Traditional Chinese Medicine; teaches foundations of TCM AI and works on TCM knowledge graphs and large language models.
person-ye-huaqun:
  summary_en: Senior engineer in the Medical Informatics teaching group at Chongqing College of Traditional Chinese Medicine; teaches foundations of smart medical language, with research in TCM big data and intelligent information processing.
person-wang-qiujie:
  summary_en: Director of the Medical Informatics teaching group at Chongqing College of Traditional Chinese Medicine and a council member of the CACMS Information Society AI branch; teaches foundations of TCM AI and works on healthcare data analysis.
person-chen-hongkai:
  summary_en: Research Assistant Professor in Information Engineering at CUHK and a corresponding author of OpenTCM, a GraphRAG-based TCM knowledge retrieval and diagnosis system.
person-khoo-christopher:
  summary_en: Associate professor at NTU's Wee Kim Wee School of Communication and Information; leads the Polyglot Asian Medicine Knowledge Graph of traditional and herbal medicines in maritime Southeast Asia.
fu-tcm-27b:
  summary_en: A 27B multimodal TCM LLM from Fudan University and collaborators, trained with Bianzheng-Grounded Policy Optimization so that four-examination evidence, intermediate bianzheng fields, and syndrome labels are explicit targets. Twelve Apache-2.0 BF16 shards are on Hugging Face; accuracy figures are author-reported.
fu-tcm-bgpo-paper:
  summary_en: Paper introducing the Fu-TCM multimodal diagnostic-reasoning framework and Bianzheng-Grounded Policy Optimization. The authors report that Fu-TCM-27B leads six TCM text, vision, and syndrome-differentiation benchmarks on macro-average accuracy. The internally built Fu-bianzheng and related benches are not independently released.
chattcm-yuan2025:
  summary_en: Yuan et al. present a TCM QA method that fine-tunes an LLM and couples it with a textbook-derived knowledge graph and chain-of-thought interaction. This is a distinct publication from the existing SylvanL/ChatTCM weights. BLEU, ROUGE, and accuracy figures are author-reported.
tcm-evidence-kg-llm:
  summary_en: Zhang, Wen, and colleagues propose a knowledge-graph and LLM method for structuring, grading, and dynamically updating multi-source TCM evidence in a digital evidence-based-medicine setting, with a feasibility check on an existing evidence-ecosystem platform.
surv-chen2025-pumch:
  summary_en: A 2025 review in Medical Journal of Peking Union Medical College Hospital on LLM applications in TCM diagnosis, consultation, and formula research, together with challenges in values and misuse, interpretability, technical gaps, and regulatory access.
surv-yang2025-outlook:
  summary_en: Yang, Zhu, and colleagues review medical LLMs and discuss potential TCM uses in research, knowledge mining, and assisted diagnosis, along with risks, countermeasures, and future directions.
surv-ye2025-inheritance:
  summary_en: A November 2025 online-first Chinese review of LLMs for TCM inheritance, covering data mining, clinical decision support, and cultural transmission, plus challenges and outlook. The journal page does not provide a DOI.
surv-xiao2024-zcy:
  summary_en: A 2024 monograph-style review in Chinese Traditional and Herbal Drugs on data handling, RAG, mixture of experts, RLHF, distillation, and training or evaluation methods for TCM LLMs, with construction strategies and application scenarios.
surv-liu2025-std-gai:
  summary_en: A 2025 review in Shanghai Journal of Traditional Chinese Medicine on generative AI for TCM standardization, covering health services, quality improvement, information management, and intelligent diagnosis, plus prospects and challenges.
ds-dragontcm:
  summary_en: A TCM knowledge base derived from American Dragon and Penner’s work. The card reports 1,119 conditions, 2,580 formulas, 1,044 herbs, and 28,735 relations. The authors note automatic AI parsing may introduce inaccuracies; license is CC-BY-NC-4.0.
ds-polyglot-medicine-kg:
  summary_en: A 2023 public knowledge-graph portal of Asian traditional and herbal medicines, currently focused on Chinese materia medica and expanding to Malay and Southeast Asian drugs, linking names, scientific names, plant parts, textual sources, and geography.

news-202611-tcm-tk-ordinance:
  summary_en: Xinhua reported from Beijing on 9 November 2026 that Premier Li Qiang signed a State Council decree (Guo Ling No. 850) promulgating the Regulation on the Protection of Traditional Chinese Medicine Traditional Knowledge. The regulation has 32 articles, including a protection database and a protection list, and takes effect on 1 January 2027.
news-202609-classic-industries-opinion:
  summary_en: MIIT and five other departments issued document 204 of 2026 on 7 September 2026, listing Chinese materia medica among historical classic industries and calling for an AI empowerment guide, high-quality datasets, large-model analysis of traditional crafts, smart pharmacies, and industrial process knowledge graphs.
news-202610-shuxiaohe:
  summary_en: A Beijing Daily report carried on 27 October 2026 by the Beijing science and technology portal said that on 18 October, at the Beijing outcomes session of the 2026 World Traditional Medicine Conference, the Beijing Digital TCM Industry Development Institute released the agent Shu Xiaohe, using local compute and a self-owned knowledge base for Chinese and English TCM services.
news-202407-digital-tcm-opinion:
  summary_en: The National Administration of Traditional Chinese Medicine and the National Data Administration issued document 6 of 2024 on promoting digital TCM, including data-element development, TCM large models, and smart services. The document is dated 19 July 2024.
news-202607-digital-tcm-forum:
  summary_en: A China Women's News report carried on 6 July 2026 by the Beijing Municipal Health Commission said the Digital TCM Forum of the 2026 Global Digital Economy Conference was held in Beijing on 3 July. The forum released agent technical requirements and related standards, 16 digital TCM application cases, and launched the Beijing TCM track of the Data Element competition.
surv-wang2026-tcm-rd-ai:
  summary_en: A review published on 8 January 2026 in Chinese Medicine by Wang, Luo, and colleagues on the development and application of AI in TCM research and development, covering drug design, manufacturing, and market access, plus limitations and future directions.
graphrag-tcm:
  summary_en: Wang, Ren, and colleagues present a hybrid retrieval-augmented generation system for TCM clinical decision support at ISBCB 2026, combining vector retrieval, lexical retrieval, and knowledge-graph traversal. Title, authors, and DOI were verified via Crossref.
graphrag-or-ft-tcm:
  summary_en: Tong, Lin, and Cai compare GraphRAG over a manually extracted TCM knowledge graph with fine-tuning at ICIC 2026 (LNCS). Title, authors, and the 15 July 2026 online publication date were verified via Crossref.
tcm-sea:
  summary_en: Wang, Lin, and colleagues introduce TCM-MisDx, an 820-case interactive benchmark of consultations after failed treatment, and TCM-SEA, a self-evolving consultation agent. The authors report a composite score rise from 61.8 to 65.5 on a sealed test set and a lower therapeutic-momentum rate. Figures are author-reported; no independent dataset download is provided in the paper.
news-202607-national-15th-plan:
  summary_en: After State Council approval (Guo Han [2026] No. 71), the National Administration of Traditional Chinese Medicine and the National Development and Reform Commission issued the 15th Five-Year Plan for the Revitalization and Development of Traditional Chinese Medicine (Guo Zhongyiyao Guicai Fa [2026] No. 8) on 23 July 2026. The plan sets the goal that everyone should have access to TCM services by 2030 and lists ten priority tasks, including accelerating digital and intelligent empowerment and standards. The official Q&A states that AI and other new technologies should be used to mine and transmit the TCM heritage. This is a national five-year plan, not a product launch.
news-202607-tcm-qiangji-action:
  summary_en: Eleven ministries, led by the National Administration of Traditional Chinese Medicine, issued the TCM Action Plan under the Healthcare Strengthening Program (Guo Zhongyiyao Yizheng Fa [2026] No. 6; dated 11 July 2026 and posted on official sites on 28 July). The plan aims, by 2030, to complete a grassroots TCM service network and improve digital and intelligent conditions. Among seven actions, it calls for faster hospital informatization, continued development of smart TCM hospitals, and exploratory use of medical AI for assisted diagnosis in grassroots TCM services and the inheritance of renowned physicians' experience.
news-202611-shandong-15th-plan:
  summary_en: The People's Government of Shandong Province issued the Shandong 15th Five-Year Plan for TCM Development (Lu Zheng Fa [2026] No. 23; dated 23 October 2026 and published on 3 November). The plan adopts a 'six names and four modernizations' strategy, including making TCM smarter, and aims for universal access to TCM services by 2030. Official tasks include digitizing ancient texts, training talent in digital and intelligent applications, and promoting digital and intelligent empowerment of TCM. This is a provincial plan, not a model release.
acupuncturebench:
  summary_en: Tan Wenjun and colleagues at Northeastern University introduce AcupunctureBench, a multimodal benchmark for generative models in acupuncture, covering text, image, and video, with 58,526 questions and 1,216 video samples. The authors report evaluating 14 large language models, 14 large multimodal models, and 4 video foundation models, and they released a dedicated evaluation website. Counts and scores are author-reported. An anonymous, manually gated Hugging Face repository without a dataset card was not added as a separate public dataset.
alpha-tcm:
  summary_en: Liu and Wang propose a nine-layer TCM-oriented system architecture that keeps semantics, multimodal acquisition, quality, knowledge priors, probabilistic inference, longitudinal updating, decisions, language interaction, and human governance distinct, and they audit the knowledge-evidence interface of layers 1-5 on synthetic data. The authors state that this is a system-design contribution and a synthetic prototype; it does not validate TCM theory or support clinical diagnostic or treatment claims.
news-202611-guangdong-15th-plan:
  summary_en: The Guangdong Provincial Health Commission, the Guangdong Administration of Traditional Chinese Medicine, and the Guangdong Development and Reform Commission issued the Guangdong 15th Five-Year Plan for TCM Development (Yue Wei [2026] No. 4; dated 8 October 2026 and posted on the provincial TCM administration website on 2 November). The plan is framed around Western-Chinese collaboration, digital and intelligent transformation, and Guangdong-Hong Kong-Macao cooperation, and aims for universal access to quality TCM services by 2030. A dedicated chapter supports TCM large-model and agent development, high-quality datasets, digital platforms and knowledge graphs, and smart TCM hospitals. This is a provincial plan, not a model release.
news-202604-zhejiang-15th-plan:
  summary_en: The General Office of the People's Government of Zhejiang Province issued the Zhejiang 15th Five-Year Plan for TCM Development (Zhe Zheng Ban Fa [2026] No. 14, dated 24 April 2026). The plan aims, by 2030, to basically complete a pioneering province for TCM modernization with nationally leading TCM AI applications, and it coordinates service, industry, science and technology, talent, culture, governance, and digital-intelligence modernization. One headline indicator is that the share of TCM medical institutions applying medical large models should reach 100% by 2030, and the plan calls for Zhejiang to become an important source of TCM AI development. This is a provincial plan, not a model release.
news-202610-hunan-15th-plan:
  summary_en: The General Office of the People's Government of Hunan Province issued the Hunan 15th Five-Year Plan for TCM Development (Xiang Zheng Ban Fa [2026] No. 53, dated 9 October 2026). The plan aims for universal access to TCM services by 2030 and sets nine groups of tasks, including faster digital and intelligent empowerment of TCM, smart TCM hospitals, shared prescriptions and data connectivity, AI-assisted diagnosis and intelligent dispensing at the grassroots, and high-quality dataset development. The provincial TCM administration's official interpretation was posted on the Hunan government portal on 11 November 2026. This is a provincial plan, not a model release.
news-202610-hubei-15th-plan:
  summary_en: An official interpretation posted on 22 October 2026 by the Hubei Provincial Health Commission states that, with the consent of the provincial people's government, the provincial health commission, development and reform commission, and TCM administration jointly issued the Hubei 15th Five-Year Plan for TCM Development on 19 September 2026. The interpretation says the plan aims for universal access to TCM services by 2030 and includes digital-intelligence empowerment and standards, continuing smart-hospital construction, deeper use of data resources, and TCM artificial intelligence. The official interpretation page was opened in this pass; the plan-text link listed on the same site returned 404 and was not used as a source. This is a provincial plan, not a model release.
news-202610-grassroots-tcm-tech:
  summary_en: The General Department of the National Administration of Traditional Chinese Medicine and the General Office of the National Health Commission issued a notice on promoting grassroots TCM appropriate techniques (Guo Zhongyiyao Zong Yizheng Fa [2026] No. 8; dated 14 October 2026 and posted on the NATCM website and, via Xinhua, on the Chinese government portal on 28 October). The notice calls for a national-provincial-city-county promotion network, basically complete coverage of county promotion centers by 2030, and priority rollout of at least 15 techniques in six categories. It also sets out digital support for the work and exploratory use of AI tools for teaching, assisted diagnosis, and quality control. This is a grassroots service-capacity policy, not a product launch.
tcmaster:
  summary_en: Chen Zheng and colleagues at Tsinghua University, Beijing University of Chinese Medicine, and the Guangdong Provincial Laboratory of Traditional Chinese Medicine present TCMaster, a confidence-aware query and physical-design method for multi-source TCM knowledge graphs. The system integrates pharmacopoeias, prescriptions, molecular databases, and LLM-extracted micro-semantics into a property graph with about 221,000 entities and 723,000 base edges, and it rewrites Cypher queries under provenance-level edge confidence. The authors report retrieval speedups on Neo4j and a 20.0 percentage-point gain in TCMbench QA accuracy from graph retrieval. Scale and scores are author-reported.
news-202611-shanxi-15th-plan:
  summary_en: "The Shanxi Provincial Health Commission and the Shanxi Development and Reform Commission issued the Shanxi 15th Five-Year Plan for TCM Development (Jin Wei Zhongyiyao Keji Fa [2026] No. 3; dated 28 October 2026 and posted on the provincial health commission website on 3 November). The plan aims, by 2030, to make decisive progress toward a strong TCM province, using scientific innovation, digital-intelligence transformation, and TCM–Western collaboration to strengthen Shanxi’s TCM brand. A dedicated chapter supports digital-intelligence empowerment, including a trusted TCM data space and high-quality AI datasets, uses of multimodal large models in assisted decision-making, record quality control, inheritance of renowned physicians’ experience, and new-drug research, plus smart TCM hospitals and grassroots intelligent assisted diagnosis. The official full-text page was opened in this pass. This is a provincial plan, not a model release."
news-202610-fujian-herb-quality:
  summary_en: "Thirteen Fujian departments, led by the Provincial Health Commission and the Provincial TCM Administration, issued Several Measures on Improving the Quality of Chinese Medicines and Promoting High-Quality Development of the TCM Industry (Min Wei Gui [2026] No. 4; dated 15 October 2026, posted on the provincial health commission website on 26 October, and valid through 31 December 2030). The measures implement State Council General Office document No. 11 of 2025 and cover protection of Fujian geo-authentic herbs, standardized cultivation, industrial clusters, and TCM industry upgrading, including faster intelligent retrofitting of manufacturers, stepwise development of smart factories, and an informatized traceability system. The official webpage and the public PDF were opened in this pass. This is a provincial industry-quality policy, not a product launch."
course-bucm-tcm-basics:
  summary_en: "A China University MOOC course on Fundamental Theories of Traditional Chinese Medicine, taught by Ma Shuran of Beijing University of Chinese Medicine and aimed at TCM students and general learners. It covers yin-yang and the five phases, visceral manifestation and meridians, qi, blood and body fluids, etiology and pathogenesis, and treatment principles. The official course page was opened in this pass. The current term runs from 14 September 2026 to 20 January 2027; the platform also records an earlier offering from October 2019. This is a formal university open course, not a marketing clip."
course-bucm-tcm-intro:
  summary_en: "A China University MOOC introductory course on traditional Chinese medicine, taught by Wang Tong of Beijing University of Chinese Medicine. It introduces TCM through medical anecdotes, methods, theory, and practice. The official course page was opened in this pass. The current term runs from 28 September 2026 to 20 January 2027; the platform also records an earlier offering from October 2019. This is a formal university open course, not a marketing clip."
course-bucm-herb-safety:
  summary_en: "A China University MOOC course on the safe use of Chinese medicines, taught by Zhang Bing, Lin Zhijian, and Zhang Xiaomeng of Beijing University of Chinese Medicine. It covers pharmacovigilance, recognition of adverse reactions, and safety issues of commonly used Chinese patent medicines. The course description states that it was recognized as a 2017 national-level quality online open course. The official course page was opened in this pass. The current term runs from 7 September to 14 December 2026; the platform also records an earlier offering from October 2015. This is a formal university open course, not a marketing clip."
tonguenet:
  summary_en: "Yang, Dong, Lin, and corresponding author Lü propose TongueNet, a multimodal model that fuses tongue images with text for multi-label classification of disease nature and location. Training used 4,815 Roboflow-collected tongue images. The authors report 89.12% accuracy and an F1 of 48.07% for disease nature; the paper does not give a code repository. The Inner Mongolia Autonomous Region Hospital of Traditional Chinese Medicine, Inner Mongolia Medical University, and Inner Mongolia University should be distinguished."
hist-2010-drugcipher:
  summary_en: "Zhao and Li Shao present drugCIPHER, a 2010 general pharmacology framework that uses linear regression to relate drug-treatment and chemical similarity to proximity on a protein-interaction network and thereby infer targets at a genome-wide scale. Later TCM reviews cite the method. It should not be merged with TCMSP or the 2026 DeepTCM entry already in this catalog."
chen2025-tongue-analysis:
  summary_en: "Chen, Chen, Zhou, Zhu, He, and corresponding author Zhang present an integrated tongue-diagnosis system with acquisition hardware, semi-supervised segmentation, color correction, and feature classification, using 2,738 clinical cases. The authors report a Dice of 0.967 for U2net-MT tongue-body segmentation; the paper does not give a code repository, and training versus test image counts are not clearly stated. This is distinct from TongueNet and TongueDx/TongueDx2."
shi2023-tongue-lung-cancer:
  summary_en: "Shi and Guo (co-first), Chun, Liu, Liu, Tu, and corresponding author Xu build a lung-cancer risk model from TFDA-1 tongue images of 862 participants. With tongue images only, a random forest reached author-reported accuracy of 0.679±0.048 and AUC 0.752±0.051; the data are not public for project-confidentiality reasons. This should be kept distinct from other tongue-diagnosis entries and does not change the person page for Xu Jiatuo."
li2025-acugraph-protocol:
  summary_en: "Li, corresponding author Ahmad and colleagues publish a study protocol comparing Acugraph computer-aided point selection with manual point selection as an adjunct to physiotherapy for mild-to-moderate knee osteoarthritis. The planned sample is 50 patients and 12 sessions. This is a protocol, not trial results, and the paper reports no measured outcomes. The existing survey surv-acupoint-cad already warns against treating this paper as a completed trial."
lai2022-voice-constitution:
  summary_en: "Lai, Guan, Men, Shang, and corresponding author Zhang use 720 voice spectrograms from 48 participants and ResNet34 to distinguish qi-deficiency and balanced constitutions. The authors report 81.5% accuracy and an AUC of 0.85, and they point to code at GitHub GYT0704/Voice_Classification. This is distinct from voice-constitution-acoustic and constitution-tap."
liu2025-constitution-tongue:
  summary_en: "Liu and Fan (co-first) and corresponding author Zhang prospectively collect 1,374 tongue images at Dongzhimen and Guang’anmen Hospitals and fuse traditional and deep features to recognize five constitutions. Accuracy figures in the abstract and Table 5 are inconsistent in print, while the AUC values 0.948 and 0.898 appear in both places and should be recorded together. The paper does not give a code repository. This is distinct from TongueNet, chen2025-tongue-analysis, and other constitution entries."
ahn2025-tci-research-priorities:
  summary_en: "Ahn, Zhou, Jiang, Kerr, Zhu, Song, and joint senior author Rudan use the CHNRI method to have experts score research ideas in traditional, complementary, and integrative medicine, and they compare the list with ChatGPT-4o, Claude 3.5, and Grok 3. Fifty-three people responded, 34 scored, and 157 ideas were collected. This is a research-priority consensus, not a trial of efficacy."
dherbkb:
  summary_en: "Corresponding authors Wang and Chen and colleagues present DHerbKB, a knowledge base that combines chronic-kidney-disease dietary principles with information on toxic Chinese medicines and offers an online recommendation system. It includes nutrition data on 8,725 foods and several classes of toxic herbal items. A 128-session evaluation with non-specialist users is an author-reported usability check. The system is at https://dherbkb.hywanglab.org.cn/. The license is CC BY-NC-ND 4.0."
hist-2010-herb-network:
  summary_en: "Corresponding author Li Shao, with Zhang, Jiang, Wei, and Zhang, present DMIM, building a herb network from 3,865 collaterals-related formulas and discussing multi-layer co-modules with Liuwei Dihuang Wan as an example. In vitro tests report IC50 values of 3.2 μM for vitexicarpin and 3.4 μM for timosaponin A-III (author-reported). This should not be merged with the same-year drugCIPHER paper, TCMSP, HERB, or the 2026 DeepTCM entry. The Li Shao person page was not changed."
yu2025-ais-heat-syndrome:
  summary_en: "Yu, corresponding authors Zhu and Song and colleagues use a convolutional network on a 193-case large-artery atherosclerotic acute ischemic stroke cohort at Xuanwu Hospital, combining TCM syndrome features and laboratory values to predict heat versus non-heat syndrome. After dropping incomplete records, 123 cases remain. On the test set, combined features reach accuracy and F1 of 0.95; AUC is 0.91 in the text and 0.90 in Figure 3C. The authors describe this as a preliminary study. The data are not public, and no code is given. The license is CC BY."
shen2022-tcm-injection-mitotox:
  summary_en: "Shen, corresponding authors Feng and Ma and colleagues use a HepG2 glucose/galactose ATP assay and an HCT116 respiration-deficient proliferation assay to screen 35 TCM injections. Xiyanping, Dengzhanhuasu, Shuanghuanglian, and Yinzhihuang meet the authors’ mitochondrial-toxicity criteria, and rutin, baicalin, scutellarin, and forsythin are suggested as candidate constituents. This is an in-vitro screen, not a clinical trial. The license is CC BY."
park2026-tkm-omop:
  summary_en: "Park, corresponding author Lee and colleagues convert electronic records from Wonkwang University Gwangju Korean Medicine Hospital to OMOP CDM 5.3, producing the WKTKM resource of 88,449 patients and extending KIOM terminology for Korean-medicine-specific concepts. Patient data cannot be shared; ETL code is on GitHub and mapping rules are in the supplement. This is a methodological proof of concept, not an efficacy trial. The license is CC BY 4.0."
ruan2017-chinese-symptom-kb:
  summary_en: "Corresponding author Ruan and colleagues automatically build a Chinese symptom knowledge base from eight medical websites, three Chinese encyclopedias, and 250,000 electronic records from Shanghai Shuguang Hospital, and they link it to UMLS. The results section reports 135,485 entities and 26,821 symptoms (including 3,968 TCM symptoms); the conclusion writes 135,484. For the electronic-record CRF, only precision is given. The knowledge base was released as linked open data. The license is CC BY 4.0. A previously listed Datahub dataset URL now redirects to a generic publications page and is not used as a source here."
surv-ma2023-chinmed-ml:
  summary_en: "Ma, Liu, and Li (co-first), with corresponding authors Li and Wang, publish a narrative review in Chinese Medicine on machine learning in TCM and natural-product research, describe their team’s coronary-syndrome-element model, and call for combining machine learning, TCM theory, and computational biology. This is not a systematic review; table accuracies come from cited papers. No new code or data are presented. The license is CC BY 4.0."
he2022-hepatoprotective-tcm:
  summary_en: "He, corresponding authors Xie and Wang and colleagues use machine learning to predict hepatoprotective activity of TCM constituents and, with efficacy-class and property clustering, propose 12 potentially hepatoprotective herbs. A voting model reaches 0.871 accuracy on a 178-compound test set. Nine of the 12 herbs already have animal or cell-experiment support in the literature. This is computational prediction plus literature checking, not a new clinical trial. The license is CC BY."
shi2021-tongue-pulse-fatigue:
  summary_en: "Shi, corresponding author Xu and colleagues collect tongue and pulse data at Shuguang Hospital and use four classifiers to distinguish disease-related from non-disease fatigue. The roughly 85% accuracy in the abstract comes from tongue and pulse plus age and BMI; with tongue and pulse alone, logistic regression accuracy is about 67%. The data are not public, and no code is given. The license is CC BY."
chen2022-dili-ai:
  summary_en: "Chen, corresponding authors Zhao and Shang and colleagues collect 2,035 compounds and compare nine machine-learning methods and a deep belief network for screening hepatotoxicity of individual compounds used in combined Chinese and Western medicines. Random-forest accuracy is 0.838 on the training set and 0.767 on the test set; the deep belief network’s test accuracy is 82.2%. Data are available on request, and no code is given. The license is CC BY 4.0."
surv-chu2022-ai-cam-scoping:
  summary_en: "Chu, corresponding author Youn and colleagues follow JBI and PRISMA-ScR to map AI applications in complementary and alternative medicine. Searching three English databases, they include 32 papers, mainly on acupuncture, tongue and lip diagnosis, and herbal medicine. This is a systematic scoping review, not a meta-analysis. Counts in the text, flowchart, and Table 1 are not fully consistent. No new code or data are presented. The license is CC BY."
surv-wang2021-ai-ra:
  summary_en: "Wang and Hou (co-first), with corresponding authors Zhang and Wang, publish a narrative review in Frontiers in Pharmacology on proposed uses of AI, deep learning, and cloud computing for rheumatoid arthritis in traditional and Western medicine, and they offer a conceptual model. This is not a systematic review and not a deployed clinical system. No new code or data are presented. The license is CC BY."
wang2019-meridian-ml:
  summary_en: "Wang, corresponding author Tang and colleagues collect 646 herbs and their constituents’ molecular fingerprints and ADME features from TCMID, and they predict meridian tropism at the herb and compound levels. The abstract’s highest accuracy is 0.83; in Table 2 the highest balanced accuracy for compound-level random forests is 0.67. Code is posted on GitHub. The license is CC BY."
tang2022-crc-tcm-prognosis:
  summary_en: "Tang and Gao (co-first), with corresponding author Yang, retrospectively include 558 patients with stage I–III colorectal cancer after curative surgery, compare four machine-learning methods for internal validation of 3- and 5-year recurrence or metastasis, and add TCM intervention and syndrome type. Code is posted on Gitee. Figures for the 5-year intervention model in the text and Table 3 are inconsistent. The license is CC BY."
wang2014-cf-syndrome-cprf:
  summary_en: "Wang, corresponding author Yang and colleagues apply conformal prediction and random forests to 736 chronic-fatigue cases for multi-label classification of four syndrome elements, and they compare conformal naive Bayes, conformal k-NN, and ML-KNN. The highest subset accuracy is 0.9959, but only leave-one-out cross-validation is used. Data are provided in the supplement. The license is CC BY."
lee2015-pulse-htn-pilot:
  summary_en: "Lee, corresponding author Kim and colleagues analyze the association of guan-position pulse-wave physical quantities with hypertension, and their predictive value, in 393 Korean women aged 46–73. This is a pilot: only 52 hypertension cases, classes are imbalanced, and sensitivity for the hypertension class is very low. It should not be merged with other pulse-and-hypertension entries. The license is CC BY 4.0."
yu2020-pdm-acup-fc-predict:
  summary_en: "Yu and Xie (equal contribution), with corresponding authors Liang and Yang, randomize 54 patients with primary dysmenorrhea to true or sham acupuncture and analyze 35. True acupuncture significantly reduces pain; sham acupuncture does not. Leave-one-out regression uses eight baseline functional-connectivity features. The text and Figure 5 do not consistently match pain-change values and change rates. The license is CC BY."
chen2021-herbal-group-hann:
  summary_en: "Chen and Liu (co-first) distill TCM prescriptions with a hierarchical attention network and then use Apriori to mine efficacy-specific herb groups. Across 13 test efficacies, overall mean accuracy after distillation is about 15.57%–23.83%, higher than the undistilled control. The gold standard comes from the internet and confirmation by one expert. Tables 1 and 2 carry unrelated footnotes. The license is CC BY 4.0."
chen2007-tcm-semantic-escience:
  summary_en: "Corresponding author Chen and colleagues describe a TCM e-science system based on ontologies, semantic views, and grid services, including DartMapping, DartSearch, DartQuery, and DartFlow. They report an ontology of more than 20,000 classes and 100,000 instances and a system linked to more than 50 databases and 800 services (author-reported). This is a system description without an independent quantitative evaluation. The license is CC BY 2.0."
cheung2010-cm-semantic-web:
  summary_en: "Corresponding author Cheung and Chen publish a 2010 editorial in Chinese Medicine arguing for Semantic Web representation and harmonization of Chinese and Western medical data. The text cites DartGrid and states that the China Academy of Chinese Medical Sciences ontology has more than 8,000 classes and 50,000 instances, which differs from the author-reported figures in the 2007 system paper already in this catalog. This is a short editorial with no new data or evaluation. The license is CC BY 2.0."
samwald2010-lod-tcm:
  summary_en: "Corresponding author Samwald and colleagues publish a 2010 commentary in Chinese Medicine that uses the search for potentially antidepressant TCM plants as a use case for linked open data. The authors manually encode 76 assertions and interlink them with an RDF version of TCMGeneDIT. This is a commentary plus a small prototype, not a completed drug-discovery study. The license is CC BY 2.0."
jin2023-tcm-wm-cpg-method:
  summary_en: "Jin and colleagues, with corresponding authors Zeng and Shang, publish a 2023 position paper and methodological standard in Military Medical Research on writing clinical practice guidelines that organically integrate TCM and Western medicine. A stock-take of 54 published integrative guidelines finds that only 5.6% clearly frame clinical questions in an integrative way. This is neither a systematic review nor a clinical trial. The license is CC BY 4.0."
galkin2026-precious3gpt:
  summary_en: "Galkin, Ren, and corresponding author Zhavoronkov present a computational proof of concept in Aging and Disease: they cross Precious3GPT-generated aging omics signatures with BATMAN-TCM2 to screen or design anti-aging TCM formulas, and they release a multi-agent workflow and datasets. Cross-species analysis yields 13 genes and 34 multi-tissue compounds, 20 of which appear in Huashan Wuzi Dan. The paper does not experimentally or clinically validate these formulas. Three printed figure captions are misaligned with the figures. The PDF states a Creative Commons Attribution license."
liu2024-medbench:
  summary_en: "Liu and Hu (co-first), with corresponding author Zhang, present a 2024 Chinese medical LLM benchmark and cloud platform in Big Data Mining and Analytics, with 300,901 questions across 43 clinical specialties and with question-answer isolation and cyclic shuffling. This is not a TCM- or herbal-medicine-specific benchmark. The correct DOI is 10.26599/BDMA.2024.9020044, which is not the 9020014 identifier that has appeared in some lists, and it is not LingLanMedBench or the same-named AAAI benchmark. The license is CC BY 4.0."
surv-jing2018-hili:
  summary_en: "Jing and corresponding author Teschke publish a 2018 narrative review in the Journal of Clinical and Translational Hepatology comparing herb-induced liver injury, including Chinese herbal medicines, with chemical drug-induced liver injury in epidemiology, clinical features, and RUCAM grading. This is not a systematic review; the main comparison tables restate existing cohorts. There are wording and number conflicts between the abstract and Table 4, and between the text and Table 6 / Figure 2. The license is CC BY-NC 4.0."
tan2025-depression-kg-qa:
  summary_en: "Tan Ping, with corresponding authors Liu Huina and Wei Changfa, publish a methods paper in Shanghai Journal of Traditional Chinese Medicine (2025, 59(7)) that turns the integrative guideline on depression into a Neo4j knowledge graph of 303 entities and 436 relations, then uses template matching and ChatGLM4 to generate traceable answers. On 20 questions, five experts give overall scores of 64.25 for template matching, 80.25 for ChatGLM4 alone, and 83.63 for the combined system. A 32-case outpatient demonstration is qualitative; no open code or graph is provided. The official journal PDF can be downloaded; no printed Creative Commons license was seen."
xue2023-tcm-strategy:
  summary_en: "Xue Xiaojuan and colleagues, with corresponding author Zhang Boli, publish a 2023 strategic review and policy recommendations in Strategic Study of CAE (25(5)), based on the CAE consulting project on TCM development strategy in the new era. The paper reviews theory, clinical evaluation, resources, intelligent manufacturing, and international promotion, and offers six recommendations. This is not a systematic review and not a new algorithm or clinical trial. Unpaywall records the license as CC BY-NC-ND."
li2023-transformer-chd:
  summary_en: "Li Hongzheng, corresponding author Wang Jie and colleagues publish a methods paper in Chinese Journal of Experimental Traditional Medical Formulae (2023, 29(1)) that uses syndrome elements as an intermediary and builds a modified Transformer with multi-head attention, compound embeddings, and dropout, trained on 8,030 Wang Jie case records, with a qualitative comparison of 100 real prescriptions. The abstract gives no numeric accuracy for those 100 cases; the 93% and 96.46% figures cited in the text belong to earlier work. A Song et al. review once misprinted the volume as 9(1); the official pagination is 29(1):148–154. The official journal PDF can be downloaded; no printed Creative Commons license was seen."
surv-zeng2024-sfdm:
  summary_en: "Zeng Jingqi and corresponding author Jia Xiaobin publish a framework review in Engineering (2024, 40(9)) proposing a System Function Decoding Model (SFDM) that connects AI to holistic material-basis research in TCM. It organizes five top-down dimensions and a bottom-up element–structure–function path, and it looks ahead to an end-to-end component-syndrome model and an oral-formulation IVIVC mechanism model. This is not a systematic review; neither technical scheme is implemented or quantitatively evaluated here. The license is CC BY-NC-ND 4.0. The official Chinese version is 25 pages."
chen2023-gpt4-prescription:
  summary_en: "Chen Qitao, corresponding author Xia Lizhen and colleagues publish a short methods paper in China Pharmacy (2023, 34(23)) that sends pharmacopoeia and Chinese materia medica text to GPT-4 and a web-connected model to generate 30 herbal prescriptions, then has three same-hospital experts grade them blindly. Table 2 mean scores are 3.756 for expert consensus, 3.622 for GPT-4, and 3.501 for the connected model, with all pairwise P>0.05; a Turing test is reported as 138/270 (51.11%). The word “training” in the text does not mean parameter updates or fine-tuning. No code or prescription data are released, and no printed Creative Commons license was seen."
wang2022-syndrome-element-ai:
  summary_en: "Wang Jie, Duan Lian, Li Hongzheng, Liu Jinlei, and Chen Hengwen publish a Views & Comments piece in Engineering (2022, 8(1)) arguing that syndrome elements can serve as a hub for TCM AI diagnostic models that combine rule ensembles, guideline symptom scores, graph-convolution knowledge graphs, and small-sample data, using eight coronary syndrome elements as an example. This is not a systematic review and reports neither training-set size nor test accuracy. The license is CC BY-NC-ND 4.0. It is not the same paper as the later modified-Transformer article by the same group in Chinese Journal of Experimental Traditional Medical Formulae."
he2024-gpts-kg-extract:
  summary_en: "He Yuhao, corresponding author Li Ming and colleagues publish a methods paper in Shanghai Journal of Traditional Chinese Medicine (2024, 58(8)) that uses custom GPTs on ChatGPT 4.0 to extract entities and relations from 351 formulas in Zhonghua Yifang, loads them into Neo4j, and compares the result with CasRel and GPLinker based on bert-Chinese. Total P, R, and F1 for the GPTs are 97.44%, 98.09%, and 97.48%. The experiment was completed by overseas collaborators; no open GPT, prompts, or annotations are provided. The official version is 58(8):1–6, DOI 10.16305/j.1007-1334.2024.2401070. The official journal PDF can be downloaded; no printed Creative Commons license was seen."
surv-tian2023-atm-four-dx:
  summary_en: "Tian, corresponding author Hongwu Wang and colleagues publish a scientometric study in Annals of Translational Medicine (2023, 11(3)) that uses Web of Science, VOSviewer, and CiteSpace to analyze AI literature on the four TCM diagnostic methods. The text reports 136 eligible studies from 2007–2022. This is not a systematic review and has no PRISMA. The license is CC BY-NC-ND 4.0. The official version is 16 pages, DOI 10.21037/atm-22-6431. It is not the same paper as the existing catalog entry surv-tian2024."
huang2020-pulse-highdim:
  summary_en: "Ching-Han Huang, Yu-Min Wang, and corresponding author Shana Smith publish a methods paper in Mathematical Biosciences and Engineering (2020, 17(6)) that extracts 71-dimensional features from ANSWatch pulse signals and uses principal-component analysis plus an artificial neural network to distinguish 10 pulse types. Twenty-seven principal components explaining 95% of variance reach a mean accuracy of 98.2%. The official version is downloadable under CC BY 4.0; no code or raw data are provided. DOI 10.3934/mbe.2020353."
cha2024-omop-team:
  summary_en: "Jiyun Cha, Eun Kyoung Ahn, Young-Heum Yoon, and Man Young Park publish a three-page MEDINFO 2023 short paper in Studies in Health Technology and Informatics (2024, pp. 1349–1351) that extracts items from Korean-medicine clinical guidelines on facial palsy, dysmenorrhea, and stroke and maps them to OMOP CDM 6.0. Of 52 deduplicated items, 42 are general clinical information and 10 are TEAM-specific; all map at table level, while three cannot be placed in existing fields at field level. The license is CC BY-NC 4.0, DOI 10.3233/SHTI231189. This is not the same paper as park2026-tkm-omop."
fu2025-bes-anemia-tongue-face:
  summary_en: "Hongyuan Fu, Yi Chun, and Yahan Zhang (equal contribution), with corresponding authors Yongzhi Li and Xu Jiatuo, publish a methods paper in Biomedical and Environmental Sciences (2025, 38(8)) that enrolls 533 women aged 20–49 at Shuguang Hospital and uses color and texture features of face and tongue images to screen for anemia. LASSO selects 19 of 62 indicators; an ANN reaches test AUC 0.849 and accuracy 0.781, and a fused ResNet50V2 model reaches AUC 0.846 and accuracy 0.818. The official journal PDF can be downloaded; no printed Creative Commons license was seen, and no code or original images are provided. DOI 10.3967/bes2025.047."
news-202611-yunnan-15th-plan:
  summary_en: "The General Office of the Yunnan Provincial People's Government issued the Yunnan TCM Revitalization and Development Plan for the 15th Five-Year Plan period (Yun Zheng Ban Fa [2026] No. 46, dated 5 November 2026 and published on the provincial government portal on 11 November 2026). The plan sets a 2030 goal of making further progress in TCM revitalization so that everyone can access TCM services, and it includes a dedicated chapter on digital empowerment: connecting TCM institutions to the provincial health-information platform, building high-quality TCM datasets, exploring TCM plus artificial intelligence and intelligent-assisted diagnosis, and accelerating smart TCM hospitals and internet TCM hospitals, as well as intelligent acupuncture, tuina and decoction equipment. It also strengthens Tibetan, Dai and Yi medicine services. This is a provincial planning document, not a launched model. The official full text on yn.gov.cn was opened."
news-202609-ningxia-15th-plan:
  summary_en: "The Ningxia Health Commission and Development and Reform Commission issued the Ningxia Hui Autonomous Region TCM Revitalization and Development Plan for the 15th Five-Year Plan period after approval by the regional government in letter Ning Zheng Han [2026] No. 55 dated 11 September 2026. The two departments issued the plan on 16 September 2026, and the Health Commission published the full text on 30 September 2026. The plan aims by 2030 to improve an all-population, life-cycle TCM service system so that everyone can access TCM services. It calls for exploring AI-enabled TCM development, a regional smart-empowerment project, standardized smart TCM hospitals and pharmacies, and precise AI applications in grassroots TCM services. This is a provincial planning document, not a launched model. The official full text and the government approval page were opened."
news-202609-fujian-15th-plan:
  summary_en: "The Fujian Provincial Health Commission and Fujian Administration of Traditional Chinese Medicine issued the Fujian TCM Revitalization and Development Plan for the 15th Five-Year Plan period on 29 September 2026; the Health Commission website lists the publication time as 30 September 2026. The plan aims by 2030 to improve high-quality TCM development mechanisms and advance Fujian as a strong TCM province so that everyone can access TCM services. Its digitalization chapter calls for Min-school TCM high-quality datasets and TCM agents, data-asset registration pilots, a Data Elements × action, smart hospital campuses and specialty large models at provincial TCM hospitals, and intelligent-assisted decision systems. This is a different instrument from Fujian's already catalogued herb-quality measures. This is a provincial planning document, not a launched model. The official HTML full text and PDF attachment were opened."
news-202610-hainan-ftp-ordinance:
  summary_en: "The Hainan Free Trade Port Regulations on Promoting the Development of Traditional Chinese Medicine were adopted by the Standing Committee of the 7th Hainan Provincial People's Congress on 30 September 2026, promulgated as Standing Committee Announcement No. 114, and took effect on 1 November 2026. The 50-article local regulation covers TCM services, materia medica and industry, Li and Miao medicine, talent and science, inheritance and culture, opening-up and international cooperation, and safeguards. It encourages smart TCM medical institutions, allows the use of internet technologies and licensed AI medical devices in TCM services, supports digital and AI archives for Li and Miao medical inheritance, and supports real-world TCM research platforms. The complete official text was opened on the Sanya Municipal People's Congress website, and the official announcement was opened in the 12 October 2026 documents edition of Hainan Daily."
news-202604-hospital-decoction-rules:
  summary_en: "The National Administration of Traditional Chinese Medicine and the National Health Commission issued the Specifications for the Management of TCM Decoction Pieces in Hospitals (2026 Edition) (Guo Zhong Yi Yao Yi Zheng Fa [2026] No. 3, dated 8 April 2026). The specifications govern procurement, acceptance, storage and curing, dispensing, institution-specific processing, decoction, extemporaneous preparation and prescription review in hospitals at all levels, took effect on the date of issuance, and repeal the 2007 edition. They encourage the use of information systems in decoction-piece management and require quality tracking, tracing and monitoring for outsourced decoction services. This is a departmental management standard, not a launched model. The official full text on gov.cn was opened."
magr-tcm:
  summary_en: "Lv, Pan, Li, Hu, Xu, Jin, Fang and colleagues present MAGR-TCM, building a knowledge graph under expert supervision from 741 high-quality gynecology cases (the paper reports 10,231 entities and 32,051 relations) and a four-agent retrieval-augmented generation framework that tries to reconstruct the TCM disease–pattern–principle–formula–medicinal chain from colloquial home inquiries. The authors report better scores than compared baselines on RAGAS and expert review, and 100% sensitivity and specificity on a safety test set; these figures are author-reported. This is a home-consultation and triage prototype study, not a clinical efficacy trial. The Springer Nature / Chinese Medicine article page was opened in this pass."
zhou2026-tcm-llm-eval:
  summary_en: "Zhou, Wang, Zhang, Bai, Sun, Liu, and Li publish a Perspective in Frontiers in Digital Health arguing that medical licensing-exam questions are convenient but insufficient benchmarks for traditional Chinese medicine large language models, and cannot by themselves show support for clinical reasoning or better patient care. They discuss four sources of potential bias and propose a clinically grounded evaluation mix of dynamic scenarios, open-ended generation, multimodal assessment, longitudinal reassessment, and clinical validation. This is a commentary on evaluation design, not a new benchmark dataset or a clinical trial. The official article page was opened in this pass."
leaf-tcm:
  summary_en: "Luo, Ding, Zhang, Miao, and Shi present LEAF, a two-stage framework evaluated on 3,253 records and 14 respiratory syndromes from the public TCM-SD benchmark. A large language model first extracts a 35-item symptom ontology compiled from public TCM sources; among three interchangeable models, the authors rank Qwen2.5-14B-Instruct first, then Phi-4 and the TCM model BianCang. A second stage compares NSGA-II, SPEA2, CMOPSO, and NSDE for interpretable multiobjective feature selection. This is a methods and benchmarking study, not a clinical efficacy trial. The official article page was opened in this pass."
surv-huang2026-formula-ai:
  summary_en: "Huang, Jiang, Hu, Ye, Liu and colleagues review the technology readiness of knowledge graphs, large language models, and high-throughput validation for developing classic TCM formulas, using metabolic syndrome as a case. They cite about 99,584 named formula entries in the second edition of the Dictionary of Traditional Chinese Medicine Formulas, and state that China’s NMPA approved 77 new TCM products in 2013–2024, fewer than ten a year on average. They place knowledge-graph work at TRL 3–6 and large language model work at TRL 1–5, and describe the three streams as uneven. This is a readiness review, not a new-drug approval or an efficacy trial. The official article page was opened in this pass."
surv-liu2026-gscm-digital:
  summary_en: "Changning Liu, Xiaoduo Zhang, and corresponding author Hongcai Shang publish a publish-ahead-of-print review in Guidelines and Standards of Chinese Medicine on 26 October 2026. They discuss gaps in evidence-based TCM research—including methodological tension with holistic principles, subjective syndrome differentiation, and limited consensus on outcome measures—and review how big data, artificial intelligence, and Internet-plus tools might support evidence repositories, more standardized clinical studies, and pharmaceutical quality assurance. This is a methods and standards review, not an evaluation of a deployed system. The official Ovid journal page, including the abstract and affiliations, was opened in this pass."
surv-hu2026-tcm-dg-ai:
  summary_en: "Ziquan Hu publishes a quantitative systematic review in Frontiers in Artificial Intelligence and Applications, volume 433, Digitalization and Management Innovation V, pages 730–743. The review covers 372 peer-reviewed studies from 2023–2025 (98 international, 274 domestic) on AI in discipline-group development at TCM institutions, and uses author-built indices (TI, RDI, IDI, CKII) to describe themes and bottlenecks. The author reports generally low model interpretability (mean IDI 0.72) and limited integration of classical TCM knowledge (mean CKII 0.20). No author affiliation was visible on the opened guest abstract page. This is an institutional-development review, not a clinical trial. The official IOS Press ebook page was opened in this pass."
surv-li2026-tongue-bibliometric:
  summary_en: "Li, Yang, Lin, Wang, Yan, Zheng, Xiang, and Tang publish a bibliometric review of AI-assisted TCM tongue diagnosis, comparing Web of Science Core Collection and CNKI records from January 2015 to August 2026. They include 482 studies (295 WoSCC, 187 CNKI) and use CiteSpace and VOSviewer to map collaboration, keywords, and emerging topics, analysing the two databases separately. This is a landscape review, not a clinical validation of diagnostic accuracy. The official article page was opened in this pass."
surv-huang2026-tongue-stroke:
  summary_en: "Huang, Yin, Shao, Jiang, Wang, and Xu systematically review the diagnostic accuracy of tongue examination for post-stroke TCM syndrome differentiation, searching to 23 February 2026 (PROSPERO CRD420261288502). They include ten studies from mainland China and 3,437 participants: six manual-diagnosis studies (n=2,191) and four AI-assisted studies (n=1,246). The authors themselves treat the estimates as exploratory agreement with existing syndrome-classification processes rather than clinically validated accuracy, citing very low certainty of evidence and uncertain independence of the reference standard. AI studies are synthesized narratively. The official article page was opened in this pass."
jiang2026-constitution-cluster:
  summary_en: "Jiang, Liu, and Han apply unsupervised clustering to large-scale Constitution in Chinese Medicine Questionnaire data in order to describe symptom subgroups within mixed TCM constitutions. They compare Likert-scale and binary encodings and combinations of UMAP, t-SNE, or PCA with K-means, DBSCAN, or Gaussian mixture models. They report that binary encoding with UMAP and a Gaussian mixture model was comparatively stable and yielded a ten-cluster solution with distinguishable heat-related, cold-sensitive, and mixed patterns. This is a methodological exploration of survey data, not a treatment trial. The official Scientific Reports article page was opened in this pass."
llm-h2g:
  summary_en: "Zhang, Yin, Wu, Yao, Yang, Cui, Li, Pengwei Hu, and Lun Hu present LLM-H2G, a hypergraph contrastive-learning model for herb–disease association prediction. It places herbs, compounds, proteins, and diseases in an enhanced heterogeneous hypergraph, encodes entity names with a large language model, and aligns those semantics with structural readouts through an InfoNCE objective. The authors report that it outperforms representative network-embedding, GNN, graph contrastive, and hypergraph baselines on TCM-suite and Ethnobotany benchmarks, with larger gaps for sparsely connected herbs; ablations indicate that both semantic enrichment and the enhanced hypergraph are needed. Case studies are computational attribution and literature-supported suggestions, not clinical validation. The official BMC Bioinformatics article page was opened in this pass."
cracks-yolo:
  summary_en: "Ding, Wu, Shen, Lin, and Men propose Cracks-YOLO, an improved YOLOv5 detector for cracked-tongue signs in TCM tongue diagnosis. They add switchable atrous convolution to the backbone for multi-scale features and a Transformer encoder for long-range dependencies. This is a computer-vision methods paper. Quantitative accuracy figures were not fully captured from the opened abstract in this pass and are therefore not restated here. It is not a clinical efficacy trial. The official article page was opened in this pass."
surv-wang2026-tongue-gc:
  summary_en: "Wang, Li, Zhang, Shao, Gao, and Zhang systematically review AI analysis of digital tongue images for gastric cancer, precancerous gastric lesions, and related gastrointestinal disorders, searching to 10 June 2026 (PROSPERO CRD420261444857). Nine studies from 2018–2025 were included. Internally validated AUCs ranged from 0.61 to 0.99, but only three studies reported external validation, which generally showed performance drops, and calibration was rarely assessed. The authors conclude that the approach is promising but early-stage, and should be viewed as a possible adjunctive pre-endoscopic triage tool rather than a replacement for gastroscopy. The official article page was opened in this pass."
yu2026-who-pulse-terms:
  summary_en: "Yu, Yap, and Amirdabbaghian compare English renderings of 49 Chinese pulse-diagnosis terms shared by the 2007 WHO Western Pacific traditional-medicine terminology standard and the 2022 WHO International Standard Terminologies on Traditional Chinese Medicine. They classify revisions as retention, expansion, or replacement: 17 terms (34.7%) were unchanged, 8 (16.3%) were expanded with additional English variants, and 24 were replaced. The study is descriptive and uses no inferential statistics. It is a terminology and standardization analysis, not a pulse-diagnosis algorithm or a clinical trial. The official BMC article page was opened in this pass."
surv-jia2026-cdss-cvd:
  summary_en: "Jia, Zhang, Tong and colleagues, with corresponding authors Yan Ma, Bing Li, and Huamin Zhang, review clinical decision support systems for cardiovascular disease from an integrative Chinese and Western medicine perspective in Biomedical and Environmental Sciences (2026, 39(9): 1115–1130). They discuss TCM-CDSS that combine principle–method–formula–medicinal theory, expert experience, and knowledge graphs to move from syndrome differentiation toward formula recommendation. The review notes reported improvements in prescribing and blood pressure in hypertension studies, while effects on major cardiovascular events and mortality still need further evaluation. This is a review, not a prospective trial of a new system. The official besjournal.com article page was opened in this pass (received 1 March 2026, accepted 17 August 2026, published online 20 September 2026)."
course-hactcm-tcm-basics:
  summary_en: "A China University MOOC course on Fundamental Theories of Traditional Chinese Medicine, taught by Cui Shanshan of Henan University of Chinese Medicine. The course page describes it as a national-level quality online open course and covers the formation of TCM, qi monism and yin-yang and the five phases, visceral manifestation, essence, qi, blood and body fluids, meridians and constitution, etiology and pathogenesis, and principles of prevention and treatment. The official course page was opened in this pass. The current term runs from 20 July to 25 December 2026; the platform records an earlier offering from 9 October 2017. This is a formal university open course, not a marketing clip."
course-sdutcm-tcm-basics:
  summary_en: "A China University MOOC course on Fundamental Theories of Traditional Chinese Medicine, taught by Zheng Hong of Shandong University of Traditional Chinese Medicine. The page states that the course is supported by the university’s national key discipline in TCM basic theory and covers essence, qi, yin-yang and the five phases, visceral manifestation, essence-qi-blood-fluids-spirit, meridians and constitution, and etiology, pathogenesis and treatment principles. The official course page was opened in this pass. The current term runs from 6 September 2026 to 10 January 2027; the platform records an earlier offering from 16 March 2020. This is a formal university open course, not a marketing clip."
course-jnu-tcm-basics:
  summary_en: "A China University MOOC course on Fundamental Theories of Traditional Chinese Medicine, taught by Chen Liguo of Jinan University. It introduces the development of the TCM theoretical system, holism and pattern differentiation, yin-yang and the five phases, and TCM views of the body, disease, and prevention. The official course page was opened in this pass. The current term runs from 3 August to 27 December 2026; the platform records an earlier offering from 26 September 2019. This is a formal university open course, not a marketing clip."
course-gzucm-tcm-basics-intensive:
  summary_en: "A China University MOOC course titled Intensive Study of the Fundamental Theories of Traditional Chinese Medicine, taught by Yan Can of Guangzhou University of Chinese Medicine. It offers close readings of key topics in philosophy, visceral manifestation, qi, blood and body fluids, etiology, pathogenesis, and treatment principles; the page states that meridians and constitution are mainly provided as self-study materials. The official course page was opened in this pass. The current term runs from 14 September 2026 to 30 January 2027; the platform records an earlier offering from 2 October 2020. This is a formal university open course, not a marketing clip."
course-njutcm-diagnostics:
  summary_en: "A China University MOOC course on TCM diagnostics, taught by Xu Zheng of Nanjing University of Chinese Medicine. The official course page was opened in this pass. The current term runs from 22 July 2026 to 8 January 2027; the platform records an earlier offering from 28 June 2021. This is a formal university open course, not a marketing clip."
course-hactcm-diagnostics:
  summary_en: "A China University MOOC course on TCM diagnostics, taught by Che Zhiying of Henan University of Chinese Medicine. The official course page was opened in this pass. The current term runs from 28 August to 31 December 2026; the platform records an earlier offering from 28 February 2019. This is a formal university open course, not a marketing clip."
course-njutcm-herbal:
  summary_en: "A China University MOOC course on Chinese materia medica, taught by Tang Decai of Nanjing University of Chinese Medicine. The course page carries language recognizing it as a national-level quality online open course and also mentions a national first-class course designation. The official course page was opened in this pass. The current term runs from 31 August 2026 to 10 January 2027; the platform records an earlier offering from 14 November 2017. This is a formal university open course, not a marketing clip."
course-cdutcm-herbal:
  summary_en: "A China University MOOC course on Chinese materia medica, taught by Wang Jian of Chengdu University of Traditional Chinese Medicine. The course page describes it as a recognized national-level quality online open course and covers basic herbal theory and the properties, actions, and clinical use of commonly used Chinese medicines. The official course page was opened in this pass. The current term runs from 16 September to 31 December 2026; the platform records an earlier offering from 1 March 2018. This is a formal university open course, not a marketing clip."
course-gzucm-formula:
  summary_en: "A China University MOOC course on TCM formulas, taught by Quan Shijian of Guangzhou University of Chinese Medicine. The official course page was opened in this pass. The current term runs from 31 August 2026 to 9 January 2027; the platform records an earlier offering from 6 September 2021. This is a formal university open course, not a marketing clip."
course-njutcm-shanghan:
  summary_en: "A China University MOOC course on the Treatise on Cold Damage (Shanghan Lun), taught by Ling Yun of Nanjing University of Chinese Medicine. The official course page was opened in this pass. The current term runs from 28 August 2026 to 10 January 2027; the platform records an earlier offering from 22 October 2019. This is a formal university open course, not a marketing clip."
course-hactcm-jinkui:
  summary_en: "A China University MOOC course on the Essentials from the Golden Cabinet (Jingui Yaolue), taught by Wang Yong of Henan University of Chinese Medicine. The official course page was opened in this pass. The current term runs from 24 August to 27 December 2026; the platform records an earlier offering from 21 March 2020. This is a formal university open course, not a marketing clip."
course-hactcm-neijing:
  summary_en: "A China University MOOC selected-readings course on the Inner Canon, taught by Huo Lei of Henan University of Chinese Medicine. The official course page was opened in this pass. The current term runs from 24 August to 18 December 2026; the platform records an earlier offering from 20 March 2020. This is a formal university open course, not a marketing clip."
course-ccucm-neijing:
  summary_en: "A China University MOOC selected-readings course on the Inner Canon, taught by Su Ying of Changchun University of Chinese Medicine. The official course page was opened in this pass. The current term runs from 31 August 2026 to 17 January 2027; the platform records an earlier offering from 23 March 2020. This is a formal university open course, not a marketing clip."
course-fjzyy-neijing:
  summary_en: "A China University MOOC selected-readings course on the Inner Canon, taught by Gao Jiajun of Fujian University of Traditional Chinese Medicine. The official course page was opened in this pass. The current term runs from 6 August to 31 December 2026; the platform records an earlier offering from 9 September 2019. This is a formal university open course, not a marketing clip."
course-hactcm-acupuncture:
  summary_en: "A China University MOOC course on acupuncture and moxibustion, taught by Gao Xiyan of Henan University of Chinese Medicine. The official course page was opened in this pass. The current term runs from 31 August 2026 to 10 January 2027; the platform records an earlier offering from 21 March 2020. This is a formal university open course, not a marketing clip."
course-bucm-acupuncture-intro:
  summary_en: "A China University MOOC introductory course on acupuncture and moxibustion, taught by Ma Wenzhu of Beijing University of Chinese Medicine. The course page describes it as a recognized national-level quality online open course. The official course page was opened in this pass. The current term runs from 29 September to 31 December 2026; the platform records an earlier offering from 24 November 2015. This is a formal university open course, distinct from the three BUCM MOOCs already in the catalog, and is not a marketing clip."
course-bucm-wenbing:
  summary_en: "A China University MOOC course on warm-disease theory, taught by Gu Xiaohong of Beijing University of Chinese Medicine. The official course page was opened in this pass. The current term runs from 15 September to 31 December 2026; the platform currently lists only this term, so the first offering is recorded as 2026. This is a formal university open course, not a marketing clip."
course-bucm-internal-selected:
  summary_en: "A China University MOOC selected-topics course on internal medicine in traditional Chinese medicine, taught by Zhao Jinxi of Beijing University of Chinese Medicine. The official course page was opened in this pass. The current term opened on 22 October 2026 and is listed with a far-future end date, indicating long-term or on-demand access; the platform records an earlier offering from 31 December 2019. This is a formal university open course, not a marketing clip."
course-fjzyy-health-concepts:
  summary_en: "A China University MOOC general-education course on TCM concepts of health, taught by Li Candong of Fujian University of Traditional Chinese Medicine. The course page describes it as a recognized national-level quality online open course, guided by Inner Canon ideas of health cultivation, and covering principles of health, self-assessment, discrimination of qi-blood and yin-yang states and visceral function, and supplementation of deficiency patterns. The official course page was opened in this pass. The current term runs from 1 September to 31 December 2026; the platform records an earlier offering from 29 April 2019. This is a formal university open course, not a marketing clip."
course-fjzyy-yijinjing:
  summary_en: "A China University MOOC course on TCM exercise therapy focused on Yijinjing, taught by Yan Xinghui of Fujian University of Traditional Chinese Medicine. The official course page was opened in this pass. The current term runs from 15 September to 15 December 2026; the platform records an earlier offering from 16 May 2019. This is a formal university open course, not a marketing clip."
course-cuhk-everyday-cm:
  summary_en: "A Coursera open course, Everyday Chinese Medicine, offered by The Chinese University of Hong Kong and taught by Prof. Vincent Chung of the Hong Kong Institute of Integrative Medicine. The course page describes it as a public-education platform on Chinese-medicine diagnosis and treatment and on regulation of Chinese-medicine services and herbal products. The page records launchedAt as 25 September 2017. The official Coursera page (HTTP 200) and the CUHK School of Chinese Medicine Coursera introduction page were opened in this pass. This is a formal university open course, not a marketing clip."
course-cuhk-everyday-cm-2:
  summary_en: "A Coursera open course, Everyday Chinese Medicine 2, offered by The Chinese University of Hong Kong and taught by Yung Tat To of the Hong Kong Institute of Integrative Medicine. The course page says it introduces basic principles of Chinese medicine to the public and healthcare professionals. The page records launchedAt as 3 February 2020. The official Coursera page was opened in this pass (HTTP 200). This is a formal university open course, not a marketing clip."
course-hkust-health-concepts:
  summary_en: "A Coursera open course, Health Concepts in Chinese Medicine, offered by The Hong Kong University of Science and Technology and taught by Robert Ko of the Division of Life Science. The course page frames basic Chinese-medicine theories in the context of modern medicine. The page records launchedAt as 6 November 2017. The official Coursera page was opened in this pass (HTTP 200). This is a formal university open course, not a marketing clip."
person-renqing-dongzhu:
  name_en: "Renqing Dongzhu"
  summary_en: "Xining. Professor and doctoral supervisor at the College of Tibetan Medicine, Qinghai University. The official youth-faculty profile (posted 21 May 2017) states that he is Tibetan, born in 1973, holds a PhD from the School of Ethnic Medicine, Chengdu University of Traditional Chinese Medicine (2017), teaches undergraduate courses including Tibetan medical febrile disease, epidemic disease, and traumatology, served as associate professor from July 2001 to March 2024, and has been professor since April 2024. The official faculty page was opened in this pass."
  orgs_en:
  - "College of Tibetan Medicine, Qinghai University"
person-xue-charlie-rmit:
  name_en: "Charlie C. Xue"
  summary_en: "Melbourne. Distinguished Professor and Associate Deputy Vice-Chancellor (International) at RMIT University. The official profile states that he has worked in higher education and the health industry since 1987; became Associate DVC (International) in January 2021; was reappointed as Distinguished Professor for 2024–2028; previously headed the Discipline of Chinese Medicine; served as National Chair of the Chinese Medicine Board of Australia from 2011 to 2021; has been a member of the WHO Expert Advisory Panel for Traditional Medicine since 2007; and directed the WHO Collaborating Centre for Traditional Medicine at RMIT from 2005 to 2022. Research interests listed on the page include evidence-based medicine and evaluation of traditional-medicine evidence. The official RMIT profile was opened in this pass. No Chinese name was given on the page, so the catalog keeps the official English name."
  orgs_en:
  - "RMIT University"
ds-tcm-flow:
  summary_en: "TCM-Flow: A Traditional Chinese Medicine Virtual Screening Dataset, released on Zenodo on 23 October 2026 as version v1 by Ma Shaochen and li xiong. The record is a public dataset with a 15.4 MB TCM-Flow_Dataset.zip file under a Creative Commons Attribution 4.0 International license. The version DOI is 10.5281/zenodo.23600814. The official Zenodo record was opened in this pass via its DOI. The landing page does not state further compound counts or screening-library size, so those figures are not recorded here. This is a public dataset landing page, not an internal benchmark."
ds-ethnomedone:
  summary_en: "EthnoMedOne v1.0.0, released on Zenodo on 22 October 2026 as version v1 by Shuai Xiaomin of Guizhou University. The record describes a structured, downloadable dataset that integrates ethnomedicinal records from multiple Chinese ethnic medical traditions with standardized compounds, protein targets, diseases, syndromes, symptoms, and compound-level properties, and it provides a SQLite database, matched CSV files, documentation, source and mapping audits, and example queries. The page states that the reported associations are standardized data linkages and should not be read as experimentally validated mechanisms or clinical efficacy. The license is CC BY 4.0, and the version DOI is 10.5281/zenodo.23553718. The official Zenodo record was opened in this pass via its DOI. This is a public dataset landing page, not an internal benchmark."
news-202610-tcm-qc-center-rules:
  summary_en: "The National Administration of Traditional Chinese Medicine issued the Administrative Provisions on TCM Medical Quality Control Centers (Guo Zhongyiyao Yizheng Fa [2026] No. 10, dated 8 October 2026 and published in full on the NATCM website on 14 October 2026, effective from the date of issuance). The rules apply to TCM quality-control centers at all levels, assign national centers to NATCM, and require centers to use information systems and existing data platforms to collect and analyze quality-control data while meeting network and data-security requirements. The official full text and policy interpretation pages were opened in this pass. This is a quality-control management regulation, not a product launch."
news-202610-tcm-nursing-schemes:
  summary_en: "The Department of Medical Administration of the National Administration of Traditional Chinese Medicine issued a notice on applying TCM nursing schemes and the handbook on TCM techniques for nursing staff (posted on the NATCM website on 8 October 2026). The notice states that NATCM commissioned the China Association of Chinese Medicine to revise TCM nursing schemes for 13 diseases, including stroke (2026 edition), and the Handbook on TCM Techniques for Nursing Staff (2026 edition), which have been published on the association's website, and asks local authorities to organize healthcare institutions to apply them. The official NATCM notice page was opened in this pass. This is a notice promoting nursing schemes, not a product launch."
news-202607-guangxi-15th-plan:
  summary_en: "The General Office of the Guangxi Zhuang Autonomous Region People's Government issued the Guangxi Plan for the Revitalization and Development of TCM (Zhuang and Yao medicine) in the 15th Five-Year Plan period (Gui Zheng Ban Fa [2026] No. 50, dated 24 July 2026 and published on the regional government portal on 31 July 2026). The plan sets a 2030 goal of a more complete TCM service system covering the whole population and life cycle, and it includes a dedicated chapter on digital empowerment and an Artificial Intelligence plus TCM action: building smart TCM hospitals, supporting intelligent-assisted diagnosis at the grassroots, constructing high-quality AI datasets, and applying AI to assisted decision-making, inheritance of master physicians' experience, and Zhuang-Yao diagnostic scenarios. The official full text on gxzf.gov.cn was opened in this pass. This is a provincial planning document, not a launched model."
news-202604-guangxi-industry-action:
  summary_en: "The Guangxi Health Commission, the Guangxi Administration of Traditional Chinese Medicine, and the Guangxi Department of Industry and Information Technology issued the Three-Year Action Plan for High-Quality Development of the Guangxi TCM Industry (2026–2028) (Gui Zhongyiyao Fa [2026] No. 10, dated 9 April 2026, approved by the regional government, and published in full on the health-commission website on 14 April 2026). The plan sets a 2028 target of more than 1.1 trillion yuan in output across the TCM industrial chain and includes intelligent, green upgrading of manufacturing, a traceability system, AI plus TCM clinical-service scenarios, intelligent-assisted diagnosis devices at the grassroots, and support for smart TCM hospitals. It is distinct from the Guangxi 15th Five-Year TCM plan added in the same pass. The official full text and interpretation pages were opened. This is a provincial industry action plan, not a launched model."
omnitongue:
  summary_en: "OmniTongue, a multimodal large-language-model benchmark for automated tongue diagnosis in traditional Chinese medicine, proposed by Liuyi Xu, Yun Guo, Shusheng Li, Xuewen Zhang, Yining Qian, and An-Yang Lu of Northeastern University. The paper reports 1,351 expert-validated tongue images and 21,616 instruction pairs across 16 clinical dimensions, region-specific annotations, and 66 fine-grained labels. The authors state that existing MLLMs still show substantial gaps and that medical-specific models do not display a stable domain advantage. The page says the code and dataset will be released later. The arXiv abstract (2611.22652, submitted 17 November 2026) was opened in this pass. Counts and results are author-reported."
tcm-hplc-llm:
  summary_en: "Xingchu Gong and colleagues at Zhejiang University, with co-authors at Tianjin University of Traditional Chinese Medicine, Hangzhou Third People's Hospital, and the Jinhua Institute of Zhejiang University, present a human–machine workflow in which a large language model proposes HPLC schemes for a TCM formula, followed by experimental validation and iterative optimization, using the Eczema External Wash Formula as the case. Among five prompt strategies, expert-role setting with structured reasoning performed best according to the authors. The final method used a SunShell C18 column and a 0.1% formic-acid water–acetonitrile gradient, separating seven markers within 55 minutes, with 20 components characterized by LC-MS. The formula comprises seven herbs, including Saposhnikoviae Radix and Phellodendri Cortex. The arXiv abstract and PDF (2611.20994, submitted 16 November 2026) were opened. Method details and results are author-reported."
acusimnet:
  summary_en: "acuSimNet, a multi-task network for multi-view, self-occlusion-aware visibility prediction of cranio-cervical acupuncture points, proposed by Jiatao Ma of the Georgia Institute of Technology and Qilei Sun of the University of Derby. The paper argues that acupoints are defined by abstract principles rather than clear anatomical landmarks and that prior methods are often single-view or rely on relative-position calculation, with limited attention to occlusion by the body, hair, or clothing. The authors report 99.97% validation accuracy on 174 cervicocranial acupoints and a reduction in the epochs needed to reach 99% accuracy from about 3,000 in prior work to 86. The official title retains the spelling Awared. The arXiv abstract (2611.20025, submitted 15 November 2026) was opened. Results are author-reported."
retcm:
  summary_en: "ReTCM, a TCM consultation model that combines a knowledge graph, a three-level external knowledge base aligned with theory–syndrome–treatment, retrieval-augmented generation, and an evidence-driven reflection mechanism, by Xiang Yang, Li Li, Han Dongxuan, and Yuan Zhongxu of Southwest University of Science and Technology, with co-authors at a Sichuan provincial AI engineering center and the University of Science and Technology of China. The authors report gains over several baselines on ROUGE-L, METEOR, FactScore, and CMB, including 5.8 and 6.9 percentage-point improvements on CMB over HuangDI and GPT-4o. The official journal page lists received 8 January 2026, revised 2 April 2026, online 1 November 2026, and published 30 October 2026, in Computer Engineering and Applications 62(21): 114–125. The official article page was opened. Metrics are author-reported."
surv-deng2026-tcm-cancer-ai:
  summary_en: "A narrative review in Frontiers in Pharmacology by Yongkang Deng, Zongze Lou, Guozheng Li, Miao Huang, and Guihua Wu of Ganzhou People's Hospital, synthesizing recent AI work on decoding anti-cancer mechanisms of TCM formulas, with a focus on multi-herb prescriptions. The review covers machine-learning screening, deep-learning bioactivity prediction, literature mining, network pharmacology, docking and virtual screening, and multi-omics integration, and it discusses bottlenecks such as non-standardized data, limited interpretability, weak external validation, and difficulty integrating TCM theory with biomedical computational frameworks. The journal page lists 19 August 2026 and 4 November 2026. The official full-text page was opened in this pass. This is a review, not a newly released model."
course-bucm-gynecology:
  summary_en: "An open China University MOOC course, Gynecology of Traditional Chinese Medicine, offered by Beijing University of Chinese Medicine and taught by Shi Yun. The course page describes it as a core clinical course covering common gynecological conditions and four-examination methods, intended for undergraduates in Chinese medicine, acupuncture and tuina, and integrative medicine, as well as graduate students in TCM gynecology. The official course page was opened in this pass. The current term runs from 7 September 2026 to 10 January 2027; the earliest term recorded on the page begins on 15 March 2025. This is a formal university open course, not a marketing clip."
course-bucm-herb-identification:
  summary_en: "An open China University MOOC course, Authentication of Chinese Materia Medica, offered by Beijing University of Chinese Medicine and taught by Yang Yaojun. The course page focuses on macroscopic identification of medicinal materials and decoction pieces, linking appearance to quality, and notes that the course team is based on a NATCM key discipline, with Professor Yan Yonghong named as the academic lead. The official course page was opened and lists Yang Yaojun as the instructor. The current term runs from 31 August 2026 to 9 January 2027; the earliest term recorded on the page begins on 10 November 2023. This is a formal university open course, not a marketing clip."
course-smu-surgery:
  summary_en: "An open China University MOOC course, Lectures on Surgery of Traditional Chinese Medicine, offered by Southern Medical University and taught by Deng Yan, Yang Liu, Lai Meisheng, Pan Enshan, and Chen Jingliang. The course page covers skin and sexually transmitted diseases, breast disease, sores and ulcers, anorectal disease, andrology, peripheral vascular disease, thyroid disease, superficial tumors, and other surgical conditions, using case-based questions. The official course page was opened in this pass. The current term runs from 7 September 2026 to 10 January 2027; the earliest term recorded on the page begins on 1 December 2020. This is a formal university open course, not a marketing clip."
course-hactcm-schools:
  summary_en: "An open China University MOOC course, Doctrines of Various TCM Schools, offered by Henan University of Chinese Medicine and taught by Li Li, Liu Wenli, Li Chengwen, Guo Fengpeng, Cai Lina, Zhao Dike, and Kong Shenyan. The course page describes it as a study of historical master physicians' academic thought, clinical experience, and schools of thought. The official course page was opened in this pass. The current term runs from 28 August 2026 to 3 January 2027; the earliest term recorded on the page begins on 21 February 2022. This is a formal university open course, not a marketing clip."
news-202610-grassroots-demo-standards:
  summary_en: "The General Office of the National Administration of Traditional Chinese Medicine issued the 2026–2028 cycle construction standards for national demonstration cities and counties in grassroots TCM work (NATCM Comprehensive Medical Administration Letter [2026] No. 225, dated 10 October 2026). The notice implements the 2026 management measures and repeals the 2022 city and county standards (NATCM Medical Administration [2022] No. 1). This pass opened the Hunan Provincial Government portal republication of the NATCM text (source attributed to the NATCM website; portal publication date 3 November 2026). The original NATCM page is http://www.natcm.gov.cn/yizhengsi/gongzuodongtai/2026-10-28/39041.html (timestamp 28 October 2026); direct requests to that URL timed out or returned HTTP 500 in this pass."
news-202604-grassroots-demo-measures:
  summary_en: "The National Administration of Traditional Chinese Medicine issued the Measures for the Administration of National Demonstration Cities and Counties in Grassroots TCM Work (NATCM Medical Administration [2026] No. 5). The measures set a three-year creation cycle, with provincial review and national verification of applicant units and assessment before naming. This pass opened the full text on the China Traditional Chinese Medicine News site (attributed to NATCM, dated 22 April 2026). The original NATCM page is http://www.natcm.gov.cn/yizhengsi/zhengcewenjian/2026-04-21/37964.html; direct requests to that URL timed out or returned HTTP 500 in this pass."
news-202610-grassroots-demo-units:
  summary_en: "The General Office of the National Administration of Traditional Chinese Medicine published the list of 2026–2028 cycle applicant units for national demonstration cities and counties in grassroots TCM work (NATCM Comprehensive Medical Administration Letter [2026] No. 238, dated 23 October 2026). Units are to follow the cycle construction standards; NATCM will organize assessment before formal naming. This pass opened the Hunan Provincial Government portal republication of the NATCM text (source attributed to the NATCM website; portal publication date 3 November 2026). The original NATCM page is http://www.natcm.gov.cn/yizhengsi/gongzuodongtai/2026-10-28/39040.html; direct requests to that URL timed out or returned HTTP 500 in this pass."
news-202603-tertiary-hospital-review-standards:
  summary_en: "The National Administration of Traditional Chinese Medicine issued the Accreditation Standards for Tertiary TCM Hospitals (2026 edition) (NATCM Medical Administration Letter [2026] No. 39, dated 13 March 2026). The standards take effect from the notice date and repeal the 2017 tertiary TCM, integrated, and ethnic-medicine hospital standards and their implementation rules. This pass opened the official State Council departmental-document page on gov.cn and a publicly downloadable official PDF (last-modified 28 March 2026). The NATCM source URL is http://www.natcm.gov.cn/yizhengsi/zhengcewenjian/2026-03-27/37885.html."
news-202603-township-tcm-service-norms:
  summary_en: "NATCM, the National Health Commission, and the National Disease Control and Prevention Administration jointly issued the Basic Norms for TCM Service Management in Township Health Centers and Community Health Centers (NATCM Medical Administration [2026] No. 2, dated 11 March 2026), merging and revising the 2003 township and community norms. The six-chapter norms cover TCM clinical departments and pharmacies, staffing, service content, and professional guidance. This pass opened the full official text on the State Council departmental-document page on govcn, plus a Xinhua report carried by gov.cn on 24 March 2026. The NATCM source URL is http://www.natcm.gov.cn/yizhengsi/zhengcewenjian/2026-03-23/37872.html."
seat:
  summary_en: "Liuyi Xu, Qing Wang, Zikai Liang, An-Yang Lu, and corresponding author Yining Qian of Northeastern University (Qinhuangdao campus for the corresponding author) propose SEAT, an evidence-audited framework for multi-label tongue-sign recognition. The paper argues that coexisting tongue signs depend on heterogeneous evidence and that uniform multi-label heads make it hard to check whether predictions come from clinically relevant cues. Built on frozen DINOv2 patch features, SEAT combines mask-guided sign-specific attention, a semi-relaxed optimal-transport pathway over LAB/HSV color prototypes, and a co-occurrence-aware transport regularizer. The authors report a mean macro-F1 of 72.59 (standard deviation 1.04) across six seeds on TongueDx, and 74.15 for a six-model ensemble. The work has been submitted to IEEE. This pass opened the arXiv abstract and a genuine PDF (2611.19748, dated 15 November 2026) and the authors' code repository page. Results are author-reported."
seeing-is-not-enough:
  summary_en: "Yucheng Liu of the University of Oxford and corresponding author Everett X. Wang of the Beijing Institute of Nanoenergy and Nanosystems, Chinese Academy of Sciences, present a TCM tongue-assessment framework in which image and pulse findings guide targeted symptom inquiry and the answers narrow the syndrome shortlist before reporting. They construct 2,600 cases from distinct real tongue photographs, assigned syndromes, simulated symptom responses and rendered pulses; 2,599 enter five-fold source-disjoint evaluation. The authors report 46.4% fine-syndrome accuracy from image/pulse prediction alone on clean images; at acquisition cost 12, inquiry without image/pulse evidence reaches 34.4%, while the combination reaches 65.8% accuracy and 90.8% top-three inclusion. This pass opened the arXiv abstract and a genuine PDF (2610.38774, v2). Results are author-reported."
course-bucm-orthopedics:
  summary_en: "Science of TCM Orthopedics and Traumatology, an open course by second-level professor Xu Lin of Beijing University of Chinese Medicine on the Chinese University MOOC (icourse163) platform. The course page states that the university's TCM orthopedics program was established in 2021 and lists a syllabus covering history, etiology, examination, treatment, emergency care, fractures, dislocations, soft-tissue injury, and bone disease. This pass opened the first-party course page; the current term runs from 27 January 2026 to 31 December 2026 (Asia/Shanghai). No videos were downloaded. This is a formal university open course, not a marketing short video."
news-202503-herb-quality-opinion:
  summary_en: "The General Office of the State Council issued the Opinions on Improving the Quality of Traditional Chinese Medicines and Promoting High-Quality Development of the TCM Industry (Guo Ban Fa [2025] No. 11, dated 15 March 2025; posted on gov.cn on 20 March 2025). The opinions cover resource conservation, medicinal-material production, industrial upgrading, clinical-value assessment and supply, science and technology, regulation, and supporting measures. They call for digital and intelligent upgrading of TCM manufacturing and for developing a large model for evaluating clinical effectiveness of TCM, among other measures. This pass opened the official State Council document page on gov.cn. The catalog previously included only Fujian's implementing measures, not this State Council document itself."
constcm:
  summary_en: "ConsTCM, a multimodal language model that aligns fundus images with TCM constitution differentiation, proposed by Xiangyu Ji, Guozheng Rao and colleagues at Tianjin University, with co-authors at Tianjin University of Traditional Chinese Medicine, La Trobe University, and the Institute of Science Tokyo. The paper describes a two-stage supervised fine-tuning pipeline: basic fine-tuning on general ophthalmoscopy datasets, then constitution-specific fine-tuning on real-world self-labeled hospital cases, using a mixture of existing classification tasks and hospital data. The authors report a 5.6% improvement over baselines and, in an ablation, a 47% improvement in an objective evaluation relative to the base model. The official Springer article page was opened in this pass; it lists online publication on 6 April 2026, volume 14, issue 1, article 50, with a December 2026 cover date. The page is not open access, and the official PDF URL returned HTML rather than a PDF. Results are author-reported."

ldcomkg:
  summary_en: "LDComKG, an LLM-powered, community-aware knowledge-graph completion framework for traditional Chinese medicine, proposed by Xing Zeng, Ziyan Wang, Jingxian Chai and colleagues at Nanjing University of Chinese Medicine and the Nanjing Hospital of Chinese Medicine affiliated to NJUCM. The method uses large language models to extract entities and relations from unstructured ancient Chinese medical texts, then applies Leiden community detection and GraphSAGE representations for link prediction and graph completion. On annotated ancient-text datasets, the authors report 93.33% accuracy, 93.69% F1, and 95.87% AUC with GPT-4o-mini, and 95.94% accuracy, 95.07% F1, and 97.72% AUC with GPT-4o, and they compare with KEPLER and CoLAKE. The official Springer article page was opened in this pass; it lists online publication on 18 February 2026, volume 14, issue 1, article 41, with a December 2026 cover date. The page is not open access, and the official PDF URL returned HTML rather than a PDF. Results are author-reported."

surv-chan2026-acu-ml:
  summary_en: "A scoping review in Frontiers in Neurology by Wancy Chan, Guan-Jun Huang, Chien-Chen Huang, and Yi-Hung Chen of the Graduate Institute of Acupuncture Science, China Medical University, Taiwan, and An Nan Hospital, China Medical University, mapping machine-learning use in acupuncture research. The official page labels the article type as Systematic Review. The authors searched PubMed for 2011–2024 and included 36 articles, reporting a rise after 2019 and a predominance of work from China. Seventeen studies focused on efficacy prediction, mainly for pain; others covered technique detection, prescription recommendation, acupoint sensitization and specificity, usage-frequency prediction, meridian conduction, and robotic point localization. Support vector machines were the most common algorithm in efficacy-prediction studies; 7 of 11 used MRI features, often with responder-classification labels. The authors find encouraging predictive performance but cite small samples, methodological heterogeneity, inconsistent data types, and the lack of standardized datasets as limits on generalizability. The journal page lists online 22 December 2025 and publication 14 January 2026, volume 16, article 1689061. The official full-text page and PDF were opened in this pass. This is a review, not a new model release."

surv-nie2026-ai-acupuncture:
  summary_en: "A review in Frontiers in Medicine by Ru Nie, Kaiyue Deng, Jing He, Jialin Jia, Hongye Wang, Shuting Yuan, and Tie Li of the Department of Acupuncture and Tuina, Changchun University of Chinese Medicine, on artificial intelligence for acupuncture decision-making and treatment. The paper reviews AI applications across four clinical tasks: guiding acupoint selection, assisting localization, improving safety, and predicting efficacy, and it offers recommendations for future intelligent acupuncture systems. The authors argue that existing TCM-AI reviews are often broad overviews and less often mapped onto the acupuncture clinical workflow. The journal page labels the article type as Review and lists online 13 April 2026 and publication 27 April 2026, volume 13. The official full-text page and PDF were opened in this pass. This is a review, not a new model release."

surv-hou2025-ai-acupuncture:
  summary_en: "A review in Frontiers in Medicine by Guo-Liang Hou, Bao-Qiang Dong, Ben-Xing Yu, Jian-Yu Dai, Xing-Xing Lin, and Ze-Zhong Cheng of the School of Acupuncture and Massage, Liaoning University of Traditional Chinese Medicine, on AI in acupuncture as a bridge between traditional knowledge and precision integrative medicine. The review synthesizes work on outcome prediction, including deep learning, meta-analytic modeling, natural language processing, computer vision, and neuroimaging, and cites examples such as CNNs for tongue-image classification and ZHENG-pattern detection and transformer-based NLP for extracting clinical knowledge from classical texts. The authors discuss limited and heterogeneous data, annotation variability, and gaps in clinical validation, and they recommend federated multimodal data platforms, explainable AI, and open science. The journal page labels the article type as Review and lists online 15 July 2025 and publication 31 July 2025, volume 12. The official full-text page and PDF were opened in this pass. This is a review, not a new model release."

course-njutcm-pediatric-tuina:
  summary_en: "An open China University MOOC course, Pediatric Tuina, offered by Nanjing University of Chinese Medicine and taught by Wu Yunchuan (professor), with Wang Jianzhu (associate professor / attending TCM physician) and lecturers Yang Xiaocun, Wang Yuhang, and Xu Xie. The course page describes pediatric tuina as a clinical subject for preventing and treating common pediatric conditions and promoting growth, covering commonly used points, manipulation techniques, and health-care methods, including lung, spleen, kidney, and other disease modules. The official course page was opened in this pass. The current term runs from 9 September 2026 to 20 December 2026; the earliest term recorded on the page begins on 2 December 2019. The page lists 450 enrolments. This is a formal university open course, not a marketing clip."

course-gzucm-pediatrics:
  summary_en: "An open China University MOOC course, Pediatrics of Traditional Chinese Medicine, offered by Guangzhou University of Chinese Medicine and taught by Xu Youjia (professor / chief physician), with Yang Jinghua (chief TCM physician) and Liu Zhuoxun (associate chief physician). The course overview describes general principles of pediatric growth, physiology, pathology, and care, plus common systemic diseases, and is aimed at undergraduate medical students as well as general learners. The official course page was opened in this pass. The current term runs from 24 August 2026 to 31 December 2026; the earliest term recorded on the page begins on 23 September 2019. The page lists 1,374 enrolments. This is a formal university open course, not a marketing clip."

course-ahtcm-yiguwen:
  summary_en: "An open Zhihuishu course, Medical Classical Chinese (Yiguwen), offered by Anhui University of Chinese Medicine and taught by Bu Feifei, Zhang Xuemei, and Wang Shuojian. The verifiable record was opened on the national Higher Education Smart Education Platform (ChinaOOC), which lists Zhihuishu as the offering platform, the three instructors, the university, more than 10,000 enrolments, and a last update date of 20 November 2026. The platform data give a term from 2026-07-20T16:00:00.000Z to 2027-01-19T16:00:00.000Z, i.e. 21 July 2026 to 20 January 2027 in Asia/Shanghai, matching the visible dates 2026/07/21 and 2027/01/20. The Zhihuishu course-home URL redirects to a JavaScript shell without extractable term or instructor fields, so it is not used as the sole source. Only this term is visible on the opened page, so the first offering is provisionally recorded as 2026. This is a formal university open course, not a marketing clip."
news-202611-shanghai-hq-plan:
  summary_en: "The Shanghai Municipal Health Commission and the Shanghai Administration of Traditional Chinese Medicine issued the Implementation Plan for High-Quality Development of Traditional Chinese Medicine in Shanghai (2026–2030) (Hu Wei Zhong Fa [2026] No. 13, dated 16 November 2026). The official commission page in the TCM-work column is timestamped 19 November 2026. The plan implements the national 15th Five-Year TCM revitalization plan and Shanghai's 15th Five-Year economic and social development outline, and was approved at the commission's 97th executive meeting. It sets out 30 tasks in 10 areas, including service delivery, life-course care, integrated Chinese and Western medicine, talent, inheritance and innovation, industry, culture, opening-up, digital empowerment and standards, and sectoral reform. 2030 targets include citywide coverage of district public TCM hospitals; 60% TCM-licensed physicians, 90% geriatric departments, and 100% pediatric services in public TCM hospitals; 20% TCM-licensed physicians at the first practice site of community health centers, and 80% of those centers able to provide at least 15 techniques in 6 categories; 80% TCM health-management coverage for people aged 65 and over and 90% for children aged 0–36 months; electronic medical record application at level 4 or above in 95% of public TCM hospitals and level 5 or above in 50% of tertiary public TCM hospitals; resident TCM health-literacy around 45%; and at least five additional international standards led by Shanghai. The digital section calls for a 'Digital TCM' program, an open standard corpus, the Shanghai TCM cloud platform, and research and application of TCM AI large models. This pass opened the official full-text notice and the commission's official interpretation page dated 24 November 2026. This is Shanghai's 15th Five-Year TCM implementation plan, not a product launch."
news-202607-shanxi-decoction-norms:
  summary_en: "The Shanxi Provincial Health Commission and the Shanxi Medical Products Administration issued the Quality Management Standards for Contract Decoction of TCM Decoction Pieces (Jin Wei Zhongyiyao Keji Gui [2026] No. 1, dated 16 June 2026). The standards apply to medical institutions in the province and to manufacturers and distributors that provide contract decoction, covering both institution-entrusted decoction and patient-requested decoction at retail pharmacies. Contract decoction is treated as an extension of use or sale, and patient consent is required. Medical institutions bear primary responsibility for decoction quality, and entrusted firms bear direct quality responsibility. Toxic and narcotic decoction-piece prescriptions may not be entrusted, and subcontracting is prohibited. Process video recordings must be kept for at least 90 days, finished liquids must carry a traceability QR code, and original prescriptions, process data, and equipment logs must be kept for at least one year, with a data retention period of no less than three years. The standards take effect on 1 August 2026 and remain valid for five years. This pass opened the official full-text page in the commission's policy-document column, which is labelled 1 July 2026 13:40, although the URL path is dated 29 July 2026. News items published on 24 November 2026 by the commission and by People.cn's Shanxi channel (sourced to Shanxi Daily) concern the same document and are recorded as later reports, not as a separate catalog entry. This provincial quality standard had been missing from the catalog."
course-bucm-diagnostics-upper:
  summary_en: "Diagnostics of Traditional Chinese Medicine (Part I), an open China University MOOC course led by Professor Wang Tianfang of Beijing University of Chinese Medicine, with Professors Wu Xiuyan, Xue Xiaolin, and Zhao Yan, and Associate Professors Guan Jing, Song Yuehan, and Ma Jie. The official course page was opened in this pass. The current term runs from 31 August 2026 to 31 December 2026 (Asia/Shanghai) and lists 5,735 enrolments; the earliest term recorded on the page begins on 29 October 2015. The current-term outline begins with an introduction and inspection (wangzhen), corresponding to the diagnostic-methods half of the course. No videos were downloaded. This is a formal university open course, not a marketing short video."
course-bucm-diagnostics-lower:
  summary_en: "Diagnostics of Traditional Chinese Medicine (Part II), an open China University MOOC course led by Professor Wang Tianfang of Beijing University of Chinese Medicine, with Professors Wu Xiuyan, Xue Xiaolin, and Zhao Yan, and Associate Professors Guan Jing, Song Yuehan, and Ma Jie. The official course page was opened in this pass. The current term runs from 31 August 2026 to 31 December 2026 (Asia/Shanghai) and lists 1,654 enrolments; the earliest term recorded on the page begins on 16 September 2019. Part II focuses on pattern differentiation, including general principles, eight-principle, yin-yang deficiency, etiology, qi-blood-body-fluid, and zang-fu pattern differentiation, as well as six-channel, defensive-qi-nutrient-blood, and triple-energizer differentiation, medical-record writing, and integrated use of diagnostic methods. No videos were downloaded. This is a formal university open course, not a marketing short video."
surv-he2026-tcm-ai-paradigm:
  summary_en: "A review in Journal of Integration Technology (Jicheng Jishu) by He Yuxiang, Tang Ruoning, You Zhifeng, and Zhang Peng of the School of Biomedical Engineering, Shenzhen University of Advanced Technology; Feng Zhiwei of the School of Pharmacy; Li Jian of the Institute of Medical Device Industrial Technology; Cheng Wenxiang and Ke Liqing of the Shenzhen Institutes of Advanced Technology, Chinese Academy of Sciences; Zhang Peng is also listed with Shandong Zhongke Advanced Technology Co., Ltd. The article takes the shift from an experience-based paradigm to a data-intelligence paradigm as its thread, and discusses four directions: elucidating the material basis of Chinese medicines, optimizing formula compatibility, pharmaceutical engineering and industrial transformation, and knowledge engineering with large models. It argues that AI is moving TCM research toward data-driven, evidence-constrained, and human-in-the-loop work, while maturity remains uneven and challenges persist in interpretability, knowledge standardization, and ethics. Journal metadata place the article in 2026, volume 15, issue 5, pages 83–101, with a publication date of 16 September 2026, an online date of 15 June 2026, and DOI 10.12146/j.issn.2095-3135.20260517001. This pass opened the official article page and confirmed an openly available official PDF licensed CC BY 3.0. This is a review, not a new model release."
news-202611-guizhou-15th-plan:
  summary_en: "The Guizhou Provincial Administration of Traditional Chinese Medicine, the Guizhou Provincial Development and Reform Commission, and the Guizhou Provincial Health Commission issued the 15th Five-Year Plan for the Revitalization and Development of Traditional Chinese Medicine in Guizhou (Qian Zhongyiyao Fa [2026] No. 5). The official regulatory-document page lists both the drafting date and the effective date as 16 November 2026; the notice itself is dated 13 November 2026 and was posted at 20:25 on 16 November 2026. The plan had already been approved by the provincial people's government. By 2030, Guizhou aims to further improve a five-tier TCM service system covering the entire population and life cycle. Ten anticipatory indicators include raising the number of TCM practicing physicians per 1,000 population from 0.62 in 2025 to 0.71, raising residents' TCM health-culture literacy from 25.97% to 33%, and bringing the total output of the TCM industrial chain to 1.5 trillion yuan. The digitalization chapter calls for high-quality TCM datasets, primary-level AI-assisted TCM diagnosis, smart TCM hospitals, and a provincial TCM health big-data zone and telemedicine network on the provincial health-information platform. This update opened the official notice page and the official plan DOCX on atcm.guizhou.gov.cn, plus the official interpretation (18 November) and the report of the provincial government's approval (12 November)."

news-202610-nmpa-decoction-cross-province:
  summary_en: "The National Medical Products Administration issued Announcement No. 34 of 2026 on 30 September 2026, publishing the Provisions on the Inter-provincial Sale and Use of TCM Decoction Pieces Prepared in Accordance with Provincial Processing Standards, which take effect on 15 May 2027. Provincial-standard decoction pieces may be sold and used across provincial borders. Varieties that share the same name but differ by region in botanical origin, medicinal part, or processing method (excluding cleaning and cutting) are treated as clinically easily confused products and must be filed by the manufacturer with the provincial regulator of the procuring or using province through NMPA's filing platform, with the label warning “Medication reminder: strictly prevent clinical confusion.” Inspection in the receiving province must follow the standard identified on the product, not the receiving province's own processing standard. Pieces already produced before the provisions take effect may continue to be sold and used within their shelf life. This update opened the official Shanghai MPA republication of 9 October 2026 and the official NMPA DOCX annexes (HTTP 200); the NMPA HTML page itself returned 412 or 504 and was not treated as a successfully opened article."

news-202610-nmpa-tcm-variety-protection:
  summary_en: "The National Medical Products Administration issued Announcement No. 97 of 2026 on 30 September 2026, on strengthening the protection of traditional Chinese medicine varieties, effective from the date of issuance. The 13-article notice, made under the Drug Administration Law, the Regulations on the Protection of TCM Varieties, and the Drug Registration Administration Measures, allows marketing authorization holders to apply to NMPA and submit dossiers to the National TCM Variety Protection Review Committee. Provincial regulators must verify the authenticity of post-marketing clinical, pharmaceutical, and pharmacological/toxicological data. Supplementary materials must be submitted in a single package within 80 working days. During the protection period, NMPA will not accept registration applications for same-name, same-formula drugs; applications already accepted before protection is granted may continue, and any resulting protection will expire on the same date as the first protected product. After this announcement, provisions of the 2009 guiding principles (Guo Shi Yao Jian Zhu [2009] No. 57) that conflict with it no longer apply. This update opened the official full-text republications on the Shanghai MPA site (9 October 2026, HTTP 200) and the Shaanxi MPA site (11 November 2026)."

news-202611-cacms-dataset-chain-leader:
  summary_en: "On 18 November 2026, the China Academy of Chinese Medical Sciences reported that the National Data Administration had recently held a signing ceremony in Xiamen, Fujian, for task letters of chain-leader organizations in industry-level high-quality dataset development. NDA Commissioner Liu Liehong attended and spoke, and Vice Commissioner Xia Bing chaired the meeting. CACMS Vice President Yang Hongjun signed the task letter on behalf of the chain-leader organization for high-quality datasets in TCM scientific research. CACMS said it will focus on building high-quality datasets in this field and on efficient circulation and use of data elements. This update opened the official CACMS news page (HTTP 200). The item records a national data-element role, not a downloadable dataset or a model release."

news-202512-hk-tcm-blueprint:
  summary_en: "On 18 December 2025, the Government of the Hong Kong Special Administrative Region released its first Chinese Medicine Development Blueprint, issued by the Health Bureau. The official government press release (HTTP 200) sets out the vision of inheriting TCM wisdom, drawing on national experience and resources, improving the quality and comprehensiveness of health services for Hong Kong residents, and building Hong Kong as a bridgehead for Chinese medicine to the world. The blueprint covers five domains—Chinese medicine services, the Chinese medicine profession, Chinese medicines, cultural inheritance, and going global—with eight goals and 20 actions, including technology-enabled service upgrading, full implementation of GMP for proprietary Chinese medicines, use of the Government Chinese Medicines Testing Institute to develop standards, and an international hub for TCM information exchange and innovation. This update also opened the official 44-page simplified-Chinese PDF of the blueprint (HTTP 200)."

yaobao:
  summary_en: "Yingqiao Zhang, Zeming Li, Hiufung Yip, Bo Han, Zhenfeng Wu, Aiping Lyu (corresponding), and Lu Zhang (corresponding) present Yaobao, a Chinese patent medicine (CPM) knowledge assistant, as an Original Article in AI Evidence-Based Medicine. The official Ovid page lists it as Publish Ahead of Print dated 13 November 2026 and marks it Open PAP. Author affiliations include the Department of Computer Science, the School of Chinese Medicine, and the Institute of Systems Medicine and Health Sciences at Hong Kong Baptist University, and the State Key Laboratory for the Modernization of Classical and Famous Prescriptions of Chinese Medicine at Jiangxi University of Chinese Medicine. The authors report integrating six types of CPM resources into 95,197 question-answer pairs for a dual-level knowledge base that links semantic retrieval with source metadata, using retrieval-augmented generation. Yaobao is described as supporting follow-up questions, verifiable citations, multilingual and multimodal input, and external tools, with DeepSeek-V3 as the generator. On a 1,000-item single-turn benchmark against five general-purpose and two TCM-specific large language models, the authors report that Yaobao had the highest ROUGE-2, ROUGE-L, and METEOR scores in all three question categories and the highest ROUGE-1 scores for efficacy and prescription questions; for precautions, Qwen3-235B scored 0.6771 ROUGE-1 and Yaobao 0.6759, while Biancang-7B had the highest BLEU-1; Gemini-2.5-Pro gave Yaobao the highest overall mean score (3.57). These metrics are author-reported. The official Ovid article page was opened and the full abstract was visible; page metadata labelled the content FreeOpenAccessContent. The official PDF URL redirected to the HTML article page, so no official PDF was confirmed."

surv-wujz2026-tcm-qc-ml:
  summary_en: "Jing-Zhen Wu, Pan Li, Zi-Meng Qi, Xin-Xin Yang (corresponding), and Peng Yu (corresponding) of Changchun University of Chinese Medicine publish a narrative review in Pharmaceuticals on machine-learning methods, progress, and challenges in traditional Chinese medicine quality control. The article covers dimensionality reduction, spectral preprocessing, classical and deep models, and knowledge-driven fusion across four application settings: authentication and origin traceability, metabolomics-based assessment, processing and manufacturing control, and consistency evaluation of decoction pieces and preparations. Two machine-learning case studies and one process-analytical monitoring example are assessed against a shared validation checklist, and reporting of validation in cited performance studies is summarized. The authors note limitations including small datasets, distribution shift, and limited independent-domain validation, and they outline priorities for process monitoring and for linking analytical predictions to pharmacological and clinical evidence. The journal page lists received 1 October 2026, revised 26 October 2026, accepted 2 November 2026, and published 4 November 2026, as Pharmaceuticals 2026, 19(11), 1751. The official MDPI article page was opened and the full article was read. This is a review, not a new model release."

surv-wuben2026-phytomed-ai-ev:
  summary_en: "Ben Wu and Bin-Sheng He of Changsha Medical University and Yang-Yang Hu of the Second Affiliated Hospital of Hunan University of Chinese Medicine publish a critical narrative review in Frontiers in Pharmacology on the evidence required when artificial intelligence is used to support phytomedicine discovery. They argue that linking traditional-use records, botanical identity, chemical profiles, and pharmacological observations does not by itself validate a phytomedicine, and they examine evidence needs for botanical identity, pharmacological validation, and translational readiness. The journal page labels the article a Review, with online publication on 30 October 2026 and publication on 23 November 2026, in volume 17, article 1971140. The official Frontiers full-text page was opened, and the official PDF was confirmed (HTTP 206, %PDF-1.6 header). This is a review, not a new model release."

surv-li2025-multi-metabolite:
  summary_en: "Yu Li, Xiangjun Liu, Jingwen Zhou, Fengjiao Li, Yuting Wang, and Qingzhong Liu, of the Department of Clinical Laboratory at Shanghai Municipal Hospital of Traditional Chinese Medicine, Shanghai University of Traditional Chinese Medicine, publish a review in Frontiers in Pharmacology on artificial intelligence for modeling multi-metabolite, multi-target interactions in traditional Chinese medicine. The article discusses identification of active metabolites, therapeutic targets, and combination mechanisms, and contrasts multi-metabolite TCM interventions with single-target therapies. The journal page labels the article a Review, with online publication on 25 March 2025 and publication on 15 April 2025, in volume 16, article 1541509. The official Frontiers full-text page was opened, and the official PDF was confirmed (HTTP 206, %PDF-1.4 header). This is a review, not a new model release."

surv-hanss2026-tcm-synthbio:
  summary_en: "Shanshan Han, Tao Qin, and Zhizhen Feng, of the Shaanxi Key Laboratory of Qinling Ecological Security / Enzyme Engineering Research Center of Shaanxi Province and the Bio-Agriculture Institute of Shaanxi Province, Shaanxi Academy of Sciences, publish a review in Frontiers in Plant Science on artificial intelligence and synthetic biology in traditional Chinese medicine for public-health applications. The article notes the historical public-health role of TCM and discusses challenges including unsustainable medicinal resources. The journal page labels the article a Review, with online publication on 19 March 2026 and publication on 13 April 2026, in volume 17, article 1789960. The official Frontiers full-text page was opened, and the official PDF was confirmed (HTTP 206, %PDF-1.4 header). This is a review, not a new model release."

surv-lijh2026-piwei-ai:
  summary_en: "Li Jinghua, Zu Yaqi, and Liu Zhangyi of the Institute of Information on Traditional Chinese Medicine, China Academy of Chinese Medical Sciences, and Tang Xudong of the Institute of Spleen and Stomach Diseases, Xiyuan Hospital, China Academy of Chinese Medical Sciences, publish a paper in Journal of Traditional Chinese Medicine (中医杂志) on applications of artificial intelligence and large-model algorithms in research on TCM spleen-stomach diseases. The authors argue that natural language processing and deep learning can improve intelligent processing of the literature, knowledge mining, and clinical-evidence integration, and can support clinical decision-making, personalized treatment plans, and efficacy prediction. They also call for multimodal data fusion, interdisciplinary collaboration, and attention to ethics. The official journal page gives the bibliographic record as Journal of Traditional Chinese Medicine, 2026, 67(2): 149-152+158, DOI 10.13288/j.11-2166/r.2026.02.006, with a publication timestamp of 14 January 2026. The official journal article page was opened and the Chinese and English abstracts were read. This is a review-style article, not a new model release."

dynamic-tongue-phenotyping:
  summary_en: "Tianhao Wang and Jian Ren of the Department of Traditional Chinese Medicine Diagnostics, Shandong University of Traditional Chinese Medicine, publish a Perspective in Frontiers in Medicine proposing a conceptual framework for dynamic tongue diagnosis and temporal phenotyping. They argue that digital tongue diagnosis has advanced in image-based feature extraction and machine learning, but that the dominant paradigm still relies on static, single-frame examination and therefore discards temporal information generated during the examination. The journal page labels the article a Perspective, with online publication on 10 August 2026 and publication on 25 August 2026, in volume 13, article 1888509. The official Frontiers full-text page was opened, and the official PDF was confirmed (HTTP 206, %PDF-1.6 header). This is a conceptual framework, not a new model or benchmark release."

hu2026-tongue-microbiome-masld:
  summary_en: "Ruomeng Hu, Jialin Deng, Liping Tu, Tao Jiang (corresponding), and Jiatuo Xu (corresponding), of the School of Traditional Chinese Medicine, Shanghai University of Traditional Chinese Medicine, publish a research article in Frontiers in Endocrinology that integrates tongue-image features with the tongue-coating microbiome to distinguish damp-heat and cold-dampness patterns in metabolic dysfunction-associated steatotic liver disease (MASLD). The study enrolled 320 participants, including 214 MASLD patients with dampness patterns (110 damp-heat, 104 cold-dampness) and 106 healthy controls. Tongue images were segmented with a customized Tongue-InSPyReNet framework to extract quantitative features, and tongue-coating microbiota were profiled by 16S rRNA gene sequencing; five machine-learning models were then built. The authors report that the damp-heat pattern was characterized by a red-crimson tongue with yellow coating and enrichment of Prevotella, whereas the cold-dampness pattern more often showed a pale tongue with petechiae and higher abundances of Streptococcus and Rothia. Integrating tongue-image features and the coating microbiome distinguished the two patterns with an AUC of 0.871 and an accuracy of 79.1%. The journal page lists publication on 22 May 2026, in volume 17, article 1851610. The official Frontiers full-text page was opened, and the official PDF was confirmed (HTTP 206, %PDF-1.4 header). These metrics are author-reported."

kan2026-mm-att-qa:
  summary_en: "Junming Kan, Ling Ma, Lijun Zheng, and Kainan Li publish a research article in Frontiers in Artificial Intelligence and Applications, volume 432 (Education, Network and Information Technology), proposing Mm_Att_QA, a generative question-answering model that integrates a knowledge graph and multimodal attention for graduate-student collaborative study of classical traditional Chinese medicine texts. The authors state that the model fuses text, multimodal contextual information, and a structured knowledge graph, and uses an attention mechanism to integrate features from different modalities. They report improvements in answer accuracy, information coverage, real-time response, and user satisfaction. The official IOS Press ebook page lists pages 1733-1744, an online date of 19 November 2026, and the type Research Article. The official article page was opened and the abstract was read; guest access provided the abstract, and no official PDF was opened. These results are author-reported. Author affiliations were not given on the opened page."

song2026-gatmi:
  summary_en: "Dan Song, Yadong Li, and Bin Yang (corresponding), of the School of Information Science and Engineering, Zaozhuang University, publish a paper in Current Bioinformatics proposing GATMI, a graph-attention-network module for identifying disease-related active compounds in traditional Chinese medicine. Molecules are represented as graphs, and graph attention networks are used to extract deep spatial-structure features. The authors constructed datasets related to COVID-19, diabetes, and urticaria, and report that GATMI outperformed GCN, Weave, and MPNN on all three datasets, and that the deep structural features improved traditional machine-learning accuracy relative to classical representations such as ECFP and MACCS. The official Bentham/EurekaSelect page lists publication on 14 July 2026, in volume 21, pages 1-14. The official article page was opened and the abstract was read; no official PDF was opened. These results are author-reported."

songguo-consult-agent:
  summary_en: "World Science and Technology-Modernization of Traditional Chinese Medicine published a study that takes the authors' Songguo Diagnosis (松果问诊) model as its subject and proposes an agent-based two-stage pre- and post-processing method intended to reduce hallucination in large TCM consultation models and to improve syndrome-differentiation accuracy and interpretability in diabetes. The official abstract page states that pre-processing uses knowledge distillation (LLaMA2-70B as teacher, DeepSeek-LLM-7B as student) together with the TCM Ten Questions Song to capture symptoms, and that post-processing uses graph retrieval-augmented generation combining a dynamic knowledge graph built from 1,047 diabetes electronic medical records (3,637 entities and 16,939 relations) with a vector database of medical guidelines, with the agent applying closed-loop control across the pipeline. The authors report that, on a test set of 500 complex cases, the optimized model reached 91.3% syndrome-differentiation accuracy (a 12.7 percentage-point increase), a hallucination rate of 7.2%, knowledge coverage of 85.6%, and a symptom-recognition F1 of 93%, with expert scores of 8.7/10 for logical consistency and 8.9/10 for theoretical fit. The official abstract page lists the publication date as 22 October 2026 and the article identifier 20260103001. The official journal abstract page was opened and the Chinese and English abstracts were read. The extracted official abstract page did not give author names, so authors and organizations are not recorded. These metrics are author-reported."

course-lnutcm-yaoshi:
  summary_en: "A China University MOOC course on Pharmacy Administration, taught by Xie Ming, Xu Meiling, Zhang Xue and Sun Ting of Liaoning University of Traditional Chinese Medicine. It covers drug regulation, national medicines policy, pharmacists and professional ethics, legislation, special-controlled drugs, registration, manufacturing and distribution, hospital pharmacy administration, and pharmaceutical intellectual property. The official course page notes a master's and doctoral programme in Chinese materia medica (pharmacy administration) and a university-level first-class course designation. The official course page was opened in this pass. The current term runs from 31 August 2026 to 3 January 2027; the platform also records an earlier offering from 30 December 2020. This is a formal university open course, not a marketing clip."

course-lnutcm-yiguwen:
  summary_en: "A China University MOOC course on Medical Classical Chinese (Yiguwen), taught by Fu Haiyan, Yu Heng and Hu Qiushi of Liaoning University of Traditional Chinese Medicine. The official page describes it as a foundational course for programmes such as Chinese medicine, integrated Chinese-Western clinical medicine, and acupuncture and tuina, and notes that the school's Yiguwen course is a national first-class (offline) course, with the MOOC intended to support reading of TCM classics. The official course page was opened in this pass. The current term started on 22 October 2026, with the end date listed as to-be-determined; the platform also records an earlier offering from 2 September 2024. This is a formal university open course, not a marketing clip."

course-zjzyy-tcm-nursing:
  summary_en: "A China University MOOC course on TCM Nursing, taught by Sun Qiuhua of Zhejiang Chinese Medical University. The official page describes it as a distinctive required course for nursing programmes, covering basic TCM theory, herbal formulae, meridians and acupoints, common TCM nursing techniques, constitution identification, and TCM health cultivation and clinical application, for nursing students and practising nurses. The official course page was opened in this pass. The current term runs from 16 September 2026 to 10 January 2027; the platform also records an earlier offering from 31 December 2019. This is a formal university open course, not a marketing clip."

course-zjzyy-home-nursing:
  summary_en: "A China University MOOC introductory course on integrated Chinese-Western home nursing, taught by Shen Cuizhen, Shen Qin and Yang Lili of Zhejiang Chinese Medical University. The official page covers common home-nursing techniques, home-based TCM health cultivation, and home care for chronic illness and for older people with disability or dementia. The official course page was opened in this pass. The current term started on 22 October 2026, with the end date listed as to-be-determined; the platform also records an earlier offering from 31 October 2019. This is a formal university open course, not a marketing clip."

course-zjzyy-moxibustion:
  summary_en: "A China University MOOC course on moxibustion (Life Fire: Moxibustion), taught by Lin Xianming of Zhejiang Chinese Medical University. It introduces meridian and acupoint basics, moxibustion theory, common techniques, and health-cultivation applications, for acupuncture professionals, meridian therapists and general learners. The official course page was opened in this pass. The current term runs from 7 September 2026 to 8 January 2027; the platform also records an earlier offering from 8 October 2019. This is a formal university open course, not a marketing clip."

course-njutcm-yiguwen:
  summary_en: "A China University MOOC course on Medical Classical Chinese (Yiguwen), taught by Zhang Ji, Wang Bin, Qi Duan, Fu Peng, Zhang Chengkun, Wen Wenting, Zhu Qiuhong, Zhang Ao and Zhu Haoran of Nanjing University of Chinese Medicine. The official course page was opened in this pass. The current term runs from 8 October 2026 to 10 January 2027; the earliest term listed on the page is 18 March 2026 to 26 August 2026, so the first-offering year is provisionally recorded as 2026. This is a formal university open course, and is distinct from the already catalogued Anhui University of Chinese Medicine Yiguwen course on Zhihuishu."

course-jxutcm-nutrition-diet:
  summary_en: "A China University MOOC course on Nutrition and Dietary Therapy, taught by Liu Xia of Jiangxi University of Chinese Medicine. It covers nutrients and energy, the nutritive value of foods, nutrition for different physiological and occupational groups, nutrition counselling, and an overview of TCM dietary therapy with examples of diet for treatment and health cultivation. The official course page was opened in this pass. The current term runs from 18 August 2026 to 18 January 2027; the platform also records an earlier offering from 10 December 2021. This is a formal university open course, not a marketing clip."

course-hactcm-herbal:
  summary_en: "A China University MOOC course on Chinese Materia Medica, taught by Wang Hui, Cui Can, Luo Xiao, Wang Junming, Wang Mengmeng, Yuan Peipei, Wang Lin, Feng Jing, Song Ning, Mao Jing, Li Lingling, Li Yamin, Xue Shujuan and Zhang Zhiqiang of Henan University of Chinese Medicine. It covers the origin, production areas, collection, processing, properties, actions and clinical use of Chinese medicines. The official course page was opened in this pass. The current term runs from 29 August 2026 to 9 January 2027; the platform also records an earlier offering from 20 March 2017. This is a formal university open course, distinct from the already catalogued Nanjing and Chengdu materia medica MOOCs."

course-hactcm-herb-identification:
  summary_en: "A China University MOOC course on Authentication of Chinese Medicines, taught by Chen Suiqing, Wang Lili, Yang Jingfan, Dai Liping and Zheng Yan of Henan University of Chinese Medicine. It discusses how planting, harvesting, processing and storage affect quality, and how to identify high-quality medicinal materials. The official course page was opened in this pass. The current term runs from 30 August 2026 to 31 December 2026; the platform also records an earlier offering from 23 October 2017. This is a formal university open course, distinct from the already catalogued Beijing University of Chinese Medicine authentication MOOC."

course-gzucm-lingnan-paozhi:
  summary_en: "A China University MOOC course on Lingnan herbal processing (paozhi), taught by Xia Quan of Guangzhou University of Chinese Medicine. It covers toxicity reduction and efficacy enhancement through processing, differences between raw and processed use, and distinctive Lingnan processing techniques. The official course page was opened in this pass. The current term runs from 1 September 2026 to 10 January 2027; the platform also records an earlier offering from 26 April 2021. This is a formal university open course, not a marketing clip."

course-gzucm-intro-acupuncture:
  summary_en: "A China University MOOC introductory course on acupuncture, taught by Li Min, Feng Shulan, Liu Rong, Zhang Liang, Hao Yan and Lin Han of Guangzhou University of Chinese Medicine. It covers the history of acupuncture, the circulation and indications of the fourteen meridians and commonly used points, needling and moxibustion techniques, and frequently seen or advantageous clinical conditions. The official course page was opened in this pass. The current term runs from 15 September 2026 to 15 January 2027; the platform also records an earlier offering from 9 December 2019. This is a formal university open course, not a marketing clip."

course-tutcm-herb-chemistry:
  summary_en: "A Chemistry of Chinese Medicines course from Tianjin University of Traditional Chinese Medicine, taught by Deng Yanru, Qiu Feng, Wang Lili, Wang Lining and Zhao Qiduo, recorded on the national Smart Education of Higher Education platform with Zhihuishu as the delivery platform and status in session. It applies chemical and physical methods, together with TCM theory, to the structures, properties, extraction, identification and structure elucidation of major classes of herbal constituents such as glycosides, flavonoids and alkaloids. The official Smart Education course page was opened in this pass and reports 10,000+ enrolments. The current term runs from 21 July 2026 to 20 January 2027; only this term is listed, so the first-offering year is provisionally 2026. The Zhihuishu course-home URL is recorded from that page but was not used as the sole source."

course-gzucm-clinical-thinking:
  summary_en: "A Methods of Clinical Thinking in TCM course from Guangzhou University of Chinese Medicine, taught by Yang Zhimin, Gao Yanxiang, Zhou Dengwei and Hu Tianxiang, recorded on the national Smart Education platform with XuetangX as the delivery platform and status in session. It covers the history, common models and types of TCM clinical thinking, how to build a clinical-thinking framework, and thinking methods contained in the TCM classics. The official Smart Education course page was opened in this pass and reports 10,000+ enrolments. The current term runs from 23 July 2026 to 12 January 2027; only this term is listed, so the first-offering year is provisionally 2026."

course-gzucm-neijing:
  summary_en: "A Huang Di Nei Jing course from Guangzhou University of Chinese Medicine, taught by Zhang Xiaohu, Su Hong, Liu Shuaishuai and He Liu, recorded on the national Smart Education platform with Xueyin Online as the delivery platform and status in session. It introduces yin-yang and the five phases, meridians, etiology and pathogenesis, diagnosis and treatment, health cultivation and five evolutive phases and six climatic factors, and emphasises holism, constant motion, the five-zang functional systems and treatment based on pattern differentiation, with case discussions for researchers, students and clinicians. The official Smart Education course page was opened in this pass and reports 1,000+ enrolments. The current term runs from 4 April 2026 to 31 December 2026; only this term is listed, so the first-offering year is provisionally 2026. This is distinct from the already catalogued Selected Readings of the Inner Canon courses at Henan, Changchun and Fujian universities of Chinese medicine."

course-hbucm-lifecycle-yangsheng:
  summary_en: "A Life-Cycle Health Cultivation course from Hubei University of Chinese Medicine, taught by Zhang Chengpeng, recorded on the national Smart Education platform with Zhihuishu as the delivery platform and status in session. It is organised around the human life cycle of birth, growth, prime and ageing and around constitution-based cultivation, bringing together diet, exercises, meridian work and emotional regulation. The official Smart Education course page was opened in this pass and reports 1,000+ enrolments. The current term runs from 21 July 2026 to 20 January 2027; only this term is listed, so the first-offering year is provisionally 2026. The Zhihuishu course-home URL is recorded from that page but was not used as the sole source."

person-li-xianjia:
  summary_en: "Xining. Dean, professor and doctoral supervisor at the Tibetan Medicine College of Qinghai University. The college's official young-faculty profile (dated 21 May 2017) states that he is Tibetan, born in 1966; he previously served as vice-president of the Tibetan Medicine Hospital of Hainan Prefecture and as a department head in Qinghai Medical College, and has been dean and deputy Party secretary of the Tibetan Medicine College since 2016. He teaches graduate courses on advances in core Tibetan medical theory and selected readings from the Four Tantras, and his research is in Tibetan medical history, literature and foundational theory. The official faculty page was opened in this pass."

person-gazang-duoji:
  summary_en: "Xining. Professor and Doctor of Medicine at the Tibetan Medicine College of Qinghai University. The college's official young-faculty profile (dated 21 May 2017) states that he is Tibetan, from Xunhua County, Qinghai, born in June 1978; he earned bachelor's and master's degrees at the Tibet Tibetan Medical College and a Doctor of Medicine degree from Qinghai University in 2014, and has worked at the college since November 2005. He teaches clinical courses including Tibetan internal medicine, the three-humor doctrine and Tibetan surgery, and his research is in Tibetan materia medica pharmacology and the standardisation of Tibetan clinical diagnosis and treatment. The page records supervision of more than 80 graduation theses but does not state a master's or doctoral supervisory title. The official faculty page was opened in this pass."

person-nogami-tatsuya:
  summary_en: "Kanagawa. Professor of Kampo Medicine in the Department of Specialized Clinical Medicine, Tokai University School of Medicine, with a Doctor of Medicine degree. The university's official faculty and researcher guide lists his research keywords as traditional medicine and Kampo medicine, and notes roles including director of the Japan Society for Oriental Medicine and the Medical and Pharmaceutical Society for WAKAN-YAKU. The department staff page states that he was born in 1973, graduated from the Faculty of Medicine of Toyama Medical and Pharmaceutical University in 1998, received his doctorate in 2010, became associate professor at Tokai in 2020 and professor in 2025, and is a Kampo specialist and supervising physician of the Japan Society for Oriental Medicine. The official faculty guide, graduate-school faculty page and department staff page were opened in this pass. The faculty guide's structured dateModified is 2026-11-02T23:05:29+00:00 (07:05 on 3 November 2026, Asia/Shanghai)."

person-ogawa-keiko:
  summary_en: "Hiroshima. Professor at the Kampo Clinical Center, Hiroshima University Hospital, with a Doctor of Medicine degree from Nagoya University. The official researcher directory lists the English name KEIKO OGAWA and Last Updated :2026/11/05, and shows 2026 undergraduate, master's and doctoral teaching assignments. The School of Medicine Kampo Medicine laboratory page states that the Kampo Medicine chair in the Graduate School of Biomedical and Health Sciences was established in December 2022, and that the group works on automated inspection diagnosis with machine learning and on clinical trials of Kampo treatment for intractable diseases. The official researcher directory and laboratory pages were opened in this pass."

news-202611-diabetes-classic-formula-consensus:
  summary_en: "China Traditional Chinese Medicine News reported on 23 November 2026 (front page) that the Expert Consensus on the Clinical Application of Classic Formulas for Diabetes was released on 21 November 2026 at the 25th academic annual meeting of the Diabetes Branch of the China Association of Chinese Medicine. The report states that the consensus was initiated and organized by the Association, and is the first clinical-application standard in China on classic formulas for diabetes. It was led by Professor Yang Shuyu of the First Affiliated Hospital of Xiamen University, with 150 specialists from 21 provinces over three years, and includes 52 classic formulas covering prediabetes, diabetes and common complications and comorbidities, as well as related symptoms and typical TCM patterns, with indications, differentiation points, evidence, recommendation strength, safety and precautions. The report emphasizes that classic formulas should be used together with diet, exercise, glucose monitoring and necessary antidiabetic drugs, prescribed by TCM or integrative physicians, and must not replace oral antidiabetic drugs or insulin. This pass opened the official CNTCM article (HTTP 200). A CACM notice of 30 October 2026 had listed the consensus among four standardization projects that had passed pre-release review, with public comment closing on 5 November 2026; that page provides a consultation draft, not the official issued text."

surv-sun2026-multimodal-dx:
  summary_en: "A review in Artificial Intelligence in Health by Jiaqi Sun and Junhong Gao (corresponding) of the Institute of Acupuncture and Moxibustion, China Academy of Chinese Medical Sciences, and Zheng Yu (corresponding) of the School of Intelligent Medicine, Chengdu University of Traditional Chinese Medicine. Instead of treating the four diagnostic methods in isolation, the article starts from five heterogeneous modalities—vision, audition, olfaction, text, and tactile data—and reviews multimodal acquisition, fusion methods, and clinical applications in intelligent TCM diagnosis, together with core challenges and future directions. The official journal page labels it a Review Article, received 29 March 2026, revised 29 April 2026, accepted 13 May 2026, and published online 15 September 2026, with DOI 10.36922/AIH026130032. This pass opened the official article page and the DOI, which resolve to the same official page. The official PDF URL returned HTTP 403 and was not recorded as an opened PDF. This is a review, not a new model release."

news-202611-cde-cultivated-bezoar-guidance:
  summary_en: "The Center for Drug Evaluation (CDE) of the National Medical Products Administration issued the Technical Guiding Principles for Research on Cultivated Bezoar as CDE Announcement No. 56 of 2026. The notice, dated 19 November 2026, states that the guidance was prepared to support research and development of substitutes for rare and endangered Chinese medicinal materials and to guide applicants in the research and registration of cultivated bezoar; it was released with NMPA’s consent and takes effect from the date of issuance. The CDE homepage lists the announcement as published on 24 November 2026. The guidance applies to cultivated bezoar produced with the same lithogenic bacteria and the same lithogenic principle as the product previously approved by the former Ministry of Health. Cultivated bezoar is defined as dried gallstones grown in the gallbladder of living cattle (Bos taurus domesticus Gmelin). The current quality standard is carried in the 1997 supplement to the Chinese Pharmacopoeia, and applications should be filed under the “other circumstances” category of TCM registration. The document implements NMPA/NATCM Announcement No. 129 of 2024 on substitutes for rare and endangered Chinese medicinal materials. Development should aim for quality and efficacy essentially consistent with natural bezoar, production should comply with the Good Agricultural Practice for Chinese Medicinal Materials, and whole-process quality control is required. Genetically engineered strains may not be used; material from cattle affected by poisoning or epidemic disease may not be used; and production studies must include at least three batches of no fewer than 50 cattle each. If the material basis is essentially consistent with natural bezoar, pharmacology/toxicology studies and clinical trials are not required. This update opened the 24 November 2026 full-text republication on the official NMPA newspaper site CNPharm (source attributed to the CDE website, HTTP 200) and the official 7-page PDF (HTTP 200, 438,408 bytes), and also opened the CDE homepage listing. Direct access to the CDE announcement URL returned HTTP 202 with a script interstitial and was not treated as a successfully opened article."

surv-ren2026-jpha-tcm-ai:
  summary_en: "Jiahe Ren, Xinyu Shi, Ruiheng Liang, Yi Qin, Xun Gao, Qing Zhang, and corresponding authors Longshan Zhao and Xuefeng Guan, published a review in Journal of Pharmaceutical Analysis on traditional machine learning and deep learning in TCM research. The PMC full-text page states that these methods have been applied to TCM toxicity prediction, efficacy assessment, targeted development, identification and classification of decoction pieces, authenticity and quality verification, quality control, and exploration of prescription composition rules, and that the review summarizes recent applications, technical challenges, and the role of interdisciplinary collaboration. The official PMC page lists Received 19 June 2025, Revised 26 January 2026, Accepted 30 January 2026, and Issue date October 2026, for volume 16, issue 10, article 101572; the page's citation_publication_date is 31 January 2026. Affiliations on the page include schools at Shenyang Pharmaceutical University, the Co-Innovation Center of Jiangsu Marine Bio-Industry Technology at Jiangsu Ocean University, and the Department of Gastroenterology, Lianyungang Affiliated Hospital of Nanjing University of Chinese Medicine. The article is marked open access under CC BY-NC-ND 4.0. The official PMC full-text HTML page was opened in this pass. This is a review, not a new model release."

surv-qi2026-tcm-ml-screening:
  summary_en: "Zi-Meng Qi and Jing-Zhen Wu (equal first authors), Pan Li, and corresponding authors Tian-Yang Xu and Peng Yu, all at Changchun University of Chinese Medicine, published a structured narrative and critical review in Pharmaceuticals on machine learning for screening bioactive compounds in TCM. The official MDPI article page discusses applications in compound prediction, formula-compatibility analysis, multi-omics integration, and drug development and repurposing, and classifies studies along two independent dimensions: application scope (direct TCM applications, natural-product studies, and general drug-discovery methods) and validation level (from computational prediction to chemical, experimental, and clinical evidence). The authors state that machine learning mainly supports candidate ranking and hypothesis generation, and that predicted targets, attention weights, and multi-omics associations do not independently establish target engagement, formula synergy, or therapeutic efficacy. They highlight limitations including chemical-domain shift, inconsistent database provenance, data leakage, sparse negative results, and incomplete experimental follow-up, and they present a minimum reporting checklist. The official MDPI page identifies the article as Pharmaceuticals 2026, 19(10), 1567, DOI 10.3390/ph19101567. The Crossref works record and the PubMed record opened in this pass both give the publication date as 2 October 2026. The official MDPI full-text article page was opened. This is a review, not a new model release."

surv-yangm2026-herb-recommend:
  summary_en: "Meng Yang, Jing Jin, Ya-Li Liu, Long Zhao, Hui Chen, Wei-An Hao, Xin-Yi Ao, Zhi-Lin Ran, Zhi Li, and corresponding author Xin Zhou published a review in Medicine (Baltimore) on data-driven Chinese herbal medicine recommendation methods from 2016 to 2025. The official PMC full-text page identifies Xin Zhou (The Affiliated Traditional Chinese Medicine Hospital, Southwest Medical University, Luzhou) as corresponding author and states that Meng Yang, Jing Jin, and Ya-Li Liu contributed equally. The review organizes methods into knowledge-graph-based, deep-learning-based, and hybrid approaches, discusses automatic quantitative and human qualitative evaluation, and outlines a theory–data–clinical evaluation framework for clinically oriented recommendation models. The official title on the opened page uses the wording “clinical applications form 2016 to 2025” (as printed). The PubMed and Crossref records opened in this pass give the bibliographic data as Medicine 2026 May 1;105(18):e48468, DOI 10.1097/MD.0000000000048468. The official PMC full-text page was opened; the Lippincott/LWW journal page returned HTTP 403 and was not used as the opened source. Affiliation footnotes for all co-authors were not fully recovered from the opened page, so only the corresponding-author organization recorded on that page is listed. This is a review, not a new model release."

chen2026-radial-pulse-ml:
  summary_en: "Ying Chen, Shuang Cheng, Huangbo Lin, and corresponding author Shaoyang Men, all at the School of Medical Information Engineering, Guangzhou University of Chinese Medicine, published an original research article in Frontiers in Digital Health on machine-learning analysis of radial pulse waves for menstrual-disorder screening. The official full-text abstract states that 246 participants were divided into a menstrual-disorders group and a normal group, with pulse-wave data and TCM constitution information collected; between-group comparisons used the Mann–Whitney U test with Benjamini–Hochberg correction, and preprocessing, feature selection, and hyperparameter tuning were confined to the training set with nested cross-validation. Six prespecified models were compared: LR-ElasticNet, LDA-Shrinkage, LR, SVM, DT, and XGBoost. The authors report that the menstrual-disorders group predominantly showed a Yin-deficiency constitution and that several pulse-wave parameters differed after FDR correction. They selected LDA-Shrinkage as the best model and report AUC 0.977 (95% CI 0.919–1.000), accuracy 0.986, F1 0.989, precision 0.978, recall 1.000, and specificity 0.966, with SHAP identifying Rw/t and Lh4/h1 as the most influential candidate features. The official page marks the article as Original Research, Accepted 30 October 2026 and Published 16 November 2026, volume 8, DOI 10.3389/fdgth.2026.1964508. The official Frontiers full-text HTML was opened; the official PDF returned HTTP 206, Content-Type application/pdf, and a %PDF-1.5 file header. These metrics are author-reported."

tcm-hedpr:
  summary_en: "ChaoBo Zhang and Long Tan posted an arXiv preprint introducing TCM-HEDPR, a hierarchical structure-enhanced personalized recommendation model for TCM formulas guided by knowledge-graph diffusion. The official abstract states that the method pre-trains symptom representations with patient-personalized prompt sequences and uses prompt-oriented contrastive learning for data augmentation; applies a knowledge-graph-guided homogeneous graph diffusion method with self-attention to capture non-linear symptom–herb relations; and uses a heterogeneous graph hierarchical network to integrate herbal dispensing relations with implicit syndromes, with the aim of guiding prescription generation and mitigating long-tailed herb distributions. The authors state that experiments were conducted on two public datasets and one clinical dataset, and that recommended prescriptions were also evaluated with insights from modern medicine and network pharmacology. The official abstract page lists the submission date as 28 September 2025 (arXiv 2509.23560). The official arXiv abstract page was opened; the official PDF returned HTTP 206, Content-Type application/pdf, and a %PDF-1.7 file header. The abstract does not report specific numeric metrics, so none are recorded. Author affiliations were not present on the opened abstract page and are omitted. This is a preprint; no journal version was opened in this pass."

tom-tongue-seg:
  summary_en: "Jiacheng Xie, Ziyang Zhang, Biplab Poudel, Congyu Guo, Yang Yu, Guanghui An, Xiaoting Tang, Lening Zhao, Chunhui Xu, and Dong Xu posted an arXiv preprint introducing TOM, a tongue-image segmentation model based on multi-teacher knowledge distillation with diffusion-based data augmentation. The authors report that, after reducing the parameter count by 96.6% relative to the teacher models, the student model still achieved 95.22% mIoU. The official abstract states that the trained model was packaged as an online and offline segmentation tool at https://itongue.cn/, intended for use by TCM practitioners and researchers without programming experience. The authors also report a case study on TCM constitution classification using segmented tongue patches, stating that training with tongue patches yielded higher classification performance and better interpretability than original tongue images, and they describe TOM as, to their knowledge, the first open-source and freely available tongue-image segmentation tool. The official abstract page lists the submission date as 19 August 2025 (arXiv 2508.14932). The official arXiv abstract page was opened; the official PDF returned HTTP 206, Content-Type application/pdf, and a %PDF-1.7 file header. These metrics are author-reported. Author affiliations were not present on the opened abstract page and are omitted. The itongue.cn tool site was not opened in this pass. This is a preprint; no journal version was opened in this pass."

ds-tcm-eviselect:
  summary_en: "TCM-EviSelect is a public annotation dataset for evidence selection in Chinese traditional-medicine question answering, released as version v1 on Zenodo by Zhang, Peihua (Hebei Finance University, contact person), Li, Xiangmeng (Affiliated Hospital of Hebei University) and Hao, Bin (College of traditional Chinese Medicine, Hebei University). The landing page is dated 7 November 2026, lists the resource type as Dataset, and uses a Creative Commons Attribution 4.0 International licence. It provides 26,432 training pairs and 4,978 development pairs with binary relevance and support labels, derived from Lingdan and Hallu-TCM, together with aggregate results from a stratified human review of 44 held-out questions. The release contains annotations and identifiers; source texts and item-level test labels are withheld, and training text-based models require separately obtained source texts aligned by identifier. In this pass the real Zenodo landing page for the concept DOI 10.5281/zenodo.24035357 was opened by webFetch, including the author list, abstract and the file tcm-qa-evidence-labels-v0.1.0.zip; the DataCite API confirmed that the version DOI 10.5281/zenodo.24035358 was issued on 7 November 2026 and is a version of 10.5281/zenodo.24035357. Direct curl requests to zenodo.org returned HTTP 403 (WAF) and were not used as the opened text page. This is a public dataset release, not a model-weight download page."

course-cdutcm-geriatric-nursing:
  summary_en: "A national Smart Education Platform / XuetangX open course on TCM Geriatrics, taught by Wang Fei, Wu Wenbin, Yang Han, Zhang Yi, Zeng Jinhao, Chen Xiaomei, Hu Quan, Li Bin, Li Xueping, Liu Xuehui and Peng Bo of Chengdu University of Traditional Chinese Medicine. The official page describes it as a clinical course on the etiology, pathogenesis, patterns of treatment, prevention and care of diseases in older age, covering 40 common geriatric conditions, and notes that it is a second-batch university-level quality online open course for Chinese-medicine and eight-year Chinese-medicine students (36 class hours), marked as a first-class course. The official platform page was opened in this pass. The current term runs from 23 July 2026 to 12 January 2027 and is listed as in session; the page update date is 26 November 2026. No earlier term is recorded on the page, so the year is provisionally 2026. This is a formal university open course; it had previously been held back because the XuetangX page alone did not yield a verifiable current-term record."

course-cdutcm-internal:
  summary_en: "A national Smart Education Platform / XuetangX open course on Internal Medicine of TCM, taught by Xie Chunguang, Wang Fei, Zhang Yi, Li Shengtao, Yang Han, Sun Honghui, Wang Haisong, Wang Zongqin, Yin Liping, Wu Wenbin, Bao Peng, Li Bin and Zeng Jinhao of Chengdu University of Traditional Chinese Medicine. The official page states that the campus course was established when the university was founded in 1956 and was designated a Sichuan provincial quality course in 2008, and that it is a bridge course linking basic TCM theory with clinical practice. The official platform page was opened in this pass. The current term runs from 23 July 2026 to 12 January 2027 and is listed as in session; the page update date is 26 November 2026. No earlier online term is recorded on the page, so the year is provisionally 2026. This is a formal university open course, distinct from the already catalogued Beijing University of Chinese Medicine selected lectures on internal medicine."

course-cdutcm-wenbing:
  summary_en: "A national Smart Education Platform / XuetangX open course on Warm Disease (Wenbing), taught by Feng Quansheng, Guo Yinling, Zheng Xiuli, Wang Haozhong, Liu Xiyang, Wang Baojia and Wu Wenjun of Chengdu University of Traditional Chinese Medicine. The official page describes it as a core clinical-foundations course and one of the four TCM classical courses, covering basic concepts of warm disease and defence-qi-nutrient-blood and triple-energizer pattern differentiation. It also states that the school's Wenbing discipline is a first-batch National Administration of TCM key discipline and a Sichuan first-class blended course, and that the course went online on Zhihuishu in 2015, with a MOOC platform built in 2020. The official platform page was opened in this pass. The current term runs from 23 July 2026 to 12 January 2027 and is listed as in session. The year is recorded as 2015 from the first online offering stated on the page. This is a formal university open course, distinct from the already catalogued Beijing University of Chinese Medicine Wenbing MOOC."

course-cdutcm-acupuncture:
  summary_en: "A national Smart Education Platform / XuetangX open course on Acupuncture and Moxibustion, taught by Liang Fanrong, Zeng Fang, Wu Ping, Zhu Yihui, Yang Jie, Zhou Haiyan and Chen Jiao of Chengdu University of Traditional Chinese Medicine. The official page describes it as a required clinical-foundations course on meridians, acupoints and needling and moxibustion methods, covering channel pathways, point location and indications, needling, moxibustion and cupping, and the acupuncture treatment of conditions in internal medicine, gynaecology, paediatrics, ENT and orthopaedics. It names the 13th Five-Year Plan textbook Acupuncture and Moxibustion, edited by Liang Fanrong and Wang Hua and published by China Press of Traditional Chinese Medicine in August 2006. The official platform page was opened in this pass. The current term runs from 23 July 2026 to 12 January 2027 and is listed as in session; the page update date is 26 November 2026. No earlier online term is recorded on the page, so the year is provisionally 2026. This is a formal university open course; it had previously been held back because the XuetangX page alone did not yield a verifiable current-term record."

course-cdutcm-elderly-nursing:
  summary_en: "A national Smart Education Platform / XuetangX open course on Geriatric Nursing, taught by Gao Jing, Yang Jing, Wu Chenxi, Bai Dingxi, Yang Xiangyu and Liang Qingfang of Chengdu University of Traditional Chinese Medicine. The official page sets out four modules: general principles of geriatric nursing, nursing for common health problems and diseases in older people, and commonly used TCM nursing techniques, including moxa-stick moxibustion, salt ironing and cupping. It also states that the course leader served as chief editor of the national TCM-series planning textbook Geriatric Nursing published by China Press of Traditional Chinese Medicine. The official platform page was opened in this pass. The current term runs from 23 July 2026 to 12 January 2027 and is listed as in session. No earlier term is recorded on the page, so the year is provisionally 2026. This is a formal TCM-university open course with an explicit TCM nursing-technique module, distinct from the school's TCM Geriatrics course."

course-gzucm-acupuncture-therapy:
  summary_en: "A national Smart Education Platform / XuetangX open course on Acupuncture Therapeutics, taught by Lin Han, Li Min, Li Yang, Yuan Qing, Xu Yunxiang, Li Jing, Huang Xiuwen and Huang Yunxuan of Guangzhou University of Chinese Medicine. The official page describes it as a clinical bridge course on using acupuncture to treat diseases across specialties, aiming at the full process of principle, method, point, prescription and technique, mainly for acupuncture students, with an outline covering general principles and pain, internal-medicine, gynaecological, paediatric and dermatological or traumatic conditions. The official platform page was opened in this pass. The current term runs from 23 July 2026 to 12 January 2027 and is listed as in session. No earlier term is recorded on the page, so the year is provisionally 2026. This is a formal university open course, distinct from the pending Guangzhou course Introduction to Acupuncture."

course-zjzyy-formula:
  summary_en: "A national Smart Education Platform / Zhihuishu open course, Formula Studies (Talks on Finding Formulae and Asking about Medicinals), taught by Ji Xuming, Xu Xiaoyu, Guan Jiaqi, Lu Fei, Zhang Guangshun, Zhang Lu, Chai Yi and Huang Hong of Zhejiang Chinese Medical University. The official page states that the course is built from formula studies, Chinese materia medica and Chinese patent medicines, and selects 10 patent medicines, 10 medicinals and 22 classical formulae, covering combination features, herb-pair characteristics and clinical use, including Guizhi Tang, Baidu San, Da Chengqi Tang, Xiao Chaihu Tang, Baihu Tang and Qingying Tang. The official platform page was opened in this pass. The current term runs from 21 July 2026 to 20 January 2027 and is listed as in session. No earlier term is recorded on the page, so the year is provisionally 2026. This is a formal university open course, distinct from the already catalogued Guangzhou Formula Studies MOOC."

course-hnucm-tuina:
  summary_en: "A national Smart Education Platform / Zhihuishu open course, Hands Guarding Health: Essentials of Tuina, taught by Peng Liang, Wang Dejun, Chen Chutao, Li Wu, Yu Juan, Yang Zhou, Liu Xiaowei and Ge Junyun of Hunan University of Chinese Medicine. The official page states that it was built by the school's key tuina discipline team and covers the role of tuina in unblocking meridians, regulating zang-fu organs, reducing malposition, harmonising qi and blood and balancing yin and yang, together with swinging, squeezing and friction manipulation classes. The official platform page was opened in this pass. The current term runs from 21 July 2026 to 20 January 2027 and is listed as in session. No earlier term is recorded on the page, so the year is provisionally 2026. This is a formal university open course and fills a gap left by the school's ended China University MOOC terms."

course-hnucm-suitable-tech:
  summary_en: "A national Smart Education Platform / Zhihuishu open course on TCM Appropriate Techniques, taught by Liu Mailan, Zhang Guoshan, Luo Jian, Li Nan, Tang Yulan, Ouyang Lizhi and Fang Yuan of Hunan University of Chinese Medicine. The official page describes TCM appropriate techniques as safe, effective, low-cost and easy-to-learn methods promoted by the National Health Commission and the National Administration of TCM, and says the course covers moxibustion, sachets, daoyin, cupping, tuina, plum-blossom needling, intradermal needling, scraping, auricular points and point application. The official platform page was opened in this pass. The current term runs from 21 July 2026 to 20 January 2027 and is listed as in session. No earlier term is recorded on the page, so the year is provisionally 2026. This is a formal university open course, not a marketing clip."

course-ahtcm-neijing:
  summary_en: "A national Smart Education Platform / Zhihuishu general-education open course, Approaching the Huangdi Neijing, taught by Niu Shuping of Anhui University of Chinese Medicine. The official page describes it as a general-education course for students of different majors, intended to broaden knowledge through reading the Huangdi Neijing and other TCM classics, with a focus on TCM culture, TCM thinking and appreciation of famous classical passages. The official platform page was opened in this pass. The current term runs from 21 July 2026 to 20 January 2027 and is listed as in session. No earlier term is recorded on the page, so the year is provisionally 2026. This is a formal university open course, distinct from the already catalogued Selected Readings of the Neijing courses and from the pending Guangzhou Huangdi Neijing course."

course-sxtcm-herbal:
  summary_en: "A national Smart Education Platform / Zhihuishu open course, Entering Chinese Medicinals: Chinese Materia Medica, taught by Li Min, Hu Xiqin, Gao Feng, Ou Li, Wei Peifeng, Lü Juan, Chen Dandan, Dong Taiwei and Sun Chen of Shaanxi University of Chinese Medicine. The official page describes Chinese materia medica as the discipline of the basic theory and clinical use of Chinese medicinals, and this course as a professional foundation course for Chinese-medicine and Chinese-materia-medica programmes, covering four qi and five flavours, ascending and descending, and chapters on exterior-releasing, heat-clearing, draining-downward, wind-damp-dispelling, damp-resolving, dampness-draining, interior-warming, qi-regulating, food-dispersing, bleeding-stopping and blood-invigorating medicinals. The official platform page was opened in this pass. The current term runs from 21 July 2026 to 20 January 2027 and is listed as in session; the page update date is 25 November 2026. No earlier term is recorded on the page, so the year is provisionally 2026. This is a formal university open course and fills a Shaanxi open-course gap."

course-jxutcm-tcm-talks:
  summary_en: "A national Smart Education Platform / Zhihuishu open course, Informal Talks on Chinese Medicine, taught by Zhang Ying and Nie Jianhua of Jiangxi University of Chinese Medicine. Despite the informal title, the official outline is a systematic introductory series covering the holistic view, treatment based on pattern differentiation, qi monism, yin-yang and the five phases, visceral manifestation of the five zang systems, qi, blood, fluids and essence, meridians, the six excesses and seven emotions, pathogenesis, inspection, listening and smelling, inquiry, palpation and pattern differentiation, as well as the definition, four qi and five flavours, ascending and descending, meridian entry of medicinals, and sovereign-minister-assistant-courier combination of formulae. The official platform page was opened in this pass. The current term runs from 21 July 2026 to 20 January 2027 and is listed as in session. No earlier term is recorded on the page, so the year is provisionally 2026. This is a formal university open course, not a fragmentary popular-science clip."

course-ahtcm-herbal:
  summary_en: "A national Smart Education Platform / Zhihuishu open course on Chinese Materia Medica, taught by Wang Yufeng, Li Feng, Yang Qingshan, Luo Mengxi, Tan Hui, Shen Ting, Song Tingting, Gao Song and Huang Li of Anhui University of Chinese Medicine. The official outline includes a general part on origin, processing and its purposes, toxicity, five flavours, meridian entry, dosage and administration, and a special part on exterior-releasing, heat-clearing, draining-downward, wind-damp-dispelling, damp-resolving, dampness-draining, interior-warming and qi-regulating medicinals. The official platform page was opened in this pass. The current term runs from 21 July 2026 to 20 January 2027 and is listed as in session. No earlier term is recorded on the page, so the year is provisionally 2026. This is a formal university open course, distinct from the already catalogued Nanjing, Chengdu and Henan materia medica MOOCs."

course-sxtcm-culture:
  summary_en: "A national Smart Education Platform / Zhihuishu open course, Introduction to TCM Culture, taught by Zhou Yanhong, Zheng Chen, Li Yajun, Li Yingbo, Ouyang Jing, Liu Ruoshui and Zhang Yuan of Shaanxi University of Chinese Medicine. The official page describes TCM culture as a distinctive culture formed by the fusion of Chinese medicine with Chinese culture, and sets out ten chapters on the spirit of TCM culture; Confucian, Daoist and Buddhist culture and TCM; language and writing; literature; health-cultivation culture; medical ethics; classical-text culture; and cultural communication. The official platform page was opened in this pass. The current term runs from 21 July 2026 to 20 January 2027 and is listed as in session. No earlier term is recorded on the page, so the year is provisionally 2026. This is a formal university open course, not an ordinary popular-science reprint."

course-zjzyy-tuina-yangsheng:
  summary_en: "A national Smart Education Platform / Zhihuishu open course on Tuina for Health Care and Cultivation, taught by Lü Lijiang, Xu Li, Xie Yuanjun, Wang Xiaodong, Yao Benshun and Zhu Bo of Zhejiang Chinese Medical University. The official page links tuina to the ideas of preventing disease before it arises, preventing change after it has arisen, and preventing recurrence after recovery, and the outline covers an introduction to tuina, commonly used points on the head, neck, chest, back, lower back, buttocks and limbs, and Yijinjing forms such as Weituo Presenting the Pestle, with practice steps and demonstrations. The official platform page was opened in this pass. The current term runs from 21 July 2026 to 20 January 2027 and is listed as in session. No earlier term is recorded on the page, so the year is provisionally 2026. This is a formal university open course, distinct from the already catalogued Fujian Yijinjing course."

course-bucm-pediatrics:
  summary_en: "A China University MOOC course on TCM Paediatrics, taught by Wang Junhong of Beijing University of Chinese Medicine, also recorded on the national Smart Education Platform. The official page describes it as a clinical-foundations course for Chinese-medicine programmes, jointly taught by paediatric faculty of Dongzhimen Hospital and Dongfang Hospital, focusing on conditions in which TCM has therapeutic strengths. The official course page and the corresponding Smart Education Platform record were opened in this pass. The current term runs from 14 September 2026 to 21 December 2026; the platform also records an earlier offering from 22 November 2019. This is a formal university open course, distinct from the already catalogued Guangzhou TCM Paediatrics MOOC."

course-bucm-neijing-zangfu:
  summary_en: "A China University MOOC course, An Introduction to the Neijing and the Theory and Application of the Zang-Fu Organs, taught by Zhai Shuangqing of Beijing University of Chinese Medicine. The official page states that the Neijing set out the thinking methods, theoretical principles and scholarly ideas of Chinese medicine and built the framework of its theoretical system, and that the course includes lecture videos, commentaries and selected case discussions, emphasising following eminent teachers, reading the classics and practising clinic. The official course page was opened in this pass. The current term runs from 7 September 2026 to 1 January 2027; the platform also records an earlier offering from 21 December 2020. This is a formal university open course, not a marketing clip."

course-gzucm-neijing-selected:
  summary_en: "A China University MOOC course of Selected Readings of the Neijing, taught by Luo Huanhuan, Wu Yalan, Deng Ye, Zhang Yuxin and Cao Zebiao of Guangzhou University of Chinese Medicine. The official page describes it as a core Chinese-medicine course on Neijing theory, using a story–knowledge–case–question-bank model to help learners master key points and apply Neijing theory to clinical problems. It lists prerequisites in basic TCM theory, diagnostics, materia medica and formulae, and names Selected Readings of the Neijing edited by Li Jingbo and Zheng Hongbin (Science Press, January 2023) as a reference. The official course page was opened in this pass. The current term runs from 21 September 2026 to 10 January 2027; the earliest listed term is 9 March 2026 to 11 July 2026, so the year is provisionally 2026. This is a formal university open course, distinct from the pending Guangzhou Huangdi Neijing course on Xueyin / the Smart Education Platform taught by Zhang Xiaohu and colleagues."

course-njutcm-neijing:
  summary_en: "A China University MOOC course on the Neijing, taught by Wu Haoxin, Tang Lingling, Li Jianxiang, Li Meng, Liu Zhou, Zhou Wen, Zhang Lijing, Sun Yan, Luo Shu, Meng Linglian, Zhou Lan, Zhang Shuwen, Wang Guangyao and Weng Zebin of Nanjing University of Chinese Medicine. The official page describes the Neijing as the earliest extant medical classic in China and this course as an advanced theoretical course in two parts: guided reading of the original text, and clinical application of Neijing theory with historical and modern cases. The official course page was opened in this pass. The current term runs from 1 September 2026 to 5 January 2027; the platform also records an earlier offering from 21 February 2022. This is a formal university open course, distinct from other schools' Selected Readings of the Neijing courses."

course-hactcm-paozhi:
  summary_en: "A China University MOOC course on Processing of Chinese Medicinals, taught by Li Kai, Zhang Hongwei, Li Hongwei, Cao Yangang, Tian Lianqi, Guo Hui, Wang Ruisheng, Kang Le and Zhang Zhenling of Henan University of Chinese Medicine. The official page describes processing as a pharmaceutical technique based on TCM theory and the needs of pattern-based treatment, and this course as a bridge discipline on processing theory, technology, specifications, quality standards and historical development. The special part covers cleaning and preparation, cutting, stir-frying, broiling, calcining, steaming and boiling, duplication, frosting and other methods. The official course page was opened in this pass. The current term runs from 29 August 2026 to 25 December 2026; the platform also records an earlier offering from 23 February 2019. This is a formal university open course, distinct from the pending Guangzhou course on Lingnan processing."

course-njutcm-herb-chemistry:
  summary_en: "A China University MOOC course on Chemistry of Chinese Medicinals, taught by Chen Peidong, Zhou Guisheng, Wang Honglan, Zhou Junfei, Chen Yong, Gao Mingliang and Liang Qiaoli of Nanjing University of Chinese Medicine. The official page states that the course studies the chemical structures, properties and structural analysis of constituents in Chinese medicinals in close connection with TCM theory and clinical effects, and that students are expected to master structural features, physicochemical properties, extraction, isolation, purification and structure identification, with experiments in extraction and isolation, property reactions and structure identification. The official course page was opened in this pass. The current term runs from 10 September 2026 to 28 December 2026; the platform also records an earlier offering from 25 June 2021. This is a formal university open course, distinct from the pending Tianjin Chemistry of Chinese Medicinals course."

course-njutcm-herb-pharmacology:
  summary_en: "A China University MOOC course on Pharmacology of Chinese Medicinals, taught by Zhou Lingling, Jiang Baoping, Wu Li, Yu Bin, Lu Jinfu, Chen Wenxing, Hong Min and Wang Aiyun of Nanjing University of Chinese Medicine. The official page describes the subject as the study, under TCM theory and with modern scientific methods, of the interactions between Chinese medicinals and the body, and as a core course for Chinese-materia-medica programmes and a bridge course linking Chinese and Western medicine and pharmacy. The official course page was opened in this pass. The current term runs from 23 September 2026 to 30 December 2026; the platform also records an earlier offering from 9 October 2019. This is a formal professional university open course, not a marketing clip."

course-fjzyy-pediatric-tuina:
  summary_en: "A China University MOOC course on Paediatric Tuina, taught by Lin Lili of Fujian University of Traditional Chinese Medicine. The official page describes paediatric tuina as a discipline that, guided by TCM theory, applies manipulation to specific sites or points on a child's body surface to support healthy qi, expel pathogens, regulate meridians and zang-fu organs, and raise immunity. The course uses video demonstrations of commonly used points and basic and compound manipulations, and a treatment section that discusses diagnosis and treatment through cases. The official course page was opened in this pass. The current term runs from 1 September 2026 to 23 December 2026; the platform also records an earlier offering from 15 August 2019. This is a formal university open course, distinct from the already catalogued Nanjing paediatric tuina MOOC."

course-gzucm-wenbing:
  summary_en: "A China University MOOC course on Warm Disease, taught by Wu Zhibing, Lin Changfeng, Ge Wenhua, Yu Zhengmiao and Lin Peizheng of Guangzhou University of Chinese Medicine. The official page introduces the pattern-differentiation system of warm disease, its etiology, pathogenesis and onset, diagnosis, and main patterns and treatment, and highlights using defence-qi-nutrient-blood pattern differentiation to grasp the main changes of various warm diseases and to guide clinical treatment. The official course page was opened in this pass. The current term runs from 25 August 2026 to 8 January 2027; the platform also records an earlier offering from 25 November 2019. This is a formal university open course, distinct from the Beijing and Chengdu Wenbing courses."

course-njutcm-wenbing:
  summary_en: "A China University MOOC course on Warm Disease, taught by Wei Kaifeng, Fu Liyuan, Zhu Ping, Zhou Xiaoping, Lai Mingsheng, Qi Mingming, Shen Shuang, Qu Minye, Wang Yifan and Zhang Jingjing of Nanjing University of Chinese Medicine. The official page describes Wenbing as a required course on the laws of occurrence and development of warm diseases and their diagnosis and treatment, and requires students to master the defence-qi-nutrient-blood and triple-energizer systems and the pattern-based treatment of common seasonal warm diseases and epidemics. The official course page was opened in this pass. The current term runs from 1 September 2026 to 15 January 2027; the platform also records an earlier offering from 20 June 2021. This is a formal university open course, distinct from other schools' Wenbing courses."

course-hactcm-wenbing:
  summary_en: "A China University MOOC course on Warm Disease, taught by Xie Zhongli, Zhang Xiaoyan, Hu Yanping, Xie Miao, Wang Mengting, Zhang Wanqiu, Qi Congcong and Li Qinglei of Henan University of Chinese Medicine. The official page describes Wenbing as a backbone course for Chinese-medicine programmes on the occurrence, development, diagnosis, treatment and prevention of warm diseases, with the aim of mastering the defence-qi-nutrient-blood and triple-energizer systems and the treatment of common warm diseases, and of understanding the academic ideas of major Ming and Qing Wenbing physicians. The official course page was opened in this pass. The current term runs from 24 August 2026 to 27 December 2026; the platform also records an earlier offering from 25 September 2019. This is a formal university open course, distinct from other schools' Wenbing courses."

course-gzucm-gynecology-life:
  summary_en: "A China University MOOC course, Looking at Gynaecology through TCM: Health and Illness across a Woman's Life, taught by Luo Songping of Guangzhou University of Chinese Medicine. The official page states that TCM gynaecology has distinctive theory and clinical strengths, and that this course follows the female age axis from puberty to menopause, covering physiological characteristics, TCM health cultivation, and prevention and treatment of common gynaecological diseases at each stage, as well as the basic theoretical framework of TCM gynaecology. The official course page was opened in this pass. The current term runs from 21 September 2026 to 10 December 2026; the platform also records an earlier offering from 2 December 2019. This is a formal university open course, not a marketing clip."

course-jnu-tcm-diagnosis:
  summary_en: "A China University MOOC course, Chinese Medicine and Diagnosis: Learn to Be Your Own Physician, taught by Sun Li of Jinan University. The official page states that it is a national quality online open course and an introductory general-education course requiring no prior TCM knowledge. The video course has 10 units: theoretical units on yin-yang and the five phases, the zang-fu organs, qi, blood and fluids, and etiology, and diagnostic units on inquiry, inspection, tongue diagnosis, pulse diagnosis, listening and smelling, and palpation. The official course page was opened in this pass. The current term runs from 31 August 2026 to 31 December 2026; the platform also records an earlier offering from 12 September 2016. This is a formal university open course, not a marketing clip."

course-jnu-practical-acupuncture:
  summary_en: "A China University MOOC course, Practical Acupuncture: Meridian-Based Health Cultivation and Rehabilitation, taught by Zhang Yimin, Zhu Mingmin, Ma Qingyu, Qing Peng and Zhao Canghuan of Jinan University. The official page states that the title comes from a public elective taught for more than twenty years by Wei Bo of the school's College of Chinese Medicine, and that the course is supported by a Jinan University online open-course project and a Chinese-culture transmission collaborative-innovation centre project (JNXTKC2022012). It is organised in four parts: meridian theory, practical acupuncture techniques, meridian-based health cultivation, and regulation and rehabilitation of common diseases, starting from basic TCM theory and covering moxibustion, scraping, cupping and massage. The official course page was opened in this pass. The current term runs from 20 July 2026 to 20 December 2026; the platform also records an earlier offering from 23 December 2019. This is a formal university open course, not a marketing clip."

course-jnu-herb-pharmacology:
  summary_en: "A China University MOOC course, Pharmacology of Chinese Medicinals: Learn to Be Your Own Regulator, taught by Nie Hong of Jinan University. The official page states that the course was developed with TCM specialists from universities and medical institutions in the Guangdong–Hong Kong–Macao Greater Bay Area, and that its 10 units address common chronic diseases such as hyperlipidaemia, hypertension, hyperglycaemia (diabetes), hyperuricaemia (gout), obesity, cancer, coronary heart disease and stroke, under the TCM idea of treating disease before it arises, covering lifestyle, diet, exercise prescriptions, medicated diet and health cultivation. The official course page was opened in this pass. The current term runs from 7 September 2026 to 31 December 2026; the platform also records an earlier offering from 15 November 2019. This is a formal university open course, distinct from the Nanjing professional course in pharmacology of Chinese medicinals."

course-scu-yangsheng:
  summary_en: "A China University MOOC course on TCM Health Cultivation and Health, taught by Xia Qing of Sichuan University. The official page quotes the Huangdi Neijing on yin-yang and the four seasons and divides the course into an introduction to TCM health-cultivation culture, methods of cultivation, and cultivation for common conditions, covering traditional breathing and sitting practice, clothing, emotions, diet, tea and sleep, acupoint care, and TCM regulation of dampness, cough, influenza, chronic gastritis, functional constipation, acne, obesity, dysmenorrhoea and haemorrhoids. It names the nationally compiled textbook TCM Health Cultivation and the Huangdi Neijing as references. The official course page was opened in this pass. The current term runs from 7 September 2026 to 1 January 2027; the platform also records an earlier offering from 23 December 2019. This is a formal university open course, not a marketing clip."
news-202611-nmpa-tcm-injection-postmarketing:
  summary_en: "The National Medical Products Administration (NMPA), the National Health Commission and the National Administration of Traditional Chinese Medicine jointly issued the Announcement on Promoting Marketing Authorization Holders in Carrying Out In-Depth Post-Marketing Research and Evaluation of Traditional Chinese Medicine Injections (NMPA Announcement No. 112 of 2026). The announcement, dated 20 November 2026, takes effect from the date of issuance and applies to TCM injections that were already on the market before the 2019 revision of the Drug Administration Law. It comprises 11 articles. Marketing authorization holders must fulfill their primary responsibility for quality and safety, proactively conduct post-marketing research and evaluation, study the material basis and mechanisms relevant to clinical efficacy, and comprehensively assess benefit/risk in light of clinical value; products whose risks outweigh benefits must be withdrawn from production and sale. Holders should give priority to products listed in the National Essential Medicines List and the national medical insurance medicines list. Before starting the research, holders must assess whether a product meets expected clinical safety and efficacy; if it does not, they should voluntarily apply to cancel the marketing authorization. Research must be based on a manufacturing process approved by the drug regulator or fixed in accordance with Article 23 of the Measures for the Administration of Post-Marketing Changes to Drugs, and clinical studies should in principle remain within the already approved functions/indications. Related registration and consultation requests will be placed in a dedicated, expedited queue. Products judged after review to have benefits outweighing risks will be marked “post-marketing research and evaluation completed” in the NMPA drug inquiry column, and their approved registration standards will be given priority for conversion into national drug standards. Regulators may place products that have not completed the work or that present quality or safety risks under key supervision, or legally refuse re-registration, cancel the authorization, suspend production, or order further research. This update opened the 27 November 2026 20:23 full-text republication on the official NMPA newspaper site CNPharm (HTTPS 200), which carries the complete 11-article announcement, the 20 November 2026 signature block, and the official policy interpretation; the article states that the three departments released and implemented the announcement on 27 November. Direct access to the NMPA website and its drug-announcement column returned HTTP 412 or 504 and was not treated as a successfully opened article."

news-202611-cde-tcm-injection-eval-reqs:
  summary_en: "The Center for Drug Evaluation (CDE) of the National Medical Products Administration issued the Basic Technical Requirements for Post-Marketing Research and Evaluation of Traditional Chinese Medicine Injections and the Dossier Requirements for Post-Marketing Research and Evaluation of Traditional Chinese Medicine Injections as CDE Announcement No. 58 of 2026. The notice, dated 26 November 2026, states that the two documents were prepared to implement NMPA/NHC/NATCM Announcement No. 112 of 2026; they were released with NMPA’s consent and take effect from the date of issuance. The CDE homepage lists the announcement as published on 27 November 2026. The technical requirements set out patient-centered, clinically value-oriented principles and a “most rigorous standards” approach. Holders must first assess the necessity of the injectable route, the reasonableness of the labeled functions/clinical positioning, and benefit/risk, and then, on the basis of a fixed manufacturing process, conduct pharmaceutical research, nonclinical safety studies, clinical efficacy and safety studies, and mechanism-of-action research, and update safety information in the labeling. The dossier requirements specify administrative and product information, overviews, pharmaceutical, pharmacological/toxicological, clinical and other study materials, and allow some items to be simplified or omitted for already marketed products, with reasons stated. This update opened the 27 November 2026 20:52 full-text republication on the official NMPA newspaper site CNPharm (source attributed to the CDE website, HTTPS 200) and the two official PDFs (technical requirements, 7 pages, HTTPS 200, 320,293 bytes; dossier requirements, 5 pages, HTTPS 200, 266,185 bytes), and also opened the CDE homepage listing via WebFetch. Direct curl access to the CDE homepage returned HTTP 202 with a script interstitial and was not treated as a successfully opened article."

solid-tcm:
  summary_en: "Qi, Li, Tan, Yu, Sun and colleagues published the SOLID-TCM Statement in BMC Medicine as an EQUATOR-informed reporting guideline for real-world observational studies of traditional Chinese medicine formulas. The official article page (opened via WebFetch on 27 November 2026) describes a 40-item, 25-domain checklist covering observational-study reporting together with TCM-formula and real-world-data elements such as syndrome differentiation, formula composition and modification, exposure definition, data provenance, linkage and population coverage, plus an Explanation and Elaboration document. The page marks the work as a Guideline, Open access, published 27 November 2026. Corresponding authors Jiajie Yu and Xin Sun are identified with West China Hospital, Sichuan University (ethics approval No. 2023-2297); other numbered affiliations were not fully expanded in the opened extract, so only this institution is recorded."

xu2026-dm3c-acu:
  summary_en: "Xu, Peng, Wen, Wang, Xia, Xu, Yang and corresponding author Hu report DM3C, a dual-model collaborative method with consistency calibration for intelligent acupuncture prescription recommendation, in Chinese Journal of Integrative Medicine (section AI Research in Chinese Medicine; published 26 November 2026). The official Springer article page, opened via WebFetch, describes symptom-to-acupoint mapping as end-to-end text generation that combines a domain-fine-tuned generator, retrieval-augmented LLM outputs and a consistency-calibrated random forest filter. No numerical performance metrics are given in the opened abstract. Data are stated to come from published monographs and are not redistributable. PubMed (PMID 43097059) supplies Nanjing University of Chinese Medicine affiliations consistent with the official author list. An official open PDF was not obtained (curl received a client-challenge page)."

wang2026-sdt-kd-dpo:
  summary_en: "Wang, Sun (equal contribution), Shen, Xie, Xu, Yang, Cheng and Hu report a TCM syndrome-differentiation and treatment model that uses knowledge distillation and DPO reinforcement learning, in Health Information Science and Systems (published 13 May 2026; Crossref volume 14, article 64). The official Springer article page, opened via WebFetch, states that GPT-4o was used as a teacher model to distill clinical cases into an instruction set, Qwen2.5-7B was LoRA-fine-tuned, and DPO was applied on a further case set. The authors report that prescription-recommendation performance remained comparable to direct training while interpretability and external generalization were strengthened, and that DPO improved prediction stability on the external set; no numeric scores are given in the opened abstract. The official page is a subscription preview: metadata and the abstract were complete, but no open PDF was obtained. Affiliations are taken from PubMed PMID 42146318 for this DOI."

surv-wu2026-imr-tongue-cancer:
  summary_en: "Wu, Wu, Chen, Kimble, May, Chan, Stylianou, Xu, Sze and corresponding author Zheng published a scoping review in Integrative Medicine Research on TCM tongue diagnosis for potential cancer identification. The official PMC full-text page (HTTP 200; PMC12856187) reports 24 studies (14 case-control, 4 cross-sectional, 5 observational, 1 prospective multicentre cohort) with 5,458 cancer patients and 7,880 controls, and lists tongue features such as lingual flange protrusion, sublingual nodules, engorged sublingual veins, purple-bluish tongue and coating changes. Using QUADAS-2, the authors judged overall quality low with possible high risk of bias, especially in participant selection and the index test, and they do not recommend clinical use on this evidence. PMC records citation_publication_date 13 October 2025, received 4 April 2025, accepted 12 October 2025, issue date June 2026, volume 15 issue 2, article 101265. This is a review, not a new model release."

liang2026-stroke-syndrome-ml:
  summary_en: "Liang, Ding, Jian, Jia and Lin report an internally validated, interpretable machine-learning model for TCM syndrome differentiation in ischemic stroke in Frontiers in Pharmacology. The official full-text page (HTTP 200) describes 616 patients at a tertiary TCM hospital in Sichuan, 51 candidate predictors (including tongue and pulse features), five syndrome classes, and a 495/121 train-test split. The authors report held-out test accuracy 0.752 (95% CI 0.678–0.826) and Macro-F1 0.744 for random forest, and Macro AUC 0.945 and Hand-Till multiclass AUC 0.944 for XGBoost, which they selected for SHAP analysis; they explicitly state that this is a preliminary single-centre internal evaluation and is not ready for clinical decision-making or prescription guidance. Publication date on the page is 12 November 2026 (online 4 November 2026). Metrics are author-reported."

liu2026-imcs-colorectal:
  summary_en: "Liu, Shuai (equal first authors), Ye, Ng, Hu, Fan, Cheng, Zhang, Zhang, Liu and corresponding authors Chen and Zhong report the IMCS integrative-medicine model for colorectal-neoplasm screening in International Journal of General Medicine. The official PDF (HTTP 200, %PDF-1.5) and official article page (publication date 5 November 2026) describe a cross-sectional study at Guangdong Provincial Hospital of Chinese Medicine (8 March 2022–21 July 2023) with 2,047 recruited and 1,814 analysed participants (39.25% with colorectal neoplasm), including tongue and facial photographs plus colonoscopy. Author-reported figures include XGBoost training-set AUC 0.817 (95% CI 0.794–0.841) and logistic-regression validation-set AUC 0.690 (95% CI 0.644–0.736). The PDF lists received 21 July 2026, accepted 24 October 2026, published 5 November 2026."

lu2026-tongue-mafld-fusion:
  summary_en: "Lu, Tian (equal first authors) and colleagues, with corresponding authors Khoo and Li, report a multimodal deep-learning model that fuses CIE L*a*b tongue-image features (ConvNeXt-Tiny) with clinical variables for non-invasive MAFLD screening, in Journal of Clinical and Translational Hepatology. The official Xia & He Publishing article page (HTTP 200) states that 477 of 904 screened subjects were included (157 healthy, 320 MAFLD) and split 8:1:1; on an independent test set (n=48) the authors report 97.92% accuracy, quadratic weighted kappa 0.9538, 96.88% sensitivity and 100% specificity. Bibliographic line: 2026;14(4):416-429; received 24 November 2025, accepted 2 March 2026, published 8 April 2026. Test-set size is small; metrics are author-reported. This is not the same work as the already-pending tongue-microbiome MASLD paper."

li2026-bingzheng-intelligent:
  summary_en: "Li Xinlong, Wang Sulin, Yan Dongning, Zhao Xinran and Zhang Genming published in Journal of Traditional Chinese Medicine a methodological essay on intelligent syndrome differentiation under the disease-syndrome combination model. The official journal page (HTTP 200) argues that unconstrained symptom-to-syndrome inference amplifies ambiguity, and proposes using modern-medicine disease entities as structural priors, together with multimodal AI and knowledge graphs, to constrain reasoning. The page records 2026, volume 67, issue 07, pages 705-709, DOI 10.13288/j.11-2166/r.2026.07.001, and both release and publication dates 2 April 2026."

wu2026-chd-ai-cds:
  summary_en: "Wu Wenjun, Wang Xinlu, Yu Rui, Li Yizhuo, Wei Jingjing, Li Bin, Xu Yulong and Zhu Mingjun published in Journal of Traditional Chinese Medicine a framework and implementation path for an integrative intelligent clinical-decision-support system for coronary heart disease. The official journal page (HTTP 200) describes a pipeline of Western-medicine diagnostic gating, TCM syndrome-element identification, an integrative knowledge graph, a guideline rule engine and physician confirmation, organised around a disease-syndrome-symptom-diagnosis-treatment-rehabilitation-outcome data frame. The page records 2026, volume 67, issue 22, pages 2386-2396, DOI 10.13288/j.11-2166/r.2026.22.005, and release/publication dates 16 November 2026. This is a methodological framework, not an outcome evaluation of a deployed system."

zhou2026-guideline-agent:
  summary_en: "Zhou Feng, Chen Tengfei, Zhang Wandie, Li Haoyuan, Zong Xingyu, Lin Jiahao, Liu Qingquan and Zhao Guozhen published in Journal of Traditional Chinese Medicine a methodological discussion of building an integrated Chinese-Western medicine diagnosis-and-treatment agent from clinical practice guidelines as the sole knowledge-base source. The official journal page (HTTP 200) outlines five methodological problems and proposed responses, including an ontology that distinguishes Chinese and Western concepts, an extract-and-expert-review loop, expert consensus for missing decision nodes, a multi-stage standardised output process intended to reduce hallucination, and clinically oriented evaluation criteria. The page records 2026, volume 67, issue 17, pages 1853-1857, DOI 10.13288/j.11-2166/r.2026.17.009, and release, publication and online dates 12 August 2026."

zhangyr2026-ai-syndrome-threshold:
  summary_en: "Zhang Yingren, Nan Nan, Hao Wenzhi and Chen Jiaxu published in Journal of Traditional Chinese Medicine a theoretical paper on a proposed 'syndrome-differentiation capability threshold' of AI TCM diagnostic systems, arising from the subjectivity and experiential nature of TCM diagnosis, and a human-AI collaboration path (auxiliary positioning, algorithm adaptation, clinician literacy and interdisciplinary work). The official journal page (HTTP 200) records 2026, volume 67, issue 20, pages 2155-2160, DOI 10.13288/j.11-2166/r.2026.20.002, and release/publication dates 14 October 2026. This is a theoretical discussion, not a system benchmark."

liangjx2026-ai-tcm-heritage:
  summary_en: "Liang Jinxiao, Li Rui, Zhao Ruixia, Cui Hongyan, Yang Xing, Wang Xuehan, Ren Rui, Jiang Zhongqi and Shao Mingyi published in Journal of Traditional Chinese Medicine a theoretical paper on conflicts between current AI reasoning paradigms and TCM image-based, syndrome-differentiation thinking in academic inheritance, and on repositioning AI as a clinical 'interlocutor' rather than a knowledge substitute. The official journal page (HTTP 200) records 2026, volume 67, issue 19, pages 2037-2041, DOI 10.13288/j.11-2166/r.2026.19.001, and release/publication dates 29 September 2026. This is a theoretical discussion, not a new model evaluation."

zhoucy2026-tcm-plan-equity:
  summary_en: "Zhou Chongyun, Wang Yifan, Zhang Chuchu, Bai Yichen, Liu Yang and Li Haiyan published a policy brief in Frontiers in Public Health on evidence and equity in implementing China's traditional Chinese medicine plan for 2026-2030. The official article page (HTTP 200) compares capacity expansion, broad reimbursement, and staged integration tied to evidence, safety and equity, and recommends the third approach, with targeted investment in underserved counties, intervention-specific eligibility, shared clinical pathways and independent evaluation of pilots. The abstract states that the proposed measures supplement national indicators and are not existing mandates or demonstrated effects of the plan. Publication date on the page is 27 November 2026 (online 17 November 2026). This is a journal policy brief, not the official government plan text."

course-cdutcm-tcm-overview:
  summary_en: "Chengdu University of Traditional Chinese Medicine open course Introduction to Chinese Medicine, taught by Huang Lihua, Jiang Miao, Dai Ou, Chen Lin, Song Juxian, Wang Jian, Zhang Tingmo, Zou Wenjun, Qin Xuhua, Tang Yi, Yang Min, Ma Xiao and Min Zhiqiang. It is offered on XuetangX and recorded on the National Higher Education Smart Education Platform. The official course page states that the course has three parts in 37 categories: basic Chinese medicine theory, more than 150 commonly used single herbs in 20 classes, and about 30 representative formulas in 10 classes, with weekly quizzes and discussions. The first-party platform page was opened in this pass. The current term runs from 23 July 2026 to 6 December 2026 and is marked as in progress, with enrolment recorded as 30,000+ and a page update date of 27 November 2026. No earlier term is given on the page, so the first-offering year is provisionally recorded as 2026. This item was previously held because the current term could not be verified; a verifiable official term record is now open."

course-zjzyy-diagnostics:
  summary_en: "Zhejiang Chinese Medical University open course Diagnostics of Traditional Chinese Medicine, taught by Zhou Yuejun, Song Hong, Liu Xiaogu, Han Jin, Yu Wangqin, Fang Chuanming and Yang Hui. It is offered on Zhihuishu and recorded on the National Higher Education Smart Education Platform. The official page describes it as a bridge course between TCM theory and clinical practice, teaching inspection, listening and smelling, inquiry and palpation, and basic pattern differentiation, including outpatient record writing. The first-party platform page was opened in this pass. The current term runs from 21 July 2026 to 20 January 2027 and is marked as in progress, with enrolment recorded as 10,000+ and a page update date of 26 November 2026. No earlier term is given on the page, so the first-offering year is provisionally recorded as 2026. It is a formal university professional course, distinct from the already catalogued diagnostics courses at Beijing, Henan and Nanjing Universities of Chinese Medicine."

course-csu-zoujin-tcm-upper:
  summary_en: "Central South University open course Approaching Chinese Medicine (Part 1), taught by Dai Xingping, Tang Tao, Xu Xia and Zhang Chunhu. It is offered on Zhihuishu and recorded on the National Higher Education Smart Education Platform. The official page states that it is a blended quality course designed for non-TCM students in Western medical schools, including five-, seven- and eight-year programmes and students of clinical medicine, anaesthesiology and stomatology, and is also open to non-medical learners. The first-party platform page was opened in this pass. The current term runs from 21 July 2026 to 20 January 2027 and is marked as in progress, with enrolment recorded as 20,000+ and a page update date of 27 November 2026. No earlier term is given on the page, so the first-offering year is provisionally recorded as 2026. It is the first part of a formal two-part university series."

course-csu-zoujin-tcm-lower:
  summary_en: "Central South University open course Approaching Chinese Medicine (Part 2), taught by Dai Xingping, Wang Yang, Wang Dongsheng, Xiong Xingui and Luo Jiekun. It is offered on Zhihuishu and recorded on the National Higher Education Smart Education Platform. The official page states that it complements Part 1. The outline covers prevention and treatment principles and the eight methods, herbal properties and combination, formula families, eight-principle, defence-qi-nutrient-blood and zang-fu pattern differentiation, and the meridians, acupoints and needling and moxibustion methods. The first-party platform page was opened in this pass. The current term runs from 21 July 2026 to 20 January 2027 and is marked as in progress, with enrolment recorded as 10,000+ and a page update date of 26 November 2026. No earlier term is given on the page, so the first-offering year is provisionally recorded as 2026. It is the second part of the same formal university series, not a duplicate of Part 1."

course-shutcm-medical-history:
  summary_en: "Shanghai University of Traditional Chinese Medicine open course History of Chinese Medicine, taught by Chen Liyun, Yang Yiwang, Hu Rong, Yan Na, Song Shenmi, Sun Zengkun and Zhou Min. It is offered on Zhihuishu and recorded on the National Higher Education Smart Education Platform. The official page describes it as a required course for beginners in Chinese medicine, covering the origin, formation and development of Chinese medicine, academic lineages, famous physicians and the relationship between medical history and social culture. The outline runs from prehistoric medical activity through the Xia-to-Spring-and-Autumn, Warring States-to-Eastern Han (including Mawangdui medical manuscripts and the Huangdi Neijing), Wei-Jin, Sui-Tang, Song-Jin-Yuan and Ming periods. The first-party platform page was opened in this pass. The current term runs from 21 July 2026 to 20 January 2027 and is marked as in progress, with enrolment recorded as 10,000+ and a page update date of 26 November 2026. No earlier term is given on the page, so the first-offering year is provisionally recorded as 2026."

course-shutcm-tcm-thinking:
  summary_en: "Shanghai University of Traditional Chinese Medicine open course Uncovering the Secrets of Chinese Medical Thinking, taught by Zhang Ting, Chen Huijuan and Zhu Lingling. It is offered on Zhihuishu and recorded on the National Higher Education Smart Education Platform. The official outline covers the concept and disciplinary nature of Chinese medicine, the doctrine of original qi, yin-yang theory, five-phase theory, and major modes of Chinese medical thinking, including image-based thinking. The first-party platform page was opened in this pass. The current term runs from 21 July 2026 to 20 January 2027 and is marked as in progress, with enrolment recorded as 30,000+ and a page update date of 27 November 2026. No earlier term is given on the page, so the first-offering year is provisionally recorded as 2026."

course-gsutcm-diagnostics:
  summary_en: "Gansu University of Chinese Medicine open course Diagnostics of Traditional Chinese Medicine, taught by Wan Shengfang, Jia Yuxin, Li Rongke, Wang Xiaorong, Liang Jianqing and Zhang Lei. It is offered on Zhihuishu and recorded on the National Higher Education Smart Education Platform. The official page describes it as a bridge course between basic and clinical subjects, covering the four examinations and pattern differentiation, including the eight principles and pattern-nature differentiation. The first-party platform page was opened in this pass. The current term runs from 21 July 2026 to 20 January 2027 and is marked as in progress, with enrolment recorded as 10,000+ and a page update date of 26 November 2026. No earlier term is given on the page, so the first-offering year is provisionally recorded as 2026. Official public courses from this university were previously almost absent from the catalogue."

course-ynutcm-yangsheng:
  summary_en: "Yunnan University of Chinese Medicine open course Science of Health Preservation in Chinese Medicine, taught by Zhou Qing, Tai Xiantao, Liu Hong, Pan Ling, Wang Jinjin, Xiao Bing, Zuo Yuanyuan, Wan Xuejiao and Shao Mengqiu. It is offered on Zhihuishu and recorded on the National Higher Education Smart Education Platform. The official page states that, after introducing basic Chinese medical knowledge and related traditional culture, the course systematically covers principles of health preservation and the emphasis on supporting the healthy qi, with topical units on mental, dietary, sexual, exercise, medicinal, meridian, constitutional and daily-life cultivation. It is described as a long-standing popular elective. The first-party platform page was opened in this pass. The current term runs from 21 July 2026 to 20 January 2027 and is marked as in progress, with enrolment recorded as 30,000+ and a page update date of 27 November 2026. No earlier term is given on the page, so the first-offering year is provisionally recorded as 2026. It is distinct from the already catalogued health-preservation courses at Sichuan University and Hubei University of Chinese Medicine."

course-gzutcm-herbal:
  summary_en: "Guizhou University of Traditional Chinese Medicine open course Clinical Chinese Materia Medica (Chinese Materia Medica), taught by Liu Dingding, Liu Jinzhe, Chen Fang, Li Xuzhao, Zhao Ran, Mei Ying and Liu Dong. It is offered on Xueyin Online and recorded on the National Higher Education Smart Education Platform. The official page describes it as both a foundation and a professional course in Chinese medicine and materia medica, covering the concepts of Chinese medicines, their origin and development, producing areas and collection, the concept of medicinal materials, and the development of geo-authentic materia medica, with chapter tests. The first-party platform page was opened in this pass. The current term runs from 23 August 2026 to 23 February 2027 and is marked as in progress, with enrolment recorded as 1,000+ and a page update date of 27 November 2026. No earlier term is given on the page, so the first-offering year is provisionally recorded as 2026. Official public courses from this university were previously almost absent from the catalogue."

course-gzutcm-diet-tumor:
  summary_en: "Guizhou University of Traditional Chinese Medicine open course Chinese Dietary Therapy and Tumour Prevention and Treatment, taught by Tang Dongxin, Yang Zhu, Wu Wenyu, Yu Jia, Ye Tao, Chen Huibin, Yang Bing, Wang Dingxue, Wang Jinghui, Huang Wenqi and Li Juan. It is offered on Zhihuishu and recorded on the National Higher Education Smart Education Platform. The official page states that the course is guided by Chinese medical theory combined with nutrition, and covers body-constitution-based diet, dietary habits and tumour rehabilitation, commonly used foods, and dietary therapy for different tumour types and stages, with the aim of teaching pattern-based and constitution-based dietary prescription. The first-party platform page was opened in this pass. The current term runs from 21 July 2026 to 20 January 2027 and is marked as in progress, with enrolment recorded as 5,000+ and a page update date of 26 November 2026. No earlier term is given on the page, so the first-offering year is provisionally recorded as 2026."

course-hebtcm-herbal:
  summary_en: "Hebei University of Chinese Medicine open course Chinese Materia Medica, taught by Professor Zhang Yixin, on China University MOOC. The official page states that the course studies basic theory and clinical use of Chinese medicines under the guidance of Chinese medical theory, and is a required bridge course for all programmes at Chinese medicine colleges. It covers the history of Chinese materia medica, properties, actions, dosage and cautions of commonly used medicines, together with medication experience from physicians of the Yan-Zhao region, contemporary achievements and warnings on safe use; the overview also states that students should master about 130 key medicines and become familiar with about 90 others. The first-party course page was opened in this pass. The current term runs from 24 August 2026 to 31 December 2026. The earliest term listed on the platform is 29 December 2020 to 26 February 2021, so the first-offering year is recorded as 2020. Official public courses from this university were previously almost absent from the catalogue."

course-ccucm-herb-pharmacology:
  summary_en: "Changchun University of Chinese Medicine open course Pharmacology of Chinese Medicines, taught by Li Lijing, Lin Zhe, Wang Chuying, Liu Jia, Li Yumei, Han Dong, Lin He, Zhang Yajie, Wang Yuchen and Bao Huiwei. It is offered on Xueyin Online and recorded on the National Higher Education Smart Education Platform. The official page describes it as the study of interactions between Chinese medicines and the body, including normal and pathological states and pathogens, under the guidance of Chinese medical theory. The course has a general part on modern studies of medicinal properties, pharmacodynamics, toxicology, pharmacokinetics and influencing factors, and a particular part on shared and individual pharmacological actions, material bases and mechanisms of commonly used medicines in classes such as exterior-releasing and heat-clearing drugs, together with experimental design and literature skills. The first-party platform page was opened in this pass. The current term runs from 27 August 2026 to 11 January 2027 and is marked as in progress, with enrolment recorded as 1,000+ and a page update date of 24 November 2026. No earlier term is given on the page, so the first-offering year is provisionally recorded as 2026. It is distinct from the already catalogued pharmacology courses at Nanjing University of Chinese Medicine and Jinan University."

course-swun-ethno-pharmacology:
  summary_en: "Southwest Minzu University open course Chinese Ethnopharmacology, taught by Liu Yuan, Li Ying, Li Wenbing, Huang Yanfei, Zhang Shaoshan, Yang Zhengming, Zhang Zhifeng and a large team that includes teachers of Tibetan, Mongolian, Uyghur, Dai and other ethnic medicines. It is offered on Xueyin Online and recorded on the National Higher Education Smart Education Platform. The official page states that the course studies traditional medicines of various ethnic groups and tribes, especially the names, sources, properties, identification, assay, actions and uses, dosage, adverse reactions, preparations and storage of minority medicines, and explicitly refers to Tibetan, Mongolian, Uyghur, Dai, Miao, Yi and Zhuang traditional medicines. The first-party platform page was opened in this pass. The current term runs from 1 September 2026 to 16 January 2027 and is marked as in progress, with enrolment recorded as 10,000+ and a page update date of 27 November 2026. No earlier term is given on the page, so the first-offering year is provisionally recorded as 2026."

course-qhu-tibetan-overview:
  summary_en: "Qinghai University open course Introduction to Tibetan Medicine, taught by Li Qi'en, Guo Xiao and Zhou Ze. It is offered on XuetangX and recorded on the National Higher Education Smart Education Platform. The official page states that it is the first course to teach Tibetan medicine completely in the national common language, has been selected as a national first-class course, and serves both as a required introductory course for Tibetan medicine students and as a general course for the wider university. It has ten chapters covering the formation and development of Tibetan medicine, the Four Tantras and their features, philosophical foundations, theoretical system, physiology and pathology, diagnosis, therapies and the 'tree metaphor' diagram, and aims to establish a body-disease-medicine overall view and Tibetan pattern differentiation, with bilingual Tibetan-Chinese resources. The first-party platform page was opened in this pass. The current term runs from 23 July 2026 to 12 January 2027 and is marked as in progress, with enrolment recorded as 30,000+ and a page update date of 27 November 2026. No earlier term is given on the page, so the first-offering year is provisionally recorded as 2026."

course-cdutcm-tibetan-intro:
  summary_en: "Chengdu University of Traditional Chinese Medicine open course Approaching Tibetan Medicine, taught by Wang Tianhong and Zhang Dan. It is offered on XuetangX and recorded on the National Higher Education Smart Education Platform. The official page states that the course distils the university's professional courses in Tibetan medicine and Tibetan medical basics, as well as Tibetan anatomy, ethics, calendrical astronomy and anthropology, into a university-wide elective. It systematically presents the history, theories, representative figures, classics and diagnostic and treatment methods of Tibetan medicine, and the page describes it as the first online Tibetan medicine course taught mainly in Chinese. The first-party platform page was opened in this pass. The current term runs from 23 July 2026 to 12 January 2027 and is marked as in progress, with enrolment recorded as 10,000+ and a page update date of 27 November 2026. No earlier term is given on the page, so the first-offering year is provisionally recorded as 2026. It is distinct from Qinghai University's Introduction to Tibetan Medicine."

course-bszy-gaoligong:
  summary_en: "Baoshan College of Traditional Chinese Medicine open course Medical and Dietary Wisdom of the Gaoligong Mountains, taught by Zhang Yin, Yin Jianzhong, Wang Hongyun, Li Zhihui, Duan An, Cun Pengfei, Liu Heng, Dong Minghui, Ding Guoyu, Li Qingxia, Ma Guangyu, Zhang Teng, Zhang Nichang, Wang Yanjiao and Xu Fang. It is offered on Zhihuishu and recorded on the National Higher Education Smart Education Platform. The official outline systematically introduces the medical and food culture of the Gaoligong Mountains and then presents the medical history, distinctive therapies, herbal baths and commonly used herbs of the Lisu, Dai, Achang, Jingpo, De'ang and Nu peoples, together with local medicinal resources such as mulberry, glutinous olive and Hedyotis diffusa. The first-party platform page was opened in this pass. The current term runs from 21 July 2026 to 20 January 2027 and is marked as in progress, with enrolment recorded as 20,000+ and a page update date of 27 November 2026. No earlier term is given on the page, so the first-offering year is provisionally recorded as 2026. It is a formal regional ethnic-medicine teaching series, not a marketing clip."

course-imust-intelligent-medicine:
  summary_en: "Inner Mongolia University of Science and Technology open course Introduction to Intelligent Medicine, taught by Liu Liang, Agula, Wan Zhiheng, Bao Hashen, Yan Ze, Zhou Hai, Zhang Chunhong, Tang Yexia and Wang Jia. It is offered on XuetangX and recorded on the National Higher Education Smart Education Platform. The official page describes it as a new medical-engineering course that incorporates regional knowledge of intelligent Chinese and Mongolian medicine; the teaching team includes a national intangible-cultural-heritage inheritor of Chinese-Mongolian warming and fire needling, clinicians, computer-science teachers and IT engineers. Besides a general introduction to intelligent medicine, clinical applications and data science, the outline has dedicated units on artificial intelligence meeting Chinese-Mongolian medicine, traditional Chinese medicine and acupuncture, and on network pharmacology, remote sensing, traceability systems, VR/AR and plant-recognition apps in Chinese and Mongolian materia medica research. The first-party platform page was opened in this pass. The current term runs from 23 July 2026 to 12 January 2027 and is marked as in progress, with enrolment recorded as 50,000+ and a page update date of 27 November 2026. No earlier term is given on the page, so the first-offering year is provisionally recorded as 2026."

person-koizumi-keiichi:
  name_en: "Keiichi Koizumi"
  summary_en: "Toyama. Professor at the Institute of Natural Medicine, University of Toyama. The official faculty page gives the English name Koizumi Keiichi and states that he belongs to the Division of Presymptomatic Disease (research and development) and the industry–government–academia collaboration division; his specialties are Japanese–Chinese (Kampo/wa-kan) medicine, biopharmaceutics, and pre-disease (mibyo) studies; and he holds a PhD in Pharmaceutical Sciences. The biography states that he graduated from Showa Pharmaceutical University in March 1995, completed the master’s programme there in March 1997 and the doctoral programme at Osaka University in March 2000; was a postdoctoral fellow at NHLBI/NIH from August 2000; joined the former Toyama Medical and Pharmaceutical University Institute of Natural Medicine as an assistant in April 2001; became associate professor in October 2010; and has been professor since December 2020. The research overview cites the Huangdi Neijing and states that his aims are to clarify the biology of mibyo and to develop pre-emptive medicines targeting it. The official personal page was opened in this pass."
  orgs_en: "['Institute of Natural Medicine, University of Toyama']"

person-zhu-xiaoshu:
  name_en: "Xiaoshu Zhu"
  summary_en: "Sydney. Professor at Western Sydney University and Head of Discipline, Health Sciences, Traditional Chinese Medicine, and Paramedicine in the School of Health Sciences. The official Pure profile (ORCID 0000-0002-2909-5926) lists a PhD in Health from Western Sydney University and bachelor’s and master’s degrees in medicine, and records adjunct professorships at Beijing University of Chinese Medicine and Nanjing University of Chinese Medicine. Research keywords include traditional Chinese medicine, cancer support, mind–body therapies, women’s health and patient-reported outcomes; the topic fingerprint includes acupuncture and Chinese herbal medicine. The profile shows research activity from 2001 to 2026 and 79 research outputs. The official personal profile was opened in this pass. No Chinese name appears on the page, so the official English name is used."
  orgs_en: "['Western Sydney University']"

person-yang-angela:
  name_en: "Angela Yang"
  summary_en: "Melbourne. Associate Professor and Discipline Lead, Chinese Medicine, in the School of Health and Biomedical Sciences at RMIT University (Bundoora West; ORCID 0000-0001-9345-4607). The official profile states that she has more than 20 years’ experience in Chinese medicine education, programme accreditation and professional standards, and is an Ahpra-registered Chinese medicine practitioner in acupuncture, Chinese herbal medicine and Chinese herbal dispensing. Her research focuses on acupuncture and Chinese herbal medicine for chronic conditions, integrative healthcare, and translating evidence into practice; she has published more than 70 peer-reviewed articles. The page states that she served on the national Chinese medicine accreditation committee for nine years and teaches Chinese medicine theory, classical literature, acupuncture, herbal medicine and formulae, clinical reasoning and professional practice. Supervisor-project dates on the page run through 11 December 2024. The official RMIT profile was opened in this pass. No Chinese name appears on the page, so the official English name is used."
  orgs_en: "['RMIT University']"

person-zheng-zhen-rmit:
  name_en: "Zhen Zheng"
  summary_en: "Melbourne. Professor in the School of Health and Biomedical Sciences at RMIT University (Bundoora West; ORCID 0000-0001-6777-1166). The official profile’s academic-positions list states that she was associate professor from 1 January 2017 to 31 December 2023 and has been professor since 1 January 2024. The page states that she teaches Chinese medicine theories, the neurophysiology of acupuncture, integrated pain management and internal medicine; has taught Chinese medicine courses in Australia for more than 20 years; served on course-approval and hearings panels for the Chinese Medicine Registration Board of Victoria; is a member of the Program Accreditation Panel of the Chinese Medicine Board of Australia; and has been invited by the World Health Organization to comment on documents on Chinese medicine training and practice. Her research focuses on multidisciplinary approaches to acute and chronic pain, sleep and Long COVID. Supervisor-project dates on the page run through 5 August 2026. The official RMIT profile was opened in this pass. No Chinese name appears on the page, so the official English name is used."
  orgs_en: "['RMIT University']"

person-zhang-tony-rmit:
  name_en: "Tony Zhang"
  summary_en: "Melbourne. Professor and Deputy Dean (International) in the School of Health and Biomedical Sciences at RMIT University (Bundoora West; ORCID 0000-0002-0968-9380). The official profile states that he was Discipline Leader from 14 February 2011 to 1 January 2021, has 10 years’ experience as deputy director of a WHO Collaborating Centre, and has been Co-Deputy Director of the China-Australia International Research Centre for Chinese Medicine since 11 September 2013. It describes his work in randomised trials, epidemiology, systematic reviews, implementation science and qualitative research, more than 30 evidence-based monographs or book chapters and more than 200 peer-reviewed papers, and editorial-board service including the American Journal of Chinese Medicine. Listed supervisor projects include systematic evaluation of Chinese medicine evidence (dates visible from November 2024 to 13 February 2025) and acupuncture and Chinese herbal medicine studies. The page states that he was listed among Stanford University’s World’s Top 2% Scientists for 2023, 2024 and 2025. The official RMIT profile was opened in this pass. No Chinese name appears on the page, so the official English name is used."
  orgs_en: "['RMIT University']"

person-hui-kakit:
  name_en: "Kakit P. Hui"
  summary_en: "Los Angeles. Professor of Clinical Medicine in the UCLA School of Medicine. The official UCLA Profiles page states that Dr. Kakit P. Hui holds the Wallis Annenberg Endowed Chair in Integrative East-West Medicine. Automatically derived publication records on the page include work on ear acupuncture and acupuncture, East–West integrative palliative care, and Chinese herbal medicine. The official personal profile was opened in this pass. No Chinese name appears on the page, so the name form used on the profile is retained."
  orgs_en: "['University of California, Los Angeles']"

person-bensoussan-alan:
  name_en: "Alan Bensoussan"
  summary_en: "Sydney. Emeritus Professor of Integrative Medicine at NICM Health Research Institute, Western Sydney University. The official NICM profile lists degrees including PhD, MSc, AdvCAc and DipAc, and states that he was commissioned by government to review the practice of Chinese medicine in Australia, leading to national regulation of Chinese medicine practitioners in 2012—the first Western nation to do so. He established Australia’s National Institute of Complementary Medicine (NICM) at Western Sydney University in 2007 with Commonwealth and state seed funding, has published over 220 scientific papers and two books, and has led clinical trials and reviews of herbal medicine. He chaired the TGA Advisory Committee for Complementary Medicines (2011–14), has consulted for WHO, and served on the Natural Therapies Review Expert Advisory Panel (2020–2024). Awards listed on the page include the 2013 International Award for Contribution to Chinese Medicine from China’s Ministry of Science and Technology, a 2019 Ministry of Science and Technology Achievement Award in Medical Science with colleagues at the China Academy of Chinese Medical Sciences, the 2019 International Qi Huang Award, and inclusion in Stanford University’s top 2% of world scientists in 2024. The official NICM personal page was opened in this pass (the university Pure person URL returned HTTP 404). No Chinese name appears on the page, so the official English name is used."
  orgs_en: "['Western Sydney University', 'NICM Health Research Institute']"

person-chang-dennis:
  name_en: "Dennis Chang"
  summary_en: "Sydney. Director of NICM Health Research Institute and Professor of Pharmacology at Western Sydney University. The official NICM profile states that his research includes clinical and pharmacological studies of herbal medicine and other complementary interventions, including trials of herbal medicine, yoga and tai chi for dementia, mild cognitive impairment, coronary heart disease, metabolic syndrome and type 2 diabetes, and laboratory work on pharmacokinetics and cardio- and neuro-protective mechanisms. He became Director in July 2021, after serving as acting Director from May 2020, and previously as Associate Director International. Education listed: Bachelor of Medicine, Sun Yat-Sen (Zhongshan) University (1986); MSc (1993) and PhD (1998) in Pharmacology, University of Sydney. The page also lists a visiting professorship at Guangzhou Medical University and the role of Coordinator of the South Pacific Chapter of the Consortium for Globalisation of Chinese Medicine. The university Pure profile (ORCID 0000-0002-6584-738X) confirms the director title, a research fingerprint that includes Traditional Chinese Medicine, and research activity through 2026. Both official personal pages were opened in this pass. No Chinese name appears on the pages, so the official English name is used."
  orgs_en: "['Western Sydney University', 'NICM Health Research Institute']"

person-armour-mike:
  name_en: "Mike Armour"
  summary_en: "Sydney. Principal Fellow in Reproductive Health at NICM Health Research Institute, Western Sydney University (ORCID 0000-0001-7539-9851). The official Pure biography states that after an honours degree in biomedicine at the University of Auckland he studied traditional Chinese medicine and acupuncture, completed a PhD on dysmenorrhea in 2016, and is an associate professor in reproductive health and Director of Research at NICM, where he is running clinical trials on endometriosis, dysmenorrhea and menstrual health literacy. The profile states that he has published over 110 peer-reviewed articles and several textbook chapters. Research activity on the page runs from 2009 to 2026. The official personal profile was opened in this pass. No Chinese name appears on the page, so the official English name is used."
  orgs_en: "['Western Sydney University', 'NICM Health Research Institute']"

person-grant-suzanne:
  name_en: "Suzanne Grant"
  summary_en: "Sydney. Researcher at NICM Health Research Institute, Western Sydney University. The official Pure profile states that she leads a clinically embedded research programme in integrative oncology and integrative medicine, co-established Western Sydney Integrative Health (WSIH), and under her leadership the university developed Australia’s first academic integrative medicine longitudinal patient registry. Qualifications listed include a PhD (Traditional Chinese Medicine) and a Bachelor of Applied Science (Traditional Chinese Medicine) from Western Sydney University, plus advanced study in Chinese medicine in Nanjing and Beijing. An external position on the page records that she has been a consultant to the WHO Global Centre for Traditional, Complementary and Integrative Medicine since 26 January 2025. Her research includes acupuncture, Chinese herbal medicine and other complementary interventions in cancer care. The official personal profile was opened in this pass. No Chinese name appears on the page, so the official English name is used."
  orgs_en: "['Western Sydney University', 'NICM Health Research Institute']"

person-li-chunguang-wsu:
  name_en: "Chun Guang Li"
  summary_en: "Sydney. Professor Chun Guang Li is Director of Higher Degree Research at NICM Health Research Institute, Western Sydney University (ORCID 0000-0002-7789-2209). The official Pure profile lists a PhD from the University of Melbourne, 232 research outputs and 33 projects, and research activity from 1985 to 2026. The topic fingerprint includes Chinese herbal medicine, Salvia miltiorrhiza and tanshinone. The official personal profile was opened in this pass; it does not include a narrative biography, so this entry records only the title, qualifications and research topics shown on the page. No Chinese name appears on the page, so the official English name is used."
  orgs_en: "['Western Sydney University', 'NICM Health Research Institute']"

news-202611-beijing-influenza-tcm-scheme:
  summary_en: "The Beijing Municipal Administration of Traditional Chinese Medicine issued the 2026 Beijing Winter Influenza Traditional Chinese Medicine Prevention and Treatment Protocol (Trial). The official notice page is dated 20 November 2026 and is addressed to district health commissions, the Beijing Economic-Technological Development Area social affairs bureau, and all TCM medical institutions. It states that cold weather has increased the incidence of respiratory diseases, mainly influenza, and that pressure on fever clinics has grown; the protocol was formulated after discussion by the Administration’s influenza expert group. No separate document number appears on the page. This update opened the official notice (HTTPS 200) and the downloadable official DOCX attachment (HTTPS 200, 29,056 bytes). The protocol states that influenza-like cases in Beijing have continued to increase since the start of winter 2026, that the city has entered an active influenza period with a further upward trend, and that current cases are mainly influenza A (H1N1 and H3N2) and influenza B, each accounting for about one-third of contemporaneous cases. Influenced by winter weather and abundant summer and autumn rainfall, early-stage cases this winter often present with exterior cold and interior heat with marked dampness; severe cases may progress to heat toxin obstructing the lung, and critical cases to toxin-heat sinking inward with internal block and external collapse; the recovery stage often shows dual deficiency of qi and yin and lung-spleen qi deficiency. The protocol covers adult and paediatric treatment, appropriate TCM techniques, and prevention; recommended base formulas may be modified according to the presenting pattern. It is intended as a clinical reference for TCM, integrated Chinese-Western medicine, and Western-medicine practitioners trained in TCM. Adult decoctions are grouped into mild (wind-cold fettering the exterior with lung heat and dampness), moderate (heat toxin obstructing the lung), critical (toxin-heat sinking inward, internal block and external collapse), and recovery (dual deficiency of qi and yin with residual pathogen) patterns, with Chinese patent medicines also recommended by pattern and by leading symptoms, including Tongxuan Lifei pills (granules, oral liquid), Jingfang granules (mixture), Jinhua Qinggan granules, Lianhua Qingwen capsules (granules), Shufeng Jiedu capsules, Tanreqing capsules, Angong Niuhuang pills, Zixue pills, Yangyin Qingfei pills and Shengmai yin. Paediatric decoctions cover mild, moderate-to-severe and recovery patterns; critical paediatric cases are to be treated in children’s specialty hospitals or intensive-care wards. Recommended techniques include acupuncture, scraping (gua sha), cupping, foot baths, acupoint application and paediatric tuina. Prevention includes 5-day herbal teas for adults and children, plus everyday care advice. China News of Traditional Chinese Medicine reported the issuance on 27 November 2026. This is a formal seasonal clinical protocol issued to TCM institutions citywide, not a popular-science article or a meeting notice."

news-202611-hubei-hospital-prep-rules:
  summary_en: "The Hubei Medical Products Administration issued the Detailed Rules for the Registration and Filing of Medical Institution Preparations in Hubei Province (Hubei MPA Document No. 41 of 2026). The official disclosure page lists the issuing body as the Hubei Medical Products Administration, the document date as 10 November 2026, the publication date as 12 November 2026, the document number as E Yaojian Fa [2026] No. 41, the status as in force, and the index number as MB1529176/2026-35501. The notice states that the rules were adopted by the Administration’s director-general’s meeting and are to be implemented accordingly; they are proactively disclosed. The rules comprise 9 chapters and 103 articles and apply to applications in Hubei for registration of medical institution preparations, filing of TCM preparations made with traditional processes, intra- and inter-institution dispensing, entrusted manufacturing of new TCM preparations, and related review, approval, testing and supervision. The provincial administration is responsible for registration approval, filing and related supervision, and for issuing Hubei medical-institution preparation standards. Approval numbers take the form E Yaozhi Zi H(Z) plus a 4-digit year and a 4-digit serial number, with Z denoting TCM preparations. Chapter 4 governs filing of traditional-process TCM preparations, defined as preparations composed according to TCM theory whose manufacturing process does not alter the material basis of the original formula for treating disease. The filing scope includes traditional solid, semi-solid and liquid dosage forms made from decoction pieces by pulverization or by water or oil extraction only, granules made by water extraction, capsules made after pulverization, and wines and tinctures made by traditional extraction; dosage forms used in TCM clinical practice but not monographed in the Chinese Pharmacopoeia are managed as “traditional-process TCM preparations in non-pharmacopoeial dosage forms.” TCM formula granules and different dosage forms of prescriptions already supplied on the market, among other cases, may not be filed. Chapter 5 creates a priority pathway for preparations listed as Hubei “Jingchu Famous Formulas,” included in national or provincial major science and technology projects or key R&D programmes, urgently needed in major public-health emergencies, or offering clinical innovation and unmet clinical value. After pre-consultation confirms eligibility, formal review is to be completed in 2 working days, and a licensing decision is to be made within 5 working days after the comprehensive technical review is passed. Chapter 6 provides that in-province dispensing may cover preparations that have held a registration approval and been used clinically for at least 2 years with proven efficacy and reliable quality, or traditional-process TCM preparations that have been filed and used clinically for at least 2 years in no fewer than 300 patient visits with demonstrated safety, effectiveness and quality control. Qualifying TCM preparations may be used in medical institutions approved as part of medical consortia, counterpart-support arrangements, regional medical centres, or provincial-or-above research collaborations. The administration is to decide within 10 working days of accepting the dossier; dispensing approvals are generally valid for 3 years. Chapter 7 allows institutions without a preparation licence for the relevant dosage form to apply for registration or first filing of a new TCM preparation only together with an entrusted-manufacturing application; the entrusted manufacturer must be an in-province institution with the corresponding preparation licence or a drug manufacturer that has passed GMP conformity inspection for the dosage form, and all products must be returned to the entrusting institution. The rules are interpreted by the Hubei Medical Products Administration, take effect on 1 March 2027, remain valid for 5 years, and repeal the 2023 version (E Yaojian Fa [2023] No. 26). The official interpretation published the same day states that the revision is intended to implement national TCM and drug-regulation reforms, address slow registration, difficult dispensing and cumbersome variations, and add a supplementary application for transfer of preparation-manufacturing technology so that registration numbers may lawfully move between medical institutions. This update opened the official full-text page (HTTPS 200) and the official interpretation page (successfully opened via WebFetch). This is a formal provincial regulatory instrument, not a draft for comment or a product announcement."

news-202610-hubei-jingchu-mingfang:
  summary_en: "The Hubei Medical Products Administration, the Hubei Provincial Department of Science and Technology, the Hubei Provincial Health Commission, the Hubei Provincial Healthcare Security Administration and the Hubei Provincial Administration of Traditional Chinese Medicine jointly issued the Work Plan for Selecting and Cultivating “Jingchu Famous Formulas” in Hubei Province (Hubei MPA Document No. 37 of 2026). The official notice page is time-stamped 23 October 2026, 15:25, and the signature block is dated 14 October 2026; the notice is proactively disclosed. It states that the five departments prepared the plan to implement Central Committee and State Council decisions on improving the quality of Chinese medicines and promoting high-quality development of the TCM industry, and to support Hubei’s role as a strategic pivot for the rise of central China, and asks municipal and prefectural authorities and relevant units to organize implementation. Citing State Council General Office documents Guobanfa [2024] No. 53 and Guobanfa [2025] No. 11, the plan calls for focusing on Jingchu TCM heritage, identifying classical and empirical formulas and medical-institution TCM preparations with proven clinical efficacy and distinctive strengths, selecting “Jingchu Famous Formulas,” building a project library, and creating a pathway from famous formula to famous preparation to marketed medicine. The selection covers two categories: in-hospital formulas with clear Jingchu regional character and historical lineage, proven efficacy, complete source documentation, consistency with TCM theory, no obvious safety risks, and suitability for development as medical-institution preparations or new TCM drugs; and already registered or traditionally processed and filed medical-institution TCM preparations with at least five years of clinical use, a good safety record, large clinical volume, marked efficacy, and further development and industrialization potential. Work is organized into project application, expert review, and cultivation and incubation. Policy measures include support for excavating and clinically validating experienced physicians’ empirical formulas; a green channel for eligible registration or filing applications covering acceptance, testing, review, inspection and approval; support for multi-centre clinical research of selected preparations through medical consortia, counterpart support and regional medical centres; same-day, fully online review of in-province dispensing applications for selected preparations; inclusion of preparations intended for conversion into new drugs in the provincial biomedical key-development reserve list; priority inclusion of qualifying selected preparations in provincial basic medical insurance and maternity insurance payment scope, with prices set by the producing institution; and long-term prescriptions for eligible patients with chronic conditions, generally for up to 4 weeks and not more than 12 weeks. This update opened the official full-text notice and plan on the Hubei Medical Products Administration website (HTTPS 200). The same site published Hubei MPA Letter [2026] No. 87 on 27 November 2026, launching the first selection round (applications from 26 November to 30 December 2026); that document is an implementing call for applications under this plan and is not catalogued separately. This is a formal five-department special work plan, not a meeting notice or a draft for comment."

surv-huang2026-joim-ml:
  summary_en: "Huang, Goh, He, Zhang, Dai, Kurniawan, Goh, Wong, Islam and Liang published a review in Journal of Integrative Medicine on integrating traditional Chinese medicine with machine learning. The openly accessible Multimedia University repository abstract page (HTTP 200) states that knowledge graphs combined with deep learning can enhance diagnosis, treatment planning and prognosis evaluation, reviews current ML applications and integration strategies, and highlights obstacles in data standardisation, ethical and legal frameworks and interdisciplinary collaboration. The repository marks the full PDF as a published version restricted to repository staff only, so no open official PDF was obtained. PubMed PMID 41765716 (eutils XML, HTTP 200) and Crossref give Journal of Integrative Medicine 2026;24(3):295-309, electronic publication 17 February 2026 and print issue May 2026, article type Review; the corresponding email is that of Hui Hwang Goh at Taylor's University. Affiliations are taken from the opened PubMed record. The ScienceDirect and DOI publisher pages remain a challenge or redirect page, Unpaywall returned HTTP 422, and EuropePMC records the item as not open access and not in PMC."

wu2026-community-tcm-ai:
  summary_en: "Sitong Wu published a Policy and Practice Review in Frontiers in Public Health on community TCM AI health services for older adults. The official full-text page and open-access PDF (HTTP 200; published 27 November 2026, online 6 November 2026) analyse three publicly reported community services in Shenzhen, Hefei and Taihe, each based on one public source, using a five-dimension framework (assessment, individualized recommendations, task monitoring, reassessment and outcomes, and regimen adjustment). All three sources described AI-assisted TCM constitution assessment and individualized recommendations, but reporting of continuing management varied and none provided systematic longitudinal health-outcome data specific to older adults. The author proposes a testable adherence-support framework aligned with China's National Basic Public Health Service Program, and states that it is intended to complement existing services and requires community pilot testing; the findings characterize the included public reports and do not represent nationwide development. Corresponding author: The Fifth Clinical Medical College, Guangzhou University of Chinese Medicine. This is not a systematic review or an outcome trial of a deployed system."

huangxr2026-ict-tcm-platform:
  summary_en: "Huang, Ni, Huang, Zhao and corresponding author Xu report a real-world prospective cohort evaluation of an ICT-based Traditional Chinese Medicine Nursing and Health Management Platform (ICT-TCM) for community-dwelling older adults with chronic disease, in Frontiers in Public Health (published 19 November 2026, online 30 October 2026). The official article page and open-access PDF (HTTP 200) describe enrollment from December 2024 to February 2026, self-selected assignment to ICT-TCM plus a wearable wristband (n=250) or routine care (n=250), and 12-month follow-up. After 1:1 propensity-score matching the analysed cohort was 196 participants per group. Author-reported Table 2 scores (mean±SD; between-group Mann-Whitney U) at one year were: ADL 91.81±11.90 vs 97.02±7.67 (p<0.001); Morse Fall Scale 11.56±15.84 vs 4.01±8.85 (p<0.001); MNA-SF 11.60±2.15 vs 12.12±1.94 (p=0.013); Athens Insomnia Scale 4.22±4.10 vs 3.26±3.22 (p=0.048; lower AIS scores indicate better sleep). The authors note that this is a non-randomized, self-selected observational study and that causal inference is limited. Ethics approval 2025-KL-070-01; registration ChiCTR2500108075. Affiliation: Zhejiang Provincial Hospital of Chinese Medicine."

xu2026-digital-preventive:
  summary_en: "Xu, Luo (equal first authors), Hu, Gu, Shen, Xu and corresponding authors Fang and Qiu published a Perspective in Frontiers in Digital Health on digitalized TCM 'preventive treatment' (zhiweibing) for chronic-disease control and proactive health. The official full-text page and open-access PDF (HTTP 200; published 23 October 2026, online 8 October 2026) propose a testable conceptual framework combining multidimensional data collection, dual-engine analysis, precision health profiling and personalized intervention. The abstract states that this is not a clinically validated system, but a way to organize component-level evidence and to define a pathway for future evaluation of feasibility, effectiveness, safety, equity, implementation and cost-effectiveness. Affiliations are Quzhou Hospital of Traditional Chinese Medicine and the School of Medicine, Quzhou College of Technology. This is a perspective, not an outcome study or systematic review."

surv-liangsb2026-opc-tcm:
  summary_en: "Liang, Li, Chai, Han, Wang, Wang, Ma, Shi, Robinson and corresponding authors Fei and Liu published a scoping review in Integrative Medicine Research on objective performance criteria (OPCs, or target values) in single-arm TCM trials. The official PMC full-text page (HTTP 200; PMC13769208, PMID 43034758) reports searches of PubMed, Embase, the Cochrane Library, CNKI, Wanfang and VIP up to December 2026, and includes 12 studies (13 publications; 1,134 participants; China, 2019-2025) of herbal decoctions (n=9), proprietary Chinese medicines (n=2) or acupuncture plus rehabilitation (n=1). OPCs were derived from prior clinical studies (n=6), meta-analyses (n=5) or a synthesis of experience and literature (n=1); only three studies reported 95% confidence intervals and four justified population comparability. The authors conclude that incomplete reporting, poor comparability, inadequate uncertainty quantification and non-standardized endpoints are common, and call for transparent OPC specification. PMC records received 3 January 2026, accepted 26 April 2026, citation_publication_date 27 April 2026, issue date December 2026, volume 15 issue 4 article 101346, open access CC BY-NC-ND. The ScienceDirect publisher page remained an HTTP 403 challenge page; the opened source is the PMC article. Corresponding-author emails are at Beijing University of Chinese Medicine."

course-hljucm-herbal:
  summary_en: "Heilongjiang University of Chinese Medicine open course Chinese Materia Medica (Zhongyaoxue), taught by Chang Weizhi (professor), Sui Fangyu (associate professor), Guan Zihe (associate professor), Zhang Miao (associate professor), Wu Xinyu, Li Jianuo (lecturer), Tian Hongzhao, Qu Miao (associate professor), Wang Jianwei (professor) and Zhao Wenjing (professor). It is offered on the CNMOOC (Hao Daxue Zaixian) platform operated with Shanghai Jiao Tong University. The official course page states that Chinese materia medica is an inseparable part of Chinese medicine and must be studied under TCM theory, with an emphasis on pattern-based prescribing; the course focuses on basic herbal theory and the properties, actions and clinical use of commonly used herbs, as a foundation for formulas and later professional courses. The posted outline covers general chapters on history, origin and storage, processing, properties, combination, contraindications, dosage and administration, followed by the standard medicinal classes such as exterior-releasing, heat-clearing, draining-downward and wind-damp-dispelling herbs. The first-party CNMOOC page was opened in this pass. The page lists terms from spring 2018 through autumn 2026. The current term runs from 24 August 2026 to 8 January 2027, with enrolment open until 31 December 2026; the page records 981 learners and a duration of 20 weeks. This school previously had no open course in the catalogue."

course-swmu-tcm:
  summary_en: "Southwest Medical University open course Traditional Chinese Medicine (Zhongyixue), taught by Jiang Hua (associate professor). It is offered on the Chinese University MOOC (icourse163) platform. The official page presents it as a bilingual introduction to basic TCM theory and knowledge, intended especially for international medical students, and refers to Wang Xinhua's undergraduate bilingual textbook. The posted English outline includes general introduction, yin-yang and the five elements, visceral manifestation, essence, qi, blood and body fluids, etiology, pathogenesis and constitution, diagnostic methods, basic acupuncture, moxibustion and tuina, Chinese medicinals, and formulas. The first-party icourse163 page was opened in this pass. The term list has two offerings: 20 April to 15 July 2026, and the current term from 31 August 2026 to 10 January 2027. The current-term page records 316 enrolments, about 3 to 5 hours of study per week, and a price of zero. The first offering is in 2026. It is a formal open course from a Western medical university, distinct from Central South University's already catalogued Approaching Chinese Medicine series."

course-swmu-zangxiang:
  summary_en: "Southwest Medical University open course TCM Visceral Manifestation Theory and Clinical Practice, taught by Luo Yongbing (associate professor). It is offered on the Chinese University MOOC (icourse163) platform. The official page describes visceral manifestation (zangxiang) theory as a core part of the TCM theoretical system and the foundation of pattern differentiation and treatment in the clinical disciplines, and presents the course as a systematic study linking theory with clinical application. The posted outline covers an introduction, the physiology and clinical aspects of the five zang and six fu organs, the extraordinary fu, and the relationships among the zang-fu. The first-party icourse163 page was opened in this pass. Terms run from a first offering of 30 August to 30 December 2021 through subsequent semesters; the current term is 31 August 2026 to 10 January 2027, with 267 enrolments recorded on the page and about 3 to 5 hours of study per week. It is a formal specialised university course, not a marketing clip."

course-shutcm-acu-classics:
  summary_en: "Shanghai University of Traditional Chinese Medicine open course Selected Readings in Acupuncture Classics, taught by Xu Ping, Wang Jing, Zhang Chao and Hu Li. It is offered on Zhihuishu and recorded on the National Higher Education Smart Education Platform. The official page states that the Huangdi Neijing and Nanjing are foundational to acupuncture, and that the course selects classical passages on channels and points, needling and moxibustion, and channel-based treatment, in order to teach acupuncture rules, channel-point theory, and principles of pattern-based treatment. Course requirements include reinforcing and reducing methods such as meeting and following, layered insertion, lifting-thrusting, and treatment according to vacuity, repletion, cold and heat, as well as the root-branch, cutaneous region and point theories. The first-party platform page was opened in this pass. The current term runs from 21 July 2026 to 20 January 2027 and is marked as in progress, lasting 27 weeks, with enrolment recorded as 10,000+ and a page update date of 28 November 2026. No earlier term is given on the page, so the first-offering year is provisionally recorded as 2026. A second platform ID, 66205415bb5c5a8025652927, opened with the same content and is not catalogued separately."

course-shutcm-orthopedics:
  summary_en: "Shanghai University of Traditional Chinese Medicine open course TCM Traumatology and Orthopedics, taught by Zhan Hongsheng, Zhang Hu, Shi Ying and Zheng Yuxin. It is offered on the People's Medical Publishing House MOOC platform and recorded on the National Higher Education Smart Education Platform. The official page describes the subject as a clinical course on injuries of sinew, bone, joint, flesh, qi and blood, channels and zang-fu, taught through 50 micro-lecture topics that cover basic knowledge and skills for bone-injury clinicians, practical techniques for primary care, and sinew-and-bone health methods. The posted topic list includes basic manipulation, sinew-regulating and spinal reduction, specialist examination, traction and exercise therapy, the Shi-school sinew-strengthening practice, splint and plaster fixation, imaging basics, and common conditions such as fracture, dislocation, cervical spondylosis, frozen shoulder, disc herniation, knee osteoarthritis and osteoporosis. The first-party platform page was opened in this pass. The current term runs from 15 September 2026 to 25 December 2026 and is marked as in progress, lasting 15 weeks, with enrolment recorded as 10,000+ and a page update date of 28 November 2026. No earlier term is given on the page, so the first-offering year is provisionally recorded as 2026. It is distinct from the already catalogued Beijing University of Chinese Medicine course of the same title taught by Xu Lin."

course-shutcm-daoyin:
  summary_en: "Shanghai University of Traditional Chinese Medicine open course TCM Daoyin and Yijinjing, taught by Sun Pingping, national-level representative inheritor Yan Weibing, Yan Shiqing, Luo Congfeng, Liu Lingshuang, Li Dianyou and Wang Xingyi. It is offered on Zhihuishu and recorded on the National Higher Education Smart Education Platform. The official page states that Yan Weibing is the principal lecturer, and that the twelve-posture ancient Yijinjing daoyin method comes from classical daoyin medicine, with the TCM view of life as its core theory; it entered the national intangible cultural heritage list for traditional medicine in 2014. The outline covers historical sources and basic theory, transmission and practice of the twelve postures, and clinical applications in Parkinson disease, tumour rehabilitation, stroke and chronic fatigue syndrome, as well as a comparison with modern exercise. The first-party platform page was opened in this pass. The current term runs from 21 July 2026 to 20 January 2027 and is marked as in progress, lasting 27 weeks, with enrolment recorded as 10,000+ and a page update date of 27 November 2026. No earlier term is given on the page, so the first-offering year is provisionally recorded as 2026. It is a formal university series, distinct from the already catalogued Fujian University of Chinese Medicine course on Yijinjing taught by Yan Xinghui."

course-hbucm-shanghan:
  summary_en: "Hubei University of Chinese Medicine open course Treatise on Cold Damage (Shanghan Lun), taught by Li Jiageng, Mei Guoqiang, Cheng Zhaoren, Qiu Mingyi, Liu Songlin, Fan Xun, Tao Chunhui, Jiang Yuewen, Chen Yu, Yue Yingying, Xu Lesi and Wang Huiru. It is offered on Zhihuishu and recorded on the National Higher Education Smart Education Platform. The official page describes the Shanghan Lun as one of the four great TCM classics and the earliest extant monograph on pattern differentiation and treatment, and a core required course; the school's Shanghan discipline is a State Administration of TCM bureau-level key discipline and the course is a provincial quality course. The outline runs from an introduction through the six-channel pattern chapters and then sudden turmoil and yin-yang exchange / relapse after recovery, with representative clauses and formulas such as Guizhi Tang, Mahuang Tang, Baihu Jia Renshen Tang, Da Chengqi Tang, Xiao Chaihu Tang, Sini Tang and Wumei Wan. The first-party platform page was opened in this pass. The current term runs from 21 July 2026 to 20 January 2027 and is marked as in progress, lasting 27 weeks, with enrolment recorded as 20,000+ and a page update date of 28 November 2026. No earlier term is given on the page, so the first-offering year is provisionally recorded as 2026. It is distinct from the already catalogued Nanjing University of Chinese Medicine Shanghan Lun course taught by Ling Yun. A second platform ID, 64388557af1f1b5d3ed14f2e, opened with the same content and is not catalogued separately."

course-lnutcm-formula:
  summary_en: "Liaoning University of Traditional Chinese Medicine open course Formulas of Chinese Medicine (Fangjixue), taught by Zhang Lin, Fan Ying, Li Ran, Zhang Hongmei, Lu Jian, Zi Hui, Yu Caina, Liu Qian, Ao Yuhan, Wang Jiaran and Zhang Zhan. It is offered on Xueyin Online and recorded on the National Higher Education Smart Education Platform. The official page describes formulas as a foundational and bridge course between herbal medicine and clinical practice, covering composition principles and modifications, and the ingredients, usage, actions, indications, mechanisms, analysis, combination features and comparative identification of commonly used formulas. The posted chapters include introduction and the standard formula classes (exterior-releasing, draining-downward, harmonising, heat-clearing, interior-warming, supplementation, astringing, spirit-calming, orifice-opening, qi- and blood-regulating, wind-treating, dryness-treating, damp-dispelling, phlegm-dispelling, food-dispersing and welling-abscess formulas), with representative prescriptions such as Mahuang Tang, Guizhi Tang, Da Chengqi Tang, Xiao Chaihu Tang, Sijunzi Tang, Siwu Tang and Xuefu Zhuyu Tang. The first-party platform page was opened in this pass. The current term runs from 28 August 2026 to 28 February 2027 and is marked as in progress, lasting 27 weeks, with enrolment recorded as 10,000+ and a page update date of 26 November 2026. No earlier term is given on the page, so the first-offering year is provisionally recorded as 2026. It is distinct from the already catalogued formula courses at Guangzhou and Zhejiang Universities of Chinese Medicine."

course-hnucm-diagnostics:
  summary_en: "Hunan University of Chinese Medicine open course Diagnostics of Traditional Chinese Medicine, taught by Hu Zhixi, Liu Wanghua, Jian Weixiong, Li Lin, Liang Hao, Li Jinxia, Ling Zhi, Du Jia, Zeng Yidi, Xiong Guanghua, Xiang Ming, Xiao Li, Xia Shuaishuai, Wei Jiaming, Wu Zixuan and Yu Yunfeng. It is offered on Zhihuishu and recorded on the National Higher Education Smart Education Platform. The first-party national platform page was opened in this pass. The current term runs from 1 August 2026 to 31 December 2026 and is marked as in progress, lasting 22 weeks, with enrolment recorded as 20,000+ and a page update date of 15 September 2026. The national platform page does not give an earlier term or a long course-description text that could be excerpted in this pass. The same school, title and lead teacher Hu Zhixi also have a Chinese University MOOC page (HNZYYDX-1207451802), which was opened tonight (HTTP 200); its term list begins on 25 December 2019 and still ends with 11 March to 31 May 2022, with no current term. That MOOC record had previously been held back for lack of a current term. Because a verifiable 2026 term is now open on Zhihuishu and the national platform, the course is accepted here. The first-offering year is recorded as 2019 from the opened MOOC term list. It is distinct from the already catalogued diagnostics courses at Beijing, Nanjing, Henan and Zhejiang Universities of Chinese Medicine, and from the leftover Gansu course taught by Wan Shengfang."

course-hbnu-shanghan:
  summary_en: "Hebei North University open course Treatise on Cold Damage (Shanghan Lun), taught by Wang Ying, Zhang Yongpeng, Li Gang, Jin Guoyin, Zhao Hongzhao and Zhao Kun. It is offered on Xueyin Online and recorded on the National Higher Education Smart Education Platform. The official page states that the course covers an introduction plus the six-channel diseases, sudden turmoil, and yin-yang exchange / relapse after recovery: the introduction treats the status, formation and development of the Shanghan Lun, its relation to the Neijing, Jingui Yaolue and warm-disease studies, and the meaning, etiology, transmission and treatment principles of cold damage; chapters 1 to 8 then teach the pattern system and representative formula-patterns. It is intended for TCM students, clinicians and general learners. The first-party platform page was opened in this pass. The current term runs from 24 October 2026 to 1 January 2027 and is marked as in progress, lasting 10 weeks, with enrolment recorded as 1,000+ and a page update date of 26 November 2026. No earlier term is given on the page, so the first-offering year is provisionally recorded as 2026. It is a formal undergraduate classic course at a public university, distinct from the Nanjing and Hubei Shanghan Lun courses."

person-zhaxi-dongzhu:
  name_en: "Zhaxi Dongzhu"
  summary_en: "Xining. Professor at the Tibetan Medicine College of Qinghai University. The official faculty page states that Zhaxi Dongzhu is a Tibetan man born in 1982, with a doctorate, and is a professor. The education section lists a bachelor’s degree from Qinghai Medical College in 2003, a master’s degree from Qinghai University Medical College in 2006 and a medical doctorate from the same college in 2014. The work history states that he became deputy director of the Tibetan medicine outpatient clinic at Qinghai University Affiliated Hospital in 2014 and director in 2017, and that he is a member of the Qinghai Tibetan Medicine Association and of its Tibetan–Western medicine committee. The teaching section states that he teaches core undergraduate courses including an introduction to Tibetan medicine, Tibetan medical anatomy, preventive health care and mind–body theory, and has supervised 92 bachelor’s students. The page is dated 21 May 2017. The official personal page was opened in this pass."
  orgs_en: "['Tibetan Medicine College, Qinghai University']"

person-ziba:
  name_en: "Ziba"
  summary_en: "Xining. Professor at the Tibetan Medicine College of Qinghai University and director of the college’s comprehensive Tibetan medicine laboratory. The official faculty page states that Ziba is a Tibetan man from Jianzha, Qinghai, born in June 1967, and is a member of the Qinghai Tibetan Medicine Association. The education section records study at the Tibet College of Tibetan Medicine in Lhasa in 1992–1993, later Tibetan-medicine study at Qinghai Medical College, and a 2007 training stay at the Arura Tibetan medicine centre in Japan. The work history states that he has taught in the Tibetan medicine department of Qinghai Medical College since April 1998. The teaching section lists courses in Tibetan medical pharmacology, formulae and medicinal botany, plus field identification practice. The page is dated 21 May 2017. The official personal page was opened in this pass."
  orgs_en: "['Tibetan Medicine College, Qinghai University']"

person-qieyang-rangzhong:
  name_en: "Qieyang Rangzhong"
  summary_en: "Xining. Professor at the Tibetan Medicine College of Qinghai University. The official faculty page states that Qieyang Rangzhong is a Tibetan man from Guide County, Qinghai, born in December 1982, and holds a medical doctorate. The education section lists a bachelor’s degree from Qinghai Medical College (2001–2005), a master’s degree from the Tibetan Medicine College of Qinghai University (2007–2010), a visiting period at the West China School of Pharmacy, Sichuan University (2010–2011), and a doctorate in ethnomedicine (Tibetan medicine and pharmacy) at Qinghai University (2011–2015), including related doctoral courses at Beijing University of Chinese Medicine. The work history states that he has worked at the college since September 2005. Courses listed include Tibetan herbal formulae, processing, pharmacology, medical history, Sanskrit and Tibetan psychiatry. The page is dated 21 May 2017. The official personal page was opened in this pass."
  orgs_en: "['Tibetan Medicine College, Qinghai University']"

person-gongque-jianzan:
  name_en: "Kunchok Gyaltsen"
  summary_en: "Xining. Associate professor and master’s and doctoral supervisor at the Tibetan Medicine College of Qinghai University. The official faculty page states that Gongque Jianzan (papers on the page also give the English name Kunchok Gyaltsen) is a Tibetan man born in 1965 who holds a US doctorate. The education section lists an MPH from Mahidol University (2000), an MIIM from the School for International Training in Vermont (2001) and a PhD from the UCLA School of Public Health (2010). The work history states that he was president of the Kumbum (Tar) Monastery Tibetan Hospital in Qinghai in 2001–2005; has worked at the Qinghai University Tibetan Medicine College since September 2010; has been project director at the Arura Tibetan Medical and Cultural Centre since 2010; and has taught an elective on Tibetan medicine and life-nurturing at the University of Virginia since 2014. The teaching section states that since September 2010 he has taught master’s and doctoral courses including monographic lectures on Tibetan life-nurturing, Sanskrit, research design and Tibetan dietetics. The page is dated 21 May 2017. The official personal page was opened in this pass."
  orgs_en: "['Tibetan Medicine College, Qinghai University']"

person-renqing-duojie:
  name_en: "Renqing Duojie"
  summary_en: "Xining. Associate professor at the Tibetan Medicine College of Qinghai University. The official faculty page states that Renqing Duojie is a Tibetan man born in 1987, with a doctorate, and is a member of a Qinghai “Thousand Talents” training team on Tibetan medicine for major diseases. It records visiting appointments at the UCLA School of Public Health, the University of Virginia School of Medicine, the Institute of Medical Humanities at Peking University Health Science Center, and the China Institute for History of Medicine and Medical Literature, China Academy of Chinese Medical Sciences. The education section lists bachelor’s, master’s and doctoral degrees completed at Qinghai University (2005–2016). The work history states that he has taught in the basic-theory department since September 2016 and serves as secretary of the teaching-management office for textbook translation. Undergraduate courses listed include the history of Tibetan medicine, anatomy and pathogenesis. The page is dated 21 May 2017. This is not the same person as the catalogue entry person-duojie (Duojie). The official personal page was opened in this pass."
  orgs_en: "['Tibetan Medicine College, Qinghai University']"

person-jiaobajia:
  name_en: "Jiaobajia"
  summary_en: "Xining. Associate professor at the Tibetan Medicine College of Qinghai University. The official faculty page states that Jiaobajia is a Tibetan man from Jianzha County, Qinghai, born in April 1979, and holds a medical doctorate. The education section lists a bachelor’s degree from Qinghai Medical College (1998–2003), a master’s degree from the Tibetan Medicine College of Qinghai University (2006–2009), a visiting period at West China Medical Center, Sichuan University (2008–2009), and a doctorate in ethnomedicine (Tibetan medicine and pharmacy) at Qinghai University (2012–2016), including related doctoral courses at Beijing University of Chinese Medicine. The work history states that he has worked at the college since July 2003. Courses listed include Tibetan medical anatomy, calendrical astronomy, therapeutics, medical history, Sanskrit and Tibetan psychiatry. The page is dated 21 May 2017. The official personal page was opened in this pass."
  orgs_en: "['Tibetan Medicine College, Qinghai University']"

person-zhao-chengzhou:
  name_en: "Zhao Chengzhou"
  summary_en: "Xining. Faculty member at the Tibetan Medicine College of Qinghai University. The official personal page’s opening line states that Zhao Chengzhou is a Han Chinese man born in 1986, with a doctorate, and is an associate professor. The education section lists a bachelor’s degree from Southwest Minzu University (2006–2010) and a combined master’s–doctoral programme in botany at Lanzhou University (2010–2016). The work-history line states: “September 2016 to present, Tibetan Medicine College of Qinghai University, lecturer.” The teaching section states that he teaches medicinal botany, biochemistry and molecular biology to undergraduates. The opening rank and the work-history rank are inconsistent; both wordings are recorded as they appear, without inferring which is current. The page is dated 21 May 2017. The official personal page was opened in this pass."
  orgs_en: "['Tibetan Medicine College, Qinghai University']"

person-niangquxian:
  name_en: "Niangquxian"
  summary_en: "Xining. Associate professor at the Tibetan Medicine College of Qinghai University. The official faculty page states that Niangquxian is from Gannan, Gansu, is a Communist Party member, and holds a medical doctorate. It states that he completed his bachelor’s, master’s and doctoral degrees at the Tibetan Medicine College of Gansu University of Chinese Medicine, Tibet University of Tibetan Medicine and the Tibetan Medicine College of Qinghai University respectively; worked as a Tibetan-medicine general practitioner at the grassroots level from 2013 to 2021; joined the Qinghai University college in September 2021; and was named a top talent under Qinghai’s Kunlun Talent programme for high-end innovation and entrepreneurship in 2021. The page records four papers in core journals including China Tibetology and World Science and Technology—Modernization of Traditional Chinese Medicine. The page is dated 1 June 2023. The official personal page was opened in this pass."
  orgs_en: "['Tibetan Medicine College, Qinghai University']"

person-pucuo-duojie:
  name_en: "Pucuo Duojie"
  summary_en: "Xining. Associate professor, deputy chief physician and master’s supervisor at the Tibetan Medicine College of Qinghai University, and director of the college’s graduate education and discipline-construction office. The official faculty page states that Pucuo Duojie holds a doctorate and is a top talent under Qinghai’s Kunlun Talent programme. Research interests listed are core theories of Tibetan medical anatomy and internal medicine, distinctive external therapies, and textual and linguistic study of the Four Tantras (rGyud bzhi). The education and work history states that he completed bachelor’s, master’s and doctoral degrees at Qinghai University, was a visiting scholar at UCLA in 2012–2013, became a lecturer in December 2013 and has been an associate professor since December 2014. The page lists a National Social Science Fund project he leads on the phonological and lexical history of Tibetan based on versions of the Four Tantras (21XYY012, September 2021–December 2024). The page is dated 20 July 2023. This is not the same person as the catalogue entry person-duojie (Duojie). The official personal page was opened in this pass."
  orgs_en: "['Tibetan Medicine College, Qinghai University']"

person-suonan-caidan:
  name_en: "Suonan Caidan"
  summary_en: "Xining. Associate professor, Tibetan-medicine attending physician and master’s supervisor at the Tibetan Medicine College of Qinghai University. The official faculty page lists research interests in core Tibetan medical theory, medical history and literature, mechanisms by which endophytic bacteria promote plant growth, and Tibetan internal medicine. The education and work history states that he completed a bachelor’s degree in Tibetan medicine (Tibetan–Western integration), a master’s degree in ethnomedicine (Tibetan medicine) and a doctorate in ethnomedicine (Tibetan medicine and pharmacy) at Qinghai University between 2008 and 2019, and has been an associate professor at the college since September 2019. The page lists a Kunlun Talent introduced top-talent project he leads (December 2020–December 2023) and a Qinghai University youth research project on the Byang lugs (“Changdi”) school’s transmission and academic thought. Papers listed include studies of that school in China Tibetology and related journals. The page is dated 1 June 2023. The official personal page was opened in this pass."
  orgs_en: "['Tibetan Medicine College, Qinghai University']"

person-li-chengyi:
  name_en: "Li Chengyi"
  summary_en: "Lanzhou. Professor and doctoral and master’s supervisor at the School of Pharmacy, Gansu University of Chinese Medicine. The official faculty page states that he received a bachelor’s degree from Beijing College of Traditional Chinese Medicine in June 1987, joined the former Gansu College of TCM the same year, and was promoted to professor in 2002. Courses listed include Chinese materia medica identification and TCM Latin at undergraduate level, a monographic master’s course and a doctoral professional course in Chinese materia medica. His research focuses on variety and quality studies of Gansu genuine medicinal materials such as liquorice, hedysarum, codonopsis, angelica, isatis and daylily. The page states that he is a national TCM higher-education teaching master, lead of an SATCM key discipline in identification of Chinese materia medica, and a Gansu leading talent, and that the “Xuanfei Zhisou” mixture he helped develop was commercialised and included in the 2015 Chinese Pharmacopoeia. The page is dated 30 December 2021. The official personal page was opened in this pass."
  orgs_en: "['School of Pharmacy, Gansu University of Chinese Medicine']"

person-guo-mei:
  name_en: "Guo Mei"
  summary_en: "Lanzhou. Professor and doctoral supervisor at the School of Pharmacy, Gansu University of Chinese Medicine, and a deputy to the 13th National People’s Congress, according to the official faculty page. It states that she received a bachelor’s degree from the School of Pharmacy of Lanzhou University (then Lanzhou Medical College) in 1985 and a master’s degree in Chinese materia medica from Chengdu University of Traditional Chinese Medicine, and has worked at the institution since 1985. The page states that she is a Gansu leading talent (2010), lead of the provincial key discipline of Chinese materia medica and of an SATCM key discipline and grade-III laboratory in TCM chemistry, and that she has worked for 37 years on the material basis and quality control of Chinese and Tibetan medicines in northwest China. It records more than 20 master’s and doctoral graduates and more than 90 SCI or national-level papers. The page is dated 29 December 2021. The official personal page was opened in this pass."
  orgs_en: "['School of Pharmacy, Gansu University of Chinese Medicine']"

person-shao-jing:
  name_en: "Shao Jing"
  summary_en: "Lanzhou. Professor and doctoral supervisor at the School of Pharmacy, Gansu University of Chinese Medicine. The official faculty page states that Shao Jing holds a doctorate and is a provincial university teaching master, a Feitian Scholar (young scholar), and a first-prize winner of the Gansu university teaching-innovation contest. The page states that she is currently dean of the School of Pharmacy. It records 24 years of teaching TCM chemistry and TCM analysis, with research on the material basis, quality control and product development of Chinese medicines, and states that she leads a national first-class course in TCM chemistry and an SATCM key discipline in TCM chemistry. The page is dated 28 December 2021. The official page for Jin Ling, published the same day, also states that she is dean of the School of Pharmacy; both wordings are recorded as they appear, without inferring who currently holds the post. The official personal page was opened in this pass."
  orgs_en: "['School of Pharmacy, Gansu University of Chinese Medicine']"

person-ren-yuan:
  name_en: "Ren Yuan"
  summary_en: "Lanzhou. Professor and doctoral and master’s supervisor at the School of Pharmacy, Gansu University of Chinese Medicine. The official faculty page states that he received a bachelor’s degree from Lanzhou Medical College in 1984, joined the former Gansu College of TCM the same year as an assistant, and was promoted to lecturer in 1992, associate professor in 1998 and professor in 2003. Courses listed include pharmacology, drug toxicology and safety evaluation, and a monographic course in Chinese-medicine pharmacology. His research is described as Chinese-medicine pharmacology and toxicology, and the page records Gansu science and technology progress awards (second and third class) and a China Association of Chinese Medicine science and technology award (third class). The page is dated 28 December 2021. The official personal page was opened in this pass."
  orgs_en: "['School of Pharmacy, Gansu University of Chinese Medicine']"

person-wei-shuchang:
  name_en: "Wei Shuchang"
  summary_en: "Lanzhou. Professor and doctoral and master’s supervisor at the School of Pharmacy, Gansu University of Chinese Medicine, and director of the Gansu Engineering Research Center for TCM Pharmaceutical Technology, according to the official faculty page. It also records membership of the World Federation of Chinese Medicine Societies transdermal-delivery committee. Courses listed include TCM pharmaceutical technology, physical pharmacy, pharmaceutical-engineering design, pharmaceutical polymers, new TCM manufacturing technologies, new dosage-form design, and biopharmaceutics and pharmacokinetics. The page states that he works on new TCM manufacturing technologies, new dosage forms and industrial translation, has led three National Natural Science Foundation projects and 14 provincial or ministerial projects, published more than 60 papers as first or corresponding author, and holds six invention patents. The page is dated 28 December 2021. The official personal page was opened in this pass."
  orgs_en: "['School of Pharmacy, Gansu University of Chinese Medicine']"

person-jin-ling:
  name_en: "Jin Ling"
  summary_en: "Lanzhou. Professor and doctoral and master’s supervisor at the School of Pharmacy, Gansu University of Chinese Medicine. The official faculty page states that Jin Ling holds a doctorate in science and is a Feitian Scholar distinguished professor, a Gansu teaching master and dean of the School of Pharmacy. She teaches medicinal botany and Chinese medicinal resources, and the page states that she is vice-chair of the national teaching-steering committee’s medicinal-botany course alliance, technical lead for Gansu in the fourth national survey of Chinese medicinal resources, director of the university’s Chinese (Tibetan) medicinal resources institute, and director of the Gansu provincial centre for TCM raw-material quality and technical services. Her stated strengths are development of Gansu genuine medicinal materials such as angelica and rhubarb, and assessment and conservation of rare Chinese and Tibetan medicinal resources. The page records eight monographs and more than 150 papers. It is dated 28 December 2021. The official page for Shao Jing, published the same day, also states that she is currently dean; both wordings are recorded as they appear. The official personal page was opened in this pass."
  orgs_en: "['School of Pharmacy, Gansu University of Chinese Medicine']"

person-deng-yi:
  name_en: "Deng Yi"
  summary_en: "Lanzhou. Professor and doctoral and master’s supervisor at the School of Pharmacy, Gansu University of Chinese Medicine. The official faculty page states that he is vice-chair of the Ministry of Education’s Chinese materia medica course alliance for pharmacy programmes, a member of the corresponding core-course alliance for Chinese medicine programmes, and a standing member of several China Association of Chinese Medicine committees, as well as a director of the World Federation of Chinese Medicine Societies and vice-chair and secretary-general of its Dunhuang medicine research and cultural-transmission committee. The page states that he has undertaken undergraduate teaching and research for 35 years and has edited or contributed to planning textbooks from the 12th to the 14th Five-Year periods, including Chinese Materia Medica, Clinical Chinese Materia Medica, Chinese Patent Medicines, and Processing and Care of Chinese Medicinal Materials. The page is dated 27 December 2021. The official personal page was opened in this pass."
  orgs_en: "['School of Pharmacy, Gansu University of Chinese Medicine']"

person-wang-yinquan:
  name_en: "Wang Yinquan"
  summary_en: "Lanzhou. Professor and doctoral and master’s supervisor at the School of Pharmacy, Gansu University of Chinese Medicine. The official faculty page states that he received a bachelor’s degree from Gansu Agricultural University in 1986 and a doctorate from the same university in 2005, and was promoted to professor in 2018. Courses listed include basic biochemistry, soil fertiliser science, soil science, and research thinking and methodology. The page records eight completed research projects, three national invention patents, more than 120 journal papers (20 indexed in SCI) and service as associate editor or contributor on four monographs and three textbooks. The page is dated 27 December 2021. The official personal page was opened in this pass."
  orgs_en: "['School of Pharmacy, Gansu University of Chinese Medicine']"

person-di-duolong:
  name_en: "Di Duolong"
  summary_en: "Lanzhou. The official doctoral-supervisor page of the School of Pharmacy, Gansu University of Chinese Medicine, states that Di Duolong holds a doctorate and is a grade-II research fellow / professor and a doctoral and master’s supervisor. It describes him as a CAS Hundred Talents scholar and distinguished research fellow, a recipient of a State Council special government allowance, and director of the CAS Key Laboratory of Chemistry of Northwestern Plant Resources, of a national–local joint engineering research centre for high-value use of distinctive medicinal plants, and of the Gansu Key Laboratory of Natural Medicines. The page also states that he is a professor at the University of Chinese Academy of Sciences and an adjunct professor at Lanzhou University, Gansu University of Chinese Medicine and Ningbo University. Research areas listed are new methods for separating and analysing complex systems and discovery of drug molecules based on traditional Chinese medicine effects. The page records nearly 300 papers, more than 70 Chinese invention-patent applications (18 granted) and first-completer provincial science and technology progress awards of first, second and third class. The page is dated 26 December 2021. The official personal page was opened in this pass."
  orgs_en: "['School of Pharmacy, Gansu University of Chinese Medicine', 'CAS Key Laboratory of Chemistry of Northwestern Plant Resources']"

person-li-yuefeng:
  name_en: "Li Yuefeng"
  summary_en: "Lanzhou. Professor, doctoral supervisor and postdoctoral co-supervisor at the School of Pharmacy, Gansu University of Chinese Medicine, and director of the university’s research and experiment centre, according to the official faculty page. It states that she holds a doctorate in Chinese materia medica and completed a postdoctoral fellowship, and is a Gansu top leading talent, a Feitian Scholar (young scholar) and a Gansu teaching master. The page records a secondment as vice-head of Wudu District, Longnan, in 2015–2017, and roles including expert for the 2020 Chinese Pharmacopoeia decoction-piece standards and vice-chair of the China Association of Chinese Medicine processing committee. It states that she has led five National Natural Science Foundation projects and more than 40 other major projects, leads the provincial first-class course and teaching team in Chinese medicine processing, and has published more than 400 papers as first or corresponding author, plus one national standard, four association standards, four provincial standards and ten invention patents. The page is dated 26 December 2021. The official personal page was opened in this pass."
  orgs_en: "['School of Pharmacy, Gansu University of Chinese Medicine']"

ds-tcmnp:
  name_en: "TCMNP (tcmnetpharma runtime dataset)"
  summary_en: "Runtime dataset for the tcmnetpharma R package (TCMNP v1.3.0). The official Zenodo record, opened in this pass, is titled “tcmnetpharma runtime dataset: multi-source Traditional Chinese Medicine network pharmacology data (TCMNP v1.3.0)”, marked Published October 27, 2026, Version 1.3.0, with creator Zheng, JianXiao of the Haihe Laboratory of Modern Chinese Medicine, Tianjin University of Traditional Chinese Medicine. DataCite confirms DOI 10.5281/zenodo.23681367, Issued 2026-10-27. The record states that data version TCMNP_1.3.0 (2026-10-21) provides 19 Apache Parquet tables used by the package; integrates TCMSP, HERB 2.0, BATMAN-TCM 2.0, ETCM2, ChEMBL 37, STRING 12, TRRUST v2, Open Targets Platform 25.06 and SymMap V2; uses the 2025 Chinese Pharmacopoeia only as a nomenclature and property reference and does not redistribute it; and includes a standardised herb–molecule–target table of 16,269,134 rows and 33 columns. The licence is CC BY-NC-SA 4.0. This is a new compiled runtime dataset, not a version update of an existing catalogue dataset. A Hugging Face mirror and the DataCite API were also checked."
  orgs_en: "['Haihe Laboratory of Modern Chinese Medicine, Tianjin University of Traditional Chinese Medicine']"

hf-deeppulse:
  name_en: "DeepPulse (深度把脉)"
  summary_en: "Open-source Traditional Chinese Medicine large-model series from 心语心言 (PneumaAI). The official Hugging Face model pages and README files for PneumaAI/DeepPulse-80B-Instruct-V0.1 and PneumaAI/DeepPulse-80B-Thinking-V0.1 were opened in this pass. The model card states that DeepPulse (深度把脉) is the core release of that series, is fine-tuned from Qwen3-Next-80B on a self-built high-quality TCM clinical dataset, and is licensed under Apache-2.0. Two versions are described: Thinking-V0.1, aimed at complex clinical reasoning and assisted diagnosis, and Instruct-V0.1, aimed at TCM instruction following and question answering. The card’s MedBench TCM-5CEval comparison table gives a release date of 23 December 2025 and organisation/team name 心语心言, with total scores of 71.3 (Thinking, first in the table) and 66.2 (Instruct, sixth). The Hugging Face API reports createdAt 24 December 2025 and lastModified 25 December 2025 for the Instruct repo. This is a distinct official TCM model project, not a quantized or ordinary fine-tuned derivative of a model already in the catalogue. GGUF quantizations were not added as separate items."
  orgs_en: "['心语心言', 'PneumaAI']"
