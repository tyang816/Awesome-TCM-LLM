news-202611-ciie-qiyuan:
  summary_en: China News Service reported on 9 November 2026 that Shanghai Seventh People's Hospital made its first CIIE appearance and presented the Qiyuan TCM model, along with an AI face-diagnosis agent and the teaching robot Xiaoqi. Qiyuan was already released in July 2026; this item covers the exhibition, not a first launch.
news-202611-tcm-best4sdt-scidata:
  summary_en: Wenge announced on 5 November 2026 that TCM-BEST4SDT, a Bianzheng Lunzhi evaluation benchmark built with the China Academy of Chinese Medical Sciences, was published online in Scientific Data. The report describes 600 samples and 27 dimensions, with data and code released. This catalog already lists the benchmark; this entry is the publication notice.
news-202611-tcmqa-release:
  summary_en: Beijing News, carrying a 5 November 2026 report, said the fifth Wenzhi TCM clinical conference in Shenzhen on 1 November formally released TCMQA, a 38,279-item exam-style benchmark with a licensed-physician baseline. Materials are on Hugging Face. This catalog already lists the benchmark; this entry is the release notice. The report does not equate exam scores with clinical bianzheng skill.
news-202610-yiqi-ondevice:
  summary_en: Ifeng Finance reported on 31 October 2026 that Tianji Yiqi said its on-device model Yiqi TCM AI finished debugging and went live on 27 October, and can run fully offline for constitution assessment and similar uses. This is a company release reprinted by media; this page has not independently verified clinical effects or deployment scale. The model is not the ETCM herbal database.
news-202610-sichuan-15th-plan:
  summary_en: Sichuan Observation reported on 20 October 2026 that the province issued its 15th Five-Year TCM development plan, calling for TCM digital platforms, large models for renowned-physician intelligent diagnosis, grassroots decision-support pilots, and high-quality datasets. This is a planning document, not a model launch.
news-202610-xiaohuangqi:
  summary_en: Zhitong Finance reported on 21 October 2026 that Yidu Technology launched the evidence-based TCM agent Xiaohuangqi at the 2026 World Traditional Medicine Conference, covering guideline retrieval, assisted bianzheng, formula lookup and term translation, with answers said to cite sources. Item counts and hospital use come from the company and have not been independently verified here.
news-202610-fan-jiping-twin:
  summary_en: A 19 October 2026 Phoenix Tech reprint said Transn Suwen and Mingyi Online jointly released a Fan Jiping digital twin on 18 October at the World Traditional Medicine Conference, built on Transn's Suwen TCM model from cases and teaching materials. This is a single-physician twin launch; the report does not present independently verified clinical trial results.
news-202610-wtmc-exhibits:
  summary_en: Guang'anmen Hospital reported on 24 October 2026 on TCM AI exhibits at the 17-18 October World Traditional Medicine Conference, including Guangyi Qizhi, Hangzhou Hospital of TCM's embodied robot Xiao'an, and Zhongke Yunzhen's Miaowu Qihuang. Visit counts and agreement rates in the report come from exhibitors and should not be read as formal benchmark results.
news-202609-xuan-guowei-model:
  summary_en: Dayoo reported on 22 September 2026 that Guangdong Provincial Hospital of Chinese Medicine presented its veteran-physician model matrix at the second Guangdong AI application conference, saying the Xuan Guowei dermatology model had been in use since June 2025. Figures such as "over 95% accuracy" and 2,917 assisted decisions come from the hospital and are not external trial results. The matrix launch was reported earlier.
news-202609-chongqing-digital-tcm:
  summary_en: China Traditional Chinese Medicine News reported on 30 September 2026 that a digital TCM and data-element pilot meeting was held in Chongqing on 20-21 September. The piece is a meeting round-up covering AI, data elements and application scenarios, not a new model debut.
news-202609-baiyi-twins:
  summary_en: Jiemian reported that on 15 September, at the seventh pavilion-exchange and TCM development conference in Hangzhou, Transn Suwen launched a Hundred Physicians Twin plan to build digital twins for 100 veteran TCM doctors on its Suwen model. This is a plan announcement; the report does not list a complete roster or independently verified agreement rates.
news-202505-huanshu:
  summary_en: Sichuan Online reported on 17 May 2025 that Chengdu Sport University and Zhongke Shiyu released the Huanshu sports-medicine TCM model and agent, aimed at competitive sport, public health and teaching, including exercise prescriptions and seasonal health plans. This page has not verified weights or a public API.
person-zhang-wei-cqctcm:
  summary_en: Associate professor in the Medical Informatics teaching group at Chongqing College of Traditional Chinese Medicine; teaches foundations of TCM AI and works on TCM knowledge graphs and large language models.
person-ye-huaqun:
  summary_en: Senior engineer in the Medical Informatics teaching group at Chongqing College of Traditional Chinese Medicine; teaches foundations of smart medical language, with research in TCM big data and intelligent information processing.
person-wang-qiujie:
  summary_en: Director of the Medical Informatics teaching group at Chongqing College of Traditional Chinese Medicine and a council member of the CACMS Information Society AI branch; teaches foundations of TCM AI and works on healthcare data analysis.
person-chen-hongkai:
  summary_en: Research Assistant Professor in Information Engineering at CUHK and a corresponding author of OpenTCM, a GraphRAG-based TCM knowledge retrieval and diagnosis system.
person-khoo-christopher:
  summary_en: Associate professor at NTU's Wee Kim Wee School of Communication and Information; leads the Polyglot Asian Medicine Knowledge Graph of traditional and herbal medicines in maritime Southeast Asia.
fu-tcm-27b:
  summary_en: A 27B multimodal TCM LLM from Fudan University and collaborators, trained with Bianzheng-Grounded Policy Optimization so that four-examination evidence, intermediate bianzheng fields, and syndrome labels are explicit targets. Twelve Apache-2.0 BF16 shards are on Hugging Face; accuracy figures are author-reported.
fu-tcm-bgpo-paper:
  summary_en: Paper introducing the Fu-TCM multimodal diagnostic-reasoning framework and Bianzheng-Grounded Policy Optimization. The authors report that Fu-TCM-27B leads six TCM text, vision, and syndrome-differentiation benchmarks on macro-average accuracy. The internally built Fu-bianzheng and related benches are not independently released.
chattcm-yuan2025:
  summary_en: Yuan et al. present a TCM QA method that fine-tunes an LLM and couples it with a textbook-derived knowledge graph and chain-of-thought interaction. This is a distinct publication from the existing SylvanL/ChatTCM weights. BLEU, ROUGE, and accuracy figures are author-reported.
tcm-evidence-kg-llm:
  summary_en: Zhang, Wen, and colleagues propose a knowledge-graph and LLM method for structuring, grading, and dynamically updating multi-source TCM evidence in a digital evidence-based-medicine setting, with a feasibility check on an existing evidence-ecosystem platform.
surv-chen2025-pumch:
  summary_en: A 2025 review in Medical Journal of Peking Union Medical College Hospital on LLM applications in TCM diagnosis, consultation, and formula research, together with challenges in values and misuse, interpretability, technical gaps, and regulatory access.
surv-yang2025-outlook:
  summary_en: Yang, Zhu, and colleagues review medical LLMs and discuss potential TCM uses in research, knowledge mining, and assisted diagnosis, along with risks, countermeasures, and future directions.
surv-ye2025-inheritance:
  summary_en: A November 2025 online-first Chinese review of LLMs for TCM inheritance, covering data mining, clinical decision support, and cultural transmission, plus challenges and outlook. The journal page does not provide a DOI.
surv-xiao2024-zcy:
  summary_en: A 2024 monograph-style review in Chinese Traditional and Herbal Drugs on data handling, RAG, mixture of experts, RLHF, distillation, and training or evaluation methods for TCM LLMs, with construction strategies and application scenarios.
surv-liu2025-std-gai:
  summary_en: A 2025 review in Shanghai Journal of Traditional Chinese Medicine on generative AI for TCM standardization, covering health services, quality improvement, information management, and intelligent diagnosis, plus prospects and challenges.
ds-dragontcm:
  summary_en: A TCM knowledge base derived from American Dragon and Penner’s work. The card reports 1,119 conditions, 2,580 formulas, 1,044 herbs, and 28,735 relations. The authors note automatic AI parsing may introduce inaccuracies; license is CC-BY-NC-4.0.
ds-polyglot-medicine-kg:
  summary_en: A 2023 public knowledge-graph portal of Asian traditional and herbal medicines, currently focused on Chinese materia medica and expanding to Malay and Southeast Asian drugs, linking names, scientific names, plant parts, textual sources, and geography.

news-202611-tcm-tk-ordinance:
  summary_en: Xinhua reported from Beijing on 9 November 2026 that Premier Li Qiang signed a State Council decree (Guo Ling No. 850) promulgating the Regulation on the Protection of Traditional Chinese Medicine Traditional Knowledge. The regulation has 32 articles, including a protection database and a protection list, and takes effect on 1 January 2027.
news-202609-classic-industries-opinion:
  summary_en: MIIT and five other departments issued document 204 of 2026 on 7 September 2026, listing Chinese materia medica among historical classic industries and calling for an AI empowerment guide, high-quality datasets, large-model analysis of traditional crafts, smart pharmacies, and industrial process knowledge graphs.
news-202610-shuxiaohe:
  summary_en: A Beijing Daily report carried on 27 October 2026 by the Beijing science and technology portal said that on 18 October, at the Beijing outcomes session of the 2026 World Traditional Medicine Conference, the Beijing Digital TCM Industry Development Institute released the agent Shu Xiaohe, using local compute and a self-owned knowledge base for Chinese and English TCM services.
news-202407-digital-tcm-opinion:
  summary_en: The National Administration of Traditional Chinese Medicine and the National Data Administration issued document 6 of 2024 on promoting digital TCM, including data-element development, TCM large models, and smart services. The document is dated 19 July 2024.
news-202607-digital-tcm-forum:
  summary_en: A China Women's News report carried on 6 July 2026 by the Beijing Municipal Health Commission said the Digital TCM Forum of the 2026 Global Digital Economy Conference was held in Beijing on 3 July. The forum released agent technical requirements and related standards, 16 digital TCM application cases, and launched the Beijing TCM track of the Data Element competition.
surv-wang2026-tcm-rd-ai:
  summary_en: A review published on 8 January 2026 in Chinese Medicine by Wang, Luo, and colleagues on the development and application of AI in TCM research and development, covering drug design, manufacturing, and market access, plus limitations and future directions.
graphrag-tcm:
  summary_en: Wang, Ren, and colleagues present a hybrid retrieval-augmented generation system for TCM clinical decision support at ISBCB 2026, combining vector retrieval, lexical retrieval, and knowledge-graph traversal. Title, authors, and DOI were verified via Crossref.
graphrag-or-ft-tcm:
  summary_en: Tong, Lin, and Cai compare GraphRAG over a manually extracted TCM knowledge graph with fine-tuning at ICIC 2026 (LNCS). Title, authors, and the 15 July 2026 online publication date were verified via Crossref.
tcm-sea:
  summary_en: Wang, Lin, and colleagues introduce TCM-MisDx, an 820-case interactive benchmark of consultations after failed treatment, and TCM-SEA, a self-evolving consultation agent. The authors report a composite score rise from 61.8 to 65.5 on a sealed test set and a lower therapeutic-momentum rate. Figures are author-reported; no independent dataset download is provided in the paper.
news-202607-national-15th-plan:
  summary_en: After State Council approval (Guo Han [2026] No. 71), the National Administration of Traditional Chinese Medicine and the National Development and Reform Commission issued the 15th Five-Year Plan for the Revitalization and Development of Traditional Chinese Medicine (Guo Zhongyiyao Guicai Fa [2026] No. 8) on 23 July 2026. The plan sets the goal that everyone should have access to TCM services by 2030 and lists ten priority tasks, including accelerating digital and intelligent empowerment and standards. The official Q&A states that AI and other new technologies should be used to mine and transmit the TCM heritage. This is a national five-year plan, not a product launch.
news-202607-tcm-qiangji-action:
  summary_en: Eleven ministries, led by the National Administration of Traditional Chinese Medicine, issued the TCM Action Plan under the Healthcare Strengthening Program (Guo Zhongyiyao Yizheng Fa [2026] No. 6; dated 11 July 2026 and posted on official sites on 28 July). The plan aims, by 2030, to complete a grassroots TCM service network and improve digital and intelligent conditions. Among seven actions, it calls for faster hospital informatization, continued development of smart TCM hospitals, and exploratory use of medical AI for assisted diagnosis in grassroots TCM services and the inheritance of renowned physicians' experience.
news-202611-shandong-15th-plan:
  summary_en: The People's Government of Shandong Province issued the Shandong 15th Five-Year Plan for TCM Development (Lu Zheng Fa [2026] No. 23; dated 23 October 2026 and published on 3 November). The plan adopts a 'six names and four modernizations' strategy, including making TCM smarter, and aims for universal access to TCM services by 2030. Official tasks include digitizing ancient texts, training talent in digital and intelligent applications, and promoting digital and intelligent empowerment of TCM. This is a provincial plan, not a model release.
acupuncturebench:
  summary_en: Tan Wenjun and colleagues at Northeastern University introduce AcupunctureBench, a multimodal benchmark for generative models in acupuncture, covering text, image, and video, with 58,526 questions and 1,216 video samples. The authors report evaluating 14 large language models, 14 large multimodal models, and 4 video foundation models, and they released a dedicated evaluation website. Counts and scores are author-reported. An anonymous, manually gated Hugging Face repository without a dataset card was not added as a separate public dataset.
alpha-tcm:
  summary_en: Liu and Wang propose a nine-layer TCM-oriented system architecture that keeps semantics, multimodal acquisition, quality, knowledge priors, probabilistic inference, longitudinal updating, decisions, language interaction, and human governance distinct, and they audit the knowledge-evidence interface of layers 1-5 on synthetic data. The authors state that this is a system-design contribution and a synthetic prototype; it does not validate TCM theory or support clinical diagnostic or treatment claims.
news-202611-guangdong-15th-plan:
  summary_en: The Guangdong Provincial Health Commission, the Guangdong Administration of Traditional Chinese Medicine, and the Guangdong Development and Reform Commission issued the Guangdong 15th Five-Year Plan for TCM Development (Yue Wei [2026] No. 4; dated 8 October 2026 and posted on the provincial TCM administration website on 2 November). The plan is framed around Western-Chinese collaboration, digital and intelligent transformation, and Guangdong-Hong Kong-Macao cooperation, and aims for universal access to quality TCM services by 2030. A dedicated chapter supports TCM large-model and agent development, high-quality datasets, digital platforms and knowledge graphs, and smart TCM hospitals. This is a provincial plan, not a model release.
news-202604-zhejiang-15th-plan:
  summary_en: The General Office of the People's Government of Zhejiang Province issued the Zhejiang 15th Five-Year Plan for TCM Development (Zhe Zheng Ban Fa [2026] No. 14, dated 24 April 2026). The plan aims, by 2030, to basically complete a pioneering province for TCM modernization with nationally leading TCM AI applications, and it coordinates service, industry, science and technology, talent, culture, governance, and digital-intelligence modernization. One headline indicator is that the share of TCM medical institutions applying medical large models should reach 100% by 2030, and the plan calls for Zhejiang to become an important source of TCM AI development. This is a provincial plan, not a model release.
news-202610-hunan-15th-plan:
  summary_en: The General Office of the People's Government of Hunan Province issued the Hunan 15th Five-Year Plan for TCM Development (Xiang Zheng Ban Fa [2026] No. 53, dated 9 October 2026). The plan aims for universal access to TCM services by 2030 and sets nine groups of tasks, including faster digital and intelligent empowerment of TCM, smart TCM hospitals, shared prescriptions and data connectivity, AI-assisted diagnosis and intelligent dispensing at the grassroots, and high-quality dataset development. The provincial TCM administration's official interpretation was posted on the Hunan government portal on 11 November 2026. This is a provincial plan, not a model release.
news-202610-hubei-15th-plan:
  summary_en: An official interpretation posted on 22 October 2026 by the Hubei Provincial Health Commission states that, with the consent of the provincial people's government, the provincial health commission, development and reform commission, and TCM administration jointly issued the Hubei 15th Five-Year Plan for TCM Development on 19 September 2026. The interpretation says the plan aims for universal access to TCM services by 2030 and includes digital-intelligence empowerment and standards, continuing smart-hospital construction, deeper use of data resources, and TCM artificial intelligence. The official interpretation page was opened in this pass; the plan-text link listed on the same site returned 404 and was not used as a source. This is a provincial plan, not a model release.
news-202610-grassroots-tcm-tech:
  summary_en: The General Department of the National Administration of Traditional Chinese Medicine and the General Office of the National Health Commission issued a notice on promoting grassroots TCM appropriate techniques (Guo Zhongyiyao Zong Yizheng Fa [2026] No. 8; dated 14 October 2026 and posted on the NATCM website and, via Xinhua, on the Chinese government portal on 28 October). The notice calls for a national-provincial-city-county promotion network, basically complete coverage of county promotion centers by 2030, and priority rollout of at least 15 techniques in six categories. It also sets out digital support for the work and exploratory use of AI tools for teaching, assisted diagnosis, and quality control. This is a grassroots service-capacity policy, not a product launch.
tcmaster:
  summary_en: Chen Zheng and colleagues at Tsinghua University, Beijing University of Chinese Medicine, and the Guangdong Provincial Laboratory of Traditional Chinese Medicine present TCMaster, a confidence-aware query and physical-design method for multi-source TCM knowledge graphs. The system integrates pharmacopoeias, prescriptions, molecular databases, and LLM-extracted micro-semantics into a property graph with about 221,000 entities and 723,000 base edges, and it rewrites Cypher queries under provenance-level edge confidence. The authors report retrieval speedups on Neo4j and a 20.0 percentage-point gain in TCMbench QA accuracy from graph retrieval. Scale and scores are author-reported.
news-202611-shanxi-15th-plan:
  summary_en: "The Shanxi Provincial Health Commission and the Shanxi Development and Reform Commission issued the Shanxi 15th Five-Year Plan for TCM Development (Jin Wei Zhongyiyao Keji Fa [2026] No. 3; dated 28 October 2026 and posted on the provincial health commission website on 3 November). The plan aims, by 2030, to make decisive progress toward a strong TCM province, using scientific innovation, digital-intelligence transformation, and TCM–Western collaboration to strengthen Shanxi’s TCM brand. A dedicated chapter supports digital-intelligence empowerment, including a trusted TCM data space and high-quality AI datasets, uses of multimodal large models in assisted decision-making, record quality control, inheritance of renowned physicians’ experience, and new-drug research, plus smart TCM hospitals and grassroots intelligent assisted diagnosis. The official full-text page was opened in this pass. This is a provincial plan, not a model release."
news-202610-fujian-herb-quality:
  summary_en: "Thirteen Fujian departments, led by the Provincial Health Commission and the Provincial TCM Administration, issued Several Measures on Improving the Quality of Chinese Medicines and Promoting High-Quality Development of the TCM Industry (Min Wei Gui [2026] No. 4; dated 15 October 2026, posted on the provincial health commission website on 26 October, and valid through 31 December 2030). The measures implement State Council General Office document No. 11 of 2025 and cover protection of Fujian geo-authentic herbs, standardized cultivation, industrial clusters, and TCM industry upgrading, including faster intelligent retrofitting of manufacturers, stepwise development of smart factories, and an informatized traceability system. The official webpage and the public PDF were opened in this pass. This is a provincial industry-quality policy, not a product launch."
course-bucm-tcm-basics:
  summary_en: "A China University MOOC course on Fundamental Theories of Traditional Chinese Medicine, taught by Ma Shuran of Beijing University of Chinese Medicine and aimed at TCM students and general learners. It covers yin-yang and the five phases, visceral manifestation and meridians, qi, blood and body fluids, etiology and pathogenesis, and treatment principles. The official course page was opened in this pass. The current term runs from 14 September 2026 to 20 January 2027; the platform also records an earlier offering from October 2019. This is a formal university open course, not a marketing clip."
course-bucm-tcm-intro:
  summary_en: "A China University MOOC introductory course on traditional Chinese medicine, taught by Wang Tong of Beijing University of Chinese Medicine. It introduces TCM through medical anecdotes, methods, theory, and practice. The official course page was opened in this pass. The current term runs from 28 September 2026 to 20 January 2027; the platform also records an earlier offering from October 2019. This is a formal university open course, not a marketing clip."
course-bucm-herb-safety:
  summary_en: "A China University MOOC course on the safe use of Chinese medicines, taught by Zhang Bing, Lin Zhijian, and Zhang Xiaomeng of Beijing University of Chinese Medicine. It covers pharmacovigilance, recognition of adverse reactions, and safety issues of commonly used Chinese patent medicines. The course description states that it was recognized as a 2017 national-level quality online open course. The official course page was opened in this pass. The current term runs from 7 September to 14 December 2026; the platform also records an earlier offering from October 2015. This is a formal university open course, not a marketing clip."
tonguenet:
  summary_en: "Yang, Dong, Lin, and corresponding author Lü propose TongueNet, a multimodal model that fuses tongue images with text for multi-label classification of disease nature and location. Training used 4,815 Roboflow-collected tongue images. The authors report 89.12% accuracy and an F1 of 48.07% for disease nature; the paper does not give a code repository. The Inner Mongolia Autonomous Region Hospital of Traditional Chinese Medicine, Inner Mongolia Medical University, and Inner Mongolia University should be distinguished."
hist-2010-drugcipher:
  summary_en: "Zhao and Li Shao present drugCIPHER, a 2010 general pharmacology framework that uses linear regression to relate drug-treatment and chemical similarity to proximity on a protein-interaction network and thereby infer targets at a genome-wide scale. Later TCM reviews cite the method. It should not be merged with TCMSP or the 2026 DeepTCM entry already in this catalog."
chen2025-tongue-analysis:
  summary_en: "Chen, Chen, Zhou, Zhu, He, and corresponding author Zhang present an integrated tongue-diagnosis system with acquisition hardware, semi-supervised segmentation, color correction, and feature classification, using 2,738 clinical cases. The authors report a Dice of 0.967 for U2net-MT tongue-body segmentation; the paper does not give a code repository, and training versus test image counts are not clearly stated. This is distinct from TongueNet and TongueDx/TongueDx2."
shi2023-tongue-lung-cancer:
  summary_en: "Shi and Guo (co-first), Chun, Liu, Liu, Tu, and corresponding author Xu build a lung-cancer risk model from TFDA-1 tongue images of 862 participants. With tongue images only, a random forest reached author-reported accuracy of 0.679±0.048 and AUC 0.752±0.051; the data are not public for project-confidentiality reasons. This should be kept distinct from other tongue-diagnosis entries and does not change the person page for Xu Jiatuo."
li2025-acugraph-protocol:
  summary_en: "Li, corresponding author Ahmad and colleagues publish a study protocol comparing Acugraph computer-aided point selection with manual point selection as an adjunct to physiotherapy for mild-to-moderate knee osteoarthritis. The planned sample is 50 patients and 12 sessions. This is a protocol, not trial results, and the paper reports no measured outcomes. The existing survey surv-acupoint-cad already warns against treating this paper as a completed trial."
lai2022-voice-constitution:
  summary_en: "Lai, Guan, Men, Shang, and corresponding author Zhang use 720 voice spectrograms from 48 participants and ResNet34 to distinguish qi-deficiency and balanced constitutions. The authors report 81.5% accuracy and an AUC of 0.85, and they point to code at GitHub GYT0704/Voice_Classification. This is distinct from voice-constitution-acoustic and constitution-tap."
liu2025-constitution-tongue:
  summary_en: "Liu and Fan (co-first) and corresponding author Zhang prospectively collect 1,374 tongue images at Dongzhimen and Guang’anmen Hospitals and fuse traditional and deep features to recognize five constitutions. Accuracy figures in the abstract and Table 5 are inconsistent in print, while the AUC values 0.948 and 0.898 appear in both places and should be recorded together. The paper does not give a code repository. This is distinct from TongueNet, chen2025-tongue-analysis, and other constitution entries."
ahn2025-tci-research-priorities:
  summary_en: "Ahn, Zhou, Jiang, Kerr, Zhu, Song, and joint senior author Rudan use the CHNRI method to have experts score research ideas in traditional, complementary, and integrative medicine, and they compare the list with ChatGPT-4o, Claude 3.5, and Grok 3. Fifty-three people responded, 34 scored, and 157 ideas were collected. This is a research-priority consensus, not a trial of efficacy."
dherbkb:
  summary_en: "Corresponding authors Wang and Chen and colleagues present DHerbKB, a knowledge base that combines chronic-kidney-disease dietary principles with information on toxic Chinese medicines and offers an online recommendation system. It includes nutrition data on 8,725 foods and several classes of toxic herbal items. A 128-session evaluation with non-specialist users is an author-reported usability check. The system is at https://dherbkb.hywanglab.org.cn/. The license is CC BY-NC-ND 4.0."
hist-2010-herb-network:
  summary_en: "Corresponding author Li Shao, with Zhang, Jiang, Wei, and Zhang, present DMIM, building a herb network from 3,865 collaterals-related formulas and discussing multi-layer co-modules with Liuwei Dihuang Wan as an example. In vitro tests report IC50 values of 3.2 μM for vitexicarpin and 3.4 μM for timosaponin A-III (author-reported). This should not be merged with the same-year drugCIPHER paper, TCMSP, HERB, or the 2026 DeepTCM entry. The Li Shao person page was not changed."
yu2025-ais-heat-syndrome:
  summary_en: "Yu, corresponding authors Zhu and Song and colleagues use a convolutional network on a 193-case large-artery atherosclerotic acute ischemic stroke cohort at Xuanwu Hospital, combining TCM syndrome features and laboratory values to predict heat versus non-heat syndrome. After dropping incomplete records, 123 cases remain. On the test set, combined features reach accuracy and F1 of 0.95; AUC is 0.91 in the text and 0.90 in Figure 3C. The authors describe this as a preliminary study. The data are not public, and no code is given. The license is CC BY."
shen2022-tcm-injection-mitotox:
  summary_en: "Shen, corresponding authors Feng and Ma and colleagues use a HepG2 glucose/galactose ATP assay and an HCT116 respiration-deficient proliferation assay to screen 35 TCM injections. Xiyanping, Dengzhanhuasu, Shuanghuanglian, and Yinzhihuang meet the authors’ mitochondrial-toxicity criteria, and rutin, baicalin, scutellarin, and forsythin are suggested as candidate constituents. This is an in-vitro screen, not a clinical trial. The license is CC BY."
park2026-tkm-omop:
  summary_en: "Park, corresponding author Lee and colleagues convert electronic records from Wonkwang University Gwangju Korean Medicine Hospital to OMOP CDM 5.3, producing the WKTKM resource of 88,449 patients and extending KIOM terminology for Korean-medicine-specific concepts. Patient data cannot be shared; ETL code is on GitHub and mapping rules are in the supplement. This is a methodological proof of concept, not an efficacy trial. The license is CC BY 4.0."
ruan2017-chinese-symptom-kb:
  summary_en: "Corresponding author Ruan and colleagues automatically build a Chinese symptom knowledge base from eight medical websites, three Chinese encyclopedias, and 250,000 electronic records from Shanghai Shuguang Hospital, and they link it to UMLS. The results section reports 135,485 entities and 26,821 symptoms (including 3,968 TCM symptoms); the conclusion writes 135,484. For the electronic-record CRF, only precision is given. The knowledge base was released as linked open data. The license is CC BY 4.0. A previously listed Datahub dataset URL now redirects to a generic publications page and is not used as a source here."
surv-ma2023-chinmed-ml:
  summary_en: "Ma, Liu, and Li (co-first), with corresponding authors Li and Wang, publish a narrative review in Chinese Medicine on machine learning in TCM and natural-product research, describe their team’s coronary-syndrome-element model, and call for combining machine learning, TCM theory, and computational biology. This is not a systematic review; table accuracies come from cited papers. No new code or data are presented. The license is CC BY 4.0."
he2022-hepatoprotective-tcm:
  summary_en: "He, corresponding authors Xie and Wang and colleagues use machine learning to predict hepatoprotective activity of TCM constituents and, with efficacy-class and property clustering, propose 12 potentially hepatoprotective herbs. A voting model reaches 0.871 accuracy on a 178-compound test set. Nine of the 12 herbs already have animal or cell-experiment support in the literature. This is computational prediction plus literature checking, not a new clinical trial. The license is CC BY."
shi2021-tongue-pulse-fatigue:
  summary_en: "Shi, corresponding author Xu and colleagues collect tongue and pulse data at Shuguang Hospital and use four classifiers to distinguish disease-related from non-disease fatigue. The roughly 85% accuracy in the abstract comes from tongue and pulse plus age and BMI; with tongue and pulse alone, logistic regression accuracy is about 67%. The data are not public, and no code is given. The license is CC BY."
chen2022-dili-ai:
  summary_en: "Chen, corresponding authors Zhao and Shang and colleagues collect 2,035 compounds and compare nine machine-learning methods and a deep belief network for screening hepatotoxicity of individual compounds used in combined Chinese and Western medicines. Random-forest accuracy is 0.838 on the training set and 0.767 on the test set; the deep belief network’s test accuracy is 82.2%. Data are available on request, and no code is given. The license is CC BY 4.0."
surv-chu2022-ai-cam-scoping:
  summary_en: "Chu, corresponding author Youn and colleagues follow JBI and PRISMA-ScR to map AI applications in complementary and alternative medicine. Searching three English databases, they include 32 papers, mainly on acupuncture, tongue and lip diagnosis, and herbal medicine. This is a systematic scoping review, not a meta-analysis. Counts in the text, flowchart, and Table 1 are not fully consistent. No new code or data are presented. The license is CC BY."
surv-wang2021-ai-ra:
  summary_en: "Wang and Hou (co-first), with corresponding authors Zhang and Wang, publish a narrative review in Frontiers in Pharmacology on proposed uses of AI, deep learning, and cloud computing for rheumatoid arthritis in traditional and Western medicine, and they offer a conceptual model. This is not a systematic review and not a deployed clinical system. No new code or data are presented. The license is CC BY."
wang2019-meridian-ml:
  summary_en: "Wang, corresponding author Tang and colleagues collect 646 herbs and their constituents’ molecular fingerprints and ADME features from TCMID, and they predict meridian tropism at the herb and compound levels. The abstract’s highest accuracy is 0.83; in Table 2 the highest balanced accuracy for compound-level random forests is 0.67. Code is posted on GitHub. The license is CC BY."
tang2022-crc-tcm-prognosis:
  summary_en: "Tang and Gao (co-first), with corresponding author Yang, retrospectively include 558 patients with stage I–III colorectal cancer after curative surgery, compare four machine-learning methods for internal validation of 3- and 5-year recurrence or metastasis, and add TCM intervention and syndrome type. Code is posted on Gitee. Figures for the 5-year intervention model in the text and Table 3 are inconsistent. The license is CC BY."
wang2014-cf-syndrome-cprf:
  summary_en: "Wang, corresponding author Yang and colleagues apply conformal prediction and random forests to 736 chronic-fatigue cases for multi-label classification of four syndrome elements, and they compare conformal naive Bayes, conformal k-NN, and ML-KNN. The highest subset accuracy is 0.9959, but only leave-one-out cross-validation is used. Data are provided in the supplement. The license is CC BY."
lee2015-pulse-htn-pilot:
  summary_en: "Lee, corresponding author Kim and colleagues analyze the association of guan-position pulse-wave physical quantities with hypertension, and their predictive value, in 393 Korean women aged 46–73. This is a pilot: only 52 hypertension cases, classes are imbalanced, and sensitivity for the hypertension class is very low. It should not be merged with other pulse-and-hypertension entries. The license is CC BY 4.0."
yu2020-pdm-acup-fc-predict:
  summary_en: "Yu and Xie (equal contribution), with corresponding authors Liang and Yang, randomize 54 patients with primary dysmenorrhea to true or sham acupuncture and analyze 35. True acupuncture significantly reduces pain; sham acupuncture does not. Leave-one-out regression uses eight baseline functional-connectivity features. The text and Figure 5 do not consistently match pain-change values and change rates. The license is CC BY."
chen2021-herbal-group-hann:
  summary_en: "Chen and Liu (co-first) distill TCM prescriptions with a hierarchical attention network and then use Apriori to mine efficacy-specific herb groups. Across 13 test efficacies, overall mean accuracy after distillation is about 15.57%–23.83%, higher than the undistilled control. The gold standard comes from the internet and confirmation by one expert. Tables 1 and 2 carry unrelated footnotes. The license is CC BY 4.0."
chen2007-tcm-semantic-escience:
  summary_en: "Corresponding author Chen and colleagues describe a TCM e-science system based on ontologies, semantic views, and grid services, including DartMapping, DartSearch, DartQuery, and DartFlow. They report an ontology of more than 20,000 classes and 100,000 instances and a system linked to more than 50 databases and 800 services (author-reported). This is a system description without an independent quantitative evaluation. The license is CC BY 2.0."
cheung2010-cm-semantic-web:
  summary_en: "Corresponding author Cheung and Chen publish a 2010 editorial in Chinese Medicine arguing for Semantic Web representation and harmonization of Chinese and Western medical data. The text cites DartGrid and states that the China Academy of Chinese Medical Sciences ontology has more than 8,000 classes and 50,000 instances, which differs from the author-reported figures in the 2007 system paper already in this catalog. This is a short editorial with no new data or evaluation. The license is CC BY 2.0."
samwald2010-lod-tcm:
  summary_en: "Corresponding author Samwald and colleagues publish a 2010 commentary in Chinese Medicine that uses the search for potentially antidepressant TCM plants as a use case for linked open data. The authors manually encode 76 assertions and interlink them with an RDF version of TCMGeneDIT. This is a commentary plus a small prototype, not a completed drug-discovery study. The license is CC BY 2.0."
jin2023-tcm-wm-cpg-method:
  summary_en: "Jin and colleagues, with corresponding authors Zeng and Shang, publish a 2023 position paper and methodological standard in Military Medical Research on writing clinical practice guidelines that organically integrate TCM and Western medicine. A stock-take of 54 published integrative guidelines finds that only 5.6% clearly frame clinical questions in an integrative way. This is neither a systematic review nor a clinical trial. The license is CC BY 4.0."
galkin2026-precious3gpt:
  summary_en: "Galkin, Ren, and corresponding author Zhavoronkov present a computational proof of concept in Aging and Disease: they cross Precious3GPT-generated aging omics signatures with BATMAN-TCM2 to screen or design anti-aging TCM formulas, and they release a multi-agent workflow and datasets. Cross-species analysis yields 13 genes and 34 multi-tissue compounds, 20 of which appear in Huashan Wuzi Dan. The paper does not experimentally or clinically validate these formulas. Three printed figure captions are misaligned with the figures. The PDF states a Creative Commons Attribution license."
liu2024-medbench:
  summary_en: "Liu and Hu (co-first), with corresponding author Zhang, present a 2024 Chinese medical LLM benchmark and cloud platform in Big Data Mining and Analytics, with 300,901 questions across 43 clinical specialties and with question-answer isolation and cyclic shuffling. This is not a TCM- or herbal-medicine-specific benchmark. The correct DOI is 10.26599/BDMA.2024.9020044, which is not the 9020014 identifier that has appeared in some lists, and it is not LingLanMedBench or the same-named AAAI benchmark. The license is CC BY 4.0."
surv-jing2018-hili:
  summary_en: "Jing and corresponding author Teschke publish a 2018 narrative review in the Journal of Clinical and Translational Hepatology comparing herb-induced liver injury, including Chinese herbal medicines, with chemical drug-induced liver injury in epidemiology, clinical features, and RUCAM grading. This is not a systematic review; the main comparison tables restate existing cohorts. There are wording and number conflicts between the abstract and Table 4, and between the text and Table 6 / Figure 2. The license is CC BY-NC 4.0."
tan2025-depression-kg-qa:
  summary_en: "Tan Ping, with corresponding authors Liu Huina and Wei Changfa, publish a methods paper in Shanghai Journal of Traditional Chinese Medicine (2025, 59(7)) that turns the integrative guideline on depression into a Neo4j knowledge graph of 303 entities and 436 relations, then uses template matching and ChatGLM4 to generate traceable answers. On 20 questions, five experts give overall scores of 64.25 for template matching, 80.25 for ChatGLM4 alone, and 83.63 for the combined system. A 32-case outpatient demonstration is qualitative; no open code or graph is provided. The official journal PDF can be downloaded; no printed Creative Commons license was seen."
xue2023-tcm-strategy:
  summary_en: "Xue Xiaojuan and colleagues, with corresponding author Zhang Boli, publish a 2023 strategic review and policy recommendations in Strategic Study of CAE (25(5)), based on the CAE consulting project on TCM development strategy in the new era. The paper reviews theory, clinical evaluation, resources, intelligent manufacturing, and international promotion, and offers six recommendations. This is not a systematic review and not a new algorithm or clinical trial. Unpaywall records the license as CC BY-NC-ND."
li2023-transformer-chd:
  summary_en: "Li Hongzheng, corresponding author Wang Jie and colleagues publish a methods paper in Chinese Journal of Experimental Traditional Medical Formulae (2023, 29(1)) that uses syndrome elements as an intermediary and builds a modified Transformer with multi-head attention, compound embeddings, and dropout, trained on 8,030 Wang Jie case records, with a qualitative comparison of 100 real prescriptions. The abstract gives no numeric accuracy for those 100 cases; the 93% and 96.46% figures cited in the text belong to earlier work. A Song et al. review once misprinted the volume as 9(1); the official pagination is 29(1):148–154. The official journal PDF can be downloaded; no printed Creative Commons license was seen."
surv-zeng2024-sfdm:
  summary_en: "Zeng Jingqi and corresponding author Jia Xiaobin publish a framework review in Engineering (2024, 40(9)) proposing a System Function Decoding Model (SFDM) that connects AI to holistic material-basis research in TCM. It organizes five top-down dimensions and a bottom-up element–structure–function path, and it looks ahead to an end-to-end component-syndrome model and an oral-formulation IVIVC mechanism model. This is not a systematic review; neither technical scheme is implemented or quantitatively evaluated here. The license is CC BY-NC-ND 4.0. The official Chinese version is 25 pages."
chen2023-gpt4-prescription:
  summary_en: "Chen Qitao, corresponding author Xia Lizhen and colleagues publish a short methods paper in China Pharmacy (2023, 34(23)) that sends pharmacopoeia and Chinese materia medica text to GPT-4 and a web-connected model to generate 30 herbal prescriptions, then has three same-hospital experts grade them blindly. Table 2 mean scores are 3.756 for expert consensus, 3.622 for GPT-4, and 3.501 for the connected model, with all pairwise P>0.05; a Turing test is reported as 138/270 (51.11%). The word “training” in the text does not mean parameter updates or fine-tuning. No code or prescription data are released, and no printed Creative Commons license was seen."
wang2022-syndrome-element-ai:
  summary_en: "Wang Jie, Duan Lian, Li Hongzheng, Liu Jinlei, and Chen Hengwen publish a Views & Comments piece in Engineering (2022, 8(1)) arguing that syndrome elements can serve as a hub for TCM AI diagnostic models that combine rule ensembles, guideline symptom scores, graph-convolution knowledge graphs, and small-sample data, using eight coronary syndrome elements as an example. This is not a systematic review and reports neither training-set size nor test accuracy. The license is CC BY-NC-ND 4.0. It is not the same paper as the later modified-Transformer article by the same group in Chinese Journal of Experimental Traditional Medical Formulae."
he2024-gpts-kg-extract:
  summary_en: "He Yuhao, corresponding author Li Ming and colleagues publish a methods paper in Shanghai Journal of Traditional Chinese Medicine (2024, 58(8)) that uses custom GPTs on ChatGPT 4.0 to extract entities and relations from 351 formulas in Zhonghua Yifang, loads them into Neo4j, and compares the result with CasRel and GPLinker based on bert-Chinese. Total P, R, and F1 for the GPTs are 97.44%, 98.09%, and 97.48%. The experiment was completed by overseas collaborators; no open GPT, prompts, or annotations are provided. The official version is 58(8):1–6, DOI 10.16305/j.1007-1334.2024.2401070. The official journal PDF can be downloaded; no printed Creative Commons license was seen."
surv-tian2023-atm-four-dx:
  summary_en: "Tian, corresponding author Hongwu Wang and colleagues publish a scientometric study in Annals of Translational Medicine (2023, 11(3)) that uses Web of Science, VOSviewer, and CiteSpace to analyze AI literature on the four TCM diagnostic methods. The text reports 136 eligible studies from 2007–2022. This is not a systematic review and has no PRISMA. The license is CC BY-NC-ND 4.0. The official version is 16 pages, DOI 10.21037/atm-22-6431. It is not the same paper as the existing catalog entry surv-tian2024."
huang2020-pulse-highdim:
  summary_en: "Ching-Han Huang, Yu-Min Wang, and corresponding author Shana Smith publish a methods paper in Mathematical Biosciences and Engineering (2020, 17(6)) that extracts 71-dimensional features from ANSWatch pulse signals and uses principal-component analysis plus an artificial neural network to distinguish 10 pulse types. Twenty-seven principal components explaining 95% of variance reach a mean accuracy of 98.2%. The official version is downloadable under CC BY 4.0; no code or raw data are provided. DOI 10.3934/mbe.2020353."
cha2024-omop-team:
  summary_en: "Jiyun Cha, Eun Kyoung Ahn, Young-Heum Yoon, and Man Young Park publish a three-page MEDINFO 2023 short paper in Studies in Health Technology and Informatics (2024, pp. 1349–1351) that extracts items from Korean-medicine clinical guidelines on facial palsy, dysmenorrhea, and stroke and maps them to OMOP CDM 6.0. Of 52 deduplicated items, 42 are general clinical information and 10 are TEAM-specific; all map at table level, while three cannot be placed in existing fields at field level. The license is CC BY-NC 4.0, DOI 10.3233/SHTI231189. This is not the same paper as park2026-tkm-omop."
fu2025-bes-anemia-tongue-face:
  summary_en: "Hongyuan Fu, Yi Chun, and Yahan Zhang (equal contribution), with corresponding authors Yongzhi Li and Xu Jiatuo, publish a methods paper in Biomedical and Environmental Sciences (2025, 38(8)) that enrolls 533 women aged 20–49 at Shuguang Hospital and uses color and texture features of face and tongue images to screen for anemia. LASSO selects 19 of 62 indicators; an ANN reaches test AUC 0.849 and accuracy 0.781, and a fused ResNet50V2 model reaches AUC 0.846 and accuracy 0.818. The official journal PDF can be downloaded; no printed Creative Commons license was seen, and no code or original images are provided. DOI 10.3967/bes2025.047."
news-202611-yunnan-15th-plan:
  summary_en: "The General Office of the Yunnan Provincial People's Government issued the Yunnan TCM Revitalization and Development Plan for the 15th Five-Year Plan period (Yun Zheng Ban Fa [2026] No. 46, dated 5 November 2026 and published on the provincial government portal on 11 November 2026). The plan sets a 2030 goal of making further progress in TCM revitalization so that everyone can access TCM services, and it includes a dedicated chapter on digital empowerment: connecting TCM institutions to the provincial health-information platform, building high-quality TCM datasets, exploring TCM plus artificial intelligence and intelligent-assisted diagnosis, and accelerating smart TCM hospitals and internet TCM hospitals, as well as intelligent acupuncture, tuina and decoction equipment. It also strengthens Tibetan, Dai and Yi medicine services. This is a provincial planning document, not a launched model. The official full text on yn.gov.cn was opened."
news-202609-ningxia-15th-plan:
  summary_en: "The Ningxia Health Commission and Development and Reform Commission issued the Ningxia Hui Autonomous Region TCM Revitalization and Development Plan for the 15th Five-Year Plan period after approval by the regional government in letter Ning Zheng Han [2026] No. 55 dated 11 September 2026. The two departments issued the plan on 16 September 2026, and the Health Commission published the full text on 30 September 2026. The plan aims by 2030 to improve an all-population, life-cycle TCM service system so that everyone can access TCM services. It calls for exploring AI-enabled TCM development, a regional smart-empowerment project, standardized smart TCM hospitals and pharmacies, and precise AI applications in grassroots TCM services. This is a provincial planning document, not a launched model. The official full text and the government approval page were opened."
news-202609-fujian-15th-plan:
  summary_en: "The Fujian Provincial Health Commission and Fujian Administration of Traditional Chinese Medicine issued the Fujian TCM Revitalization and Development Plan for the 15th Five-Year Plan period on 29 September 2026; the Health Commission website lists the publication time as 30 September 2026. The plan aims by 2030 to improve high-quality TCM development mechanisms and advance Fujian as a strong TCM province so that everyone can access TCM services. Its digitalization chapter calls for Min-school TCM high-quality datasets and TCM agents, data-asset registration pilots, a Data Elements × action, smart hospital campuses and specialty large models at provincial TCM hospitals, and intelligent-assisted decision systems. This is a different instrument from Fujian's already catalogued herb-quality measures. This is a provincial planning document, not a launched model. The official HTML full text and PDF attachment were opened."
news-202610-hainan-ftp-ordinance:
  summary_en: "The Hainan Free Trade Port Regulations on Promoting the Development of Traditional Chinese Medicine were adopted by the Standing Committee of the 7th Hainan Provincial People's Congress on 30 September 2026, promulgated as Standing Committee Announcement No. 114, and took effect on 1 November 2026. The 50-article local regulation covers TCM services, materia medica and industry, Li and Miao medicine, talent and science, inheritance and culture, opening-up and international cooperation, and safeguards. It encourages smart TCM medical institutions, allows the use of internet technologies and licensed AI medical devices in TCM services, supports digital and AI archives for Li and Miao medical inheritance, and supports real-world TCM research platforms. The complete official text was opened on the Sanya Municipal People's Congress website, and the official announcement was opened in the 12 October 2026 documents edition of Hainan Daily."
news-202604-hospital-decoction-rules:
  summary_en: "The National Administration of Traditional Chinese Medicine and the National Health Commission issued the Specifications for the Management of TCM Decoction Pieces in Hospitals (2026 Edition) (Guo Zhong Yi Yao Yi Zheng Fa [2026] No. 3, dated 8 April 2026). The specifications govern procurement, acceptance, storage and curing, dispensing, institution-specific processing, decoction, extemporaneous preparation and prescription review in hospitals at all levels, took effect on the date of issuance, and repeal the 2007 edition. They encourage the use of information systems in decoction-piece management and require quality tracking, tracing and monitoring for outsourced decoction services. This is a departmental management standard, not a launched model. The official full text on gov.cn was opened."
magr-tcm:
  summary_en: "Lv, Pan, Li, Hu, Xu, Jin, Fang and colleagues present MAGR-TCM, building a knowledge graph under expert supervision from 741 high-quality gynecology cases (the paper reports 10,231 entities and 32,051 relations) and a four-agent retrieval-augmented generation framework that tries to reconstruct the TCM disease–pattern–principle–formula–medicinal chain from colloquial home inquiries. The authors report better scores than compared baselines on RAGAS and expert review, and 100% sensitivity and specificity on a safety test set; these figures are author-reported. This is a home-consultation and triage prototype study, not a clinical efficacy trial. The Springer Nature / Chinese Medicine article page was opened in this pass."
zhou2026-tcm-llm-eval:
  summary_en: "Zhou, Wang, Zhang, Bai, Sun, Liu, and Li publish a Perspective in Frontiers in Digital Health arguing that medical licensing-exam questions are convenient but insufficient benchmarks for traditional Chinese medicine large language models, and cannot by themselves show support for clinical reasoning or better patient care. They discuss four sources of potential bias and propose a clinically grounded evaluation mix of dynamic scenarios, open-ended generation, multimodal assessment, longitudinal reassessment, and clinical validation. This is a commentary on evaluation design, not a new benchmark dataset or a clinical trial. The official article page was opened in this pass."
leaf-tcm:
  summary_en: "Luo, Ding, Zhang, Miao, and Shi present LEAF, a two-stage framework evaluated on 3,253 records and 14 respiratory syndromes from the public TCM-SD benchmark. A large language model first extracts a 35-item symptom ontology compiled from public TCM sources; among three interchangeable models, the authors rank Qwen2.5-14B-Instruct first, then Phi-4 and the TCM model BianCang. A second stage compares NSGA-II, SPEA2, CMOPSO, and NSDE for interpretable multiobjective feature selection. This is a methods and benchmarking study, not a clinical efficacy trial. The official article page was opened in this pass."
surv-huang2026-formula-ai:
  summary_en: "Huang, Jiang, Hu, Ye, Liu and colleagues review the technology readiness of knowledge graphs, large language models, and high-throughput validation for developing classic TCM formulas, using metabolic syndrome as a case. They cite about 99,584 named formula entries in the second edition of the Dictionary of Traditional Chinese Medicine Formulas, and state that China’s NMPA approved 77 new TCM products in 2013–2024, fewer than ten a year on average. They place knowledge-graph work at TRL 3–6 and large language model work at TRL 1–5, and describe the three streams as uneven. This is a readiness review, not a new-drug approval or an efficacy trial. The official article page was opened in this pass."
surv-liu2026-gscm-digital:
  summary_en: "Changning Liu, Xiaoduo Zhang, and corresponding author Hongcai Shang publish a publish-ahead-of-print review in Guidelines and Standards of Chinese Medicine on 26 October 2026. They discuss gaps in evidence-based TCM research—including methodological tension with holistic principles, subjective syndrome differentiation, and limited consensus on outcome measures—and review how big data, artificial intelligence, and Internet-plus tools might support evidence repositories, more standardized clinical studies, and pharmaceutical quality assurance. This is a methods and standards review, not an evaluation of a deployed system. The official Ovid journal page, including the abstract and affiliations, was opened in this pass."
surv-hu2026-tcm-dg-ai:
  summary_en: "Ziquan Hu publishes a quantitative systematic review in Frontiers in Artificial Intelligence and Applications, volume 433, Digitalization and Management Innovation V, pages 730–743. The review covers 372 peer-reviewed studies from 2023–2025 (98 international, 274 domestic) on AI in discipline-group development at TCM institutions, and uses author-built indices (TI, RDI, IDI, CKII) to describe themes and bottlenecks. The author reports generally low model interpretability (mean IDI 0.72) and limited integration of classical TCM knowledge (mean CKII 0.20). No author affiliation was visible on the opened guest abstract page. This is an institutional-development review, not a clinical trial. The official IOS Press ebook page was opened in this pass."
surv-li2026-tongue-bibliometric:
  summary_en: "Li, Yang, Lin, Wang, Yan, Zheng, Xiang, and Tang publish a bibliometric review of AI-assisted TCM tongue diagnosis, comparing Web of Science Core Collection and CNKI records from January 2015 to August 2026. They include 482 studies (295 WoSCC, 187 CNKI) and use CiteSpace and VOSviewer to map collaboration, keywords, and emerging topics, analysing the two databases separately. This is a landscape review, not a clinical validation of diagnostic accuracy. The official article page was opened in this pass."
surv-huang2026-tongue-stroke:
  summary_en: "Huang, Yin, Shao, Jiang, Wang, and Xu systematically review the diagnostic accuracy of tongue examination for post-stroke TCM syndrome differentiation, searching to 23 February 2026 (PROSPERO CRD420261288502). They include ten studies from mainland China and 3,437 participants: six manual-diagnosis studies (n=2,191) and four AI-assisted studies (n=1,246). The authors themselves treat the estimates as exploratory agreement with existing syndrome-classification processes rather than clinically validated accuracy, citing very low certainty of evidence and uncertain independence of the reference standard. AI studies are synthesized narratively. The official article page was opened in this pass."
jiang2026-constitution-cluster:
  summary_en: "Jiang, Liu, and Han apply unsupervised clustering to large-scale Constitution in Chinese Medicine Questionnaire data in order to describe symptom subgroups within mixed TCM constitutions. They compare Likert-scale and binary encodings and combinations of UMAP, t-SNE, or PCA with K-means, DBSCAN, or Gaussian mixture models. They report that binary encoding with UMAP and a Gaussian mixture model was comparatively stable and yielded a ten-cluster solution with distinguishable heat-related, cold-sensitive, and mixed patterns. This is a methodological exploration of survey data, not a treatment trial. The official Scientific Reports article page was opened in this pass."
llm-h2g:
  summary_en: "Zhang, Yin, Wu, Yao, Yang, Cui, Li, Pengwei Hu, and Lun Hu present LLM-H2G, a hypergraph contrastive-learning model for herb–disease association prediction. It places herbs, compounds, proteins, and diseases in an enhanced heterogeneous hypergraph, encodes entity names with a large language model, and aligns those semantics with structural readouts through an InfoNCE objective. The authors report that it outperforms representative network-embedding, GNN, graph contrastive, and hypergraph baselines on TCM-suite and Ethnobotany benchmarks, with larger gaps for sparsely connected herbs; ablations indicate that both semantic enrichment and the enhanced hypergraph are needed. Case studies are computational attribution and literature-supported suggestions, not clinical validation. The official BMC Bioinformatics article page was opened in this pass."
cracks-yolo:
  summary_en: "Ding, Wu, Shen, Lin, and Men propose Cracks-YOLO, an improved YOLOv5 detector for cracked-tongue signs in TCM tongue diagnosis. They add switchable atrous convolution to the backbone for multi-scale features and a Transformer encoder for long-range dependencies. This is a computer-vision methods paper. Quantitative accuracy figures were not fully captured from the opened abstract in this pass and are therefore not restated here. It is not a clinical efficacy trial. The official article page was opened in this pass."
surv-wang2026-tongue-gc:
  summary_en: "Wang, Li, Zhang, Shao, Gao, and Zhang systematically review AI analysis of digital tongue images for gastric cancer, precancerous gastric lesions, and related gastrointestinal disorders, searching to 10 June 2026 (PROSPERO CRD420261444857). Nine studies from 2018–2025 were included. Internally validated AUCs ranged from 0.61 to 0.99, but only three studies reported external validation, which generally showed performance drops, and calibration was rarely assessed. The authors conclude that the approach is promising but early-stage, and should be viewed as a possible adjunctive pre-endoscopic triage tool rather than a replacement for gastroscopy. The official article page was opened in this pass."
yu2026-who-pulse-terms:
  summary_en: "Yu, Yap, and Amirdabbaghian compare English renderings of 49 Chinese pulse-diagnosis terms shared by the 2007 WHO Western Pacific traditional-medicine terminology standard and the 2022 WHO International Standard Terminologies on Traditional Chinese Medicine. They classify revisions as retention, expansion, or replacement: 17 terms (34.7%) were unchanged, 8 (16.3%) were expanded with additional English variants, and 24 were replaced. The study is descriptive and uses no inferential statistics. It is a terminology and standardization analysis, not a pulse-diagnosis algorithm or a clinical trial. The official BMC article page was opened in this pass."
surv-jia2026-cdss-cvd:
  summary_en: "Jia, Zhang, Tong and colleagues, with corresponding authors Yan Ma, Bing Li, and Huamin Zhang, review clinical decision support systems for cardiovascular disease from an integrative Chinese and Western medicine perspective in Biomedical and Environmental Sciences (2026, 39(9): 1115–1130). They discuss TCM-CDSS that combine principle–method–formula–medicinal theory, expert experience, and knowledge graphs to move from syndrome differentiation toward formula recommendation. The review notes reported improvements in prescribing and blood pressure in hypertension studies, while effects on major cardiovascular events and mortality still need further evaluation. This is a review, not a prospective trial of a new system. The official besjournal.com article page was opened in this pass (received 1 March 2026, accepted 17 August 2026, published online 20 September 2026)."
course-hactcm-tcm-basics:
  summary_en: "A China University MOOC course on Fundamental Theories of Traditional Chinese Medicine, taught by Cui Shanshan of Henan University of Chinese Medicine. The course page describes it as a national-level quality online open course and covers the formation of TCM, qi monism and yin-yang and the five phases, visceral manifestation, essence, qi, blood and body fluids, meridians and constitution, etiology and pathogenesis, and principles of prevention and treatment. The official course page was opened in this pass. The current term runs from 20 July to 25 December 2026; the platform records an earlier offering from 9 October 2017. This is a formal university open course, not a marketing clip."
course-sdutcm-tcm-basics:
  summary_en: "A China University MOOC course on Fundamental Theories of Traditional Chinese Medicine, taught by Zheng Hong of Shandong University of Traditional Chinese Medicine. The page states that the course is supported by the university’s national key discipline in TCM basic theory and covers essence, qi, yin-yang and the five phases, visceral manifestation, essence-qi-blood-fluids-spirit, meridians and constitution, and etiology, pathogenesis and treatment principles. The official course page was opened in this pass. The current term runs from 6 September 2026 to 10 January 2027; the platform records an earlier offering from 16 March 2020. This is a formal university open course, not a marketing clip."
course-jnu-tcm-basics:
  summary_en: "A China University MOOC course on Fundamental Theories of Traditional Chinese Medicine, taught by Chen Liguo of Jinan University. It introduces the development of the TCM theoretical system, holism and pattern differentiation, yin-yang and the five phases, and TCM views of the body, disease, and prevention. The official course page was opened in this pass. The current term runs from 3 August to 27 December 2026; the platform records an earlier offering from 26 September 2019. This is a formal university open course, not a marketing clip."
course-gzucm-tcm-basics-intensive:
  summary_en: "A China University MOOC course titled Intensive Study of the Fundamental Theories of Traditional Chinese Medicine, taught by Yan Can of Guangzhou University of Chinese Medicine. It offers close readings of key topics in philosophy, visceral manifestation, qi, blood and body fluids, etiology, pathogenesis, and treatment principles; the page states that meridians and constitution are mainly provided as self-study materials. The official course page was opened in this pass. The current term runs from 14 September 2026 to 30 January 2027; the platform records an earlier offering from 2 October 2020. This is a formal university open course, not a marketing clip."
course-njutcm-diagnostics:
  summary_en: "A China University MOOC course on TCM diagnostics, taught by Xu Zheng of Nanjing University of Chinese Medicine. The official course page was opened in this pass. The current term runs from 22 July 2026 to 8 January 2027; the platform records an earlier offering from 28 June 2021. This is a formal university open course, not a marketing clip."
course-hactcm-diagnostics:
  summary_en: "A China University MOOC course on TCM diagnostics, taught by Che Zhiying of Henan University of Chinese Medicine. The official course page was opened in this pass. The current term runs from 28 August to 31 December 2026; the platform records an earlier offering from 28 February 2019. This is a formal university open course, not a marketing clip."
course-njutcm-herbal:
  summary_en: "A China University MOOC course on Chinese materia medica, taught by Tang Decai of Nanjing University of Chinese Medicine. The course page carries language recognizing it as a national-level quality online open course and also mentions a national first-class course designation. The official course page was opened in this pass. The current term runs from 31 August 2026 to 10 January 2027; the platform records an earlier offering from 14 November 2017. This is a formal university open course, not a marketing clip."
course-cdutcm-herbal:
  summary_en: "A China University MOOC course on Chinese materia medica, taught by Wang Jian of Chengdu University of Traditional Chinese Medicine. The course page describes it as a recognized national-level quality online open course and covers basic herbal theory and the properties, actions, and clinical use of commonly used Chinese medicines. The official course page was opened in this pass. The current term runs from 16 September to 31 December 2026; the platform records an earlier offering from 1 March 2018. This is a formal university open course, not a marketing clip."
course-gzucm-formula:
  summary_en: "A China University MOOC course on TCM formulas, taught by Quan Shijian of Guangzhou University of Chinese Medicine. The official course page was opened in this pass. The current term runs from 31 August 2026 to 9 January 2027; the platform records an earlier offering from 6 September 2021. This is a formal university open course, not a marketing clip."
course-njutcm-shanghan:
  summary_en: "A China University MOOC course on the Treatise on Cold Damage (Shanghan Lun), taught by Ling Yun of Nanjing University of Chinese Medicine. The official course page was opened in this pass. The current term runs from 28 August 2026 to 10 January 2027; the platform records an earlier offering from 22 October 2019. This is a formal university open course, not a marketing clip."
course-hactcm-jinkui:
  summary_en: "A China University MOOC course on the Essentials from the Golden Cabinet (Jingui Yaolue), taught by Wang Yong of Henan University of Chinese Medicine. The official course page was opened in this pass. The current term runs from 24 August to 27 December 2026; the platform records an earlier offering from 21 March 2020. This is a formal university open course, not a marketing clip."
course-hactcm-neijing:
  summary_en: "A China University MOOC selected-readings course on the Inner Canon, taught by Huo Lei of Henan University of Chinese Medicine. The official course page was opened in this pass. The current term runs from 24 August to 18 December 2026; the platform records an earlier offering from 20 March 2020. This is a formal university open course, not a marketing clip."
course-ccucm-neijing:
  summary_en: "A China University MOOC selected-readings course on the Inner Canon, taught by Su Ying of Changchun University of Chinese Medicine. The official course page was opened in this pass. The current term runs from 31 August 2026 to 17 January 2027; the platform records an earlier offering from 23 March 2020. This is a formal university open course, not a marketing clip."
course-fjzyy-neijing:
  summary_en: "A China University MOOC selected-readings course on the Inner Canon, taught by Gao Jiajun of Fujian University of Traditional Chinese Medicine. The official course page was opened in this pass. The current term runs from 6 August to 31 December 2026; the platform records an earlier offering from 9 September 2019. This is a formal university open course, not a marketing clip."
course-hactcm-acupuncture:
  summary_en: "A China University MOOC course on acupuncture and moxibustion, taught by Gao Xiyan of Henan University of Chinese Medicine. The official course page was opened in this pass. The current term runs from 31 August 2026 to 10 January 2027; the platform records an earlier offering from 21 March 2020. This is a formal university open course, not a marketing clip."
course-bucm-acupuncture-intro:
  summary_en: "A China University MOOC introductory course on acupuncture and moxibustion, taught by Ma Wenzhu of Beijing University of Chinese Medicine. The course page describes it as a recognized national-level quality online open course. The official course page was opened in this pass. The current term runs from 29 September to 31 December 2026; the platform records an earlier offering from 24 November 2015. This is a formal university open course, distinct from the three BUCM MOOCs already in the catalog, and is not a marketing clip."
course-bucm-wenbing:
  summary_en: "A China University MOOC course on warm-disease theory, taught by Gu Xiaohong of Beijing University of Chinese Medicine. The official course page was opened in this pass. The current term runs from 15 September to 31 December 2026; the platform currently lists only this term, so the first offering is recorded as 2026. This is a formal university open course, not a marketing clip."
course-bucm-internal-selected:
  summary_en: "A China University MOOC selected-topics course on internal medicine in traditional Chinese medicine, taught by Zhao Jinxi of Beijing University of Chinese Medicine. The official course page was opened in this pass. The current term opened on 22 October 2026 and is listed with a far-future end date, indicating long-term or on-demand access; the platform records an earlier offering from 31 December 2019. This is a formal university open course, not a marketing clip."
course-fjzyy-health-concepts:
  summary_en: "A China University MOOC general-education course on TCM concepts of health, taught by Li Candong of Fujian University of Traditional Chinese Medicine. The course page describes it as a recognized national-level quality online open course, guided by Inner Canon ideas of health cultivation, and covering principles of health, self-assessment, discrimination of qi-blood and yin-yang states and visceral function, and supplementation of deficiency patterns. The official course page was opened in this pass. The current term runs from 1 September to 31 December 2026; the platform records an earlier offering from 29 April 2019. This is a formal university open course, not a marketing clip."
course-fjzyy-yijinjing:
  summary_en: "A China University MOOC course on TCM exercise therapy focused on Yijinjing, taught by Yan Xinghui of Fujian University of Traditional Chinese Medicine. The official course page was opened in this pass. The current term runs from 15 September to 15 December 2026; the platform records an earlier offering from 16 May 2019. This is a formal university open course, not a marketing clip."
course-cuhk-everyday-cm:
  summary_en: "A Coursera open course, Everyday Chinese Medicine, offered by The Chinese University of Hong Kong and taught by Prof. Vincent Chung of the Hong Kong Institute of Integrative Medicine. The course page describes it as a public-education platform on Chinese-medicine diagnosis and treatment and on regulation of Chinese-medicine services and herbal products. The page records launchedAt as 25 September 2017. The official Coursera page (HTTP 200) and the CUHK School of Chinese Medicine Coursera introduction page were opened in this pass. This is a formal university open course, not a marketing clip."
course-cuhk-everyday-cm-2:
  summary_en: "A Coursera open course, Everyday Chinese Medicine 2, offered by The Chinese University of Hong Kong and taught by Yung Tat To of the Hong Kong Institute of Integrative Medicine. The course page says it introduces basic principles of Chinese medicine to the public and healthcare professionals. The page records launchedAt as 3 February 2020. The official Coursera page was opened in this pass (HTTP 200). This is a formal university open course, not a marketing clip."
course-hkust-health-concepts:
  summary_en: "A Coursera open course, Health Concepts in Chinese Medicine, offered by The Hong Kong University of Science and Technology and taught by Robert Ko of the Division of Life Science. The course page frames basic Chinese-medicine theories in the context of modern medicine. The page records launchedAt as 6 November 2017. The official Coursera page was opened in this pass (HTTP 200). This is a formal university open course, not a marketing clip."
person-renqing-dongzhu:
  name_en: "Renqing Dongzhu"
  summary_en: "Xining. Professor and doctoral supervisor at the College of Tibetan Medicine, Qinghai University. The official youth-faculty profile (posted 21 May 2017) states that he is Tibetan, born in 1973, holds a PhD from the School of Ethnic Medicine, Chengdu University of Traditional Chinese Medicine (2017), teaches undergraduate courses including Tibetan medical febrile disease, epidemic disease, and traumatology, served as associate professor from July 2001 to March 2024, and has been professor since April 2024. The official faculty page was opened in this pass."
  orgs_en:
  - "College of Tibetan Medicine, Qinghai University"
person-xue-charlie-rmit:
  name_en: "Charlie C. Xue"
  summary_en: "Melbourne. Distinguished Professor and Associate Deputy Vice-Chancellor (International) at RMIT University. The official profile states that he has worked in higher education and the health industry since 1987; became Associate DVC (International) in January 2021; was reappointed as Distinguished Professor for 2024–2028; previously headed the Discipline of Chinese Medicine; served as National Chair of the Chinese Medicine Board of Australia from 2011 to 2021; has been a member of the WHO Expert Advisory Panel for Traditional Medicine since 2007; and directed the WHO Collaborating Centre for Traditional Medicine at RMIT from 2005 to 2022. Research interests listed on the page include evidence-based medicine and evaluation of traditional-medicine evidence. The official RMIT profile was opened in this pass. No Chinese name was given on the page, so the catalog keeps the official English name."
  orgs_en:
  - "RMIT University"
ds-tcm-flow:
  summary_en: "TCM-Flow: A Traditional Chinese Medicine Virtual Screening Dataset, released on Zenodo on 23 October 2026 as version v1 by Ma Shaochen and li xiong. The record is a public dataset with a 15.4 MB TCM-Flow_Dataset.zip file under a Creative Commons Attribution 4.0 International license. The version DOI is 10.5281/zenodo.23600814. The official Zenodo record was opened in this pass via its DOI. The landing page does not state further compound counts or screening-library size, so those figures are not recorded here. This is a public dataset landing page, not an internal benchmark."
ds-ethnomedone:
  summary_en: "EthnoMedOne v1.0.0, released on Zenodo on 22 October 2026 as version v1 by Shuai Xiaomin of Guizhou University. The record describes a structured, downloadable dataset that integrates ethnomedicinal records from multiple Chinese ethnic medical traditions with standardized compounds, protein targets, diseases, syndromes, symptoms, and compound-level properties, and it provides a SQLite database, matched CSV files, documentation, source and mapping audits, and example queries. The page states that the reported associations are standardized data linkages and should not be read as experimentally validated mechanisms or clinical efficacy. The license is CC BY 4.0, and the version DOI is 10.5281/zenodo.23553718. The official Zenodo record was opened in this pass via its DOI. This is a public dataset landing page, not an internal benchmark."
