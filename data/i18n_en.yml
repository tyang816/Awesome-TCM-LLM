ds-tcmsp:
  title_en: TCMSP
  summary_en: Herb–ingredient–target–disease networks with ADME parameters; public site is TCMSP 2.3 with downloadable relationship tables.
ds-tcmid:
  title_en: TCMID 2.0
  summary_en: Integrative formula–herb–ingredient–target database (distinct from NUS TCM-ID). Original megabionet site is down; verify via Zenodo extract and the NAR paper.
ds-tcm-id:
  title_en: TCM-ID
  summary_en: NUS BIDD formula–herb–ingredient–target resource covering pharmacopoeia, classical, and CFDA-approved prescriptions; not the same database as TCMID 2.0.
ds-etcm:
  title_en: ETCM 2.0
  summary_en: Encyclopedia of TCM formulas, patent drugs, materia medica, and ingredients with target prediction and multi-scale networks; v1 site remains online.
ds-herb:
  title_en: HERB 2.0
  summary_en: Evidence-centered TCM resource integrating clinical trials, meta-analyses, high-throughput experiments, literature, and a knowledge graph.
ds-symmap:
  title_en: SymMap 2.0
  summary_en: Herb–TCM symptom–modern symptom–ingredient–target–disease maps, expanded with newer pharmacopoeia records and downloadable relationship tables.
ds-batman-tcm:
  title_en: BATMAN-TCM 2.0
  summary_en: Known and predicted TCM ingredient–target protein interactions, with greatly expanded TTI coverage and target-to-ingredient search.
ds-tcm-taiwan:
  title_en: TCM Database@Taiwan
  summary_en: About 20k isolated-compound 2D/3D structures from 453 TCM materials for virtual screening. Original tcm.cmu.edu.tw is unreachable; verify via the PLOS paper.
ds-hit:
  title_en: HIT 2.0
  summary_en: Manually curated herbal-ingredient–target activity pairs (~1,237 ingredients / 2,208 targets, 2000–2020 literature). Portal opens; the analysis backend port is currently down (marked site issue).
ds-ltm-tcm:
  title_en: LTM-TCM
  summary_en: Symptom–prescription–plant–ingredient–target platform linking 14 source databases plus clinical and classical records (~48k formulas). Official Tasly cloud no longer resolves; verify via the paper DOI.
ds-tcmio:
  title_en: TCMIO
  summary_en: Immuno-oncology TCM database of prescriptions, herbs, ingredients, targets, and pathways, with downloads and a REST API.
ds-cemtdd:
  title_en: CEMTDD
  summary_en: Ethnic-minority herbal–compound–target–disease resource (~621 herbs, mainly Uygur/Kazakh). Original cemtdd.com now hosts something else; verify via the PMC paper.
ds-yatcm:
  title_en: YaTCM
  summary_en: About 1,813 prescriptions, 6,220 herbs, and 47k natural products with target/pathway tools. Nankai site currently returns 403; verify via the open-access paper.
ds-tcmbank:
  title_en: TCMBank
  summary_en: Large downloadable herb–ingredient–target–disease resource with literature-mining updates after manual checks.
ds-itcm:
  title_en: ITCM
  summary_en: Integrated formula/herb/ingredient/target platform plus 1,488 pharmacotranscriptomic profiles for 496 TCM ingredients (expression data also on Synapse).
ds-dcabm-tcm:
  title_en: DCABM-TCM
  summary_en: Literature-mined blood constituents and metabolites of TCM prescriptions and herbs, with experimental detection conditions (~1,816 structured absorbed constituents).
ds-cmaup:
  title_en: CMAUP
  summary_en: BIDD landscape of multi-target activities, pathways, and diseases for useful plants including TCM herbs; 2024 update, downloadable from the official site.
ds-supertcm:
  title_en: SuperTCM
  summary_en: Charité biocultural TCM resource linking drugs, botanical species, ingredients, targets, KEGG pathways, and diseases (~6,516 drugs). Official tcm.charite.de no longer resolves.
ds-tcmanalyzer:
  title_en: TCMAnalyzer
  summary_en: RCDD chemo-/bioinformatics service for formula/herb/ingredient networks and scaffold search (~1,493 formulas, 618 herbs). Official rcdd.org.cn currently times out.
ds-tcm-mesh:
  title_en: TCM-Mesh
  summary_en: Herb–compound–gene–disease network with toxicity/side-effect records (~6,235 herbs). Official portal currently returns 403; verify via the open paper.
ds-tcmgenedit:
  title_en: TCMGeneDIT
  summary_en: Text-mined associations among TCM, genes, diseases, effects, and ingredients, with pathway and PPI links. Official NTU site no longer resolves.
ds-cvdhd:
  title_en: CVDHD
  summary_en: Cardiovascular herbal database of 3D compound structures, targets, and pathways for virtual screening and network pharmacology. Original Peking University site currently times out.
ds-tm-mc:
  title_en: TM-MC
  summary_en: KIOM literature-derived Northeast Asian medicinal-material–compound database; the 2015 release covers ~536 materials, and the 2024 2.0 paper expands to ~34k compounds. Official site currently times out.
