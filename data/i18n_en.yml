  - Beijing Institute of Technology
  - BIT Tangshan Research Institute
  summary_en: "Closed loop of LLM generation and knowledge-graph completion for TCM QA (published, not granted)."
pat-cn118230893:
  name_en: "AI-large-model system for intelligent TCM prescription recommendation"
  orgs_en:
  - Hangzhou Ganzhicao Technology
  summary_en: "Trains an AI large model on medical records to recommend personalized TCM prescriptions, wired into a hospital IS (published, not granted)."
pat-cn117828050:
  name_en: "Long-document retrieval-augmented generation for TCM question answering"
  orgs_en:
  - Beijing Zhipu Huazhang Technology
  summary_en: "Long-document RAG for TCM question answering, with expansion, recall, reranking, and source citations. Published on 5 April 2024 and granted on 9 July 2024."
ds-tcmsp:
  title_en: TCMSP
  summary_en: A pharmacology site for herb ingredients, targets, diseases, and ADME numbers. The site now keeps version 2.3 beside the newer 9.0.1, and the relationship tables can be downloaded.
ds-tcmid:
  title_en: TCMID 2.0
  summary_en: East China Normal University's database of formulas, herbs, ingredients, and targets. The data and the paper are on Zenodo and in Nucleic Acids Research. It is a different database from NUS TCM-ID. megabionet.org/tcmid timed out on this check.
ds-tcm-id:
  title_en: TCM-ID
  summary_en: NUS BIDD formula–herb–ingredient–target resource covering pharmacopoeia, classical, and CFDA-approved prescriptions; not the same database as TCMID 2.0.
ds-etcm:
  title_en: ETCM 2.0
  summary_en: Encyclopedia of TCM formulas, patent drugs, materia medica, and ingredients with target prediction and multi-scale networks; v1 site remains online.
ds-herb:
  title_en: HERB 2.0
  summary_en: Evidence-centered TCM resource integrating clinical trials, meta-analyses, high-throughput experiments, literature, and a knowledge graph.
ds-symmap:
  title_en: SymMap 2.0
  summary_en: Maps among herbs, TCM symptoms, modern symptoms, ingredients, targets, and diseases. The site is now version 2.0, updated with the 2020 Chinese Pharmacopoeia, and the relationship tables can be downloaded. The footer is dated 2022.
ds-batman-tcm:
  title_en: BATMAN-TCM 2.0
  summary_en: Known and predicted TCM ingredient–target protein interactions, with greatly expanded TTI coverage and target-to-ingredient search.
ds-tcm-taiwan:
  title_en: TCM Database@Taiwan
  summary_en: "More than 20,000 pure compounds isolated from 453 TCM ingredients, each in 2D and 3D, for virtual screening. tcm.cmu.edu.tw timed out on this check."
ds-hit:
  title_en: HIT 2.0
  summary_en: Manually curated herbal-ingredient–target activity pairs (~1,237 ingredients / 2,208 targets, 2000–2020 literature). Portal opens; the analysis backend port is currently down (marked site issue).
ds-ltm-tcm:
  title_en: LTM-TCM
  summary_en: "Links 14 TCM databases with clinical records and classical books across symptoms, prescriptions, plants, ingredients, and targets: 1,928 symptoms, 48,126 prescriptions, 9,122 plants, 34,967 ingredients, and 13,109 targets. cloud.tasly.com does not resolve on this check."
ds-tcmio:
  title_en: TCMIO
  summary_en: Immuno-oncology TCM database of prescriptions, herbs, ingredients, targets, and pathways, with downloads and a REST API.
ds-cemtdd:
  title_en: CEMTDD
  summary_en: An herbal–compound–target–disease resource centered on Uygur and Kazakh medicines. The paper reports about 621 herbs.
ds-yatcm:
  title_en: YaTCM
  summary_en: "1,813 prescriptions, 6,220 herbs, and 47,696 natural products, with target and pathway tools. The Nankai site returned 403 on this check."
ds-tcmbank:
  title_en: TCMBank
  summary_en: Large downloadable herb–ingredient–target–disease resource with literature-mining updates after manual checks.
ds-itcm:
  title_en: ITCM
  summary_en: Integrated formula/herb/ingredient/target platform plus 1,488 pharmacotranscriptomic profiles for 496 TCM ingredients (expression data also on Synapse).
ds-dcabm-tcm:
  title_en: DCABM-TCM
  summary_en: Literature-mined blood constituents and metabolites of TCM prescriptions and herbs, with experimental detection conditions (~1,816 structured absorbed constituents).
ds-cmaup:
  title_en: CMAUP
  summary_en: BIDD landscape of multi-target activities, pathways, and diseases for useful plants including TCM herbs; 2024 update, downloadable from the official site.
ds-supertcm:
  title_en: SuperTCM
  summary_en: "Charité resource of 6,516 TCM drugs, 5,372 botanical species, 55,772 active ingredients, 543 targets, 254 KEGG pathways, and 8,634 diseases. tcm.charite.de does not resolve on this check."
ds-tcmanalyzer:
  title_en: TCMAnalyzer
  summary_en: "Sun Yat-sen University toolkit for scaffold search of bioactive ingredients and for networks of molecules, targets, pathways, and diseases. rcdd.org.cn timed out on this check."
ds-tcm-mesh:
  title_en: TCM-Mesh
  summary_en: "Network-pharmacology resource with 6,235 herbs, 383,840 compounds, 14,298 genes, 6,204 diseases, 163,221 side-effect records, and 71 toxicity records. The old site returned 403 on this check."
ds-tcmgenedit:
  title_en: TCMGeneDIT
  summary_en: "Text-mined links among TCM, genes, diseases, effects, and ingredients, joined to pathways and protein interactions. tcm.lifescience.ntu.edu.tw does not resolve on this check."
ds-cvdhd:
  title_en: CVDHD
  summary_en: "3D structures of 35,230 natural products from cardiovascular herbs, docked to 2,395 target proteins, with related diseases, pathways, and clinical biomarkers. The original Peking University site timed out on this check."
ds-tm-mc:
  title_en: TM-MC
  summary_en: KIOM's literature-derived database of Northeast Asian medicinal materials and compounds. The 2015 release covers about 536 materials, and the 2024 version 2.0 expands to about 34,000 compounds. The old address says the data and services have moved to tm-mc.kr.
model-guangyi-qizhi:
  summary_en: Guangyi Qizhi is Guang'anmen Hospital's TCM service model for triage, pre-consultation,
    charting, and syndrome-formula advice; version 2.0 adds an agent doctor and the system has completed
    algorithm filing.
model-shuzhi-qihuang:
  summary_en: Shuzhi Qihuang is a TCM model from East China Normal University and partner institutes;
    version 1.0 offers QA and knowledge-graph interaction, and version 2.0 extends it to multimodal Chinese
    and Western medicine data.
model-shuzhi-bencao:
  summary_en: Shuzhi Bencao is Tasly and Huawei Cloud's dual language-and-molecule TCM model, built on
    Pangu, for classic-text QA, molecular computation, and herbal R&D screening.
model-tianhe-lingshu:
  summary_en: Tianhe Lingshu is a TCM model from the National Supercomputing Center in Tianjin and Tianjin
    University of Traditional Chinese Medicine; version 1.0 targets acupuncture with a 3D acupoint avatar,
    and version 2.0 covers more than 20 clinical specialties.
model-rendu-suwen:
  summary_en: Rendu Suwen is Transn's TCM model on its Rendu base and moH architecture, offering proactive
    consultation, syndrome analysis, and formula suggestions, and it passed CAICT's TCM large-model evaluation
    at level 4+.
model-dayi-jingui:
  summary_en: Dayi Jingui is a TCM model jointly built by Wenge and the China Academy of Chinese Medical
    Sciences for syndrome reasoning, treatment planning, and four-diagnostic health management.
model-zhongsi:
  summary_en: Zhongsi is a vertical TCM model released by Merchants Union Consumer Finance with Sun Yat-sen
    University and Shenzhen Hospital of Guangzhou University of Chinese Medicine for QA, consultation
    notes, and formula suggestions in community clinics.
model-xinhuo-zhongguoyao:
  summary_en: Xinhuo Zhongguoyao is an education TCM model led by Beijing University of Chinese Medicine
    for study, teaching, research, administration, and international communication, and it received generative-AI
    service filing in 2026.
model-qiyuan:
  summary_en: Qiyuan is the Seventh People's Hospital of Shanghai's TCM model, trained with pretraining,
    domain fine-tuning, and expert reinforcement learning, for generative records and famous-doctor agent
    twins.
model-huazu-bencao:
  summary_en: Huazu Bencao is an ethnic-medicine model led by Guizhou Medical University, using Shuzhi
    Qihuang and Qwen to connect multi-ethnic classics and a knowledge graph across ingredient screening,
    formulation, quality control, and teaching.
model-bianshi-yunzhongyi:
  summary_en: Bianshi Yun Zhongyi is Wisdom Eye's TCM application on its filed multimodal Bianshi model,
    using a symptom-to-formula knowledge graph for four-diagnostic capture and decision support.
model-zhongxing-changbai:
  summary_en: Zhongxing Changbai Qihuang is a multimodal reasoning TCM model from Changchun University
    of Chinese Medicine and partner universities, with a family health assistant and a Jipai doctor assistant.
model-yiyin:
  summary_en: The Yiyin classic TCM model from Zhongyi Online is trained on medical canons and classical
    prescriptions, shows its syndrome-reasoning steps, and supports primary-care clinics in Song County.
model-gushengtang-brain:
  summary_en: Gushengtang TCM Brain connects national-physician AI avatars to the hospital information
    system for history taking, record drafting, syndrome support, and prescription support with traceable
    rationale.
model-qihuang-wendao:
  summary_en: Qihuang Wendao is Nanjing Dajing TCM's vertical model, using a large TCM knowledge graph
    and clinical data for syndrome diagnosis, prescriptions, and regimen advice in medical institutions.
model-zhifu-qihuang-tiangong:
  summary_en: Zhifu Qihuang Tiangong is a TCM model from Zhifu Qihuang and Harbin Institute of Technology,
    trained on cases and famous-doctor formulas for several syndrome systems, and it backs four-diagnostic
    constitution reports under algorithm filing.
model-zhangzhongjing-tcm:
  summary_en: The Zhang Zhongjing TCM model, released by Henan University of Chinese Medicine and the
    University of Science and Technology Beijing, covers syndrome differentiation, syndrome-element recommendation,
    classical formulas, and formula analysis for clinical decision support.
model-hengqin-r1:
  summary_en: Hengqin-R1 is the Guangdong Provincial Laboratory of TCM's vertical reasoning model, combining
    fine-tuning, reinforcement learning, and a knowledge graph for syndrome reasoning, combined Chinese-Western
    medication agents, and objective four diagnostics.
ds-yiankb:
  summary_en: Case search, structuring, and mining platform of the Institute of Information on Traditional
    Chinese Medicine, China Academy of Chinese Medical Sciences. An institute news item on 2026-09-20
    states that the current resource holds more than 1.1 million structured historical and modern cases,
    plus 19.63 million analysis records, with about 53,000 registered users. Registration or institutional
    login is required, and no public bulk download was found. Some campus trial notes still say about
    500,000 cases.
ds-tcmkb:
  summary_en: Knowledge-service homepage maintained by the Institute of Information on Traditional Chinese
    Medicine, CACMS, for search, knowledge graphs, and disease profiles. A related about page from the
    same institute says that, starting in 2019, it built a professional TCM knowledge service for the
    China Knowledge Centre for Engineering Sciences and Technology, bringing together diseases, formulas,
    herbs, and literature. The homepage opens; campus trial notes require registration on an institutional
    network, and no public bulk download was found.
ds-gydc:
  summary_en: Image-and-text library of historical Chinese medical books from the Institute of Information
    on Traditional Chinese Medicine and its library, CACMS. The current entry is the version-4 site. Public
    descriptions put the holdings at roughly 2,500 to 3,000 titles from pre-Qin through the late Qing
    and Republican periods, with basic, advanced, and controlled-vocabulary search and image-text viewing.
    Access is by campus network or registration, not a public bulk download.
ds-zhonghuayidian:
  summary_en: Commercial sales site (Feixiong Technology) for the Zhonghua Yidian electronic collection.
    The site states 1,156 classical titles and about 450 million characters, a 2000 national electronic-publication
    nomination, and Qiu Peiran as editorial reviewer and title writer. Edition 6 is a web version used
    after purchase and registration, not a public download.
ds-ntcm-ancient-lib:
  summary_en: Ancient-book and traditional-knowledge portal started in 2022 by the Institute of Information
    on Traditional Chinese Medicine, CACMS. It has halls for classical texts, Republican-era documents,
    and bibliographic catalogs, and links out to reading systems including Guoyi Diancang. The portal
    opens; full text is reached through the sub-libraries and is not a public bulk download.
ds-icd11-tm:
  summary_en: Official WHO explanation of the ICD-11 supplementary chapter Traditional Medicine Conditions.
    The chapter is for optional dual coding of morbidity and is not used for mortality. Module I covers
    traditional-medicine conditions that originated in ancient China and are now used in China, Japan,
    Korea, and elsewhere. This page explains the chapter; the codes themselves are read in the ICD-11
    browser. The page is public.
ds-who-acupoint:
  summary_en: WHO Regional Office for the Western Pacific standard for acupuncture point locations, published
    in 2008 and reprinted in 2009. The IRIS record states the surface-location method and 361 points for
    teaching, research, clinical service, publication, and academic exchange, and provides the English
    PDF. Experts from China, Japan, and Korea joined the location consensus. The record page is public.
ds-gbt-12346:
  summary_en: Current Chinese national standard Nomenclature and location of meridian points, issued and
    effective on 26 November 2021, under the National Administration of Traditional Chinese Medicine.
    The official full-text disclosure system offers online preview and download. This is the standard
    page, not a separately packaged acupoint table.
ds-gbt-15657:
  summary_en: Current Chinese national standard Classification and codes of diseases and patterns of traditional
    Chinese medicine, issued and effective on 11 October 2021, replacing GB/T 15657-1995, under the National
    Administration of Traditional Chinese Medicine. The official full-text disclosure system offers online
    preview and download. This is the standard page, not a standalone machine-readable code package.
ds-gbt-16751-1:
  summary_en: 'Current national standard Clinic terminology of traditional Chinese medical diagnosis and
    treatment — Part 1: Diseases, issued and effective on 17 March 2023, under the National Administration
    of Traditional Chinese Medicine. The official full-text disclosure system offers online preview and
    download. Syndrome and therapeutic-method parts have their own full-text pages.'
ds-gbt-16751-2:
  summary_en: 'Current national standard Clinic terminology of traditional Chinese medical diagnosis and
    treatment — Part 2: Syndromes/patterns, issued and effective on 26 November 2021. The official full-text
    disclosure system offers online preview and download. This is the syndrome-terminology standard page,
    not a separate vocabulary dump.'
ds-gbt-16751-3:
  summary_en: 'Current national standard Clinic terminology of traditional Chinese medical diagnosis and
    treatment — Part 3: Therapeutic methods, issued and effective on 17 March 2023. The official full-text
    disclosure system offers online preview and download. This is the therapeutic-method standard page,
    not a separate vocabulary dump.'
ds-sofda:
  summary_en: Syndrome-ontology platform built by the Institute of Chinese Materia Medica, CACMS, and
    collaborators. The iMeta 2023 paper describes 319 curated syndromes, 8,045 diseases, and 1,359 formulas,
    linked to genes, diseases, and formulas. The paper page checks out; the front page currently shows no readable
    syndrome content. It shares the tcmip.cn host with ETCM but is a separate syndrome
    system. No anonymous full-database mirror was found.
ds-bencaodian:
  summary_en: Bilingual TCM seed data from the Bencao Dian editorial group, released under CC BY-SA 4.0
    as directly downloadable JSON. Version 1, generated on 17 April 2026, lists 365 herb records, 112
    formulas, 84 patterns, and 208 acupoints, plus meridians, tongue and pulse entries, and a relation
    graph. A coverage note on the same page says 335 of about 530 standard materia medica items are included.
    This is an editorial vocabulary, not a national standard.
ds-tcmpg:
  summary_en: Traditional Chinese medicine plant-genome database maintained by Chengdu University of Traditional
    Chinese Medicine and collaborators. The current homepage lists 274 plants, 324 genomes, 414 herbs,
    and 13,809 ingredients, with BLAST, JBrowse, and other tools. A 2024 paper describes the 2.0 upgrade.
    The site is open for browsing and analysis; a full packaged dump was not verified.
ds-tcmssd:
  summary_en: Syndrome-standardization database reported by authors at Zhejiang Chinese Medical University.
    The paper reports 624 syndromes, 133,518 prescriptions, 8,073 diseases, 8,259 herbs, 43,413 ingredients,
    and 17,602 targets. The site opens and its front-end script contains syndrome and TCMSSD content;
    without JavaScript the page is empty. No full-database download entry was found.
ds-hkbu-cmmid:
  summary_en: Chinese medicinal-material image library from the School of Chinese Medicine, Hong Kong
    Baptist University. The library page states more than 420 commonly used crude drugs, with source,
    origin, morphology, properties, indications, and high-resolution images, searchable by Chinese, Latin,
    and English names. It has been online since 2013 and is openly browsable, not a bulk download.
ds-hkbu-cmfid:
  summary_en: Formula image library from the School of Chinese Medicine, Hong Kong Baptist University,
    openly browsing composition, actions, indications, and images. The browse page shows about 182 formulas,
    and the public counter starts in November 2017. It is an online reference, not a bulk formula-table
    download.
ds-tradmpd:
  summary_en: Traditional Medical and Pharmaceutical Database at the University of Toyama Institute of Natural Medicine. A MEXT regional innovation cluster grant supported it in 2008–2012. It covers crude-drug identity, properties, Kampo composition and indications, and more than 10,000 Kampo papers. The Wakanyaku Library holds nearly 80 compounds plus chemical and bioassay data for hot-water extracts of 80 crude drugs and 80 Kampo extracts, with bioassay downloads from 2024. The database site returned 503 on this check; the institute portal still lists the address.
ds-kampodb:
  summary_en: Kampo mechanism database maintained by the Institute of Natural Medicine, University of
    Toyama. It links formulas, crude drugs, natural compounds, and target proteins, including known interactions
    and docking predictions. The about page currently lists 298 Kampo formulas, 180 crude drugs, 3,002
    natural compounds, 62,906 proteins or genes, and 3,063,505 docking results. The 2018 Scientific Reports
    paper is the citation; the site news records a renewal on 15 July 2021.
ds-mpdb-nibn:
  summary_en: Comprehensive medicinal-plant database of the NIBIOHN Research Center for Medicinal Plant
    Resources. The home page describes medicinal plants, crude drugs, constituents and genes, cultivation,
    and internal morphology, plus measured data for representative crude drugs in Japanese circulation.
    The footer copyright is 2012–2025, funded by a MHLW research grant. Separate Kampo-formula and Japanese
    Pharmacopoeia crude-drug lists are online.
ds-ekat:
  summary_en: Evidence Reports of Kampo Treatment, a structured-abstract database from the Japan Society
    for Oriental Medicine EBM committee. The site says it has been free and updated since 2007. It covers
    RCTs and meta-analyses of Kampo products still on the market, limited to reports since 1986 that used
    the same quality as marketed products; decoctions are excluded because product quality is unknown.
    Japanese and English editions are provided, and the Association of Korean Medicine has a Korean translation.
ds-ethmedmmm:
  summary_en: Ethnomedicine specimen database of the Museum of Materia Medica at the University of Toyama.
    The home-page table lists 461 kinds and 8,942 Japanese–Chinese crude-drug specimens, opened in Japanese
    in April 2000. The same site also has an English crude-drug list and separate Unani, Thai, Ayurvedic,
    and Indonesian collections. The latest note is a version-7 rebuild on 30 March 2018. The site returned 503 on this check; the institute portal still lists the address.
ds-ktkp-tm:
  summary_en: Korean-medicine slice of the Korean Traditional Knowledge Portal, run for the Ministry of
    Intellectual Property. The English introduction says the database was compiled from traditional Korean
    medicine literature in 2005–2007 and opened for search in December 2007. The same page currently counts
    5,500 herbs, 7,103 prescriptions, and 12,500 diseases, linked to effects, indications, formulas, and
    patent classes.
ds-nikom-kmmb:
  summary_en: "Korean Medicine Material Bank at the National Institute for Korean Medicine Development. On 1 January 2016 it was formed by merging the natural-substance bank and the herbal biomaterial bank. The herb page lists 691 items, with name, synonym, scientific name, botanical source, and reacting enzymes."
ds-kmcric:
  summary_en: Data portal of the Korean Medicine Convergence Research Information Center at Kyung Hee
    University. The data-center page lists an evidence-based Korean-medicine literature set of systematic
    reviews, RCTs, and mechanism studies published since 2010; an herb-interaction set based on Natural
    Standard; acupoint videos made from the 2008 WHO Western Pacific standard locations; and a crude-drug
    update built with the Kyung Hee and Chungbuk pharmacy faculties. The director’s biography says the
    directorship began in 2013.
ds-nwipb-tibetan-mm:
  summary_en: Tibetan materia-medica list published by the Key Laboratory of Tibetan Medicine Research
    at the CAS Northwest Institute of Plateau Biology. The page is a table of Chinese name, Latin name,
    drug name, and part used, and it states that there are 15 pages. Entry paths are dated March–April
    2022. It is a crude-drug list, not a compound–target database.
ds-sowa-rigpa-mm:
  summary_en: Open Data in Brief table of Latin identifications for commonly used Sowa Rigpa materia medica.
    The paper says about 700 commonly used items were selected from the Four Medical Treatises and Gawé
    Dorjé’s classification, with Tibetan script, Wylie transliteration, and Latin names; the supplement
    is published with the article. The authors are at the School of Tibetan Medicine, Gansu University of Chinese Medicine, the University of Wisconsin-Madison, and the College of Pharmacy at Qinghai Nationalities University. The data-source location is the ethnic-medicine center at Chengdu University of Traditional Chinese Medicine.
ds-dai-medicinal-plants:
  summary_en: Dai medicinal-plant source database on the Chinese Union of Botanical Gardens platform,
    from Xishuangbanna Tropical Botanical Garden, CAS. The home page is copyrighted 2018 and describes
    Dai medicine’s four towers, five aggregates, and antidote theory. The species-list URL returns a redirect
    notice, and no anonymously browsable species catalogue was confirmed.
ds-nmg-ethnic-drug-list:
  summary_en: Public ethnic-medicine catalogue PDF from the Inner Mongolia Healthcare Security Administration,
    mainly finished Mongolian formulas. The government filename is dated 25 December 2023. The extracted
    text is titled the Inner Mongolia ethnic-medicine catalogue and notes that listed drugs are managed
    as class B. It is a reimbursement list, not a research compound database.
wst-kg-imhre:
  summary_en: KG-IMHRE guides an LLM with subgraph mining and dynamic retrieval queries over the Zhao
    Bingnan dermatology school graph. On that benchmark it scores 85.2 on multiple choice, 45.78 on open
    questions, and 73.38 overall.
wst-tcm-classic-translator:
  summary_en: "TCM Classic-Translator is a LoRA model for classical-to-modern TCM translation, trained on Huangdi Neijing and Shanghan Lun parallels with commentary augmentation. BLEU-4, ROUGE-1, ROUGE-2, and ROUGE-L are 39.3534, 55.0474, 35.8099, and 54.6551."
wst-xinglin-ner:
  summary_en: XingLin-NER is a generative NER framework that instruction-tunes structured and reasoning
    prompts for variable TCM clinical terms, scored with TCM-BERT semantic similarity. It is an extraction
    method, not a general TCM chat model.
wst-kd-sdt-llm:
  summary_en: GPT-4o distills TCM case records into syndrome-differentiation instructions, then LoRA-tunes
    Qwen2.5-7B. The paper reports more readable reasoning while keeping prescription accuracy. No brand
    name or public weights.
wst-sft-rag-qa:
  summary_en: ChatGLM3 is supervised-fine-tuned with PissA and then wrapped in RAG. Reported scores are
    BLEU 14.5830 and ROUGE-1 34.6730; with RAG the TCM item-bank F rises to 0.6398 from a 0.2654 ChatGLM3
    baseline.
wst-lora-guji-llm:
  summary_en: Shanghan Lun QA pairs from GPT-4, plus ShenNong and cMedQA2, are used to LoRA-tune five
    base models and to compare full LoRA with 8-bit and 4-bit QLoRA on Qwen-7B-Chat. That model gains
    17.61 BLEU and 21.4 ROUGE-L over its base. No separate model name.
wst-ad-rag-qa:
  summary_en: "LangChain grounds ChatGLM3-6B on a local library of Alzheimer guidelines and textbooks endorsed by the Chinese Association of Integrative Medicine and the Chinese Medical Association. Against bare ChatGLM3-6B, factual-accuracy wins are 88.09% and completeness wins 85.71%."
wst-mmkgqa:
  summary_en: "MMKGQA answers marine Chinese materia medica questions from the MMKG graph using Aho-Corasick and Word2Vec. On a questionnaire corpus, mean precision, recall, and F1 are 97.93%, 83.41%, and 89.10%. It is not an LLM system."
bucm-syndrome-element-llm:
  summary_en: Instr-MT-TCM, an instruction-tuned TCM embedding model, is paired with an LLM for syndrome-element
    differentiation. On 1,793 real cases the joint method reaches mean F1 0.927 versus 0.512 for manual
    labels, and is applied to 48 prostate-cancer cases.
cdm-pico-tcm-qa:
  summary_en: Cui et al. use ERNIE Bot to extract PICO triples from a polycystic-ovary guideline, store
    248 nodes and 337 relations in Neo4j, and draft 12 question classes with 24 templates for a guideline
    QA system.
jtcm-yayi-preconsult:
  summary_en: Liu et al. fine-tune YAYI 2-30B with DeepSpeed ZeRO-3 and couple it to a weighted symptom-graph agent. On the simulated tests, practitioner-exam accuracy is 94.09%, licensed Chinese-pharmacy exam accuracy 78.00%, symptom-term recognition 87.50%, and meridian recognition 68.80%. In the clinical test, syndrome accuracy is 88.33%, with fewer turns and less time than attending physicians.
smgcn:
  summary_en: Syndrome-aware multi-graph convolution for herb recommendation. Besides the symptom–herb
    graph, it adds symptom and herb co-occurrence graphs, fuses an implicit syndrome vector, then ranks
    herbs.
mgcn-jep:
  summary_en: Multi-graph convolutional prescription model on the Treatise on Cold Damage. Symptom features
    are aggregated on state-element and syndrome graphs, then an MLP predicts the herb set.
kg-herb-fitee:
  summary_en: Graph-attention herb recommendation guided by a knowledge graph mined from TCM literature
    and prescriptions, with formula-theory signals added in the prediction layer.
kdhr:
  summary_en: Knowledge-driven herb recommendation by multi-layer graph-convolution fusion over a TCM
    knowledge graph. Code is public.
presrecrf:
  summary_en: Fuses a molecular knowledge graph with TCM semantic representations from large models, and
    predicts both herbs and dosages. Code and data are on GitHub.
ds-tonguedx:
  summary_en: 'Public remote-tongue dataset: 5,109 images from 4,650 subjects, eight binary attributes
    (pale, red tip/side, red spots, ecchymosis, cracks, tooth marks, thick fur, yellow fur), plus age
    and sex. The repository is downloadable. This is not the later TongueDx2 ablation paper.'
pat-cn122135923:
  summary_en: "Recalls case records and treatment rationales through vector and text paths, four routes in all, then a large model drafts TCM diagnosis, syndrome pattern, a Western diagnosis, and a herbal prescription. Published on 2 June 2026 and not yet granted."
pat-cn120299726:
  summary_en: "Turns unstructured case records into structured knowledge, then patient, doctor, assistant, and expert agents collaborate to simulate a TCM diagnostic encounter. Published on 11 July 2025 and not yet granted."
pat-cn120148827:
  summary_en: "A pretrained large model fuses TCM syndrome knowledge with a Western pathology graph and proposes cardiovascular decisions that include Western drugs, Chinese herbal formulas, and non-drug measures. Published on 13 June 2025 and not yet granted."
pat-cn120913881:
  summary_en: "Trains a multimodal TCM large model on tongue images, speech, and inquiry text, then outputs a preliminary TCM analysis. Granted on 12 June 2026."
news-202512-30:
  summary_en: "Guang'anmen Hospital reports that Guangyi Qizhi completed national deep-synthesis algorithm filing and describes itself as the first TCM hospital to do so."
news-202510-30:
  summary_en: "Science and Technology Daily reports the CTA clinical-research agent, fine-tuned from Qwen2.5-14B for trial protocols, data management, and statistics."
news-202510-31:
  summary_en: "China Economic Net reports the 26 October release of Idiom-Hypertension, an integrated Chinese-Western model for hypertension care."
news-202603-30:
  summary_en: "Shanghai University of TCM says its formula-syndrome multimodal model was selected as a stage result of a national AI application pilot base."
news-202605-13:
  summary_en: "Beijing University of Chinese Medicine says XinHuo ZhongGuoYao appeared at the 2026 World Digital Education Conference and its Q&A edition is on the national smart-education platform."
news-202609-29:
  summary_en: "China News Service reports that the formula-syndrome model opened for access on 19 September, covering assisted care, research mining, and training, with planned deployment at Longhua Hospital."
news-202610-09:
  summary_en: "Reports say Nanjing University of Chinese Medicine released the LingSu Aihu TCM nursing model on 9 October; 27 member hospitals are the first sites."
news-202601-09:
  summary_en: "TCM Congbao says its Suwen content-generation algorithm was included in the 14th CAC deep-synthesis filing batch."
pat-cn121460113:
  summary_en: "LoRA-tunes a TCM language model that maps syndrome and chief complaint to a formula (published, not granted)."
pat-cn121562809:
  summary_en: "Chunks TCM text, plans multi-hop paths on a knowledge graph, and trains a large model to generate a TCM question bank (published, not granted)."
pat-cn120913769:
  summary_en: "A multimodal model turns a tongue image into a condition description and a medicinal-drink recommendation. Published on 7 November 2025 and granted on 29 May 2026."
pat-cn122508432:
  summary_en: "Sends a small sample to a TCM-tuned large model for a preliminary quality check of a TCM knowledge graph (published, not granted)."
pat-cn119069137:
  summary_en: "Uses a large model to read tongue images by constitution, symptoms, and an overall interpretation (published, not granted)."
pat-cn119049664:
  summary_en: "Converts wearable signals into TCM terms and passes them to a TCM large model (published; deemed withdrawn on 6 February 2026)."
pat-cn119049665:
  summary_en: "A six-meridian TCM dialogue system over a body-area network and a large model (published; deemed withdrawn on 6 February 2026)."
surv-yin2025-ai-tcm:
  summary_en: "Reviews AI for TCM across data mining, large language models, and multimodal fusion, aimed at multi-component herbal formulas."
surv-liu2025-netpharm-llm:
  summary_en: "Reviews how network pharmacology and large language models jointly explain multi-target mechanisms of TCM formulas."
surv-sun2026-generative:
  summary_en: "Reviews advances and applications of generative models in traditional Chinese medicine."
surv-wang2026-eval-rethink:
  summary_en: "Argues that TCM LLM evaluation still lacks a quality floor: unfiltered classics and web text can contain outdated advice, and a single case is not a benchmark."
surv-dong2026-rx-review:
  summary_en: "Reviews computational herbal-prescription recommendation and how it can support TCM clinical decisions."
surv-cacms2026-digital:
  summary_en: "Discusses opportunities and challenges for TCM as AI moves from expert systems to deep learning and large language models."
surv-li2026-ebm:
  summary_en: "Discusses digital intelligent evidence-based methods for evidence-informed decisions in Chinese medicine."
surv-dcmed2026-diagnosis:
  summary_en: "Discusses interdisciplinary integration and development trends of intelligent diagnosis in TCM."
tcm-llm-eval-gscm:
  summary_en: "Builds a clinical-practice evaluation for TCM large language models, arguing that Western medical benchmarks do not fit."
lingdan-jamia:
  summary_en: "JAMIA paper on Lingdan, a TCM large language model for encoding domain knowledge in clinical reasoning tasks. Distinct from the later Digital Chinese Medicine prescription-evaluation paper."
tcm-prompt-npj:
  summary_en: "Evaluates 16 models on TCM and shows that prompt effects depend on the model, which complicates reliable deployment."
tcm-llm-mechanism-jbhi:
  summary_en: "An LLM method for mechanism exploration and downstream application in TCM."
tembed-ddi:
  summary_en: "Annotates cross-domain drug interactions with large language models and bidirectional networks, and adds a Chinese-medicine interaction evaluation."
tcm-cot-rag:
  summary_en: "Retrieval-augmented generation with chain-of-thought for TCM rheumatology decisions."
tcm-hyperrag:
  summary_en: "Higher-order knowledge hypergraphs for TCM diagnosis and prescription recommendation, with traceable evidence passed to a backbone model."
acugpt-agent:
  summary_en: "Combines a specialized LLM, an infertility-acupuncture knowledge graph and routing across specialist knowledge bases; EvalAcu assesses domain knowledge and task performance."
llm-sdat:
  summary_en: "A knowledge-informed LLM framework for TCM syndrome differentiation."
acukg:
  summary_en: "A knowledge graph of medical acupuncture built with entity recognition, relation extraction, and ontology mapping."
kampobench:
  summary_en: "Physician-reviewed Kampo consultation benchmark: 74 scenarios and 310 dialogue-level criteria, scoring application rather than exam recall."
tkm-cpx-agent:
  summary_en: "LLM plus retrieval-augmented generation and multimodal cues to automate traditional Korean medicine CPX scenarios; validated by 10 experts."
sdt-treat-bench:
  summary_en: "Scientific Data benchmark for evaluating syndrome differentiation and treatment in large language models."
tcm-llm-practice-cm:
  summary_en: "Discusses how large language models can link implicit TCM knowledge with syndrome-based clinical practice."
tcm-kg-qa-bigcomp:
  summary_en: "Knowledge-graph-enhanced large language models for TCM question answering."
hpr-dual-align:
  summary_en: "Medical-knowledge-enhanced dual-level alignment network for herbal prescription recommendation."
dmease:
  summary_en: "An AI assistant for TCM doctors diagnosing and treating diabetes mellitus."
tcm-tongue-onto-llm:
  summary_en: "Uses a large language model to help construct a TCM tongue-diagnosis ontology."
acu-cases-kg:
  summary_en: "Builds a knowledge graph of famous acupuncturists' cases by extracting information with a large language model."
acu-llm-eswa:
  summary_en: "Studies compensation mechanisms of large language models in acupuncture clinical decision-making."
acu-llm-jmir:
  summary_en: "Compares ChatGPT, DeepSeek, and physician-generated acupuncture treatment plans."
tcm-instr-ft-dlut:
  summary_en: "Instruction fine-tuning of large language models for TCM."
tcm-syndrome-ft:
  summary_en: "Fine-tunes large language models for TCM syndrome differentiation."
tcm-kg-qa-ccis:
  summary_en: "An intelligent TCM question-answering system that joins a knowledge graph with large language models."
tcm-consult-kg-llm:
  summary_en: "Case study of integrating large language models with knowledge graphs in TCM consultation."
tcm-rx-multistage:
  summary_en: "A large language model for TCM prescription recommendation trained in multiple stages."
tcm-patent-re:
  summary_en: "Relation extraction over TCM patents with a large language model and diversified semantic interaction."
llama3-tcm-iet:
  summary_en: "Fine-tunes Llama 3, Phi-3.5, and Mistral on TCM data to improve Chinese TCM language coverage."
tcmhp:
  summary_en: "A large language model for TCM health preservation (preventive care)."
tcm-physio-kg-llm:
  summary_en: "Connects dynamic knowledge graphs with large language models for TCM physiological modeling."
tcmqa:
  summary_en: The paper reports 38,279 questions and 101 practitioners. The current HF release documents 33,872 qa rows and
    5,250 doctor-annotated rows with 102 practitioners and 15,151 responses. Configurations overlap, so their counts must
    not be summed as unique questions. Pin the release; CC BY-NC-SA 4.0.
tcm-clinical-reason:
  summary_en: "2,000 multicenter EHR cases testing whether a model can reason from pathogenesis and syndrome to treatment principle and prescription."
tcm-rx-sss:
  summary_en: "Four-stage alignment for TCM prescription generation covering auditable li-fa-fang-yao reasoning, follow-up adjustment, and contraindications such as the eighteen antagonisms."
tcmscience:
  summary_en: "An autonomous TCM research agent that separates language-model proposals from execution and release authority."
tcm-falsify-agent:
  summary_en: "A model-agnostic falsification protocol for auditable syndrome differentiation on the public 200-case TCMEval-SDT set."
linglan-mm-llm:
  summary_en: "A multimodal TCM diagnosis model over the four examinations. Not the LingLan benchmark paper (arXiv 2602.01779)."
ds-sdt-treat-bench:
  summary_en: "Scientific Data benchmark for syndrome differentiation and treatment with large language models."
ds-tcmqa:
  summary_en: The paper reports 38,279 questions and 101 practitioners. The current HF release documents 33,872 qa rows and
    5,250 doctor-annotated rows with 102 practitioners and 15,151 responses. Configurations overlap, so their counts must
    not be summed as unique questions. Pin the release; CC BY-NC-SA 4.0.
ds-tcm-clinical-reason:
  summary_en: "2,000 multicenter records for reasoning from pathogenesis to prescription."
ds-kampobench:
  summary_en: "Physician-reviewed Kampo consultation benchmark with 74 scenarios and 310 dialogue-level criteria."
ds-acukg:
  summary_en: "Knowledge graph of medical acupuncture assembled from guidelines, literature, trials, and ontology mapping."
pat-cn117493579:
  summary_en: "An LLM extracts named entities and relations from TCM text, merges similar entities, and builds a TCM knowledge graph (published, not granted)."
pat-cn118070907:
  summary_en: "Synonym-augmented TCM text trains a Transformer LLM that is fine-tuned to parse customer requests and draft replies; the application was granted as CN118070907B on 2024-07-09."
pat-cn118098506:
  summary_en: "ChatGLM3-6B is fine-tuned on labeled symptoms, points, and operations to propose acupuncture plans, which are scored by sentence similarity (published, not granted)."
pat-cn118280556:
  summary_en: "An LLM handles spoken inquiry while computer vision converts patient images into findings that are retrieved and fed back to the LLM for TCM decision support (published, not granted)."
pat-cn118430833:
  summary_en: "Retrieval augmentation and model fine-tuning are trained together so the system can explain TCM terms and syndromes and suggest treatment from a patient query (published, not granted)."
pat-cn117786590:
  summary_en: "An LLM rewrites patient diagnostic text, which is then semantically interpreted to predict TCM syndromes and causes and to suggest treatment. Published on 1 April 2024."
pat-cn118899077:
  summary_en: "TongueAI builds tongue- and face-image readings, multi-turn questions, and constitution-reasoning data, then instruction-tunes TongueLMM for those three tasks. Published on 8 November 2024."
pat-cn119446558:
  summary_en: "A model trained on herbal and consultation data visualizes treatment options for a patient and is updated from outcome ratings. Published on 17 February 2025."
pat-cn119517372:
  summary_en: "A dataset built from TCM literature trains an LLM that takes a user's medical question and returns a dialogue answer. Published on 27 February 2025."
pat-cn119252469:
  summary_en: "Labeled tongue images and historical records train a tongue-inquiry model used to construct an LLM for an intelligent TCM system. Published on 7 January 2025."
pat-cn119811630:
  summary_en: "An LLM predicts core lesion keywords from urological TCM inquiry text and adjusts its parameters from recorded feedback. Published on 11 April 2025."
pat-cn119811698:
  summary_en: "Handwritten herbal prescriptions are OCR'd into prompts on incompatibility, dosage, and administration, which a large model scores into an overall judgment. Published on 11 April 2025."
pat-cn120108651:
  summary_en: "Shared knowledge domains fine-tune a chest-and-lung TCM inquiry LLM that outputs constitution and symptom parameters and recommends food-medicine formulas. Published on 5 June 2025."
pat-cn120216657:
  summary_en: "A Chinese-materia-medica knowledge base trains the pharmacovigilance RAG model PV-RAG to answer natural-language safety questions. Published on 27 June 2025."
pat-cn120337029:
  summary_en: "Entities from multi-source herbal data are mapped to modern pharmacological indicators, then a pretrained large model is adaptively fine-tuned to classify herbs. Published on 18 July 2025."
pat-cn120809097:
  summary_en: "An LLM first performs TCM syndrome differentiation, then generates personalized five-tone therapy music under tonal constraints. Published on 17 October 2025."
pat-cn121034544:
  summary_en: "A dynamically updated acupuncture knowledge graph is combined with time-series clinical features, graph attention, and reinforcement learning to differentiate syndromes and draft acupuncture plans. Published on 28 November 2025."
pat-cn121096596:
  summary_en: "Tongue-image features are fused with clinical text, similar cases are retrieved, and a multimodal LLM drafts syndrome, diagnosis, herbal prescription, and reasoning. Published on 9 December 2025."
pat-cn121210613:
  summary_en: "An acupuncture LLM answers questions from vector-retrieved knowledge snippets and, for diagnosis requests, retrieves treatment entries from an acupuncture-plan library. Published on 26 December 2025."
pat-cn121212280:
  summary_en: "An LLM extracts triples from manufacturing text under TCM term and relation constraints, then a human-cyber-physical ontology assembles a manufacturing knowledge graph. Published on 25 December 2025."
pat-cn121393746:
  summary_en: "Multi-source clinical data are quantified and cleaned, then a meridian-syndrome knowledge base and an LLM generate acupuncture plans. Published on 23 January 2026."
pat-cn122050683:
  summary_en: "Herbal prescription generation is cast as multi-label classification, with graph attention and an LLM modeling drug synergy and contraindications. Published on 15 May 2026."
pat-cn122245713:
  summary_en: "Intent is parsed from multimodal inquiry data, then dual-path retrieval over TCM knowledge produces the consultation result (published, not granted)."
pat-cn122364665:
  summary_en: "An LLM finds candidate symptom spans in sliced classical TCM texts and maps them into a standard symptom semantic field (published, not granted)."
news-202501-08:
  summary_en: "On 8 January 2025, the University of Science and Technology Beijing and Henan University of Chinese Medicine released Zhang Zhongjing TCM Large Model 1.0 for syndrome differentiation, syndrome-element recommendation, classical formulas, and formula analysis."
news-202503-13:
  summary_en: "Xinhua reported that on 13 March 2025 Huang Huang's team at Nanjing University of Chinese Medicine and Hangzhou Maijing Health released an AI system that combines an LLM and a knowledge graph to operationalize formula-person matching."
news-202503-31:
  summary_en: "Hefei Yunzhen said it released the Yunzhen Huayi TCM model on its TongueLMM tongue model and DeepSeek-R1 for syndrome differentiation, constitution assessment, and report generation."
news-202504-12:
  summary_en: "Ifeng reported that on 11 April 2025, at the Huawei Cloud ecosystem conference, Jiuwei Health released the Jiuwei Shennong TCM agent on the Pangu model for drug R&D, formula optimization, and clinical support."
news-202505-11:
  summary_en: "Beijing University of Chinese Medicine said that on 10 May 2025 it released Xinhuo Zhongguoyao Zhisiti 1.0, a education model of more than 70 billion parameters built on iFlytek Spark and DeepSeek."
news-202506-06:
  summary_en: "Nanjing University of Chinese Medicine said that on 6 June 2025 it released Lingshan TCM Model (Xiao Xingren) and Sushan Chinese Materia Medica Model (Sushan Zhisiti) for clinical, teaching, and research use."
news-202506-18:
  summary_en: "The National Data Administration listed a Chengdu University of TCM case that uses a large model to segment and tag 996 classical books and ChatGLM-6B to link TCM terms into graphs such as point-organ relations."
news-202508-06:
  summary_en: "Hubei Daily reported that on 6 August 2025 Hubei University of Chinese Medicine, Hubei Shizhen Laboratory, and Transn signed a cooperation agreement centered on the Chuanshen Suwen TCM model."
news-202509-12:
  summary_en: "Guang'anmen Hospital said that on 12 September 2025, at the CIFTIS forum, it released Guangyi Qizhi 2.0 and the AI doctor An'an, already shown on outpatient guidance and pre-consultation screens."
news-202509-10:
  summary_en: "The China Academy of Chinese Medical Sciences said that at CIFTIS on 10-14 September 2025 its intelligent-science center showed the Dayi Jinkui LLM and multi-turn inquiry system, plus tongue-diagnosis and mobile TCM testing units."
news-202511-02:
  summary_en: "USTB said that on 2 November 2025 in Zhengzhou it jointly released the Qihuang Acupuncture model, which turns four-diagnostic readings into acupuncture prescriptions."
news-202601-08:
  summary_en: "Chengdu University of TCM said Wen Chuanbiao's team project, a high-quality TCM AI-model dataset numbered 2025-AISJK-02013, was selected for the 2025 MIIT and NMPA AI medical-device challenge list."
news-202603-17:
  summary_en: "China News of Traditional Chinese Medicine reported that on 17 March 2026 Li Haiyan said the Yiyuan TCM model is being tried for case structuring, intelligent inquiry, prescription recommendation, and rational use of Chinese patent medicines."
ds-gancao-tcm-instruct:
  summary_en: "Public Gancao-TCM-Instruct release with 25,000 cases and 125,000 samples covering disease diagnosis, syndrome diagnosis, treatment selection, base-formula selection, and herb selection."
ds-tricmdf-acupuncture:
  summary_en: "Expert-verified instruction corpus for TCM models, instantiated for acupuncture across consensus, experiential, and perception tables; the repository releases text, not the image or video files."
ds-tcm-classics-clauses:
  summary_en: "Clause-level corpus of five classical TCM texts totaling 3,569 clauses with sentence-BERT embeddings: Song-edition Shanghan Lun, Guilin Shanghan Zabing Lun, Jingui Yuhan Jing, Jingui Yaolue, and Fu Qingzhu Nüke."
ds-famous-old-tcm-cases:
  summary_en: "Outpatient cases from Contemporary Famous Old Chinese Medicine Doctors' Typical Cases Collection; the card says each case includes the illness description, syndrome differentiation, and prescriptions."
ds-tcmle:
  summary_en: "Chinese TCM practitioner licensing question bank with 7,956 items: 2,700 assistant-practitioner and 5,256 practitioner questions, including past papers and mocks."
ds-pharmacist-tcm-2023:
  summary_en: "TCM Pharmacy track items from the 2023 Chinese National Pharmacist Licensure Examination; the card says they were collected online and points to FreedomIntelligence/HuatuoGPT-II."
ds-tw-moe-tcm-mcq:
  summary_en: "Past national TCM exam questions from Taiwan's Ministry of Examination; the README gives ROC years 96–111 excluding 110, and the repository file is basic theory of traditional Chinese medicine.csv."
ds-jtb-tw-tcm-exam:
  summary_en: "JTB Tech compilation of Taiwan Ministry of Examination TCM questions for ROC years 90–113, covering TCM internal medicine, basic medicine, and clinical medicine."
ds-cmmlu-tcm:
  summary_en: "CMMLU Traditional Chinese Medicine test split; the card shows a 185-example load and the file traditional_chinese_medicine.json."
ds-tcm-drug-name-overrely:
  summary_en: "Experiment data for the paper on whether LLMs over-rely on names to identify ingredients of Chinese drugs, linked from the dataset card to arXiv:2504.03786."
ds-tongue-color-cls:
  summary_en: "TongueProjectTCM tongue-image set whose card lists images and integer labels, with 807 training and 121 validation examples."
ds-tcm19w-sft-part:
  summary_en: "The card describes a partial non-web TCM instruction-tuning set, released as TCM19W_Part1.json."
ds-tw-tcm-cot:
  summary_en: "minyichen/tw-tcm card lists 8,145 training examples with question, answer, source, and think fields."
ds-tcm-humanities-mcq:
  summary_en: "Multiple-choice questions on medical humanities, ethics, and physician regulations, curated by the Traditional Chinese Medicine Language Model Team; the card marks the size as under 1,000."
ds-tcm-formula-names:
  summary_en: "Cross-linguistic table of TCM formula names in Chinese, Japanese Kampo, Korean Han medicine, and English, compiled from official formularies and clinical references in Taiwan."
ds-tcm-semkg-v2:
  summary_en: "Version 2.0 semantic knowledge graph linking diseases, patterns, symptoms, and herbs, released as node and edge CSV files."
ds-tcm-term-llm-eval:
  summary_en: "Evaluation set for using large language models as judges of TCM terminology, containing 376 contrasts from the 2022 WHO International Standard Terminologies on Traditional Chinese Medicine."
ds-tcm-prompt-lang:
  summary_en: "972 model responses for 18 TCM terms across six general-purpose models, three prompt languages (Chinese, English, and Malay), and three runs, with WHO 2007 and 2022 terminology references."
ds-herb-efficacy-relations:
  summary_en: "Structured herb–efficacy relations converted from classical TCM efficacy wording for knowledge-graph construction, formula-efficacy prediction, and herb–symptom association."
ds-tonguebench-2694:
  summary_en: "2,694 tongue images and 22 labels; compares nine multimodal models, three prompting strategies and repeated-output stability. Image data and an inference/scoring demo are available."
ds-sciencedb-tcm-qa:
  summary_en: "Science Data Bank set of 6,157 question-answer pairs built from classic Chinese medicine literature."
ds-sciencedb-tcm-case-gen:
  summary_en: "Generation set for TCM medical-case commentary, with 510 standardized source cases and 2,550 training and test instances compiled from gynecological classics."
ds-tcmefo:
  summary_en: "Formal ontology for traditional Chinese medicine efficacy, providing a hierarchical computable framework over concepts, relations, and herbal-medicine instances."
ds-chm-315:
  summary_en: "Fine-grained Chinese herbal-medicine image set with 315 categories and 126,000 images, 400 images per category."
ds-herbpairiam:
  summary_en: "Data and model artifacts for attributing adverse-reaction signals to components of multi-component Kampo medicines, with a zip archive and README on Zenodo."
ds-baize-botanical-images:
  summary_en: "Medicinal-plant origin images for Baize Traditional Chinese Medicine, covering habitats, original plants, and medicinal parts, with Chinese and Latin identification based on the Chinese Pharmacopoeia, Flora of China, and the Engler system."
evaluating-large-language:
  summary_en: "The authors tested GPT-4o, GPT-5, DeepSeek-V3, and DeepSeek-R1 under six prompts for literature retrieval in CNKI, Wanfang, PubMed, and Embase on psoriasis, COVID-19, and type 2 diabetes; the deduplicated gold-standard set contained 182 records (50, 74, and 58)."
development-llm-based-cpx:
  summary_en: "In the Korean-medicine CPX practice chatbot, Claude-3.5-Sonnet scored every sample with perfect quantitative accuracy and averaged 43.2 seconds, faster than GPT-4."
knowledge-graphs-combined:
  summary_en: "The study built a depression-specific acupuncture knowledge graph and used large language models to optimize knowledge integration for researchers and clinicians."
study-intelligent-diagnosis:
  summary_en: "Using large language models plus manual annotation on 82 acupuncture texts and clinical data, the authors built a graph of 16,558 entities and 80,084 relations; on 90 patients with diminished ovarian reserve, diagnostic agreement with experts was 86.7%."
supporting-chinese:
  summary_en: "On the 2023 Chinese postgraduate examination for traditional Chinese medicine, Ernie Bot scored 50.30% and ChatGLM 46.67%, both above the passing score, with the highest scores in the medical humanities module."
ic-bert-instruction-classifier:
  summary_en: "IC-BERT uses a BERT text filter to limit which questions a traditional Chinese medicine large language model may answer, so as to reduce fabricated facts when questions fall outside its capability."
dynamic-disease-tracking:
  summary_en: "The system connects multi-turn consultation and temporal analysis to a large language model for personalized traditional Chinese medicine prescriptions, and on 1,000 insomnia cases it improved initial-case inference, diagnostic accuracy, and adaptability."
named-entity-recognition:
  summary_en: "For named-entity recognition in traditional Chinese medicine obesity literature, prompt-optimized DeepSeek-R1 reached an F1-score of 0.927 on the test set."
reunderstanding-classification-syndromes:
  summary_en: "From ten selected Three-Yang passages in Shang Han Lun, Chinese and English ChatGLM 4.0 and ChatGPT-4.0 reclassified cases by modern medical consensus; among the four outputs, Chinese ChatGLM 4.0 was closest to the original Three-Yang grouping and English ChatGLM 4.0 diverged the most."
prompt-rag-pioneering-vector:
  summary_en: "Prompt-RAG, which does not use vector embeddings, outperformed ChatGPT and vector-embedding retrieval-augmented generation on relevance and informativeness in a Korean-medicine question-answering chatbot."
large-language-models:
  summary_en: "From 349 de-identified outpatient cases at 62 hospitals, the authors used 60 cases to compare 16 large language models with 60 practicing traditional Chinese medicine physicians, scored blindly by five senior experts across nine diagnostic and therapeutic dimensions."
study-automated-data:
  summary_en: "Through interactive questioning, a large language model ran frequency, clustering, and Apriori association analyses on traditional Chinese medicine prescriptions for osteoporosis, and the automated results were highly similar to manual SPSS statistics."
research-construction-traditional:
  summary_en: "Prompted large language models extracted entities and relations from eight coronary-heart-disease guidelines of traditional or integrative Chinese medicine published in the past decade, producing a knowledge graph of 452 nodes and 690 relations, with BERT+CNN selected as the best intent-recognition model."
evaluating-semantic-fidelity:
  summary_en: "For English translation of traditional Chinese medicine classics, DeepSeek exceeded Google Translate and ChatGPT-5 on BERTScore semantic fidelity to the human reference, while ChatGPT-5 produced more semantically coherent text across sentences."
knowledge-guided-chinese-confucian:
  summary_en: "The intelligent traditional Chinese medicine tutor links a large language model to a knowledge graph from the Golden Mirror of Medicine; of 125 student volunteers, 102 questionnaires were analyzed, and the integrated system produced higher immediate post-test scores than the large-language-model-only group and the self-study group."
research-organization-application:
  summary_en: "The authors used large language models and a knowledge graph to organize medicinal materials, processing methods, adjuvants, and effects in Lingnan herbal classics, stored the graph in Neo4j, and combined BERT-CAN-NER with generative large models for natural-language question answering."
contemporary-chinese:
  summary_en: "Large language models recognized traditional Chinese medicine entities and classified citation intent in patents; 72.9% of the patent citations showed low knowledge integration, and Systematic Differentiation of Warm Diseases ranked highest in technological impact."
tcm:
  summary_en: "The prescription model retrieves similar cases with weighted BM25 and adds a drug knowledge graph from the Compendium of Materia Medica plus the eighteen incompatibilities and eighteen antagonisms, then passes that evidence to a large language model; experiments used the CCL2025 traditional Chinese medicine benchmark."
method-constructing-tcm:
  summary_en: "The syndrome-differentiation question-answering framework connects a curated traditional Chinese medicine repository to a large language model through structured retrieval, in order to improve factual accuracy, contextual precision, and professional quality."
large-chinese-analysis:
  summary_en: "On one standardized migraine case, nine large language models were compared with two traditional Chinese medicine physicians and a published case response, scored blindly by 32 experts; GPT o3, Qwen 3, and Gemini 2.5 Pro matched or exceeded selected comparators in some domains, while Aya Expanse 32B scored lower."
intelligent-tcm-diagnosis:
  summary_en: "The locally deployed system uses four agents for inspection, listening, inquiry, and palpation, coordinated by modular component processing and multimodal retrieval-augmented generation, and a central reasoning module turns tongue images, voice, pulse, and symptoms into a diagnosis and health advice."
smart-virtual-patients:
  summary_en: "The traditional Chinese medicine virtual patient combines a large language model and a knowledge graph with beam search and Sentence-BERT pruning, reaching 53.2% symptom consistency and 62.5% recall, both above the prompt-plus-knowledge-graph baseline."
llm-driven-unsupervised-discovery:
  summary_en: "DeepSeek-V3.2 induced 458 raw labels from 12,163 traditional Chinese medicine herb records and 64,107 short sentences, merged into 22 semantic categories; Qwen3-Embedding-8B found average internal coherence above 60% for 19 concepts, and experts rated reasonableness 4.64 on a 1-to-5 scale."
multimodal-tcm-seven-emotion:
  summary_en: "The seven-emotion framework reached a macro F1 of 87.6% on 10,593 IEMOCAP samples, then used a frozen large language model to turn the neural predictions into traditional Chinese medicine syndrome-differentiation reports."
construction-knowledge-graph:
  summary_en: "Using 22 group-standard documents on functional specifications for traditional Chinese medicine information systems, the authors constrained DeepSeek with CRISPE prompts to extract entities and relations and then applied rule-based constraints to build a knowledge graph."
performance-assessment-chatgpt-4:
  summary_en: "The authors gave medical records of 87 metabolic-dysfunction-associated fatty-liver-disease cases treated with traditional Chinese medicine to ChatGPT-4.0, ChatGLM4, ChatGLM4 with a knowledge base, and ChatGLM3-6B, comparing syndrome differentiation, confusion of Chinese and Western concepts, and treatment-plan text."
from:
  summary_en: "Using the same three prompts for each sampled term, the authors tested with ChatGPT-4o whether the WHO 2007 and 2022 traditional Chinese medicine terminology standards give enough explicit information for auditable selection among coexisting English variants."
tcmrd-kg-design-development:
  summary_en: "TCMRD-KG is described as the first rheumatism-specific knowledge graph built from ancient traditional Chinese medicine books, with entity labeling that combines automatic annotation by mainstream large language models and manual review."
conveying-imagistic-thinking:
  summary_en: "From four foundational passages of Huangdi Neijing, prompt scaffolding guided DeepSeek V3.1 to convey metaphor and metonymy; ChatGPT 5 Pro and Gemini 2.5 Pro then simulated three reader types and scored human, baseline, and prompt-adjusted translations on five cognitive dimensions, with the prompt-adjusted translations best on all five."
surv-artificial-intelligence-bridging-ancient-pract:
  summary_en: "This review analyzes traditional Chinese medicine large language models along construction, application, challenges, and prospects, noting that systems such as Qibo and MedChatZH already exist while earlier reviews lacked a synthesis of shared characteristics."
surv-artificial-intelligence-catalyst-modernization:
  summary_en: "This scoping review searched PubMed, Web of Science, and CNKI through 2025 and states that deep learning and large language models show promising accuracy on tongue-image analysis and syndrome differentiation, in some studies approaching expert-level performance."
surv-domestic-international-research-trends-artific:
  summary_en: "The authors systematically reviewed 23 Korean-medicine artificial-intelligence studies from 2019 to 2025, ten domestic and thirteen international, and report that recent work increasingly uses large language models and other generative AI."
surv-empirical-wisdom-computational-intelligence-kn:
  summary_en: "The paper proposes a knowledge–data dual-driven paradigm that turns implicit traditional Chinese medicine experience into computable structure with large-scale knowledge graphs and TCM-specific large language models, and digitizes the four examinations into a multimodal TCM phenomics."
surv-xiangshu-omics-framework-spatio-temporal:
  summary_en: "This review says it is the first to systematically construct XiangShu omics, and states that its large model integrates large language models grounded in the classical logic of principle, method, formula, and medicine, such as Shu-Zhi Qihuang."
utilizing-large-language:
  summary_en: "The authors assembled 389 articles on traditional Chinese medicine against COVID-19 and manually annotated 48 of them with six entity types; under fuzzy match ChatGPT beat BERT question-answering models on 5 of 6 tasks, while exact match reversed that pattern, and none of GPT-4's F1 scores on herb, target, or research method exceeded 0.5."
surv-ai-driven-multi-scale-target:
  summary_en: "This review of multi-scale traditional Chinese medicine target analysis lists the development of TCM-specific large language models among its future directions, in order to decode TCM pharmacological logic."
km-cpx-pilot:
  summary_en: "The authors turned a National Institute of Korean Medicine standardized-patient scenario into text and used role prompting and few-shot prompting with GPT-4 to build a Korean-medicine CPX practice chatbot; internal scoring found relatively high correctness and compliance, with confidentiality and naturalness still needing improvement."
tcmkg-qa:
  summary_en: "TCMKG used expert-guided prompting on the Xin'an medical-case corpus to build a traditional Chinese medicine knowledge graph of 37,192 entities and 130,030 relations, with information-extraction precision 0.89, recall 0.88, and F1 0.88."
nsclc-cot-ft:
  summary_en: "For non-small-cell lung cancer, the two-stage chain-of-thought fine-tuning improved prescription generation and proprietary-Chinese-medicine recommendation by 1.2% and 6.1% over the baseline."
fine-med-mental:
  summary_en: "Fine-Med-Mental-T&P used DeepSeek-V3 to draft and Qwen3-32B to rewrite answers, screening 16,000 theory instructions from textbooks and guidelines and 4,000 practice instructions from more than 600 real case seeds, for 20,000 instruction pairs on traditional Chinese medicine mental disorders."
tongue-mllm-region:
  summary_en: "A multimodal large-model method for region-aware, bidirectional evidence-based tongue diagnosis."
ai-tongue-abdominal:
  summary_en: "A mobile tongue-diagnosis expert system that uses large language models to detect abdominal disease."
km-rag-jmir:
  summary_en: "An open-weight LLM chatbot for Korean medical consultation, comparing retrieval-augmented generation with metadata filtering."
ai-tcm-cms:
  summary_en: "Reviews multimodal fusion and machine learning for AI-assisted diagnosis and treatment in traditional Chinese medicine."
ds-acusim:
  summary_en: "Synthetic dataset for localising cervicocranial acupuncture points, built because expert annotation is costly and limits detector training."
ds-tf-disease-corpus:
  summary_en: "Annotated corpus of traditional formula–disease relations in biomedical articles. Formulas are herb combinations prepared under traditional medicine principles."
ds-tcmp-300:
  summary_en: "Image dataset of traditional Chinese medicinal plants for plant recognition."
ds-tcm-chole-metab:
  summary_en: "Serum and urine metabolomics for two TCM syndromes in cholelithiasis: liver qi stagnation and liver-gallbladder damp-heat."
ds-tcm-tx-atlas:
  summary_en: "Harmonized transcriptomic atlas of traditional Chinese medicine perturbations, assembled from public treatment experiments."
ds-tongue-bish:
  summary_en: "Tongue-image dataset with pathological annotations for AI-assisted TCM diagnosis."
ds-tcm-ms2link:
  summary_en: "AI-ready dataset joining curated herb–compound links (TCM-MolLink) with MS/MS spectra."
ds-tcm-qa-sdb:
  summary_en: "Traditional Chinese medicine question-answering set plus the knowledge graph, prompt-engineering code, and experiment outputs."
ds-prcot-syndrome:
  summary_en: "Syndrome-manifestation cases with gold labels and model predictions, built under pathogenesis reasoning chain-of-thought supervision."
ds-cn-article-llm-index:
  summary_en: "Key-information extraction and summary scores from four large models on 100 Chinese medical research articles."
ds-treeprobe:
  summary_en: "Tibetan-medicine benchmark for measuring cultural bias in large language models."
ds-six-meridian:
  summary_en: "Traditional Chinese medicine dataset for six-meridian syndrome differentiation."
ds-tcmdi:
  summary_en: "Benchmark for predicting contraindicated interactions between traditional Chinese medicines and drugs."
ds-vietmedkg:
  summary_en: "Knowledge graph and benchmark for traditional Vietnamese medicine."
cotke-tcm:
  summary_en: "CotKE-TCM prompts a large language model with chain-of-thought and retrieves similar cases, generated TCM knowledge, and clinical experience for syndrome differentiation, tested on the CHIP 2024 track."
tcm-qa-robot:
  summary_en: "Builds a traditional Chinese medicine question-answering robot with retrieval-augmented generation and a self-built dataset."
tcm-grpo-reason:
  summary_en: "Generates interpretable traditional Chinese medicine clinical reasoning chains with group relative policy optimization and multi-dimensional rewards."
acu-chatbot-eval:
  summary_en: "Compares five free chatbots (ChatGPT, Claude, Copilot, Gemini, and Perplexity) and three subscribed ones (ChatGPT, Claude, and Perplexity) on 2,528 oriental-medicine acupuncture theory items and 100 acupuncture-infection items. The median theory score was 75%, below 86% on the infection items."
pat-cn121709160:
  summary_en: "Fine-tunes Qwen-VL with tongue-diagnosis prompts so a tongue image yields structured color and coating labels plus a natural-language reading (published, not granted)."
pat-cn119941636:
  summary_en: "Extracts tongue-coating and pulse features, fuses them with text by cross-modal attention, and trains a multimodal TCM large language model. Published on 6 May 2025."
pat-cn121331451:
  summary_en: "Takes tongue image as the main signal, adds heart rate and self-reported text, and prompts DeepSeek to write a health-status assessment (published, not granted)."
pat-cn120998428:
  summary_en: "A formula-optimization LLM proposes a macro revision, a smaller pharmacologic model traces constituent herbs, and the two are merged into a final formula. Published on 20 November 2025 and not yet granted."
pat-cn122135936:
  summary_en: "Encodes a case with a Chinese instruction LLM, fuses it with a dynamic TCM knowledge graph, and returns formula recommendations as answers (published, not granted)."
pat-cn122436116:
  summary_en: "Combines a spleen-stomach school knowledge graph, vector retrieval, and an LLM for formula selection, safety checks, and prescription writing (published, not granted)."
pat-cn119905208:
  summary_en: "Blends content-based recommendation, collaborative filtering, and an LLM reading of symptom text to rank personalized formulas (published, not granted)."
pat-cn121460056:
  summary_en: "An LLM maps case entities to disease and syndrome, drafts a formula, scores it, and regenerates from structured advice until the score passes (published, not granted)."
pat-cn122531762:
  summary_en: "A rule engine enumerates structured TCM features, an LLM turns them into simulated cases, and those cases fine-tune a customized prescription model (published, not granted)."
pat-cn122436251:
  summary_en: "Aligns four-examination and course features, retrieves past acupuncture plans, and uses a fine-tuned LLM with chain-of-thought for an explainable plan (published, not granted)."
pat-cn120674039:
  summary_en: "Trains a language model on medical records so symptoms map to acupuncture points, then applies parameter tuning and policy optimization (published, not granted)."
pat-cn121524286:
  summary_en: "Builds a cardiovascular acupuncture knowledge graph and sends hits to a cloud LLM for wording; if retrieval fails, the LLM answers with a caution (published, not granted)."
news-202601-05:
  summary_en: "Xinhua reports that on 24 December 2025 Henan's health commission showed a meridian-assisted diagnosis model and the Yuyao multimodal Shennong materia medica model for herb identification, authentication, assay, and origin tracing."
news-202601-12:
  summary_en: "Science and Technology Daily reports that on 9 January Guangdong Provincial Hospital of Chinese Medicine launched a matrix of famous-doctor decision models; dermatology and cardiovascular models are already in clinical use."
news-202607-29:
  summary_en: "Xinhua reports that in July 2026 the national medical AI pilot base released five results in Henan, including a meridian-diagnosis model, an esophageal-cancer model, a TCM dataset, a Chinese-medicine R&D model, and a famous-doctor agent."
news-202608-27:
  summary_en: "The university site says the Qian Xiaoxing medical model was released on 27 August 2026, trained on TCM literature, expert experience, and clinical data for diagnosis support, constitution identification, wellness advice, and medication guidance."
news-202608-24:
  summary_en: "Southern Finance reports that Guangzhou University of Chinese Medicine continued-trains a general model on about 2 billion TCM tokens into the Xinglin teaching model, now piloted in three core courses."
ds-vtm-tda:
  summary_en: "A FAIR computational benchmark of Vietnamese traditional medicine digitized from Do Tat Loi's pharmacopoeia, with 724 harmonized botanical entities and 1,635 historical prescriptions."
ds-tongueatlas-4k:
  summary_en: "A 4,000-image clinical tongue benchmark with certified TCM expert labels for 22 appearance categories, released for MIRNet (AAAI 2026, to appear). The Zenodo record is restricted."
ds-yizong-jinjian-triples:
  summary_en: "25,571 knowledge triples extracted from the Golden Mirror of Medicine, covering medicinals, formulas, diseases, acupoints, and theory across 1,105 relation types."
ds-tcm-qm:
  summary_en: "Gas-phase DFT descriptors for 3,196 TCM-related molecules, with 16,918 deduplicated herb–molecule provenance links."
ds-hwtcm-sft-v1:
  summary_en: "Haiwei AI Team's 7,096-example TCM instruction set. Text from websites, forums, and books was converted to QA and scored for expertise, safety, and fluency."
ds-hwtcm-r1-distill:
  summary_en: "Haiwei AI Team's DeepSeek-distilled TCM reasoning QA set built from web text. The authors state that it was not manually reviewed."
pulse-smartphone-impedance:
  summary_en: "Feasibility study of TCM pulse diagnosis on a smartphone by measuring skin impedance at acupoints, approximating fingertip pressure over the artery."
pulse-bionic-protocol:
  summary_en: "A protocol for digitizing TCM pulse information with bionic pulse-diagnosis equipment."
pulse-dl-health:
  summary_en: "Signal processing and deep learning for health-status classification from TCM pulse signals."
pulse-cnn-diabetes:
  summary_en: "Data processing so a convolutional network can read TCM pulse signals for diabetes, addressing the low repeatability of fingertip pulse diagnosis."
constitution-tap:
  summary_en: "TCM constitution diagnosis that combines tongue, voice, and pulse indices."
pulse-rater-agreement:
  summary_en: "Test–retest reliability and inter-rater agreement of TCM pulse diagnosis by two practitioners on 300 participants."
tcm-incompat-formula-net:
  summary_en: "A network of 362 TCM formulas, plus chemical space and metabolism space, used to examine the eighteen antagonisms and nineteen mutual inhibitors."
anderation-incompat:
  summary_en: "Anti-community detection, using a node's degree and its inner-to-outer degree ratio, applied to herb incompatibility in TCM."
tcm-lbd-adverse:
  summary_en: "Literature-based search for TCM alternatives that may lessen adverse reactions of western drugs, with depression treatment as the case."
kemre:
  summary_en: "Knowledge-enhanced relation extraction from Chinese medicine instruction texts."
tcm-ml-safety:
  summary_en: "Random-forest safety scoring of 127 bioactive compounds from 24 herbs, drawn from TCMSP, TCMID, PubChem, and ChEMBL, with separate weights for FDA, EMA, and CFDA priorities."
biobert-hdi:
  summary_en: "BioBERT predicts herb–drug interactions from the literature and is compared with other machine-learning models."
surv-tcm-safety-outlook:
  summary_en: "Review of why TCM toxicity is hard to study: multi-component formulas and unpredictable drug–body interactions, unlike chemical or biological drugs."
surv-tcm-insilico-tox:
  summary_en: "Mini-review of in silico toxicity studies of traditional Chinese herbal medicine."
surv-tcm-wm-safety:
  summary_en: "A clinical framework for safety of combined Chinese and western drugs: prediction, risk detection, mechanism checks, and decision support before and during use."
surv-tcm-xai:
  summary_en: "Argues that TCM AI is limited by a mismatch between statistical models and syndrome-based reasoning, so explanations are required."
ds-tcm4nsclc:
  summary_en: 3,790 non-small-cell lung cancer case records from one senior TCM physician, including repeat visits,
    for syndrome differentiation, prescription, and real-world research.
pulse-ml-preg-chd:
  summary_en: "A portable MEMS/CMOS pulse device records healthy women, women with coronary heart disease, and women in the first trimester, then machine learning separates pregnancy from coronary heart disease."
tpc-gcn:
  summary_en: "Improved SMOTE augments pulse samples, multi-domain features are extracted, and a graph convolutional network classifies TCM pulse patterns."
pulse-matrix:
  summary_en: "Objective pulse analysis with a TCM pulse matrix. The authors argue that current waveform definitions and objectification standards are incomplete."
pulse-pcos-ml:
  summary_en: "Machine learning on radial pulse-wave parameters separates polycystic ovary syndrome from healthy controls in 459 subjects, as a step toward objective TCM pulse diagnosis."
pulse-htn-ml:
  summary_en: "Machine-learning comparison of radial pulse waves from 450 people with hypertension and 479 healthy people, as an objective reference for TCM pulse diagnosis."
pulse-chd-hht:
  summary_en: "Hilbert–Huang energy and sample entropy of TCM pulse signals, classified with a random forest to separate coronary heart disease from healthy people."
pulse-dcnn-wrist:
  summary_en: "Shannon energy envelope and the Hilbert transform extract the wrist pulse, then a deep convolutional network recognizes it for TCM pulse diagnosis."
pulse-ppw-pregnancy:
  summary_en: "Deep learning relates the pulse pressure wave to pregnancy. The paper reports 84% accuracy and an AUC of 91%. The signal is the pressure wave, not the TCM pulse qualities of position, rate, shape, and force."
face-mobilevit:
  summary_en: "Statistical features and MobileViT for automatic TCM facial-complexion classification."
face-fsvm:
  summary_en: "After cheek segmentation, a fuzzy support vector machine with color modeling recognizes TCM facial complexion and reduces the effect of outliers."
face-constitution-color:
  summary_en: "Color face images of 5,150 people, with face detection and landmarks, used to classify TCM constitution from facial features."
face-complexion-quant:
  summary_en: "Computerized qualitative and quantitative recognition of facial color and gloss, reducing the subjectivity of experience-based face diagnosis."
face-cv-roi:
  summary_en: "Deep learning finds 68 facial landmarks, segments regions such as the ting, cheeks, and mingtang, then reads TCM complexion from color histograms."
gyn-jiezhai-kg:
  summary_en: "A Neo4j knowledge graph of Jiezhai Gong's obstetric and gynecological case records."
tcm-mkg-gnn:
  summary_en: "Interpretable graph neural networks quantify herb compatibility on a multidimensional TCM knowledge graph. Medicinal properties are virtual nodes. The study assesses herbal pieces in 6,080 formulas and checks 215 COVID-19 formulas."
tcm-principle-quant:
  summary_en: "A model trained on ancient and classical formula records quantifies the TCM mapping from symptom patterns to individualized herbal therapy, for comparison with modern biomedicine."
shanghan-eppi:
  summary_en: "Using empirical records from the Shanghan Lun, treats the exterior–interior pair of the Eight Principles as dimensionality reduction and tests whether it carries the most symptom information, is the most abstract, and helps formula choice."
syndrome-cnn-diabetes:
  summary_en: "Treats a diabetic patient's record as a one-dimensional image and symptoms as pixels. A multi-instance multi-task convolutional network finds relevant symptoms and maps them to syndromes."
ds-zhao-hanqing:
  summary_en: "De-identified 2025 internal-medicine outpatient prescriptions from Zhao Hanqing: 122 patients, 335 prescriptions, and 5,951 herb rows with gram doses. 75 are initial visits and 260 are follow-ups. Routes: 315 oral decoctions, 8 oral dissolved, 8 external washes, and 4 external uses. Dosing is twice daily in 333 prescriptions and three times daily in 2. Herb-name rows containing processing marks, which can overlap: stir-fried 412, honey-fried 341, bran 289, vinegar 164, ginger 154, wine 89, calcined 67, prepared 63, and processed Pinellia (Fa Ban Xia) 99. CC BY 4.0. The repository describes the clinic as Beijing Heniantang Hospital."
ds-tcmcpd:
  summary_en: "Structured case-derived tables: 4,895 patients, 12,900 visits, 703 herbs, 11,879 visit–syndrome links, and 63,192 visit–herb rows. Dose units are mostly grams (61,386), plus 1,067 qian, 364 pieces, 240 tablets, 69 liang, 64 fen, and 2 millilitres. Rows also link symptoms, ingredients, and targets, with Neo4j files. Full copyrighted case texts are not redistributed. The describing manuscript is a Research Square preprint."
ds-acu-cpg:
  summary_en: "A dataset of acupuncture clinical practice guidelines, released to make the guidelines easier to use in clinic."
ds-tcm-term-enzh:
  summary_en: "A Chinese–English terminology dataset for traditional Chinese medicine, published in China Scientific Data."
ds-km-exam:
  summary_en: "A traditional Korean medicine examination protocol, built from the literature and three rounds of expert review, with healthy-adult examination data collected over four years."
tcm-symptom-norm:
  summary_en: "Automatically maps symptom names in TCM electronic records onto a unified terminology, so mining can use clinical records rather than only manually extracted formulas."
tcm-symptom-norm-ccis:
  summary_en: "Automated methods for normalizing symptom names in traditional Chinese medicine records."
tcm-symptom-fine:
  summary_en: "Fine-grained extraction of nested symptom entities and relations from semi-structured TCM records, avoiding the loss from coarse labels."
icd11-tm-snomed:
  summary_en: "Compares traditional medicine entries in ICD-11 Chapter 26 with SNOMED CT in order to build a traditional-medicine ontology."
shanghan-kg:
  summary_en: "Constructs a knowledge graph of the Treatise on Febrile Diseases and reports an application."
shanghan-tinybert:
  summary_en: "Classifies the intent of questions about the Treatise on Febrile Diseases with a TinyBERT and convolutional network."
face-rx-conv:
  summary_en: "A convolutional model that builds an herbal prescription from multi-scale facial features, rather than from symptoms alone."
face-tongue-dm:
  summary_en: "Fuses tongue, face, and sublingual images to detect diabetes and impaired glucose regulation. Earlier work used only one of these views."
pulse-gamma-index:
  summary_en: "Fits Chinese pulse waveforms with collective gamma density functions to produce quantitative classification indices."
tcm-ocular-moe:
  summary_en: "Segments scleral-surface anomalies with a hierarchical mixture-of-experts network, to quantify TCM inspection of the whites of the eyes."
tcm-drl-course:
  summary_en: "Plans sequential herbal prescriptions across visits for chronic disease with deep reinforcement learning, rather than a single prescription."
tcm-constitution-aaai:
  summary_en: "End-to-end TCM constitution assessment from face and tongue images, pulse and voice, and inquiry text."
tcm-inquiry-philosophy:
  summary_en: "Syndrome differentiation that follows TCM inquiry, aimed at consultation systems that ask too little and ignore inquiry principles."
kampo-virtual-patient:
  summary_en: "A virtual patient for Kampo medical interviews, intended to support empathy and the pathological concepts used in Kampo."
face-htn-color:
  summary_en: "A classification model for TCM facial-color diagnosis of hypertension."
pulse-wgan:
  summary_en: "Wasserstein GAN augmentation of wrist-pulse signals for traditional Chinese medicine."
pulse-waveform-htn:
  summary_en: "Compares TCM wrist pulse-taking with pulse-waveform analysis and hemodynamics in people with hypertension."
tcm-sleep-anfis:
  summary_en: "Uses an adaptive neuro-fuzzy inference system to diagnose sleep disorders in a traditional Chinese medicine setting."
ds-tcmtoxdb:
  summary_en: "A toxicity database that separates toxic effects of formulas, herbs, and ingredients, and gathers targets for specific toxic manifestations. Five herb–target and ingredient–target prediction algorithms are included. Site: https://www.sdu-idea.cn/TCMToxDB."
ds-metaacupoint:
  summary_en: "900 synthetic RGB hand images from MetaHuman avatars in Unreal Engine, with bone-attached sockets for five hand acupoints used in Korean medicine."
ds-herb-hetnet:
  summary_en: "Heterogeneous biomedical graphs that include herb–target, herb–symptom, herb–herb, and symptom–symptom networks, together with protein–protein interaction networks."
surv-team-ehr-standards:
  summary_en: "Scoping review of English reports from January 2016 to March 2026 on how Korean medicine, TCM, and Kampo concepts are mapped into mainstream health-informatics standards."
surv-acupoint-dl:
  summary_en: "Review of deep-learning acupoint localization, grouped by body region, architecture, strategy, and image modality, including datasets and metrics."
surv-acupoint-cad:
  summary_en: "Systematic review of traditional algorithms and deep learning for acupoint localization across anatomical regions."
chest-bi-fhir:
  summary_en: "For chest bi syndrome and coronary heart disease, a FHIR and SNOMED CT data system with 9 subsets and 352 elements, 42.6% of them TCM-specific, plus a 128-rule trigger engine. A prospective controlled study enrolled 972 people."
gbt-iso-18668:
  summary_en: "Compares the Chinese national coding standard GB/T 31774-2015 with ISO 18668 parts 1–4 for Chinese medicines."
gbt-12346-interpret:
  summary_en: "Explains what changed in GB/T 12346-2021, Nomenclature and Location of Meridian Points, relative to the 2006 edition, including terms, definitions, body regions, and bone-proportional cun."
kampo-icd-modules:
  summary_en: "At a Kampo clinic, relates ICD-10 diagnoses of patients aged 20 or older, seen from October 2014 through June 2019, to ICD-11 traditional-medicine modules such as heat–cold and excess–deficiency."
icd11-ch26-supplement:
  summary_en: "Argues that ICD-11 Chapter 26, drawn from the WHO international standard terminologies, should keep the adopted patterns and add essential patterns that are still missing."
pipe-11:
  summary_en: "Pattern Identification and Prescription Expert-11, a decision-support system for putting the ICD-11 traditional medicine chapter into computable pattern identification and prescription."
stc-nf:
  summary_en: "Split-then-concatenate normalization of TCM symptom terms from electronic records: 12 fine-grained semantic labels, three named-entity recognizers, and a two-stage deep-learning model."
syndrome-criteria-apply:
  summary_en: "A Delphi guideline for judging whether TCM syndrome diagnostic criteria are usable: 5 domains and 25 items, scored on a 5-point scale. Domains are accessibility, readability, implementability, acceptability, and overall evaluation."
blt-tm-data-gap:
  summary_en: "Discusses data gaps for traditional medicine in the International Statistical Classification of Diseases."
shanghan-gcn:
  summary_en: "Builds a heterogeneous graph of the Treatise on Febrile Diseases and learns node representations with a graph convolutional network."
shanghan-textmine:
  summary_en: "Text mining and analysis of the Treatise on Febrile Diseases with natural language processing."
wenbing-bert-ner:
  summary_en: "BERT named-entity recognition for warm-disease texts in traditional Chinese medicine."
lungca-sd-e2e:
  summary_en: "End-to-end models trained to imitate traditional Chinese medicine syndrome differentiation in lung cancer diagnosis."
shanghan-physica-net:
  summary_en: "A complex-network model of the Treatise on Cold Damage."
wenre-shanghan-net:
  summary_en: "Network analysis of herbal formulas from Wenre Jingwei and the Shanghan Lun."
sd-longtail-kg:
  summary_en: "Knowledge-graph-enhanced long-tail learning for traditional Chinese medicine syndrome differentiation."
tcmkd:
  summary_en: "A proofread platform of syndromes, formulas, Chinese patent drugs, medicinal materials, ingredients, targets, and diseases, with mining, enrichment, and network analysis. https://cbcb.cdutcm.edu.cn/TCMKD/"
tcm-bert-cnn-sd:
  summary_en: "BERT and a convolutional network that map symptoms to multiple syndromes, using expert knowledge from public guidelines and textbooks and ten-fold cross-validation."
acu-gnn-bert:
  summary_en: "Models symptom–acupoint compatibility with a heterogeneous graph and a fine-tuned BERT, for acupoint recommendation."
t2fal-face-acu:
  summary_en: "A two-stage detector and regressor that localizes facial acupoints on multi-pose infrared thermal images, using bone-proportional cun and TCM anatomical rules."
ds-tcm-tox-exp:
  summary_en: "Literature-derived in vivo and in vitro toxicity experiments for chemical constituents of traditional Chinese medicines, including Naoyanghua, Banmao, croton, Yangjinhua, Fuzi, and Qingfen. Fields cover route, species, indicators such as LD50, toxic dose, target organ, pathology, and PMID."
ds-tcm-rx-dose:
  summary_en: "The repository readme describes 23 treatment methods, more than 400 subcategories, 4,174 common medicinal materials with doses and sources, and more than 900 classic formulas, with 21 feature categories. Files include Treatment.csv and a treatment–prescription workbook."
ds-syd-nk:
  summary_en: "366 TCM internal-medicine test items. Each item is a syndrome name plus a first-person symptom narrative. The card says the text was cleaned from an internal-medicine textbook and checked by TCM students. Apache-2.0."
tcmm-db:
  summary_en: "A unified database aimed at modernization of traditional Chinese medicine and therapeutic innovation."
taiwan-herb-adr:
  summary_en: "A system for reporting and evaluating adverse reactions to herbal medicine in Taiwan, covering 1998–2016."
unitcm:
  summary_en: "A reverse-pharmacology platform that links formulas and diseases to molecular findings, with layers for standardization, clinical discovery, molecular analysis, systems checks, and tools."
ihpreten:
  summary_en: "A supervised model with attribute regularization that predicts incompatible herb pairs in traditional Chinese medicine."
aconite-incompat-rules:
  summary_en: "Association-rule analysis of aconite prescriptions that contain incompatible herbs, comparing regions and compatibility features."
preg-contra-overview:
  summary_en: "A book chapter surveying Chinese medicines that are contraindicated in pregnancy."
rx-dose-fuzzy:
  summary_en: "Fuzzy analysis of how doses are allocated inside a traditional Chinese medicine prescription."
eswa-tcm-2025:
  summary_en: "Predicts traditional Chinese medicine toxicity with a heterogeneous network."
ds-classic-formula-key:
  summary_en: "Official key-information tables for ancient classic formulas, not patient records. The notices cover 7 formulas in 2020, 25 including Zhuye Shigao Tang in 2023, and 43 including Xuanfu Daizhe Tang in 2025. The 2025 table gives source, processing, and gram doses. In Xuanfu Daizhe Tang, licorice is dry-fried (41.40 g) and pinellia is Qing Ban Xia (34.50 g). The decoction uses 2000 mL of water, reduces to 1200 mL, removes the marc, boils again to 600 mL, and is taken warm at 200 mL three times a day."
tcm-tbosd:
  summary_en: "CCL 2025 shared task. Qilu University of Technology and the Affiliated Hospital of Shandong University of Traditional Chinese Medicine built TCM-TBOSD from de-identified records: 1,500 cases, 10 syndromes, 4 diseases, and 381 herbs. The prescription field lists herb names and, as the paper states, excludes doses. The repository has baseline code and a confidentiality form; the case table is not in the file listing."
tcm-dili-signals:
  summary_en: "Uses adverse-reaction monitoring data to look for new risk signals and susceptibility factors in traditional Chinese medicine–induced liver injury. The journal page publishes the article and does not release case rows."
sasang-fusion:
  summary_en: "KIOM fused face images, body shape, voice, and questionnaires from 2,973 patients at 23 Korean-medicine clinics to classify Sasang constitution. Test accuracy was 64.0% for men and 55.2% for women. The images and questionnaires are not publicly posted."
sasang-face-geom:
  summary_en: "Selects distances, angles, and distance ratios from facial photographs to distinguish Sasang constitution. The abstract counts 1,225 distance features, 61,250 angle features, and 749,700 ratio features. The photographs are not public."
constitution-body-image:
  summary_en: "Full-body standing photos of healthy people, labeled with the Constitution in Chinese Medicine Questionnaire. Complexion and body shape come from a color space and local binary patterns; a dual-branch network adds deep features from the whole-body image; a random forest then identifies the constitution. Accuracy 0.842, precision 0.868, F1 0.790."
face-uniform-lab:
  summary_en: "Recognizes TCM facial complexion in a uniform Lab color space. The face images are not public."
face-spirit-video:
  summary_en: "Classifies TCM spirit inspection from facial features in video. The videos are not public."
pulse-chd-param:
  summary_en: "Pressure-sensor pulse recordings from 251 people: 102 with coronary heart disease, 94 with other cardiovascular disease, and 55 healthy people. The recordings are not public."
pulse-fasting-cgc:
  summary_en: "Records Left Cun, Right Cun, and Right Guan pulses in 51 healthy adults before fasting (day 0), during fasting (day 4), and after fasting (day 7)."
pulse-multichannel-cnn:
  summary_en: "A convolutional network reads common pulse patterns from multichannel radial-artery signals after denoising and feature extraction. The sample size and the recordings are not public."
pulse-cnn9:
  summary_en: "A 9-layer convolutional network classifies TCM wrist-pulse signals without handcrafted features. The recordings are not public."
km-stroke-pi-agree:
  summary_en: "Two clinicians independently examined 168 hospitalized stroke patients with Korean-medicine pattern identification. AC1 was 0.66–0.89 for pulse, 0.66–0.95 for inspection, 0.67–0.88 for listening and smelling, and 0.62–0.94 for inquiry."
pulse-voice-cad:
  summary_en: "Shanghai University of Traditional Chinese Medicine and collaborators treat the radial pulse wave as pulse diagnosis and the voice as auscultation, to screen for coronary artery disease and heart failure. They recorded 553 people (healthy, coronary disease, and heart failure) and checked the model on another 194."
an-ihp:
  summary_en: "Attention networks predict incompatible herb pairs in traditional Chinese medicine."
ihp-cikm:
  summary_en: "A supervised learning framework for incompatible herb pairs, a 2018 conference paper in the same line as the later IHPreten model."
tcm-ddi-gat:
  summary_en: "Graph attention networks predict interactions among traditional Chinese medicines."
tcm-ms-tox:
  summary_en: "Machine learning on mass spectra predicts the toxicity of traditional Chinese medicines."
tcm-cv-tox:
  summary_en: "Structure-similarity software for predicting cardiovascular toxicity of traditional Chinese medicine."
chest-pain-18fan:
  summary_en: "Association-rule mining of the eighteen incompatible medicaments inside chest-pain prescriptions."
cmm-cardiac-adr:
  summary_en: "Bibliometrics and association rules for cardiac adverse reactions attributed to Chinese materia medica."
sipa-tcm:
  summary_en: "SiPA predicts several interactions at once so the TCM network among constituents, targets, and diseases can be expanded."
surv-hdi-onco:
  summary_en: "Review of herb–drug interactions in oncology, covering pharmacodynamic and pharmacokinetic mechanisms and risk prediction."
surv-ai-drug-herb:
  summary_en: "Review of artificial-intelligence models and tools for assessing drug–herb interactions."
gpt4-tw-tcm-exam:
  summary_en: "GPT-4 answered 480 items from the 2022 Taiwan TCM licensing examination and was compared with two licensed TCM doctors, using direct answers and explain-then-answer. Overall accuracy was 43.9% for the model, versus 70% and 78.4% for the two doctors. About 55.3% of the errors came from misunderstanding TCM concepts. This compares exam recall with licensed practitioners; it does not separately score syndrome judgment, prescription rationality, and safety checks."
jingfang-name-nn:
  summary_en: "A neural network trained on 261 formulae and 173 herbs extracted from the Shanghan Lun and the Synopsis of Prescriptions of the Golden Chamber. Given only the medicinal composition, it names the classical formula, and it is tested on modified formulae from different meridians."
ds-tcm-suite:
  summary_en: "A site that joins herb identification with network pharmacology. The Watson section currently lists 6,692 formulas, 7,322 herbs, 704,321 compounds, 19,319 proteins, and 15,437 diseases. Holmes identifies herbs with marker genes. Described in iMeta in 2022."
ds-npass:
  summary_en: "A database of measured activity for natural products. This version lists 204,023 natural products, 48,940 source organisms, 8,764 targets, and 1,048,756 activity records, with values drawn from ChEMBL and the literature. Species records were also taken from TCM-ID, TCMID, TCMSP, and TM-MC. The 2026 update appeared in Nucleic Acids Research in November 2025."
ds-zhongyishijia:
  summary_en: "An online reader for TCM classics, herbs, formulas, and case records. The formula index has 25,425 entries, browsable by initial character or pinyin, and the herb index has 11,307 entries."
pharmmapper:
  summary_en: "Upload a 3D molecular structure and get possible protein targets. The 2017 update covers 23,236 proteins, with 16,159 druggable pharmacophore models and 51,431 ligandable ones, clustered from the 1 January 2016 PDB snapshot. Useful when a herb constituent has a structure but no measured target."
tcm-cli:
  summary_en: "A terminal tool for asking TCM questions in natural language, including formula composition, syndrome questions, and compatibility checks. It needs Python 3.10 or newer and an LLM API key. Local data can be pulled for herbs, formulas, TCMSP, TCMID, and related sets. MIT license. The repository was created in February 2026."
pro-tcmllm:
  summary_en: "A P-Tuning script that trains ChatGLM-6B on the ShenNong instruction files. The active command uses prefix length 128, learning rate 2e-2, the ShenNong train and test files, 3,000 steps, batch size 4, gradient accumulation 2, and fp16. The repository was created in November 2025."
ds-tao-shanghan:
  summary_en: "A downloadable Shanghan Lun corpus that keeps clauses, commentaries, and textual variants apart. Version 1.0, released 11 August 2026, has 681 clause records, including 398 canonical clauses, 2,958 aligned commentaries, and 616 variants. CC BY 4.0."
ds-shanghan-five-kg:
  summary_en: "A knowledge graph drawn from Shanghan Lun, Shanghan Leifang, Shanghan Xuanjie, Shanghan Lun Qianzhu, and Shanghan Jiushi Lun. It has 26,771 nodes and 8,272 relations in CSV files that can be loaded into Neo4j. Released on ScienceDB in 2024."
jingfang-pingren:
  summary_en: "Matches the pattern expected by a formula in the Shanghan zabing lun with the patient's present pattern and scores the fit from 0% to 100%. The method is implemented as the online program Pingren. Inputs are the book's own words for symptoms and course. Released December 2021, CC BY 4.0."
ds-ccmq-score:
  summary_en: "SAS code, SPSS syntax, and an Excel test sheet for scoring the Constitution in Chinese Medicine Questionnaire. Released January 2021, CC BY 4.0."
who-tcm-terms-2022:
  summary_en: "The World Health Organization's 2022 terminology standard for traditional Chinese medicine, so clinics, policy, and records can share the same concepts. The publications page offers a PDF for checking Chinese and English wording of patterns and the four examinations."
wujutong-skill:
  summary_en: "A warm-disease skill set drawn from Wenbing Tiaobian, Yiyi Bingshu, Wu Jutong's case records, and Wenre Jingwei, set beside six-meridian formula patterns. The repository description lists 359 cases and 22 warm-disease formulas, using sanjiao and wei-qi-ying-xue."
aconite-tci:
  summary_en: "Weights aconitine, mesaconitine, and hypaconitine by minimum lethal dose and defines a toxic-constituents index for aconite, instead of adding the three diester-alkaloid contents directly. Frontiers in Pharmacology, 2016."
xiyanping-vip:
  summary_en: "Uses variable-importance-for-projection scores to see how age and herb-drug combinations contribute to the severity of adverse events linked to Xiyanping injection. Chinese Medicine, 2023."
xiyanping-allergy:
  summary_en: "A nested case-control study in a national medical-insurance sample on concomitant drugs and suspected allergic reactions with Xiyanping injection. Frontiers in Pharmacology, 2022."
hubei-tcm-inj-adr:
  summary_en: "Analyzes spontaneous adverse-reaction reports for traditional Chinese medicine injections in Hubei from 2014 to 2019. Scientific Reports, 2021."
tcm-adr-tree:
  summary_en: "Decision-tree classification for signal detection in traditional Chinese medicine pharmacovigilance. BMC Medical Informatics and Decision Making, 2018."
msat-cmm-adr:
  summary_en: "A heterogeneous graph neural network trained on FAERS spontaneous reports to predict adverse reactions associated with Chinese materia medica. Frontiers in Pharmacology, 2026."

tcmlm-pr:
  summary_en: "Reinforcement learning for explainable traditional Chinese medicine prescription recommendation, using implicit preferences from a smaller language model. Chinese Medicine, 2025."
tcmpcsd-bert:
  summary_en: "Identifies TCM syndrome types from free text in electronic records of people with pancreatic cancer. JMIR Formative Research, 2025."
dg-spantcm:
  summary_en: "Recognizes nested entities in traditional Chinese medicine electronic medical records, such as a symptom and the body site it belongs to. Scientific Reports, 2025."
tcm-ner-distill:
  summary_en: "Knowledge distillation for named-entity recognition in traditional Chinese medicine, moving the skill into a smaller model. Scientific Reports, 2026."
tcm-span-ds-ner:
  summary_en: "Span-level named-entity extraction for traditional Chinese medicine, trained with distant supervision. JMIR Medical Informatics, 2021."
gam-tcm-cdss:
  summary_en: "Validation of an artificial-intelligence assistive diagnostic system for traditional Chinese medicine. JMIR Medical Informatics, 2020."
cpm-rx-monitor:
  summary_en: "A prescription-monitoring program for Chinese patent medicines built on a knowledge graph. Evidence-Based Complementary and Alternative Medicine, 2021."
tcm-dose-titration:
  summary_en: "A method for adjusting the dosage of traditional Chinese medicine formulas, moving from empirical practice toward more precise use. Frontiers in Pharmacology, 2026."
tcm-decoction-textcnn:
  summary_en: "Classifies how long a traditional Chinese medicine compound should be decocted, using multi-dimensional features. Computer Methods in Biomechanics and Biomedical Engineering, 2024."
dhhngdp-dosage:
  summary_en: "Predicts doses while recommending a traditional Chinese medicine formula, using a diffusion model and a heterogeneous hierarchical network. IEEE BIBM, 2025."
imgateway-hdi:
  summary_en: "Evidence-based monographs of Chinese herb–drug interactions for a clinical decision-support database. Evidence-Based Chinese Medicine and Technology Assessment, 2026."
ccrin-tcm-emr:
  summary_en: "Joint named-entity and relation extraction for traditional Chinese medicine clinical text, with a character-level convolutional recurrent network. Artificial Intelligence in Medicine, 2026."
lip-color-svm:
  summary_en: "Classifies lip color for traditional Chinese medicine inspection with multi-class support vector machines. BMC Complementary and Alternative Medicine, 2012."
face-control-transformer:
  summary_en: "A controllable Transformer for several traditional Chinese medicine facial-inspection tasks at once. IEEE Journal of Biomedical and Health Informatics, 2026."
auscult-wpt-svm:
  summary_en: "Turns traditional Chinese medicine listening into a computable syndrome task with wavelet-packet fractal dimension and a support vector machine. 2014."
voice-constitution-acoustic:
  summary_en: "Uses acoustic features of the voice to identify constitutions in traditional Chinese medicine. Journal of Alternative and Complementary Medicine, 2013."
inquiry-chd-mll:
  summary_en: "Models inquiry-based diagnosis of coronary heart disease in traditional Chinese medicine with multi-label learning. BMC Complementary and Alternative Medicine, 2010."
t2dm-inquiry-lsm:
  summary_en: "Recognizes traditional Chinese medicine syndromes of type 2 diabetes from inquiry information collected in Shanghai. 2022."
pcos-pattern-ml:
  summary_en: "Compares feature selection and multi-label models for predicting traditional Chinese medicine patterns in polycystic ovary syndrome. Heliyon, 2024."
dysmenorrhea-svm:
  summary_en: "A machine-learning model for traditional Chinese medicine syndrome differentiation in dysmenorrhea. Combinatorial Chemistry and High Throughput Screening, 2025."
pediatric-tuina-adhd:
  summary_en: "Selects features and predicts pediatric tuina choices for children with attention deficit hyperactivity disorder. Bioengineering, 2025."
breast-tcm-nn:
  summary_en: "Uses a neural network and clustering to separate traditional Chinese medicine patterns in people with breast cancer. Frontiers in Pharmacology, 2020."
ggn-tcm-risk:
  summary_en: "Assesses how pulmonary ground-glass nodules may progress, combining imaging with traditional Chinese medicine symptoms. Journal of Integrative Medicine, 2026."
tcm-qwen25-7b-sft:
  summary_en: "A traditional Chinese medicine supervised-fine-tuning checkpoint of Qwen2.5-7B. The weights are full safetensors files under Apache-2.0, uploaded in October 2026."
qwen35-9b-tcm-cpt:
  summary_en: "Full weights after continued pretraining of Qwen3.5-9B on traditional Chinese medicine: one bfloat16 safetensors file of about 17.9 GB, Apache-2.0, uploaded in July 2026. The model card still calls this stage a LoRA, but the repository has no separate adapter file."
tcm-constitution-gguf:
  summary_en: "Quantized Qwen3-8B weights for traditional Chinese medicine constitution, with q4, q5, and q8 GGUF files under Apache-2.0. Uploaded in September 2026."
tcmdata:
  summary_en: "An R package for target-oriented network pharmacology and AI-assisted interpretation in traditional Chinese medicine. Current Molecular Pharmacology, 2026."
who-wpro-tm-2007:
  summary_en: "The World Health Organization Western Pacific terminology for traditional medicine, the 2007 predecessor of the 2022 Chinese-medicine terminology. The PDF is on IRIS."
syndrome-element-term-map:
  summary_en: "Maps clinical wordings of TCM syndromes onto standard syndrome names with syndrome-element knowledge. Information Science, 2025, volume 43, issue 7."
ds-tcm-diagcommit:
  summary_en: "TCM-SD-derived benchmark with 1,834 source cases, 148 syndrome labels and 23,842 task rows; fixed three-stage evidence disclosure tests syndrome discrimination, evidence use and commit/acquire/defer/abstain decisions. Data and scoring code are available."
acumodel-acuagent:
  summary_en: "Combines AcuModel, an acupuncture knowledge graph, semantic routing and rule constraints for follow-up inquiry and acupuncture reasoning. Project documentation and samples are public; full weights and training data require an author request."
news-202611-data-elements-tcm:
  summary_en: A 5 November People’s Daily Online interview discusses the separate TCM track in the Data Elements competition,
    expert agents and high-quality dataset construction; it supplies leads rather than downloadable data.
news-202611-ai-tcm-data-meeting:
  summary_en: Beijing’s health authority reports on 4 November about the 30 October meeting on structured TCM knowledge, trusted
    AI datasets and Xiyuan Hospital’s oncology data system. No public data package accompanies the report.
news-202611-traditional-medicine-ai-report:
  summary_en: A 3 November Economic Daily report describes the 2026 global traditional-medicine AI report and Hangzhou’s Zhongyi
    Xiao’an robot. Its scope is AI in traditional medicine broadly, not a count of TCM LLMs.
news-202610-hanpai-data-trade:
  summary_en: China News of TCM reports on 16 October that Wuhan Hospital of TCM traded a Hanpai orthopaedics data product
    involving 168,000 structured records, 3,600 empirical formulas and diagnostic reasoning; this is licensed circulation.
news-202609-gam-data-registration:
  summary_en: China News of TCM reports on 24 September on registration of Guang’anmen’s chronic-gastritis dataset and a trusted
    data space for disease-specific TCM research; the report provides no public download.
tcm-qwen35-9b-sft-r2:
  summary_en: A Qwen3.5-9B-Base TCM CPT/SFT checkpoint reporting 616M training tokens and 21,586 SFT samples. Four BF16 shards
    are present. Training is text-only despite retained vision components; no tongue-diagnosis validation or added license
    is stated.
mimo-tcm-andrology-lora:
  summary_en: A downloadable LoRA adapter on MiMo-V2.6-Distill-Qwen-9B for TCM andrology diagnosis and herb-name generation,
    without doses. Restricted to non-commercial research; the author reports weaker follow-up matching than copying the previous
    prescription, and the source-data card states no IRB review or patient consent.
fu-tcm-9b:
  summary_en: The fudanxai account hosts 9.41B BF16 parameters in eight safetensors shards under an Apache-2.0 tag. The card
    contains only the license, with no training, evaluation or institutional documentation; the account name is not treated
    as verified affiliation.
ds-tcm-ancient-modern-metadata:
  summary_en: 'Public metadata for a controlled classical-to-modern TCM corpus: 9,610 indexed records, frozen splits, edition
    provenance and hashes, plus ten independent demonstration pairs. Experimental passages, reference translations and teacher
    traces are withheld; this is not 9,610 downloadable training pairs.'
ds-fu-tcm:
  summary_en: The repository contains Fu_bianzheng.json, Fu_text.json, Fu_vision.json and image files (505 files total). It
    tags Apache-2.0 but lacks provenance, sample counts and annotation documentation; modern atlas names occur in image filenames,
    so underlying image permissions remain unverified.
ds-tcm-andrology-emr:
  summary_en: The card reports 67,073 visits, 25,103 patients and 26,923 complete examples in patient-grouped JSONL splits.
    Doses are absent and tongue/pulse fields are sparse. The author states no IRB review or patient consent; this is a resource
    index entry with unresolved provenance and reuse grounds.
ds-hanpai-orthopaedics:
  summary_en: Wuhan Hospital of TCM’s licensed Hanpai orthopaedics data product reportedly covers 168,000 structured records,
    3,600 formulas and reasoning chains. A marketplace transaction is reported; an anonymous bulk download was not found.
ds-gam-chronic-gastritis:
  summary_en: A disease-specific TCM dataset registered in 2026 for research and model adaptation. Access is described through
    internal use, collaborative research and licensed products. No dataset-specific sample count or public download is provided;
    hospital-wide totals are not its size.
ds-cmeta:
  summary_en: Previously existing resource; original launch year unconfirmed. A collaborative TCM textual-editing archive
    with multiple Shanghan Lun versions, Jingui and case records, image comparison and Markdown/TXT export controls. Google
    login is required; export was not tested behind login. Original editorial work is CC BY 4.0; external images have separate
    terms.
ds-jicheng:
  summary_en: A TCM classics project begun in 2009 with searchable canonical, diagnostic, materia-medica, formula and case
    texts, a public GitLab collection and source downloads. Editorial work on public-domain texts is declared CC0; original
    explanatory pages are CC BY 4.0, with image/page exceptions.
ds-aeam-classics:
  summary_en: Previously existing resource; original launch year unconfirmed. The association’s official index links seven
    medical classics. A checked Shanghan Lun PDF has 79 extractable-text pages and identifies its Zhao Kaimei edition basis.
    Edition and reuse terms must be checked per text.
ds-aeam-meridian-images:
  summary_en: Previously existing resource; original launch year unconfirmed. Historical meridian illustrations from five
    works are arranged side by side by meridian. Useful for edition comparison and image/text source discovery; this is not
    an annotated VQA dataset, and bulk-download/training rights are unverified.
ds-cintcm-smart-library:
  summary_en: Previously existing resource; original launch year unconfirmed. CACMS’s library portal indexes Republican-era
    books and journals, reprinted classics, rare-book facsimiles and ethnic-medicine books. The homepage and category links
    are accessible with registration/login available; full-text entitlements and bulk downloads are unverified.
ds-nlc-smart-classics:
  summary_en: Previously existing resource; original launch year unconfirmed. The National Library of China’s general classics
    portal offers full-text, edition and knowledge search plus OCR, punctuation and comparison tools. Medical works are a
    subset; whole-platform totals are not TCM corpus counts. Bulk text export is unverified.
ds-ctext-neijing:
  summary_en: Previously existing resource; original launch year unconfirmed. Chapter-organized Huangdi Neijing text with
    related edition facsimiles. English translations are labeled AI/user-produced and should not be treated as expert-validated
    translation gold data. Bulk export licensing was not verified.
ds-fujikawa-digital:
  summary_en: Kyoto University’s digitized historical medical collection includes Chinese/Japanese medical books and medical-history
    materials. Its digitization was completed in April 2018, with an IIIF collaboration with Keio. Useful for edition/image/OCR
    research; holdings totals are not cleaned TCM text counts.
ds-shutcm-rare-classics:
  summary_en: Previously existing resource; original launch year unconfirmed. SHUTCM’s library describes high-resolution scans
    of rare medical classics, above 600 DPI. Access explicitly requires the campus network or institutional VPN; this is an
    institutional edition-image resource rather than a public corpus download.
patent-cn121281871a:
  summary_en: Coordinates task-understanding and data-governance agents with a clinical processing toolkit for TCM outcome
    research. Published 6 January 2026; Google Patents lists Pending.
patent-cn121436110b:
  summary_en: Uses syndrome/symptom keyword sets, confusable tuples and contextual disambiguation to prepare pretraining text.
    The A publication’s timeline records the B grant on 31 July 2026; technical description here is based on A because B text
    was not retrieved.
patent-cn121436111b:
  summary_en: Organizes diagnosis through symptom chains, pattern-factor scores, logical combinations and contradiction checks.
    Granted 15 May 2026 and listed Active. The claims concern structured reasoning, not a released LLM checkpoint.
patent-cn122599028a:
  summary_en: Combines multi-site pressure-level pulse signals, temporal rhythm encoding and constitution classification for
    herb/acupoint recommendations. Published 18 August 2026 and listed Pending; this is a disclosed technical proposal.
person-li-shao:
  name_en: Shao Li
  summary_en: Professor and doctoral supervisor at Tsinghua University, and director of the Beijing Institute for TCM Interdisciplinary Research. Works on network pharmacology and AI for TCM, including cancer and other complex diseases, and recruits postdocs and professional doctoral students.
  orgs_en:
  - Department of Automation, Tsinghua University
  - Beijing Institute for TCM Interdisciplinary Research, Tsinghua University
person-fan-xiaohui:
  name_en: Xiaohui Fan
  summary_en: Qiushi Distinguished Professor and doctoral supervisor at Zhejiang University, and vice president of Zhejiang Chinese Medical University. His TCM+X group works on AI for TCM and released TCMChat.
  orgs_en:
  - College of Pharmaceutical Sciences, Zhejiang University
  - Zhejiang Chinese Medical University
person-zhou-xuezhong:
  name_en: Xuezhong Zhou
  summary_en: Professor, doctoral supervisor, and chair of the Department of Artificial Intelligence at Beijing Jiaotong University. Works on TCM knowledge graphs, large language models, and clinical AI; the group released Lingdan and Lingdan-V2.
  orgs_en:
  - School of Computer Science and Technology, Beijing Jiaotong University
person-hu-kongfa:
  name_en: Kongfa Hu
  summary_en: Vice president and doctoral supervisor at Nanjing University of Chinese Medicine, and dean of the provincial AI school. Works on TCM AI, knowledge graphs, and large models, including tongue diagnosis, syndrome differentiation, and a Jiangsu TCM vertical model.
  orgs_en:
  - School of Artificial Intelligence and Information Technology, Nanjing University of Chinese Medicine
person-chen-jianxin:
  name_en: Jianxin Chen
  summary_en: Professor and doctoral supervisor in the School of Life Sciences, Beijing University of Chinese Medicine. Works on TCM data mining and integrative AI, including SymMap, and recruits 2026 doctoral students in TCM informatics and big data.
  orgs_en:
  - School of Life Sciences, Beijing University of Chinese Medicine
person-guo-jincheng:
  name_en: Jincheng Guo
  summary_en: Professor and doctoral supervisor in the School of Traditional Chinese Medicine, Beijing University of Chinese Medicine. Works on TCM bioinformatics, digital twins, and agents, including HERB and POINT, and jointly recruits 2026 doctoral students with Zhao Yi of the Chinese Academy of Sciences.
  orgs_en:
  - School of Traditional Chinese Medicine, Beijing University of Chinese Medicine
person-wang-benyou:
  name_en: Benyou Wang
  summary_en: Assistant professor, doctoral supervisor, and Presidential Young Fellow at the School of Data Science, The Chinese University of Hong Kong, Shenzhen. Builds medical multimodal models; the group released the TCM model ShizhenGPT.
  orgs_en:
  - School of Data Science, The Chinese University of Hong Kong, Shenzhen
person-wang-xin:
  name_en: Xin Wang
  summary_en: Professor and doctoral supervisor in the College of Intelligence and Computing, Tianjin University. Works on knowledge graphs and large models, and co-developed the TCM model Qibo with Tianjin University of Traditional Chinese Medicine.
  orgs_en:
  - College of Intelligence and Computing, Tianjin University
person-lu-wenpeng:
  name_en: Wenpeng Lu
  summary_en: Professor and doctoral supervisor at Qilu University of Technology (Shandong Academy of Sciences), leading the NLP and cognitive computing group. Works on medical LLMs and agents and released the TCM model BianCang.
  orgs_en:
  - Qilu University of Technology (Shandong Academy of Sciences)
person-zhang-junhua:
  name_en: Junhua Zhang
  summary_en: Professor and doctoral supervisor at Tianjin University of Traditional Chinese Medicine, and executive deputy director of the Haihe Laboratory of Modern Chinese Medicine. Works on evidence-based TCM and released the evidence-review agent AireviewAgent.
  orgs_en:
  - Institute of Traditional Chinese Medicine, Tianjin University of Traditional Chinese Medicine
  - Haihe Laboratory of Modern Chinese Medicine
person-xu-haiyu:
  name_en: Haiyu Xu
  summary_en: Chief researcher at the China Academy of Chinese Medical Sciences and director of the Integrative Chinese Medicine Research Center. Works on integrative pharmacology and TCM big data, including ETCM and SoFDA, and recruits 2026 doctoral students in TCM AI at Liaoning University of Traditional Chinese Medicine.
  orgs_en:
  - Institute of Chinese Materia Medica, China Academy of Chinese Medical Sciences
person-wen-chuanbiao:
  name_en: Chuanbiao Wen
  summary_en: Doctoral supervisor at Chengdu University of Traditional Chinese Medicine. His group builds high-quality datasets for TCM AI models and TCM AIGC; the dataset was selected for the national AI medical-device challenge.
  orgs_en:
  - Chengdu University of Traditional Chinese Medicine
person-liu-baoyan:
  name_en: Baoyan Liu
  summary_en: Chief researcher at the China Academy of Chinese Medical Sciences. Works on clinical-outcome evaluation and TCM big data, contributes to Lingdan-V2, and collaborates with Gushengtang on TCM models and real-world data.
  orgs_en:
  - China Academy of Chinese Medical Sciences
person-liu-liang:
  name_en: Liang Liu
  summary_en: Academician of the Chinese Academy of Engineering and director of the Guangdong Laboratory of Traditional Chinese Medicine (Hengqin Laboratory). The lab works on syndrome differentiation, diagnostic devices, and the Hengqin TCM model.
  orgs_en:
  - Guangdong Laboratory of Traditional Chinese Medicine
  - Guangzhou University of Chinese Medicine
person-xu-nenggui:
  name_en: Nenggui Xu
  summary_en: Professor and doctoral supervisor at Guangzhou University of Chinese Medicine, and director of the South China Acupuncture Research Center. Leads AI research on acupuncture for encephalopathy.
  orgs_en:
  - South China Acupuncture Research Center, Guangzhou University of Chinese Medicine
person-wang-wenjia:
  name_en: Wenjia Wang
  summary_en: Leads Tasly’s Shuzhi Bencao TCM model and contributes to Lingdan-V2.
  orgs_en:
  - Tasly
person-wang-lei:
  name_en: Lei Wang
  summary_en: Researcher at the Institute of Automation, Chinese Academy of Sciences, and chairman of Zhongke Wenge. Co-developed the TCM model Dayi Jinkui with the China Academy of Chinese Medical Sciences.
  orgs_en:
  - Zhongke Wenge
  - Institute of Automation, Chinese Academy of Sciences
person-zheng-xiang:
  name_en: Xiang Zheng
  summary_en: Vice president of Gushengtang, responsible for the national-master AI twins and the TCM Brain.
  orgs_en:
  - Gushengtang
person-hu-zhongkai:
  name_en: Zhongkai Hu
  summary_en: Chief technology officer of Gushengtang, responsible for the TCM model, clinical data, and deployment in care settings.
  orgs_en:
  - Gushengtang
person-luo-changyong:
  name_en: Changyong Luo
  summary_en: Master’s supervisor at Dongfang Hospital, Beijing University of Chinese Medicine. Works on TCM AI for epidemic and chronic disease and led the Tianyi TCM model.
  orgs_en:
  - Dongfang Hospital, Beijing University of Chinese Medicine
person-hu-dan:
  name_en: Dan Hu
  summary_en: President of Shanghai Seventh People’s Hospital. The hospital released the Qiyuan TCM model with Shanghai University of Traditional Chinese Medicine and the Shanghai Artificial Intelligence Laboratory.
  orgs_en:
  - Shanghai Seventh People’s Hospital, Shanghai University of Traditional Chinese Medicine
person-sun-maosong:
  name_en: Maosong Sun
  summary_en: Professor and doctoral supervisor in the Department of Computer Science and Technology at Tsinghua University, and executive vice dean of the Institute for Artificial Intelligence. Works on natural language processing and large models; his group collaborates with Gushengtang on TCM models.
