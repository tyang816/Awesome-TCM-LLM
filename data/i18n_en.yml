  summary_en: ShizhenGPT multimodal SFT data (text/vision/speech/ECG etc.; ~311k items total per paper Table 3).
ds-tcmchat-600k:
  title_en: TCMChat-dataset-600k
  summary_en: TCMChat herbal QA and recommendation instruction data (~600k).
ds-sylvanl-sft:
  title_en: Traditional-Chinese-Medicine-Dataset-SFT
  summary_en: High-quality TCM supervised fine-tuning dataset.
ds-chp-tcm:
  title_en: ChP-TCM
  summary_en: KnowledgeQA and PrescriptionWriting instructions built from Chinese Pharmacopoeia Vol. I.
ds-opentcm-kg:
  title_en: OpenTCM-KG
  summary_en: OpenTCM gynecology classics KG (~48k entities / ~152k relations).
ds-tcm-mkg:
  title_en: TCM-MKG
  summary_en: Open multidimensional TCM knowledge graph of terminology, herbal pieces, and medicinal properties. The companion paper uses interpretable graph neural networks on 6,080 formulas, with a check on 215 COVID-19 formulas.
ds-chatmed-kg:
  title_en: TCM_KG
  summary_en: A TCM knowledge graph built with Neo4j community edition. The sample query starts from the symptom node for constipation and returns its neighbors.
ds-tcm-ner:
