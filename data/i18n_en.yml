  summary_en: TCMChat weights.
hf-zhongjing:
  title_en: ZhongJing
  summary_en: ZhongJing GPT weights.
hf-medchatzh:
  title_en: medchatzh
  summary_en: MedChatZH weights.
hf-baize:
  title_en: Baize
  summary_en: Baize TCM LLM weights.
