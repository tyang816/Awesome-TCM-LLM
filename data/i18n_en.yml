news-202609-27:
  summary_en: Guang'anmen Hospital shows **Guangyi Qizhi 2.0** at CIFTIS 2026, with AI doctor An'an covering six hospital scenes from patient service to ward management.
news-202609-28:
  summary_en: Beijing University of Chinese Medicine debuts a TCM constitution-identification system and an embodied tuina robot at the CIFTIS 2026 TCM pavilion.
news-202607-15:
  summary_en: Shanghai Seventh People's Hospital (SHUTCM) releases the **Qiyuan** TCM LLM with pretraining, domain fine-tuning,
    and expert RL; supports generative medical records and master-physician Agent digital twins; showcased at WAIC.
news-202607-16:
  summary_en: Guizhou Medical University and partners launch **HuaZu BenCao**, a national ethnic-medicine AI platform built
    on ShuZhi QiHuang + Qwen integrating multi-ethnic materia medica classics.
news-202607-17:
  summary_en: Andun Health debuts a **seven-diagnosis** TCM robot at WAIC 2026, integrating face/IR face/tongue/ear/auscultation/inquiry/pulse
    sensing with TianHui pulse algorithms and a TCM clinical LLM.
news-202607-18:
  summary_en: Insightful Eye presents **Bianshi Cloud TCM** at WAIC 2026, built on a registered Bianshi multimodal model with
    four-diagnosis devices and assisted-care systems.
news-202606-00:
  summary_en: Zhongke Wenge passes HKEX listing hearing; reports note the **DaYi JinKui** TCM LLM (with CACMS) has obtained
    top-tier CAICT Trusted AI certification.
news-202604-01:
  summary_en: Beijing University of Chinese Medicine's **XinHuo ZhongGuoYao** TCM education LLM completes national generative-AI
    service filing—the first publicly approved TCM-domain model of its kind.
news-202604-19:
  summary_en: Affiliated Hospital of Shandong University of TCM launches the provincial AI+ TCM scenario project **ZhiHui
    QiHuang**.
news-202602-20:
  summary_en: Eight ministries issue the TCM Industry High-Quality Development Plan (2026–2030), calling for AI and knowledge
    graphs to empower classical formulas and master physicians' prescriptions.
news-202512-02:
  summary_en: Jilin releases **ZhongXing·Changbai Qihuang 1.0**, an AI-native multimodal TCM LLM.
news-202512-03:
  summary_en: Gushengtang launches a “TCM Brain” product and AI digital twin of National TCM Master Shi Qi; 14 expert twins
    cover eight core specialties.
news-202512-04:
  summary_en: '**ZMT-M1** scores 96.26 on a simulated national TCM practitioner exam and is piloted in 100+ clinics.'
news-202511-05:
  summary_en: Five national health ministries issue AI+ healthcare guidelines that explicitly support building TCM diagnostic
    LLMs.
news-202509-06:
  summary_en: Transn's **RenDu·SuWen** passes CAICT Trusted AI TCM LLM Level 4+ evaluation.
news-202509-07:
  summary_en: '**ZhiFu Qihuang Tiangong** TCM AI model completes national deep-synthesis algorithm filing for four-diagnosis
    devices and constitution assessment.'
news-202509-21:
  summary_en: '**YiYin** classical TCM LLM goes live in Song County, Henan, combining TCM education with AI-assisted care
    for county clinics.'
news-202508-08:
  summary_en: '**Gushengtang** releases ten “National Master AI twins” trained on master clinicians'' experience, reporting
    >86% pattern-differentiation accuracy.'
news-202508-22:
  summary_en: NSCC-TJ and Tianjin University of TCM release **TianHe·LingShu** 2.0 (expanded beyond acupuncture to 20+ specialties)
    and launch a TCM intelligent-model evaluation system.
news-202507-23:
  summary_en: Guang'anmen Hospital forms the **GuangYi·QiZhi** LLM agent alliance with medical consortium partners for cross-institution
    intelligent care.
news-202506-09:
  summary_en: '**TCM Hengqin** vertical LLM is officially released.'
news-202505-10:
  summary_en: China Academy of Chinese Medical Sciences releases evaluation standards for TCM large models.
news-202504-11:
  summary_en: Transn releases **RenDu·SuWen** TCM LLM (mixture-of-entropy architecture) for inquiry, pattern differentiation,
    and formula recommendation.
news-202503-12:
  summary_en: Guang'anmen Hospital releases **GuangYi·QiZhi**, described as the first TCM hospital with integrated local compute
    + model + application deployment.
news-202412-24:
  summary_en: China UnionPay Consumer Finance with Sun Yat-sen University and GZUCMS Shenzhen Hospital release vertical TCM
    LLM **ZhongSi** for community clinic inquiry.
news-202409-13:
  summary_en: Zhongke Wenge releases **DaYi JinKui** TCM LLM and health platform trained on 1,500+ TCM classics.
news-202405-25:
  summary_en: Tasly and Huawei Cloud release **ShuZhi BenCao** (Pangu language + molecular models) covering TCM R&D; later
    earns CAICT TCM LLM Level 4+.
news-202403-14:
  summary_en: ECNU, SHUTCM, ECUST, NMMU, Lingang Lab, and CR Jiangzhong jointly develop the **ShuZhi QiHuang** TCM LLM. The linked ECNU page is a later write-up of ShuZhi QiHuang 2.0, not the original 2024.03 release announcement.
news-202307-26:
  summary_en: Nanjing Dajing TCM releases **QiHuang Wendao** LLM with large knowledge graphs and clinical data for institutional
    beta use.
core-acu:
  summary_en: Acupuncture clinical decision support with structured reasoning traces and a knowledge-graph safety veto loop.
derm-3r:
  summary_en: Resource-constrained multimodal multi-agent framework for TCM dermatology (recognition / representation / SDT
    agents).
gastro-tcm:
  summary_en: TCM gastroenterology LLM fine-tuned from Llama3-8B with RAG and agent scaffolding.
mmir-tcm:
  summary_en: Memory-augmented multimodal tongue diagnosis and clinical decision framework; proposes MedTCM dataset and TDEU
    metric.
qwen-tcm-dia:
  summary_en: Specialty fine-tuned model for TCM diarrhea care (CPT + CoT SFT) covering symptom→pathomechanism→method→formula
    chains.
tcm-agent:
  summary_en: LLM multi-agent system for network pharmacology and herbal discovery.
tcm-diffrag:
  summary_en: Syndrome-differentiation RAG with a general KG, a personalized KG, and chain-of-thought.
tonguevlm:
  summary_en: Multimodal VLM for TCM tongue diagnosis, description generation, and constitution reasoning.
xinghe:
  summary_en: Qwen3.5-9B reasoning TCM model grounded in the *Neijing*, with explicit CoT pattern differentiation and safety
    boundaries.
  name_en: Xinghe
linglan:
  summary_en: 'Large multi-task TCM benchmark: 5 domains, 13 subtasks, 25,624 instances.'
  name_en: LingLan
  orgs_en:
  - Beijing Jiaotong University et al.
bencao-gpt:
  summary_en: Instruction-aligned multimodal TCM assistant (ChatGPT/GPTs Store) with tongue APIs and knowledge bases (distinct
    from HuaTuo/BenCao).
  name_en: BenCao
chattcm:
  summary_en: Fully open TCM LLM from pretraining data through released weights.
diagx-dt:
  summary_en: Exclusionary syndrome-differentiation reasoning with CoT and an external TCM knowledge base.
dopi:
  summary_en: Doctor-like proactive inquiry TCM LLM (guide + expert models); reported inquiry accuracy 84.68%.
mcm:
  summary_en: Multi-agent collaborative multimodal TCM diagnosis framework (IEEE ICIP 2025).
  orgs_en:
  - Shanghai Computer Software Technology Development Center
mtcmb:
  summary_en: Multi-task TCM benchmark (~12 subsets, ~7.1k samples) covering knowledge, reasoning, formulas, and safety.
opentcm:
  summary_en: GraphRAG TCM retrieval and diagnosis system with a gynecology classics knowledge graph.
rag-cpmf:
  summary_en: Multi-LLM verification + RAG for Chinese patent medicine recommendation, with a living public CPM dataset.
shizhengpt:
  summary_en: Multimodal TCM LLM supporting the four diagnoses (inspection, auscultation-olfaction, inquiry, palpation).
  orgs_en:
  - The Chinese University of Hong Kong, Shenzhen et al.
tcm-llm-acu-eval:
  summary_en: Real-case evaluation of 7 general LLMs vs licensed acupuncturists on SDT, point selection, needling, and herbs
    (*npj Digital Medicine*).
  name_en: TCM LLM acupuncture clinical evaluation
tcm-3ceval:
  summary_en: 'Three-axis TCM LLM evaluation: core knowledge, classics comprehension, and clinical decision-making.'
tcm-5ceval:
  summary_en: Five-dimension deep evaluation extending TCM-3CEval with materia medica and non-drug therapies.
tcm-best4sdt:
  summary_en: Case benchmark for syndrome differentiation and treatment (knowledge / ethics / safety / SDT).
tcm-kllama:
  summary_en: KG-fused LLM for intelligent TCM formula generation.
tcm-ladder:
  summary_en: First large multimodal TCM QA benchmark with 52,000+ items (NeurIPS 2025).
tcm-r1:
  summary_en: TCM LLM with GRPO-enhanced reasoning.
  orgs_en:
  - Southwest University
tcmchat:
  summary_en: Generative TCM LLM built via pre-training and supervised fine-tuning, released with the 600k-sample TCMChat-600k dialogue dataset (Pharmacol. Res. 2024).
vitcm-llm:
  summary_en: Qwen2.5-VL + RAG tongue multimodal clinical framework; MedTCM dataset and TDEU metric (precursor to MMIR-TCM).
yaoshi-rag:
  summary_en: Uncertain-KG RAG for medicine–food homology dietary recommendation with personalization and explainability.
  name_en: Yaoshi-RAG
renshu-ai:
  summary_en: FastAPI + LangGraph multi-agent TCM consultation system combining GraphRAG and DeepSeek-TCM.
  name_en: RenShu-AI
zhongjing:
  summary_en: ZhongJingGPT, an expert-knowledge-guided TCM LLM combining vertical-domain fine-tuning with cognitive-psychology insights and multi-scenario TCM knowledge instructions (Tsinghua Sci. Technol. 2025).
tianyi:
  summary_en: ~7B TCM LLM from NJUCM et al. with reading–clinic–apprenticeship training stages, TCMEval, and real-world validation.
  name_en: Tianyi
  orgs_en:
  - Nanjing University of Chinese Medicine
tianhui:
  summary_en: Domain LLM for 12 TCM scenarios (DeepSeek-R1-Distill-Qwen-14B + PT/SFT) with open code and eval scripts.
  name_en: TianHui
qibo:
  summary_en: TCM LLM and Qibo Benchmark from Tianjin University et al.; CPT + SFT for SDT and QA.
  name_en: Qibo
  orgs_en:
  - Tianjin University
  - Tianjin University of Traditional Chinese Medicine
biancang:
  summary_en: BianCang TCM LLM series (IEEE JBHI); 14B open-weight release in Dec 2025.
  name_en: BianCang
  orgs_en:
  - Qilu University of Technology
zmt-m1:
  summary_en: ZMT-M1 TCM LLM and the dynamic, extensible TCM-Eval benchmark platform.
  name_en: ZMT-M1
  orgs_en:
  - Beihang University
baize-tcm:
  summary_en: ICMM Baize TCM QA models on Qwen3 (0.6B/8B) with ~157k LoRA-tuning examples.
  name_en: Baize-TCM-LLM
  orgs_en:
  - Institute of Chinese Materia Medica, CACMS
zhifangdantai:
  summary_en: GraphRAG + LLM fine-tuning for interpretable formula generation (sovereign–minister–assistant–courier, efficacy,
    contraindications) with open weights.
  name_en: ZhiFangDanTai
shennong-alpha:
  summary_en: "ShennongAlpha (Westlake University): an AI-driven sharing and collaboration platform for intelligent curation, acquisition and translation of natural-medicinal-material knowledge (Cell Discov. 2025)."
jingfang:
  summary_en: LLM-based multi-agent TCM diagnosis/treatment system reporting large relative SDT gains under the authors' protocol.
  name_en: Jingfang
chinese-llava-med:
  summary_en: Chinese medical multimodal LLM based on the LLaVA architecture, with the llava-med-zh-eval benchmark and open 7B weights.
medchatzh:
  summary_en: "MedChatZH: a fine-tuned LLM for TCM consultation dialogues, released with open dataset and weights (Comput. Biol. Med. 2024)."
lingdan:
  summary_en: TCMLLM / Lingdan for TCM modeling and prescription recommendation.
  name_en: TCMLLM / Lingdan
  orgs_en:
  - Beijing Jiaotong University
bigdatatcm:
  summary_en: "BigDataTCM (34B): a vertical TCM LLM co-developed by HAUT's Complexity Science institute and Apus, offering medical QA, diagnostic support and TCM knowledge services."
ming:
  summary_en: "MING: a Chinese medical consultation LLM using a sparse mixture of low-rank adapter experts (MING-MoE) for medical multi-task learning (arXiv 2024)."
huatuo-bencao:
  summary_en: Instruction-tuned Chinese medical LLM (BenCao / formerly HuaTuo).
  name_en: BenCao (formerly HuaTuo)
  orgs_en:
  - Harbin Institute of Technology
chatmed:
  summary_en: ChatMed series of Chinese medical LLMs, including ChatMed-Consult trained on 500k+ online consultation dialogues.
xrayglm:
  summary_en: Chinese multimodal medical LLM for chest X-ray interpretation.
huatuogpt:
  summary_en: Large language model trained on Chinese medical corpora (HuaTuoGPT).
  name_en: HuaTuoGPT
  orgs_en:
  - The Chinese University of Hong Kong, Shenzhen
  - Shenzhen Institute of Big Data
qizhengpt:
  summary_en: Chinese clinical QA model for drugs, diseases, procedures, and labs (QiZhenGPT).
  name_en: QiZhenGPT
  orgs_en:
  - Zhejiang University
sunsimiao:
  summary_en: Sunsimiao Chinese medical LLM; Sunsimiao-7B fine-tuned from Qwen2-7B on curated medical data, reaching 30B-level SOTA on CMB-Exam.
bianque:
  summary_en: Chinese proactive health LLM for everyday living spaces (BianQue).
  name_en: BianQue
  orgs_en:
  - South China University of Technology
  - Guangdong Key Laboratory of Digital Twin Humans
baichuan-m1:
  title_en: Baichuan-M1
  name_en: Baichuan-M1
  summary_en: Baichuan's from-scratch open medical LLM (14B), trained on ~20T medical+general tokens across 20+ specialties; a common base for later TCM fine-tunes.
  orgs_en:
  - Baichuan Intelligence
baichuan-m2:
  title_en: Baichuan-M2
  name_en: Baichuan-M2
  summary_en: Baichuan's second open medical reasoning model (32B on Qwen2.5-32B) with a large verifier system and multi-stage RL; strong open-source HealthBench results.
  orgs_en:
  - Baichuan Intelligence
baichuan-m3:
  title_en: Baichuan-M3
  name_en: Baichuan-M3
  summary_en: Baichuan's third open medical reasoning model (235B on Qwen3) with SPAR staged RL and fact-aware RL for active inquiry and hallucination control; strong HealthBench and SCAN-bench results.
  orgs_en:
  - Baichuan Intelligence
huatuogpt-ii:
  title_en: HuatuoGPT-II
  name_en: HuatuoGPT-II
  summary_en: Second HuatuoGPT generation with one-stage medical adaptation; 7B/13B use Baichuan2 backbones and remain a standard Chinese medical baseline.
  orgs_en:
  - The Chinese University of Hong Kong, Shenzhen
  - Shenzhen Institute of Big Data
huatuogpt-o1:
  title_en: HuatuoGPT-o1
  name_en: HuatuoGPT-o1
  summary_en: HuatuoGPT medical complex-reasoning model trained with verifiable problems and a medical verifier; 7B/72B cover Chinese and English.
  orgs_en:
  - The Chinese University of Hong Kong, Shenzhen
  - Shenzhen Institute of Big Data
huatuogpt-vision:
  title_en: HuatuoGPT-Vision
  name_en: HuatuoGPT-Vision
  summary_en: HuatuoGPT multimodal medical model that injects visual knowledge at scale; a common Chinese medical vision baseline.
  orgs_en:
  - The Chinese University of Hong Kong, Shenzhen
  - Shenzhen Institute of Big Data
disc-medllm:
  title_en: DISC-MedLLM
  name_en: DISC-MedLLM
  summary_en: Fudan DISC conversational medical LLM on Baichuan-13B, with DISC-Med-SFT built from knowledge graphs and reconstructed consultations.
  orgs_en:
  - Fudan University
pulse:
  title_en: PULSE
  name_en: PULSE
  summary_en: OpenMEDLab Chinese medical LLM (Bloom 7B/14B) for exams, report reading, record structuring, and simulated diagnosis.
  orgs_en:
  - Shanghai AI Laboratory
wingpt2:
  title_en: WiNGPT2
  name_en: WiNGPT2
  summary_en: Winning Health open medical LLM on Qwen for medical QA, record understanding, and multi-turn consults; 7B/14B weights are public.
  orgs_en:
  - Winning Health
wingpt3:
  title_en: WiNGPT3
  name_en: WiNGPT3
  summary_en: Winning Health's third medical reasoning model (32B on Qwen2.5) with multi-stage SFT+RL and WiNEX hospital integration; tech report and code are public, weights are not verified as downloadable.
  orgs_en:
  - Winning Health
taiyi:
  title_en: Taiyi
  name_en: Taiyi
  summary_en: DUTIR bilingual biomedical LLM on Qwen-7B for QA, doctor–patient dialogue, report generation, and information extraction (JAMIA 2024).
  orgs_en:
  - Dalian University of Technology
taiyi-2:
  title_en: Taiyi-2
  name_en: Taiyi-2
  summary_en: Second Taiyi open biomedical model, moving from Qwen-7B to GLM4-9B with tighter data filters and task instructions; the official replacement for Taiyi-1.
  orgs_en:
  - Dalian University of Technology
qilin-med:
  title_en: Qilin-Med
  name_en: Qilin-Med
  summary_en: Multi-stage Chinese medical LLM (CPT+SFT+DPO on Baichuan-7B) releasing the ~3GB ChiMed corpus, optionally with RAG.
chimed-gpt:
  title_en: ChiMed-GPT
  name_en: ChiMed-GPT
  summary_en: USTC Chinese medical LLM continued from Ziya-v2 with pretraining, SFT, and RLHF for extraction, QA, and multi-turn dialogue.
  orgs_en:
  - University of Science and Technology of China
apollo:
  title_en: Apollo
  name_en: Apollo
  summary_en: FreedomIntelligence multilingual medical LLM (including Chinese) with ApolloCorpus and XMedBench.
  orgs_en:
  - The Chinese University of Hong Kong, Shenzhen
  - Shenzhen Institute of Big Data
doctorgpt:
  title_en: DoctorGLM
  name_en: DoctorGLM
  summary_en: Early open Chinese consultation model on ChatGLM-6B with LoRA/P-Tuning; a frequent 2023 Chinese medical baseline.
medicalgpt:
  title_en: MedicalGPT
  name_en: MedicalGPT
  summary_en: Open training stack for Chinese medical LLMs (pretrain/SFT/RLHF/DPO), often reused as a baseline pipeline in TCM fine-tuning.
soulchat:
  title_en: SoulChat
  name_en: SoulChat
  summary_en: SCUT mental-health dialogue LLM from the same lab as BianQue; a common Chinese health-conversation baseline.
  orgs_en:
  - South China University of Technology
  - Guangdong Key Laboratory of Digital Twin Humans
caregpt:
  title_en: CareGPT
  name_en: CareGPT
  summary_en: Open Chinese medical LLM training stack (pretrain through DPO) with accompanying weights, often used to reproduce Chinese medical fine-tunes.
bianque-2:
  title_en: BianQue-2
  name_en: BianQue-2
  summary_en: Second BianQue open consultation model with stronger multi-turn questioning; a common CMB baseline.
  orgs_en:
  - South China University of Technology
  - Guangdong Key Laboratory of Digital Twin Humans
ivygpt:
  title_en: IvyGPT
  name_en: IvyGPT
  summary_en: LLaMA-based Chinese medical QA model fine-tuned with curated clinical QA and RLHF; listed as an open baseline in the CMB paper.
chatglm-med:
  title_en: ChatGLM-Med
  name_en: ChatGLM-Med
  summary_en: HIT-SCIR ChatGLM-6B instruction-tuned on Chinese medical KGs, sharing data lineage with BenCao/HuaTuo; a frequent CMB baseline.
  orgs_en:
  - Harbin Institute of Technology
ds-cmb:
  title_en: CMB
  summary_en: FreedomIntelligence comprehensive Chinese medical benchmark (CMB-Exam ~280k items plus CMB-Clin cases); the most common non-TCM comparison board in TCM LLM papers.
ds-cmexam:
  title_en: CMExam
  summary_en: Chinese medical licensing-exam set (~68k annotated items) used as a knowledge-recall baseline by Chinese medical and TCM LLMs.
ds-huatuo-26m:
  title_en: Huatuo-26M
  summary_en: Largest open Chinese medical QA resource (~26M pairs from encyclopedias, KGs, and consults); Huatuo-Lite is the usual SFT/RAG subset.
ds-promptcblue:
  title_en: PromptCBLUE
  summary_en: CBLUE's 16 Chinese medical NLP tasks rewritten as generative instructions; an early unified Chinese medical LLM leaderboard (CCKS 2023).
ds-disc-med-sft:
  title_en: DISC-Med-SFT
  summary_en: Fudan DISC medical-dialogue SFT set (~470k examples from KG triples and reconstructed consults; no preference data).
ds-qilin-chimed:
  title_en: ChiMed (Qilin)
  summary_en: Qilin-Med's ~3GB Chinese medical corpus (CPT/SFT/DPO); not the same resource as the ChiMed 2.0 pretraining set.
ds-cmedqa:
  title_en: cMedQA
  summary_en: Chinese community medical QA-matching set (repo table ~54k questions / 102k answers; non-commercial research). Paper DOI matches the README; see cMedQA2 for the later release.
ds-cmedqa2:
  title_en: cMedQA2
  summary_en: Chinese community medical QA (~108k questions / 200k answers), a common source for BianQue-style SFT mixtures.
ds-meddialog:
  title_en: MedDialog
  summary_en: Large doctor–patient dialogue corpus (about 1.1M Chinese encounters) used for multi-turn Chinese medical fine-tuning.
ds-cmekg:
  title_en: CMeKG
  summary_en: Chinese medical knowledge graph of diseases, drugs, and symptoms; main source for BenCao/HuaTuo and ChatGLM-Med instruction data. Official portal is unstable; verify via the tools repo.
ds-cblue:
  title_en: CBLUE
  summary_en: Chinese biomedical NLU benchmark (NER, relations, diagnosis normalization, classification); the source-task suite behind PromptCBLUE, with a Tianchi submission portal.
ds-imcs21:
  title_en: IMCS-21
  summary_en: About 4,116 pediatric online consults annotated for entities, intents, symptoms, and reports; later wired into four CBLUE dialogue tasks.
ds-webmedqa:
  title_en: webMedQA
  summary_en: Early Chinese non-factoid medical QA from health-consult sites (~63k questions, one positive and four negative answers each).
ds-knapsack-kampo:
  title_en: KNApSAcK KAMPO
  summary_en: NAIST Kampo public database (~1,581 formulas, 278 crude drugs), downloadable from the NBDC life-science archive.
ds-km-embedding:
  title_en: Korean Medicine Embedding Dataset
  summary_en: Query–positive–negatives (~113k pairs) built from Korean-medicine terms and an ontology, for embedding fine-tunes such as BGE-M3.
ds-oasis-kiom:
  title_en: OASIS (KIOM)
  summary_en: KIOM traditional-medicine literature portal for Korean-medicine papers and herbal resources.
clinicalgpt:
  title_en: ClinicalGPT
  name_en: ClinicalGPT
  summary_en: BUPT clinical Chinese medical model (BLOOM-7B) fine-tuned on records, knowledge, exams, and multi-turn consults; a common CMB-era baseline. HF hosts a medicalai snapshot.
  orgs_en:
  - Beijing University of Posts and Telecommunications
iflytek-spark-med:
  title_en: iFlytek Spark Medical
  name_en: iFlytek Spark Medical
  summary_en: Closed iFlytek medical LLM (Spark Medical X1/X2) behind Zhiyi Assistant and Xiaoyi; no public weights, listed as an industry baseline.
  orgs_en:
  - iFlytek
hunyuan-med:
  title_en: Tencent Hunyuan Medical
  name_en: Tencent Hunyuan Medical
  summary_en: Closed Tencent Health medical LLM on Hunyuan for QA, triage, records, and imaging; announced by Tencent Jarvis Lab, no public weights.
  orgs_en:
  - Tencent
pangu-drug:
  title_en: PanGu Drug Model
  name_en: PanGu Drug Model
  summary_en: Closed Huawei Cloud / SIMM molecule foundation model (~1.7B small molecules) for property prediction, generation, and optimization; later used under Shuzhi Bencao.
  orgs_en:
  - Huawei Cloud
  - Shanghai Institute of Materia Medica, CAS
ant-afu:
  title_en: Ant Afu / Ant Medical LLM
  name_en: Ant Afu
  summary_en: Closed Ant multimodal medical LLM, first shipped as Alipay AQ and later rebranded Afu for consults, report and pill-box reading; announced at WAIC 2024, no public weights.
  orgs_en:
  - Ant Group
kampo-llm:
  title_en: KAMPO LLM
  name_en: KAMPO LLM
  summary_en: Closed Japanese Kampo medical API from VARYTEX with the Japan Society for Oriental Medicine, scored on 471 specialist-training items; no public weights.
  orgs_en:
  - VARYTEX
km-agent:
  title_en: KM-Agent
  name_en: KM-Agent
  summary_en: Tool-augmented agent for Korean / East Asian traditional medicine over 4,780 herb–syndrome–acupoint metadata records, evaluated on TCMBench-style sets.
lingdan-v2:
  title_en: Lingdan-V2
  name_en: Lingdan-V2
  summary_en: BJTU's second Lingdan TCM reasoning family (Qwen3 4B/8B/14B with CPT, SFT, and prescription GRPO). ModelScope checkpoints exist but require access requests, so they are not marked freely downloadable.
  orgs_en:
  - Beijing Jiaotong University
dfglm-tcm:
  title_en: DFGLM-TCM
  name_en: DFGLM-TCM
  summary_en: Dongfang Hospital / Zhipu TCM clinical system that models textbook knowledge and practitioner experience in separate modules; paper is out, weights are not.
  orgs_en:
  - Beijing University of Chinese Medicine
  - Zhipu AI
shennong-tcm-llm:
  summary_en: ShenNong-TCM-LLM, the first TCM large language model, released with the ShenNong_TCM_Dataset and open weights.
tcm-nvwa:
