ds-tcm-qg:
  title_en: TCM-QG
  summary_en: "Question-generation data from TCM texts: 3,500 documents, with one to four human-written question-answer pairs each. The license is CC BY-NC 2.0."
hf-xinghe:
  title_en: Xinghe
  summary_en: Xinghe Neijing reasoning model weights.
hf-biancang:
  title_en: BianCang
  summary_en: BianCang open-weight series.
hf-chattcm:
